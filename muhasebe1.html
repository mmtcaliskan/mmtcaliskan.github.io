<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muhasebe I Simülatörü</title>
<meta name="description" content="Muhasebe I Simülatörü: tarayıcıda çalışan etkileşimli ders aracı. M. M. Tuncer Çalışkan.">
<style>
:root{color-scheme:light;
  --page:#f9f9f9;--surface:#ffffff;--ink:#191919;--ink2:#666666;--grid:#e7e7e7;--axis:#c2c2c2;--border:rgba(11,11,11,.10);
  --s1:#257de0;--s2:#f47230;--s3:#00b894;--s4:#f2a600;--s5:#ee7fac;
  --good:#0aac23;--crit:#dc3c3d;--goodtext:#006c10;
  --accent:#257de0;--accent-ink:#1757ac;--wash:#eef5fd;--ylwash:#f4f1fd;--ylink:#6a4ce2;}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --page:#0b0b0b;--surface:#191919;--ink:#efefef;--ink2:#9c9c9c;--grid:#303030;--axis:#474747;--border:rgba(255,255,255,.10);
  --s1:#338ced;--s2:#e76624;--s3:#00a888;--s4:#d28e05;--s5:#e24d8b;--goodtext:#53c556;
  --accent:#338ced;--accent-ink:#84b9f3;--wash:#14243a;--ylwash:#211c35;--ylink:#9887ef;}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15.5px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1080px;margin:0 auto;padding:18px 20px 60px}
a{color:var(--accent-ink)}
h1{font-size:1.55rem;line-height:1.25;margin:.15em 0}
h2{font-size:1.22rem;line-height:1.3;margin:.15em 0}
h3{font-size:1.02rem;margin:1.3em 0 .35em}
p{margin:.55em 0}
ul,ol{margin:.4em 0;padding-left:1.3em} li{margin:.2em 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px}
.hero{display:flex;gap:18px 28px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin:8px 0 16px}
.kicker{font-size:.78rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.lead{color:var(--ink2);max-width:62ch}
.toggles{display:flex;flex-direction:column;gap:8px}
.tg{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink2)} .tg .lbl{min-width:46px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-right:1px solid var(--border);background:transparent;color:var(--ink);padding:5px 11px;font:inherit;font-size:.85rem;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.seg button:focus-visible,.btn:focus-visible,.stp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;font-size:.88rem}
.howto b{display:block;font-size:.9rem;margin-bottom:2px}
.unit h2{font-size:1rem;margin:26px 0 10px;color:var(--ink2);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lc{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;transition:border-color .15s,transform .15s}

.lc.off{opacity:.6}
.lc .no{font-size:.76rem;color:var(--ink2)} .lc .tt{font-weight:600;margin:2px 0 8px;line-height:1.35} .lc .mt{font-size:.8rem;color:var(--ink2)}
.chip{display:inline-block;font-size:.72rem;line-height:1.5;padding:0 8px;border-radius:99px;border:1px solid var(--border);color:var(--ink2);margin-right:4px;vertical-align:middle;white-space:nowrap}
.chip.pilot{background:var(--wash);color:var(--accent-ink);border-color:transparent}
.chip.gap{border-style:dashed}
.chip.ok{color:var(--goodtext);border-color:transparent;background:rgba(10,172,35,.11)}
.chip.yl{background:var(--ylwash);color:var(--ylink);border-color:transparent}
.lh{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end;margin:4px 0 12px}
.back{font-size:.86rem;text-decoration:none}
.lmeta{font-size:.8rem;color:var(--ink2)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px}
.stp{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:99px;padding:3px 11px 3px 3px;font:inherit;font-size:.78rem;cursor:pointer;white-space:nowrap}
.stp .sn{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--page);font-weight:600;font-size:.76rem}
.stp.cur{border-color:var(--accent);color:var(--ink)} .stp.cur .sn{background:var(--accent);color:#fff}
.stp.done .sn{background:var(--good);color:#fff}
.stp:disabled{opacity:.4;cursor:not-allowed}
.step .sh{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:12px}
.chip.t-kesif{background:var(--wash);color:var(--accent-ink);border-color:transparent}
.chip.t-alistirma{background:rgba(242,166,0,.15);color:inherit;border-color:transparent}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
.lockmsg{font-size:.84rem;color:var(--ink2);text-align:center}
.btn{font:inherit;font-size:.92rem;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer}

.btn.sm{padding:3px 10px;font-size:.8rem}

.eq{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:1.08rem;text-align:center;margin:12px 0;padding:10px 12px;background:var(--page);border-radius:8px;overflow-x:auto}
.eq i{font-style:italic}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px}
.fr>span{line-height:1.3;padding:0 3px} .fr>span:first-child{border-bottom:1px solid currentColor}
.tbl{border-collapse:collapse;font-size:.87rem;margin:10px 0;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid var(--grid);padding:5px 12px;text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--ink2);font-weight:600}
.tbl.sym td{text-align:left}
.tbl tr.tot td{font-weight:700;border-top:1.5px solid var(--axis)}
.tbl tr.sub td{color:var(--ink2)}
.tbl td.l{text-align:left}
.note{padding:10px 14px;border-radius:8px;margin:14px 0;background:var(--page);font-size:.92rem}
.note.yl{background:var(--ylwash);border-left:3px solid var(--ylink)}
.note.yl::before{content:var(--yl-label,"İleri düzey");display:block;font-size:.7rem;font-weight:700;color:var(--ylink);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.note.tr::before{content:"Mevzuat notu";display:block;font-size:.7rem;font-weight:700;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.note.warn{border-left:3px solid var(--s4)}
body:not(.yl) .yl-only{display:none!important}
.k-intro{margin-bottom:14px}
.kgrid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px}
.kgrid>*{min-width:0}
@media (max-width:840px){.kgrid{grid-template-columns:minmax(0,1fr)}}
.sl{display:block;margin:0 0 13px}
.sl-top{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;color:var(--ink2)}
.sl output{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0}
.segw{margin:0 0 13px} .segw .seg{margin-top:4px}
.task{border:1px dashed var(--accent);border-radius:10px;padding:10px 12px;margin-bottom:16px;background:var(--wash);font-size:.86rem}
.task.all{border-style:solid;border-color:var(--good)}
.task-h{font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.task-s{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink2)}
.ti{display:flex;gap:8px;margin:5px 0}
.cb{flex:0 0 16px;height:16px;border:1.5px solid var(--ink2);border-radius:4px;margin-top:3px;position:relative}
.ti.ok .cb{background:var(--good);border-color:var(--good)}
.ti.ok .cb::after{content:"";position:absolute;left:4px;top:0;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.ti.ok>span:last-child{color:var(--ink2)}
.ro{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.ro-i{border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--surface)}
.ro-i.wide{grid-column:1/-1}
.ro-l{font-size:.74rem;color:var(--ink2);line-height:1.35}
.ro-v{font-weight:600;font-variant-numeric:tabular-nums}
.flag{display:inline-flex;gap:5px;align-items:center;font-weight:600;font-size:.82rem;padding:1px 9px;border-radius:99px}
.flag.good{color:var(--goodtext);background:rgba(10,172,35,.12)}
.flag.bad{color:var(--crit);background:rgba(220,60,61,.11)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.8rem;color:var(--ink2);margin-bottom:2px}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--ink2)}
.sw.l1{border-color:var(--s1)} .sw.l2{border-color:var(--s2)} .sw.l3{border-color:var(--s3)}
.sw.ref{border-top:1.5px dashed var(--ink2)}
.sw.box{width:12px;height:12px;border:0;border-radius:3px}
.sw.box.f1{background:var(--s1)} .sw.box.f2{background:var(--s2)} .sw.box.f3{background:var(--s3)} .sw.box.f4{background:var(--s4)} .sw.box.f5{background:var(--s5)}
.sw.box.fg{background:var(--axis)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.tick{fill:var(--ink2);font-size:11.5px;font-variant-numeric:tabular-nums}
.atitle{fill:var(--ink2);font-size:12px}
.l1,.l2,.l3{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.l1{stroke:var(--s1)} .l2{stroke:var(--s2)} .l3{stroke:var(--s3)}
.ref{stroke:var(--ink2);stroke-width:1.25;stroke-dasharray:4 4;fill:none}
.cur{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.d2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.d3{fill:var(--s3);stroke:var(--surface);stroke-width:2}
.f1{fill:var(--s1)} .f2{fill:var(--s2)} .f3{fill:var(--s3)} .f4{fill:var(--s4)} .f5{fill:var(--s5)} .fg{fill:var(--axis)}
.seg-r{stroke:var(--surface);stroke-width:2}
.area1{fill:var(--s1);opacity:.14} .area-g{fill:var(--good);opacity:.14} .area-c{fill:var(--crit);opacity:.12}
.bar1{fill:var(--s1)} .bar1.dim{opacity:.38}
.ref2{stroke:var(--axis);stroke-width:1.25;stroke-dasharray:2 3;fill:none}
.sw.box.bar1{background:var(--s1)} .sw.box.area1{background:var(--s1);opacity:.3}
.sw.box.area-g{background:var(--good);opacity:.35} .sw.box.area-c{background:var(--crit);opacity:.3}
.sw.dot{width:10px;height:10px;border:0;border-radius:50%;background:var(--ink)} .sw.dot.d2{background:var(--s2)} .sw.dot.d3{background:var(--s3)}
.dim{opacity:.38}
.lab,.lab2{font-size:12px;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.lab{fill:var(--ink)} .lab2{fill:var(--ink2)}
.labin{font-size:11.5px;fill:#fff;font-variant-numeric:tabular-nums}
.labin.dk{fill:#0b0b0b}
.hov line{stroke:var(--ink2);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,.14);border-radius:8px;padding:6px 10px;font-size:.78rem;line-height:1.45;white-space:nowrap;z-index:5;font-variant-numeric:tabular-nums}
details.dt summary{cursor:pointer;font-size:.82rem;color:var(--ink2);margin-top:10px}
.dtw{max-height:260px;overflow:auto}
.q{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:12px 0}
.qh{display:flex;gap:4px;align-items:center;margin-bottom:6px}
.qn{margin-left:auto;font-size:.76rem;color:var(--ink2)}
.qa{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
input.num,input.acc,select.sel{font:inherit;padding:6px 10px;border:1px solid var(--axis);border-radius:8px;background:var(--surface);color:var(--ink)}
input.num{width:190px}
.unit{color:var(--ink2);font-size:.9rem}
.opts label{display:flex;gap:8px;align-items:flex-start;padding:3px 0;cursor:pointer}
.opts input{margin-top:5px}
.fb{margin-top:10px;padding:8px 12px;border-radius:8px;font-size:.9rem}
.fb:empty{display:none}
.fb.ok{background:rgba(10,172,35,.11)}
.fb.try{background:rgba(242,166,0,.15)}
.fb.rev{background:var(--wash)}
.qsum{font-size:.86rem;color:var(--ink2);margin-bottom:4px}
.about{font-size:.8rem;color:var(--ink2);margin-top:30px;border-top:1px solid var(--grid);padding-top:14px}
.map summary{cursor:pointer;font-weight:600}
.map{margin-top:26px}
.done-box{text-align:center;padding:30px}
.summary li{margin:.35em 0}
/* ---- Muhasebeye özgü bileşenler ---- */
.jt{border-collapse:collapse;font-size:.88rem;margin:8px 0 12px;font-variant-numeric:tabular-nums;min-width:min(100%,520px)}
.jt td,.jt th{padding:4px 10px;border-bottom:1px solid var(--grid)}
.jt th{color:var(--ink2);font-weight:600;font-size:.78rem;text-align:right}
.jt th:first-child{text-align:left}
.jt td.n{text-align:right;width:110px}
.jt td.cr{padding-left:38px}
.jt tr.mh td{border-bottom:1.5px solid var(--axis);font-size:.78rem;color:var(--ink2);text-align:center}
.jt tr.ex td{font-size:.8rem;color:var(--ink2);font-style:italic;border-bottom:1.5px solid var(--axis)}
.jt tr.tot td{font-weight:700}
.ta-wrap{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}
.ta{min-width:200px;flex:1 1 200px;max-width:300px;font-size:.84rem;font-variant-numeric:tabular-nums}
.ta-h{text-align:center;font-weight:600;border-bottom:2px solid var(--ink);padding:2px 4px}
.ta-b{display:grid;grid-template-columns:1fr 1fr;min-height:50px}
.ta-b>div{padding:3px 6px}
.ta-b>div:first-child{border-right:2px solid var(--ink)}
.ta-b>div:last-child{text-align:right}
.ta-l{display:flex;justify-content:space-between;gap:6px} .ta-b>div:last-child .ta-l{flex-direction:row-reverse}
.ta-l span:first-child{color:var(--ink2);font-size:.74rem}
.ta-f{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--axis);font-size:.78rem}
.ta-f>div{padding:2px 6px} .ta-f>div:last-child{text-align:right}
.ta-bal{text-align:center;font-size:.78rem;color:var(--ink2)}
.ta.new .ta-h{color:var(--accent-ink)}
.je{border-collapse:collapse;margin-top:8px;font-size:.88rem}
.je td,.je th{padding:3px 4px}
.je th{color:var(--ink2);font-weight:600;font-size:.76rem;text-align:left}
.je input.acc{width:250px}
.je input.num{width:130px;text-align:right}
.je .tot td{font-size:.82rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.xbtn{border:0;background:transparent;color:var(--ink2);cursor:pointer;font-size:1rem}
.tx-list{display:flex;flex-direction:column;gap:6px}
.tx{display:flex;gap:8px;align-items:flex-start;text-align:left;font:inherit;font-size:.84rem;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.tx:hover:not(:disabled){border-color:var(--accent)}
.tx:disabled{opacity:.5;cursor:default}
.tx .txn{font-weight:700;color:var(--ink2);min-width:18px}
.tx select{max-width:100%;min-width:0}
.tx.on{border-color:var(--good);background:rgba(10,172,35,.07)}
.cls-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;padding:6px 0;border-bottom:1px solid var(--grid);font-size:.88rem}
/* Metin en az 180 px yer alır; sığmazsa açılır liste alt satıra iner (dar panelde kelime kelime kırılmayı önler) */
.cls-row>span{flex:1 1 180px;min-width:0}
.cls-row select{flex:0 1 auto;max-width:100%;min-width:0}
.cls-row.ok select{border-color:var(--good)} .cls-row.bad select{border-color:var(--crit)}
.fs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.fs{grid-template-columns:1fr}}
.fs .tbl{width:100%}
.mono{font-variant-numeric:tabular-nums}
/* Motorun tablolara eklediği kapsayıcı: dar ekranda tablo sayfayı değil kendini kaydırır */
.tw{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fs>.tw>.tbl{width:100%}
/* ---- Telefon (≤600 px): metin sütunları kelime kelime kırılmasın, geniş tablolar kendi içinde kaysın ---- */
@media (max-width:600px){
  #app{padding:12px 10px 50px}
  .card{padding:14px 12px}
  .q{padding:12px 10px}
  .tbl th,.tbl td{padding:4px 7px}
  .tbl:not(.sym) td:not(:first-child){white-space:nowrap}
  /* Tablo, sütun sayısına göre bir alt genişlik alır; ekrana sığmazsa .tw içinde yana kayar */
  .tbl.sym:has(tr>:nth-child(2)){min-width:21em}
  .tbl.sym:has(tr>:nth-child(3)){min-width:31em}
  .tbl.sym:has(tr>:nth-child(4)){min-width:40em}
  .tbl:not(.sym):has(tr>:nth-child(4)){min-width:30em}
  .tbl:not(.sym):has(tr>:nth-child(5)){min-width:36em}
  .jt{min-width:21em}
  .jt td,.jt th{padding:4px 6px}
  .jt td.n{width:auto;white-space:nowrap}
  .jt td.cr{padding-left:18px}
  .je{width:100%;font-size:.84rem}
  .je td,.je th{padding:3px 2px}
  .je input.acc{width:100%;min-width:7.5em;padding:6px}
  .je input.num{width:4.6em;padding:6px 4px}
}

<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================
   Muhasebe simülatörleri — ortak motor, sürüm 0.1 (pilot), 27.11.2026
   Özgün kod. Mimari 12_Finans_Simulatoru ile aynıdır; ders akışı
   fikri M. Songur'un Mikroekonomi Simülatörü'nden esinlenmiştir,
   o çalışmadan kod alınmamıştır.
   ============================================================ */

/* ---------- Yardımcılar ---------- */
const $=(s,r=document)=>r.querySelector(s);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function nf(x,d=0){return Number(x).toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d});}
function tl(x,d=0){return (x<-1e-9?'−':'')+nf(Math.abs(x),d)+' TL';}
function pc(x,d=1){return (x<-1e-12?'−%':'%')+nf(Math.abs(x)*100,d);}
function pp(x,d=1){return (x<-1e-12?'−':'')+nf(Math.abs(x)*100,d)+' puan';}
function kTL(v){const a=Math.abs(v),s=v<0?'−':'';if(a>=1e6)return s+nf(a/1e6,(a%1e6)?1:0)+' mn';if(a>=1e3)return s+nf(a/1e3,0)+' bin';return s+nf(a,0);}
function fr(n,d){return `<span class="fr"><span>${n}</span><span>${d}</span></span>`;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function r2(x){return Math.round(x*100)/100;}
const pctFmt=v=>'%'+nf(v,Number.isInteger(v)?0:1);

/* ---------- Tekdüzen Hesap Planı (ders kapsamındaki hesaplar) ----------

function niceStep(span,n){const s0=span/n,mag=Math.pow(10,Math.floor(Math.log10(s0))),e=s0/mag;return mag*(e>=7.5?10:e>=3.5?5:e>=1.5?2:1);}

function niceMax(v,n=5){if(!(v>0))return 1;const st=niceStep(v,n);return Math.ceil(v*1.0001/st)*st;}
function niceRange(lo,hi,n=5){if(hi-lo<1e-9){hi=lo+1;}const st=niceStep(hi-lo,n);return [Math.floor(lo/st)*st,Math.ceil(hi/st)*st];}

    rect(x0,x1,v0,v1,cls,round=true){const lo=Math.min(v0,v1),hi=Math.max(v0,v1);if(hi-lo<1e-9)return;
      const px0=X(x0),px1=X(x1),w=px1-px0,yt=Y(hi),yb=Y(lo),h=yb-yt,r=round?Math.min(4,w/2,h):0;
      if(!r){f.add(`<rect class="${cls}" x="${px0}" y="${yt}" width="${w}" height="${h}"/>`);return;}
      const up=v1>=v0; /* veri ucu: up ise üst, değilse alt */
      const p=up?`M${px0},${yb}V${yt+r}Q${px0},${yt} ${px0+r},${yt}H${px1-r}Q${px1},${yt} ${px1},${yt+r}V${yb}Z`
               :`M${px0},${yt}V${yb-r}Q${px0},${yb} ${px0+r},${yb}H${px1-r}Q${px1},${yb} ${px1},${yb-r}V${yt}Z`;

/* Yığılmış sütun (bilanço): cols=[{name, items:[[etiket,değer,sınıf]]}] */

/* Şelale: items=[{l, v, t:'total'|'delta'}] */
function waterfall(host,items,o={}){

  const lo=Math.min(0,...bars.map(x=>Math.min(x.a,x.b))),hi=Math.max(0,...bars.map(x=>Math.max(x.a,x.b)));

/* Gruplu sütun: cats=['..'], series=[{n, cls, v:[..]}] */
function groupChart(host,cats,series,o={}){

/* ---------- Alıştırmalar ---------- */
function parseNum(s){
  s=String(s).trim().replace(/\s/g,'').replace(/TL|tl|adet|yıl|gün|pay|%/g,'').replace(/[−–]/g,'-');
  if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  return Number(s);
}
function isRight(q,v){if(!isFinite(v))return false;const t=q.abs!=null?q.abs:Math.max(Math.abs(q.ans)*(q.rel||0.005),0.01);return Math.abs(v-q.ans)<=t;}
function netMap(lines){const m={};lines.forEach(([c,b,a])=>{m[c]=(m[c]||0)+b-a;});Object.keys(m).forEach(c=>{if(Math.abs(m[c])<0.5)delete m[c];});return m;}
/* Öğrenci satırlarını beklenen kayıtla (ya da alternatifleriyle) karşılaştırır */
function gradeEntry(q,lines){
  const tol=q.tol||1;const sm=netMap(lines);
  const res=[q.entry].concat(q.alt||[]).map(ex=>{const em=netMap(ex);const codes=new Set([...Object.keys(em),...Object.keys(sm)]);let good=0,bad=0;
    codes.forEach(c=>{if(em[c]!=null&&sm[c]!=null&&Math.abs(em[c]-sm[c])<=tol)good++;else bad++;});
    return {ok:bad===0,good,total:Object.keys(em).length,wrongAcc:Object.keys(sm).filter(c=>em[c]==null)};});
  return res.find(r=>r.ok)||res.reduce((a,b)=>(b.good-b.wrongAcc.length)>(a.good-a.wrongAcc.length)?b:a);
}

function renderExercises(root,lid,step,api){
  const qs=step.qs.filter(q=>!q.yl||S.lvl==='yl');
  const sum=el('div','qsum');root.appendChild(sum);
  root.insertAdjacentHTML('beforeend','<p class="lmeta">Sayısal cevaplarda ondalık için virgül kullanın (ör. 42,58); binlik ayırıcı zorunlu değildir. Yevmiye sorularında hesap kodunu (ör. 153) ya da listeden hesabı seçin; her satıra yalnızca borç <i>ya da</i> alacak tutarı yazın. İlk yanlışta ipucu, ikinci yanlışta çözüm gösterilir.</p>');
  ensureDatalist();
  const upd=()=>{const n=qs.length,d=qs.filter(q=>(S.qs[lid+':'+q.id]||{}).s).length,f=qs.filter(q=>{const s=S.qs[lid+':'+q.id];return s&&s.s==='ok'&&s.a===0;}).length;
    sum.innerHTML=`Cevaplanan: <b>${d}/${n}</b> · İlk denemede doğru: <b>${f}</b>`;if(d===n)api.unlock();};
  qs.forEach((q,i)=>{
    const key=lid+':'+q.id;const st=S.qs[key]||(S.qs[key]={a:0,s:''});
    const c=el('div','q');const kay=q.tag==='kayit';
    const solHTML=()=>(kay?jt([J(q.ed||'',q.entry)],{num:false}):'')+(q.sol||'');
    let inner='';
    if(q.opts)inner=`<div class="opts" role="radiogroup">${q.opts.map((o,k)=>`<label><input type="radio" name="r${key}" value="${k}"><span>${o}</span></label>`).join('')}</div><div class="qa"><button type="button" class="btn chk">Kontrol et</button></div>`;
    else if(kay)inner=`<table class="je"><thead><tr><th>Hesap</th><th>Borç (TL)</th><th>Alacak (TL)</th><th></th></tr></thead><tbody></tbody><tfoot><tr class="tot"><td style="text-align:right">Toplam</td><td class="tb" style="text-align:right">0</td><td class="tc" style="text-align:right">0</td><td></td></tr></tfoot></table>
      <div class="qa"><button type="button" class="btn sm addr">+ Satır ekle</button><button type="button" class="btn chk">Kontrol et</button></div>`;
    else inner=`<div class="qa"><input class="num" inputmode="decimal" aria-label="Cevap" placeholder="Cevabınız"> <span class="unit">${q.unit||''}</span><button type="button" class="btn chk">Kontrol et</button></div>`;
    c.innerHTML=`<div class="qh"><span class="chip">${TAG[q.tag]}</span>${q.yl?`<span class="chip yl">${CONFIG.lvlLabels[1]}</span>`:''}<span class="qn">Soru ${i+1}/${qs.length}</span></div><div>${q.p}</div>${inner}<div class="fb"></div>`;
    root.appendChild(c);
    const fb=$('.fb',c),btn=$('.chk',c),inp=$('input.num',c);
    let tbody,addRow,rowsData;
    if(kay){tbody=$('tbody',c);
      const tot=()=>{let b=0,a=0;tbody.querySelectorAll('tr').forEach(r=>{b+=parseNum(r.querySelector('.vb').value)||0;a+=parseNum(r.querySelector('.va').value)||0;});$('.tb',c).textContent=nf(b,b%1?2:0);$('.tc',c).textContent=nf(a,a%1?2:0);};
      addRow=()=>{const r=el('tr','',`<td><input class="acc" list="tdhp-dl" placeholder="ör. 102 Bankalar" aria-label="Hesap"></td><td><input class="num vb" inputmode="decimal" aria-label="Borç"></td><td><input class="num va" inputmode="decimal" aria-label="Alacak"></td><td><button type="button" class="xbtn" title="Satırı sil">×</button></td>`);
        tbody.appendChild(r);r.querySelectorAll('input').forEach(x=>x.addEventListener('input',tot));$('.xbtn',r).onclick=()=>{if(tbody.children.length>1){r.remove();tot();}};};
      addRow();addRow();$('.addr',c).onclick=addRow;
      rowsData=()=>{const out=[],errs=[];tbody.querySelectorAll('tr').forEach((r,k)=>{const as=r.querySelector('.acc').value,vb=r.querySelector('.vb').value,va=r.querySelector('.va').value;
        if(!as.trim()&&!vb.trim()&&!va.trim())return;
        const code=findCode(as);const b=vb.trim()?parseNum(vb):0,a=va.trim()?parseNum(va):0;
        if(!code)errs.push(`${k+1}. satırdaki hesap tanınmadı ("${as||'boş'}").`);
        else if(!isFinite(b)||!isFinite(a))errs.push(`${k+1}. satırdaki tutar sayı değil.`);
        else if((b>0)===(a>0))errs.push(`${k+1}. satıra yalnızca borç ya da yalnızca alacak tutarı yazın.`);
        else out.push([code,b,a]);});
        return {out,errs};};
    }
    const lock=()=>{c.querySelectorAll('input,button.chk,button.addr,button.xbtn').forEach(x=>x.disabled=true);};
    const show=(extra)=>{
      if(st.s==='ok'){fb.className='fb ok';fb.innerHTML='<b>Doğru.</b> '+solHTML();lock();}
      else if(st.s==='rev'){fb.className='fb rev';fb.innerHTML='<b>Çözüm:</b> '+solHTML();lock();}
      else if(st.a===1){fb.className='fb try';fb.innerHTML='<b>Henüz değil; bir kez daha deneyin.</b> '+(extra||'')+'İpucu: '+q.hint;}
    };
    btn.onclick=()=>{
      let right,extra='';
      if(q.opts){const r=c.querySelector('input[type=radio]:checked');if(!r){fb.className='fb try';fb.textContent='Bir seçenek işaretleyin.';return;}right=+r.value===q.correct;}
      else if(kay){const {out,errs}=rowsData();
        if(errs.length){fb.className='fb try';fb.innerHTML=errs.join('<br>');return;}
        if(out.length<2){fb.className='fb try';fb.textContent='Bir yevmiye maddesinde en az bir borç ve bir alacak satırı olmalıdır.';return;}
        const t=entryTotals(out);if(Math.abs(t.b-t.a)>0.5){fb.className='fb try';fb.innerHTML=`Kayıt denk değil: borç toplamı ${nf(t.b)}, alacak toplamı ${nf(t.a)}. Çift taraflı kayıtta iki toplam eşit olmalıdır.`;return;}
        const g=gradeEntry(q,out);right=g.ok;
        if(!right)extra=`Beklenen ${g.total} hesaptan ${Math.min(g.good,g.total)} tanesi doğru tutar ve yönde.${g.wrongAcc.length?` Bu kayıtta yer almaması gereken hesap: ${g.wrongAcc.join(', ')}.`:''} `;}
      else{const v=parseNum(inp.value);if(!isFinite(v)){fb.className='fb try';fb.textContent='Sayısal bir değer girin.';return;}right=isRight(q,v);}
      if(right)st.s='ok';else{st.a++;if(st.a>=2)st.s='rev';}
      S.qs[key]=st;save();show(extra);upd();
    };
    if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});
    show();
  });
  upd();
}

let UICHK=0,TXCHK=0;
function poke(b,st,err,tag){
  if(b.querySelector('.tx-list'))TXCHK++;
  b.querySelectorAll('input[type=range]').forEach(r=>{[r.min,r.max,r.defaultValue].forEach(v=>{r.value=v;r.dispatchEvent(new Event('input'));});});
  b.querySelectorAll('.seg button').forEach(x=>x.click());
  for(let g=0;g<40;g++){const cur=b.querySelector('.tx-list .tx button.primary');if(!cur)break;const sel=cur.parentNode.querySelector('select');if(sel)sel.value='0';cur.click();}
  b.querySelectorAll('[data-s]').forEach((x,i)=>{if(i===0)x.click();});
  b.querySelectorAll('.cls-row select').forEach(s=>{s.value=s.options[1]?s.options[1].value:'';s.dispatchEvent(new Event('change'));});
  b.querySelectorAll('button[data-step]').forEach(x=>{for(let k=0;k<12;k++)if(!x.disabled)x.click();});
  if(st.qs){const qs=st.qs.filter(q=>!q.yl||S.lvl==='yl');b.querySelectorAll('.q').forEach((c,i)=>{const q=qs[i];if(!q||q.tag!=='kayit')return;
    const tb=c.querySelector('tbody');while(tb.children.length<q.entry.length)c.querySelector('.addr').click();
    q.entry.forEach((x,k)=>{const r=tb.children[k];r.querySelector('.acc').value=an(x[0]);r.querySelector('.vb').value=x[1]?nf(x[1],2):'';r.querySelector('.va').value=x[2]?nf(x[2],2):'';});
    c.querySelector('.chk').click();UICHK++;if(!c.querySelector('.fb.ok'))err(`${tag} S${q.id}: doğru kayıt arayüzde kabul edilmedi (${c.querySelector('.fb').textContent.slice(0,90)})`);});}
}
function selfTest(){
  NOSAVE=true;const out=[];let fail=0;const keep=JSON.parse(JSON.stringify(S));S.qs={};S.unl={};
  const err=(m)=>{fail++;out.push('HATA  '+m);};
  window.addEventListener('error',e=>err('pencere: '+e.message));
  Object.keys(LESSONS).forEach(id=>{if(!CAT[id])err(`${id}: katalogda yok`);});
  const host=el('div','');host.style.cssText='position:absolute;left:-9999px;width:1000px';document.body.appendChild(host);
  let nSteps=0,nQ=0,nK=0;
  ['lisans','yl'].forEach(lvl=>{S.lvl=lvl;S.mode='tam';applyLvl();
    Object.entries(LESSONS).forEach(([id,L])=>{visSteps(L).forEach(st=>{
      const b=el('div','');host.appendChild(b);
      try{mountStep(b,id,st,{unlocked:false,unlock(){}});nSteps++;}catch(e){err(`${lvl} ${id}/${st.k}: ${e.message}`);}
      try{poke(b,st,err,`${lvl} ${id}/${st.k}`);}catch(e){err(`${lvl} ${id}/${st.k} etkileşim: ${e.message}`);}
      S.qs={};
      if(st.qs&&lvl==='yl')st.qs.forEach(q=>{nQ++;
        if(q.tag==='kayit'){nK++;[q.entry].concat(q.alt||[]).forEach((ex,k)=>{const t=entryTotals(ex);if(Math.abs(t.b-t.a)>0.01)err(`${id} S${q.id} kayıt${k?' alt'+k:''} denk değil (${t.b} / ${t.a})`);
            ex.forEach(x=>{if(!TDHP[x[0]])err(`${id} S${q.id}: hesap yok ${x[0]}`);});});
          if(!gradeEntry(q,q.entry).ok)err(`${id} S${q.id}: doğru cevap kabul edilmiyor`);
          const wrong=q.entry.map(x=>[x[0],x[2],x[1]]);if(gradeEntry(q,wrong).ok)err(`${id} S${q.id}: ters kayıt kabul ediliyor`);}
        else if(q.opts){if(!(q.correct>=0&&q.correct<q.opts.length))err(`${id} S${q.id}: doğru seçenek yok`);}
        else if(!isFinite(q.ans))err(`${id} S${q.id}: cevap sayı değil`);
        if(!q.hint)err(`${id} S${q.id}: ipucu yok`);});
      b.remove();});});});
  /* Ders metinlerindeki örnek maddelerin denkliği */
  (window.EXAMPLE_ENTRIES||[]).forEach(([n,ex])=>{const t=entryTotals(ex.l);if(Math.abs(t.b-t.a)>0.01)err(`örnek madde denk değil: ${n} (${t.b} / ${t.a})`);ex.l.forEach(x=>{if(!TDHP[x[0]])err(`örnek madde ${n}: hesap yok ${x[0]}`);});});
  [...new Set(JT_ERR)].slice(0,20).forEach(m=>err('ekranda denk olmayan ya da tanımsız hesaplı madde: '+m));
  out.push(`Ekranda üretilen yevmiye maddesi: ${JT_N}`);
  host.remove();S=keep;NOSAVE=false;applyLvl();
  out.unshift(`${CONFIG.title}: ${Object.keys(LESSONS).length} ders, ${nSteps} adım açıldı (iki düzey), ${nQ} soru (${nK} yevmiye) denetlendi, ${(window.EXAMPLE_ENTRIES||[]).length} örnek madde; arayüzde ${UICHK} yevmiye cevabı girildi, ${TXCHK} işlem listesi sonuna kadar oynatıldı. Hata: ${fail}`);
  app.innerHTML=`<pre id="selftest">${out.join('\n')}</pre>`;document.title=fail?'SELFTEST FAIL '+fail:'SELFTEST OK';
}

/* ---------- Ortak hesaplayıcılar ---------- */
function bsFrom(entries){
  const m=balances(entries);let hz=0,al=0,st=0,md=0,yk=0,sr=0,kr=0,dg=0;
  Object.keys(m).forEach(c=>{const d=m[c].b-m[c].a,k=c[0],g=c.slice(0,2);
    if(k==='1'){if(g==='10')hz+=d;else if(g==='12')al+=d;else if(g==='15')st+=d;else dg+=d;}
    else if(k==='2')md+=d;
    else if(k==='3'||k==='4')yk+=-d;
    else if(c==='500'||c==='501')sr+=-d;
    else if(k==='5')sr+=-d;
    else if(k==='6'||k==='7')kr+=-d;});
  const aktif=[['Hazır değerler',hz,'f1'],['Ticari alacaklar',al,'f2'],['Stoklar',st,'f3'],['Diğer dönen',dg,'f5'],['Duran varlıklar',md,'f4']];
  const pasif=[['Yabancı kaynaklar',yk,'f2'],['Sermaye',sr,'f1'],['Dönem kârı',kr,'f3']];
  return {aktif,pasif,A:hz+al+st+md+dg,P:yk+sr+kr,kar:kr,ok:Math.abs(hz+al+st+md+dg-(yk+sr+kr))<0.5};
}

  const s=sl(L.ctl,{label:'Net satışlar',min:0,max:2000000,step:50000,value:1200000,fmt:v=>tl(v)});
  const c=sl(L.ctl,{label:'Satılan malın maliyeti (satışların %\'si)',min:40,max:120,step:5,value:60,fmt:v=>'%'+v});
  const g=sl(L.ctl,{label:'Faaliyet giderleri',min:0,max:800000,step:10000,value:300000,fmt:v=>tl(v)});
  legend(L.leg,[['box f1','Ara toplam'],['box f3','Artış'],['box f2','Azalış']]);
  const ro=readouts(L.ro,[['b','Brüt satış kârı'],['k','Dönem kârı'],['o0','Dönem başı özkaynak'],['o1','Dönem sonu özkaynak']]);
  function draw(u){

function stokHesap(g,q,fiyat){
  const lay=[[100,1000],[200,1000*(1+g)],[200,1000*(1+g)*(1+g)]];

}

function amortPlan(C,n,yontem,kal=0){
  const out=[];let nd=C;
  if(yontem==='normal'){const a=(C-kal)/n;for(let t=1;t<=n;t++){nd-=a;out.push([t,a,nd]);}}
  else{const d=Math.min(2/n,0.5);for(let t=1;t<=n;t++){const a=t===n?nd:nd*d;nd-=a;out.push([t,a,nd]);}}
  return out;
}

function K_satis(root,api){
  const C=200000,N=5;
  const L=kl(root,`Defne Ticaret 2026 başında ${tl(C)}\'ye aldığı ve 5 yılda normal yöntemle amortismana tabi tuttuğu büro mobilyasını satıyor. Satış, seçilen yılın <b>amortismanı ayrıldıktan sonra</b>, bir sonraki yılın ilk iş gününde yapılıyor ve %20 KDV ile peşin tahsil ediliyor. Satış bedeli net defter değerinden yüksekse kâr, düşükse zarar oluşur.`);
  const ck=checklist(L.task,[{id:'a',t:'Satıştan <b>kâr</b> elde edin.'},{id:'b',t:'Satıştan <b>zarar</b> edin.'},{id:'c',t:'Satış bedelini net defter değerine <b>tam eşitleyin</b>.'}],api);
  const y=sl(L.ctl,{label:'Kaç yıllık amortisman ayrıldı?',min:1,max:4,step:1,value:2,fmt:v=>v+' yıl'});
  const p=sl(L.ctl,{label:'Satış bedeli (KDV hariç)',min:0,max:250000,step:5000,value:150000,fmt:v=>tl(v)});
  const ro=readouts(L.ro,[['ba','Birikmiş amortisman'],['nd','Net defter değeri'],['kz','Satış kârı / zararı']]);
  legend(L.leg,[['box f1','Net defter değeri'],['box f3','Satış bedeli']]);
  function draw(u){
    const BA=C/N*y.v,ND=C-BA,P=p.v,K=P-ND,kdv=P*.2;
    groupChart(L.ch,['Net defter|değeri','Satış|bedeli'],[{n:'Tutar',cls:'f1',v:[ND,0]},{n:'Satış bedeli',cls:'f3',v:[0,P]}],{aria:'Net defter değeri ve satış bedeli',labels:true,h:260,mb:58});
    ro.set('ba',tl(BA));ro.set('nd',tl(ND));ro.set('kz',Math.abs(K)<1?'Kâr ya da zarar yok':K>0?`<span class="flag good">Kâr ${tl(K)}</span>`:`<span class="flag bad">Zarar ${tl(-K)}</span>`);
    const l=[B(100,P+kdv),B(257,BA)];if(K<-0.5)l.push(B(689,-K));l.push(A(255,C));if(kdv>0)l.push(A(391,kdv));if(K>0.5)l.push(A(679,K));
    L.x.innerHTML='<h3>Satış kaydı</h3>'+jt([J('Demirbaşın satışı',l.filter(x=>x[1]+x[2]>0.5))],{num:false});
    if(u){if(K>0.5)ck.mark('a');if(K<-0.5)ck.mark('b');if(Math.abs(K)<0.5)ck.mark('c');}
  }
  [y,p].forEach(x=>x.on(()=>draw(1)));draw(0);
}

  {id:6,tag:'kavram',p:'Mizan denk çıktı. Aşağıdaki hatalardan hangisi <b>yine de</b> mevcut olabilir?',opts:['Bir alacak tutarının büyük deftere eksik aktarılması','Bir maddede borç tutarının alacak tutarından farklı yazılması','Bir işlemin borç ve alacak taraflarının ters çevrilmesi','Bir hesabın borç toplamının yanlış toplanması'],correct:2,hint:'Hangi hata iki tarafı aynı tutarda etkiler?',sol:'<b>Ters kayıt</b> her iki tarafa da aynı tutarı yazar; mizan denk kalır.'},
  {id:7,tag:'hesap',p:'Bir alacak tutarı büyük deftere 81.000 TL yerine 18.000 TL olarak aktarıldı. Mizanın borç toplamı 1.240.000 TL\'dir. Mizanın alacak toplamı kaç TL çıkar?',ans:1177000,abs:1,unit:'TL',hint:'Alacak tarafı ne kadar eksik yazıldı?',sol:'Eksik aktarılan tutar 81.000 − 18.000 = 63.000 TL → 1.240.000 − 63.000 = <b>1.177.000 TL</b>. Fark 9\'a bölünür (63.000 / 9 = 7.000); bu, rakam yer değiştirme hatalarının tipik izidir.'},
  {id:8,tag:'kavram',yl:1,p:'Türkiye\'de TFRS\'ye göre finansal tablo hazırlayan şirketlerin yasal defterleri için uygulamada hangisi en yaygındır?',opts:['Yasal defterler doğrudan TFRS\'ye göre tutulur, TDHP kullanılmaz','Yasal defterler VUK ve TDHP\'ye göre tutulur; TFRS tabloları düzeltme ve sınıflandırma kayıtlarıyla hazırlanır','TFRS uygulayan şirketler defter tutmaz','Yalnızca vergi beyannamesi TFRS\'ye göre hazırlanır'],correct:1,hint:'Vergi matrahı VUK hükümlerine göre belirlenir.',sol:'Uygulamada yasal kayıtlar <b>VUK ve TDHP</b> esasına göre tutulur; TFRS tabloları ayrı bir raporlama katmanında düzeltme kayıtlarıyla elde edilir.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary">
  <li>Aktif ve gider hesapları borçta, pasif ve gelir hesapları alacakta artar; düzenleyici hesaplar terstir.</li>
  <li>TDHP kodu sınıf → grup → ana hesap yapısındadır (1 → 10 → 102).</li>
  <li>Yevmiye defteri tarih sırasıyla, büyük defter hesap bazında, mizan özet olarak tutulur.</li>
  <li>Mizan denkliği tutar hatalarını yakalar; ters kayıt, yanlış hesap, unutma ve çift kaydı yakalamaz.</li></ul>
  <p class="lmeta">İzlence: Hafta 4 (hesap kavramı, işleyiş kuralları), 5 (defterler ve kayıt düzeni), 9 (hesap planı) · ÖÇ1, ÖÇ2.</p>`}
]},

stok:{title:'Ticari mallar ve katma değer vergisi',sure:'45 dk',steps:[
 {k:'a',type:'anlatim',title:'153 Ticari Mallar, satışlar ve KDV',html:()=>`
  <p>Ticaret işletmeleri satmak amacıyla aldıkları malları <b>153 Ticari Mallar</b> hesabında izler. Derste <b>aralıklı (dönemsel) envanter</b> yöntemi kullanılır: alışlar 153'e borç, satışlar satış tutarıyla 600 Yurt İçi Satışlar'a alacak yazılır. Satılan malın maliyeti dönem sonunda sayım yapılarak bulunur:</p>
  <div class="eq">SMM = Dönem başı stok + Net alışlar − Dönem sonu stok</div>
  <p>Alışla ilgili nakliye ve sigorta gibi giderler malın maliyetine (153) eklenir. Alıştan iadeler 153'ü azaltır; satıştan iadeler <b>610 Satıştan İadeler (−)</b>, sonradan yapılan indirimler <b>611 Satış İskontoları (−)</b> hesabına yazılır. Dönem sonunda SMM için şu kayıt yapılır: <b>621 Satılan Ticari Mallar Maliyeti</b> borç, 153 alacak.</p>
  <h3>Stok değerleme yöntemleri</h3>
  <p>Aynı mal farklı fiyatlarla alındığında satılan ve kalan malın maliyeti bir varsayımla belirlenir. <b>İlk giren ilk çıkar</b> (FIFO) yönteminde önce eski partiler satılmış sayılır. <b>Ağırlıklı ortalama</b> yönteminde bütün partiler ortalama birim maliyetle değerlenir.</p>
  <h3>Katma değer vergisi</h3>
  <p>KDV, tüketiciye kadar her aşamada yalnızca <b>katma değer üzerinden</b> alınan bir vergidir. İşletme alışlarda ödediği KDV'yi <b>191 İndirilecek KDV</b>'ye, satışlarda müşteriden tahsil ettiği KDV'yi <b>391 Hesaplanan KDV</b>'ye yazar. Ay sonunda iki hesap mahsup edilir: 391 büyükse fark <b>360 Ödenecek Vergi ve Fonlar</b>'a, 191 büyükse fark <b>190 Devreden KDV</b>'ye aktarılır.</p>
  <div class="note tr">Genel KDV oranı 10.07.2023'ten bu yana %20'dir; bazı mal ve hizmetlerde %10 ve %1 oranları uygulanır. Örneklerde %20 kullanılmıştır. Oranlar Cumhurbaşkanı kararıyla değişebilir.</div>`},
 {k:'o',type:'ornek',title:'Defne Ticaret\'in Mart ayı',html:()=>`
  <p><b>Soru.</b> Dönem başında 100 adet mal var (birim 1.000 TL). Mart'ta 300 adet birim 1.200 TL'den %20 KDV ile veresiye alınıyor. 250 adet birim 2.000 TL'den %20 KDV ile veresiye satılıyor. Dönem sonu stok <b>ağırlıklı ortalama</b> ile değerleniyor. Kayıtları yapın; SMM'yi, brüt kârı ve ödenecek KDV'yi bulun.</p>
  <p><b>Ortalama birim maliyet:</b> (100.000 + 360.000) / 400 = 1.150 TL. <b>DSS:</b> 150 × 1.150 = 172.500 TL. <b>SMM:</b> 100.000 + 360.000 − 172.500 = <b>287.500 TL</b>.</p>
  ${jt(ORN_STOK)}
  <p><b>Brüt satış kârı:</b> 500.000 − 287.500 = <b>212.500 TL</b>. <b>Ödenecek KDV:</b> 100.000 − 72.000 = <b>28.000 TL</b>.</p>
  <p>FIFO ile SMM = 100 × 1.000 + 150 × 1.200 = 280.000 TL olurdu; fiyatlar arttığı için FIFO daha düşük maliyet ve daha yüksek kâr verir.</p>`},
 {k:'k1',type:'kesif',core:true,title:'FIFO ve ağırlıklı ortalama',mount:K_fifo},
 {k:'k2',type:'kesif',core:true,title:'KDV mahsubu: ödenecek mi, devreden mi?',mount:K_kdv},
 {k:'t',type:'turetim',title:'SMM formülü 153 hesabından nasıl çıkar?',html:()=>`
  <p>153 Ticari Mallar hesabının borç tarafında dönem başı stok ve alışlar, alacak tarafında alıştan iadeler ve dönem sonunda satılan malın maliyeti yer alır. Kalan bakiye dönem sonu stoktur:</p>
  <div class="eq">DBS + Alışlar − Alıştan iadeler − SMM = DSS &nbsp;⇒&nbsp; SMM = DBS + Net alışlar − DSS</div>
  <p>Yöntem seçimi <b>satışa hazır mal toplamını</b> (DBS + net alışlar) değiştirmez; yalnızca bu toplamın SMM ile DSS arasında nasıl bölüneceğini değiştirir. Bu yüzden bir yöntemin bu yıl yüksek gösterdiği kâr, stoklar satıldıkça sonraki dönemlerde tersine döner.</p>
  <p><b>KDV neden gider değildir?</b> İşletme 391'de topladığı vergiden 191'de ödediğini düşüp farkı devlete öder. KDV, işletmenin kârını etkilemeyen bir <i>geçiş kalemidir</i>; bu yüzden 153'e değil 191'e yazılır.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'kayit',p:'80.000 TL + %20 KDV tutarında ticari mal veresiye alındı.',entry:[B(153,80000),B(191,16000),A(320,96000)],hint:'KDV 80.000 × %20 = 16.000 TL; satıcıya olan borç KDV dahil tutardır.',sol:''},
  {id:2,tag:'kayit',p:'50.000 TL + %20 KDV tutarında mal satıldı; karşılığında müşteriden senet alındı.',entry:[B(121,60000),A(600,50000),A(391,10000)],hint:'Alınan senet 121 Alacak Senetleri hesabında izlenir.',sol:''},
  {id:3,tag:'hesap',p:'Dönem başı stok 40.000 TL, alışlar 260.000 TL, alıştan iadeler 10.000 TL, dönem sonu stok 55.000 TL. Satılan malın maliyeti kaç TL\'dir?',ans:235000,abs:1,unit:'TL',hint:'SMM = DBS + alışlar − alıştan iadeler − DSS.',sol:'40.000 + 260.000 − 10.000 − 55.000 = <b>235.000 TL</b>.'},
  {id:4,tag:'kayit',p:'Önceki sorudaki satılan malın maliyetini dönem sonunda kaydedin.',entry:[B(621,235000),A(153,235000)],hint:'Maliyet 62 grubundaki bir hesaba borç, stok hesabına alacak yazılır.',sol:''},
  {id:5,tag:'hesap',p:'Ay sonunda 391 Hesaplanan KDV bakiyesi 48.000 TL, 191 İndirilecek KDV bakiyesi 61.000 TL\'dir. Sonraki aya devreden KDV kaç TL\'dir?',ans:13000,abs:1,unit:'TL',hint:'Hangi hesap büyük?',sol:'61.000 − 48.000 = <b>13.000 TL</b> devreden KDV.'},
  {id:6,tag:'kayit',p:'Önceki sorudaki KDV mahsup kaydını yapın.',entry:[B(391,48000),B(190,13000),A(191,61000)],hint:'391 kapanır (borç), 191 kapanır (alacak); fark 190\'a borç yazılır.',sol:''},
  {id:7,tag:'grafik',p:'Fiyatların sürekli arttığı bir dönemde hangi yöntem daha yüksek brüt kâr gösterir?',opts:['Ağırlıklı ortalama','İlk giren ilk çıkar (FIFO)','İkisi her zaman eşittir','Satış miktarına göre değişir, genel bir şey söylenemez'],correct:1,hint:'Keşif 1\'de fiyat değişimini pozitif yaptığınızda hangi sütun yükseldi?',sol:'FIFO\'da satılan mallar eski (ucuz) partilerden çıkar; SMM düşük, brüt kâr <b>yüksek</b> olur.'},
  {id:8,tag:'kavram',yl:1,p:'TMS 2 Stoklar standardına göre aşağıdaki yöntemlerden hangisi <b>kullanılamaz</b>?',opts:['İlk giren ilk çıkar','Ağırlıklı ortalama maliyet','Son giren ilk çıkar (LIFO)','Özel tanımlama (birbirinin yerine kullanılamayan kalemlerde)'],correct:2,hint:'Standart, maliyet akışı varsayımlarından birini yasaklar.',sol:'TMS 2 <b>LIFO</b> yöntemine izin vermez.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary">
  <li>Aralıklı envanterde SMM = DBS + net alışlar − DSS; dönem sonunda 621 borç, 153 alacak kaydı yapılır.</li>
  <li>FIFO ve ağırlıklı ortalama satışa hazır mal toplamını SMM ile DSS arasında farklı böler. Fiyatlar artarken FIFO daha yüksek kâr gösterir.</li>
  <li>Alışlardaki KDV 191'e, satışlardaki KDV 391'e yazılır. Ay sonunda fark 360'a (ödenecek) ya da 190'a (devreden) aktarılır.</li>
  <li>KDV bir geçiş kalemidir; işletmenin kârını etkilemez.</li></ul>
  <p class="lmeta">İzlence: Hafta 10 (dönen varlıklar) ve ders içeriğindeki "stok hareketleri" ile "KDV işlemleri" · ÖÇ3.</p>`}
]},

amort:{title:'Maddi duran varlıklar ve amortisman',sure:'45 dk',steps:[
 {k:'a',type:'anlatim',title:'Maliyet, amortisman ve net defter değeri',html:()=>`
  <p>İşletmede bir yıldan uzun süre kullanılmak üzere edinilen fiziksel varlıklar <b>25 Maddi Duran Varlıklar</b> grubunda izlenir: 250 Arazi ve Arsalar, 252 Binalar, 253 Tesis, Makine ve Cihazlar, 254 Taşıtlar, 255 Demirbaşlar. Varlık <b>maliyet bedeliyle</b> kaydedilir: alış fiyatına nakliye, montaj ve kullanıma hazır hâle getirme giderleri eklenir; indirilebilen KDV maliyete girmez.</p>
  <h3>Amortisman</h3>
  <p>Arsa dışındaki duran varlıklar kullanıldıkça, eskidikçe ve teknolojik olarak geride kaldıkça değer kaybeder. <b>Amortisman</b>, maliyetin varlığın faydalı ömrüne gider olarak dağıtılmasıdır. Kayıtta varlık hesabı azaltılmaz; birikmiş tutar düzenleyici hesapta, <b>257 Birikmiş Amortismanlar (−)</b>'da toplanır. Gider tarafı varlığın kullanıldığı yere göre seçilir: yönetim için 770, satış için 760, üretim için 730.</p>
  <div class="eq">Net defter değeri = Maliyet − Birikmiş amortisman</div>
  <h3>VUK'taki yöntemler</h3>
  <ul><li><b>Normal (eşit tutarlı) yöntem:</b> Her yıl aynı tutar ayrılır; oran = 1 / faydalı ömür.</li>
  <li><b>Azalan bakiyeler yöntemi:</b> Oran normal oranın <b>iki katıdır, %50'yi aşamaz</b>; her yıl kalan net değere uygulanır. Son yılda kalan değerin tamamı amortisman olarak ayrılır.</li></ul>
  <p>Faydalı ömürler ve oranlar Gelir İdaresi'nin yayımladığı amortisman listelerinde yer alır. VUK'ta amortisman kural olarak yıllık ayrılır; varlığın yıl içinde hangi ay alındığına bakılmaz (binek otomobiller gibi istisnalar vardır).</p>
  <h3>Duran varlık satışı</h3>
  <p>Satışta varlığın maliyeti (255 alacak) ve birikmiş amortismanı (257 borç) birlikte kapatılır. Satış bedeli net defter değerinden yüksekse fark <b>679 Diğer Olağan Dışı Gelir ve Kârlar</b>'a, düşükse <b>689 Diğer Olağan Dışı Gider ve Zararlar</b>'a yazılır.</p>
  <div class="note yl yl-only"><b>TMS 16 Maddi Duran Varlıklar</b> amortismanın varlığın ekonomik faydalarının tüketilme biçimini yansıtmasını ister. Faydalı ömür ve <b>kalıntı değer</b> işletmenin kendi tahminidir ve her yıl gözden geçirilir; amortisman varlık kullanıma hazır olduğu andan itibaren (aylık kıst) başlar. Ayrıca önemli parçaları farklı ömürlü olan varlıklar <b>bileşenlerine ayrılarak</b> amortismana tabi tutulur. Bu farklar VUK ile TFRS tabloları arasında geçici farklar ve ertelenmiş vergi doğurur.</div>`},
 {k:'o',type:'ornek',title:'Defne Ticaret\'in büro mobilyaları',html:()=>{const P=amortPlan(200000,5,'azalan');return `
  <p><b>Soru.</b> Defne Ticaret 2 Ocak 2026'da 200.000 TL'ye (KDV hariç) büro mobilyası aldı; faydalı ömür 5 yıl. Normal ve azalan bakiyeler yöntemine göre amortisman planlarını çıkarın ve 2026 yılı sonu kaydını yapın.</p>
  <p><b>Normal yöntem:</b> oran %20; her yıl 200.000 × %20 = <b>40.000 TL</b>.</p>
  <p><b>Azalan bakiyeler:</b> oran %20 × 2 = %40 (%50 sınırının altında).</p>
  <table class="tbl"><thead><tr><th>Yıl</th><th>Normal</th><th>Azalan bakiyeler</th><th>Azalan: net değer</th></tr></thead><tbody>${P.map(x=>`<tr><td>${x[0]}</td><td>${nf(40000)}</td><td>${nf(x[1],x[1]%1?2:0)}</td><td>${nf(x[2],x[2]%1?2:0)}</td></tr>`).join('')}<tr class="tot"><td>Toplam</td><td>200.000</td><td>200.000</td><td></td></tr></tbody></table>
  <p>5. yılda azalan bakiyelerde %40 uygulanmaz; kalan ${nf(P[4][1])} TL'nin tamamı ayrılır. 2026 sonu kaydı (normal yöntem, yönetimde kullanılan mobilya) ve dönem sonu yansıtma kayıtları:</p>
  ${jt(ORN_AMORT)}`;}},
 {k:'k1',type:'kesif',core:true,title:'Normal ve azalan bakiyeler yöntemi',mount:K_amort},
 {k:'k2',type:'kesif',core:true,title:'Duran varlık satışı: kâr mı, zarar mı?',mount:K_satis},
 {k:'t',type:'turetim',title:'İki yöntem neden aynı toplamı verir?',html:()=>`
  <p>Azalan bakiyeler yönteminde oran <i>d</i> = min(2/<i>n</i>; 0,5) ise <i>t</i>. yıl sonunda net değer <i>C</i>(1 − <i>d</i>)<sup><i>t</i></sup> olur. Bu ifade hiçbir zaman sıfıra inmez; bu yüzden VUK son yılda kalan değerin tamamının ayrılmasını ister. Böylece iki yöntemde de ömür boyunca ayrılan toplam amortisman <b>maliyete eşittir</b>.</p>
  <p>Farklı olan, giderin <b>zamanlamasıdır</b>. Azalan bakiyeler ilk yıllarda daha fazla gider yazar, kârı ve vergiyi öne çeker. Toplam vergi değişmez ama ödeme ertelenir; paranın zaman değeri düşünüldüğünde bu işletme lehinedir.</p>
  <p><b>Satış kaydının mantığı:</b> Satışla varlık bilançodan tamamen çıkar. Bunun için maliyet (borç bakiyeli 255) alacaklandırılır, birikmiş amortisman (alacak bakiyeli 257) borçlandırılır. Tahsilat ile net defter değeri arasındaki fark kâr ya da zarardır.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'360.000 TL\'ye alınan, faydalı ömrü 5 yıl olan bir taşıt için normal yöntemle yıllık amortisman kaç TL\'dir?',ans:72000,abs:1,unit:'TL',hint:'Oran = 1 / 5.',sol:'360.000 × %20 = <b>72.000 TL</b>.'},
  {id:2,tag:'hesap',p:'Aynı taşıt için azalan bakiyeler yöntemiyle <b>2. yıl</b> amortismanı kaç TL\'dir?',ans:86400,abs:1,unit:'TL',hint:'Oran %40. Önce 1. yıl sonundaki net değeri bulun.',sol:'1. yıl: 360.000 × %40 = 144.000; net değer 216.000. 2. yıl: 216.000 × %40 = <b>86.400 TL</b>.'},
  {id:3,tag:'kayit',p:'Yönetimde kullanılan bu taşıt için 1. yıl sonunda normal yöntemle amortisman kaydını yapın (7/A seçeneği).',entry:[B(770,72000),A(257,72000)],hint:'Gider, varlığın kullanıldığı yere göre seçilir; birikmiş tutar düzenleyici hesapta toplanır.',sol:''},
  {id:4,tag:'hesap',p:'Faydalı ömrü 3 yıl olan bir varlıkta azalan bakiyeler yönteminin oranı yüzde kaçtır?',ans:50,abs:0.01,unit:'%',hint:'Normal oranın iki katını bulun ve sınırı kontrol edin.',sol:'2 × (1/3) = %66,7; ancak oran %50\'yi aşamaz → <b>%50</b>.'},
  {id:5,tag:'kayit',p:'Maliyeti 100.000 TL, birikmiş amortismanı 60.000 TL olan demirbaş 50.000 TL + %20 KDV karşılığında peşin (nakit) satıldı.',entry:[B(100,60000),B(257,60000),A(255,100000),A(391,10000),A(679,10000)],hint:'Net defter değeri 40.000 TL; satış bedeli 50.000 TL. Kâr hangi hesapta izlenir?',sol:'Net defter değeri 100.000 − 60.000 = 40.000 TL; satış kârı 50.000 − 40.000 = 10.000 TL.'},
  {id:6,tag:'grafik',p:'Faydalı ömür boyunca ayrılan <b>toplam</b> amortisman tutarı normal yöntemde ve azalan bakiyeler yönteminde nasıldır?',opts:['Azalan bakiyelerde daha yüksektir','Normal yöntemde daha yüksektir','İkisinde de maliyete eşittir','Ömre göre değişir'],correct:2,hint:'Keşif 1\'de iki çizgi son yılda nerede buluşuyor?',sol:'İkisinde de toplam = maliyet; yalnızca <b>zamanlama</b> farklıdır.'},
  {id:7,tag:'hesap',yl:1,p:'TMS 16\'ya göre maliyeti 200.000 TL, kalıntı değeri 20.000 TL, faydalı ömrü 6 yıl olan bir makinenin doğrusal yöntemle yıllık amortismanı kaç TL\'dir?',ans:30000,abs:1,unit:'TL',hint:'Amortismana tabi tutar = maliyet − kalıntı değer.',sol:'(200.000 − 20.000) / 6 = <b>30.000 TL</b>.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary">
  <li>Maddi duran varlıklar maliyet bedeliyle kaydedilir; amortisman maliyeti faydalı ömre dağıtır.</li>
  <li>Birikmiş amortisman 257'de toplanır; net defter değeri = maliyet − birikmiş amortisman.</li>
  <li>Azalan bakiyeler oranı normal oranın iki katıdır ve %50'yi aşamaz; son yılda kalan değer tamamen ayrılır.</li>
  <li>Satışta 255 ve 257 birlikte kapatılır; fark 679'a (kâr) ya da 689'a (zarar) yazılır.</li>

/* Sınıflandırma keşfi: her satır için açılır listeden doğru seçeneği seçme */
function siniflandir(L,items,opts,ck,id,onAll){
  const box=el('div','');L.ctl.appendChild(box);
  box.innerHTML=items.map((it,k)=>`<div class="cls-row" data-k="${k}"><span>${it[0]}</span><select class="sel" aria-label="Seçenek"><option value="">Seçin…</option>${opts.map((o,j)=>`<option value="${j}">${o}</option>`).join('')}</select></div>`).join('');
  const sec={};
  const upd=()=>{let ok=0;box.querySelectorAll('.cls-row').forEach(r=>{const k=+r.dataset.k,s=sec[k];r.classList.toggle('ok',s!=null&&s===items[k][1]);r.classList.toggle('bad',s!=null&&s!==items[k][1]);if(s===items[k][1])ok++;});
    if(ok===items.length){ck.mark(id);if(onAll)onAll();}return ok;};
  box.querySelectorAll('select').forEach(s=>s.addEventListener('change',()=>{const k=+s.closest('.cls-row').dataset.k;sec[k]=s.value===''?null:+s.value;const ok=upd();L.ro.innerHTML=`<div class="ro-i"><div class="ro-l">Doğru</div><div class="ro-v">${ok} / ${items.length}</div></div>`;
    const it=items[k];L.x.innerHTML=sec[k]===it[1]?`<div class="fb ok"><b>${opts[it[1]]}.</b> ${it[2]}</div>`:sec[k]!=null?`<div class="fb try">Bu durum başka bir kavrama daha iyi uyuyor. İpucu: ${it[3]||it[2].split('.')[0]+'.'}</div>`:'';}));
  L.ro.innerHTML=`<div class="ro-i"><div class="ro-l">Doğru</div><div class="ro-v">0 / ${items.length}</div></div>`;
}

    if(u){if(G>=144000)ck.mark('a');if(v===1)ck.mark('b');ck.mark('c');}

/* ---------- DERS 9 — Ücret bordrosu ---------- */
function bordro(br,r){
  const sgk=br*r.si/100,isz=br*r.ii/100,mat=br-sgk-isz,gv=mat*r.gv/100,dv=br*r.dv/100,net=br-sgk-isz-gv-dv,isv=br*(r.se-r.tes)/100,isvz=br*r.ie/100;
  return {sgk,isz,gv,dv,net,isv,isvz,mat,top:br+isv+isvz};
}
function K_bordro(root,api){
  const L=kl(root,'Yönetimde çalışan bir personelin aylık brüt ücretinden yapılan kesintileri ve işverenin ödediği primleri izleyin. Oranların varsayılanları 2026 için yayımlanan genel oranlardır; gelir vergisi tek dilimle (%15) ve <b>asgari ücret istisnası göz ardı edilerek</b> basitleştirilmiştir.');
  const ck=checklist(L.task,[{id:'a',t:'Brüt ücreti değiştirin ve işverene toplam maliyetin brüt ücrete oranını gözleyin.'},{id:'b',t:'İşveren teşvikini seçin: net ücret değişiyor mu?'}],api);
  const br=sl(L.ctl,{label:'Aylık brüt ücret',min:20000,max:200000,step:1000,value:50000,fmt:v=>tl(v)});
  const r={si:14,ii:1,gv:15,dv:0.759,se:21.75,ie:2,tes:0};
  const p2=v=>'%'+nf(v,Number.isInteger(v)?0:2);
  const si=sl(L.ctl,{label:'SGK işçi payı',min:0,max:20,step:0.25,value:14,fmt:p2});
  const se=sl(L.ctl,{label:'SGK işveren payı',min:0,max:30,step:0.25,value:21.75,fmt:p2});

function K_yil(root,api){
  const L=kl(root,'Defne Ticaret\'in ilk yılını sekiz özet işlemle kaydedin; her kayıttan sonra <b>gelir tablosu</b> ve <b>bilanço</b> güncellenir. Vergi ve KDV göz ardı edilmiştir; dönem sonu kapanış kayıtları Muhasebe II\'de işlenir.');
  const ck=checklist(L.task,[{id:'a',t:'Sekiz işlemi kaydedin ve iki tabloyu tamamlayın.'},{id:'b',t:'En az <b>altı</b> tahmini doğru yapın.'}],api);
  const tb=el('div','');L.main.appendChild(tb);
  function draw(ents){
    const m=balances(ents),g=c=>-net(m,c),sat=g('600'),smm=net(m,'621'),fg=net(m,'770'),bk=sat-smm,k=bk-fg;
    const b=bsFrom(ents);
    stackChart(L.ch,[{name:'Aktif',items:b.aktif},{name:'Pasif',items:b.pasif}],{minMax:900000,aria:'Bilanço',h:280});
    const row=(a,v,c='')=>`<tr class="${c}"><td>${a}</td><td>${nf(v)}</td></tr>`;
    tb.innerHTML=`<div class="fs"><table class="tbl"><thead><tr><th>Gelir tablosu</th><th>TL</th></tr></thead><tbody>${row('Net satışlar',sat)}${row('Satışların maliyeti (−)',-smm)}${row('Brüt satış kârı',bk,'tot')}${row('Faaliyet giderleri (−)',-fg)}${row('Dönem kârı',k,'tot')}</tbody></table>
     <table class="tbl"><thead><tr><th>Bilanço</th><th>TL</th></tr></thead><tbody>${['102','120','153','255','257'].map(c=>row(an(c),net(m,c))).join('')}${row('Aktif toplamı',b.A,'tot')}${['320','500'].map(c=>row(an(c),-net(m,c))).join('')}${row('Dönem kârı',b.kar)}${row('Pasif toplamı',b.P,'tot')}</tbody></table></div>`;
    L.x.innerHTML=ents.length?'<h3>Yevmiye</h3>'+jt(ents):'';
  }
  txList(L.ctl,TX_YIL,(ents,i,ok,res)=>{draw(ents);if(ents.length===TX_YIL.length){ck.mark('a');if(res.filter(Boolean).length>=6)ck.mark('b');}});
  draw([]);
}

giris:{title:'Muhasebeye genel bakış ve temel kavramlar',sure:'30 dk',steps:[

ilke:{title:'Bilanço ve gelir tablosu ilkeleri: dönemsellik ve tahakkuk',sure:'35 dk',steps:[
 {k:'a',type:'anlatim',title:'Mali tablo ilkeleri',html:()=>`

  <h3>Tahakkuk esası</h3>
  <p>Gelir, mal teslim edildiğinde ya da hizmet yapıldığında; gider, katlanıldığında kaydedilir. Paranın el değiştirmesi ayrı bir olaydır. Aradaki farklar bilançoda alacak, borç ve <b>dönemsellik hesaplarıyla</b> görünür:</p>

   <tr><td>180 Gelecek Aylara Ait Giderler</td><td>Peşin ödenen ama gelecek dönemlere ait giderler</td></tr>
   <tr><td>181 Gelir Tahakkukları</td><td>Bu döneme ait ama henüz tahsil edilmemiş gelirler (ör. mevduat faizi)</td></tr>
   <tr><td>380 Gelecek Aylara Ait Gelirler</td><td>Peşin tahsil edilen ama gelecek dönemlere ait gelirler</td></tr>
   <tr><td>381 Gider Tahakkukları</td><td>Bu döneme ait ama henüz ödenmemiş giderler</td></tr></tbody></table>
  <div class="note yl yl-only"><b>TFRS 15</b> hasılatın, mal ya da hizmet üzerindeki kontrol müşteriye geçtiğinde ve beklenen bedel tutarında kaydedilmesini ister (beş adımlı model). Tahakkuk esası Kavramsal Çerçeve'de de temel varsayımdır; nakit akış tablosu (TMS 7) ise nakit esasındaki bilgiyi ayrıca sunar.</div>`},
 {k:'o',type:'ornek',title:'Aralık\'ın kârı',html:()=>`
  <p><b>Durum.</b> Aralık'ta 200.000 TL'lik satışın 50.000 TL'si tahsil edilmedi; Aralık elektrik faturası (8.000 TL) Ocak'ta gelecek; Kasım'da peşin ödenen 12 aylık reklam bedelinin (24.000 TL) Aralık payı 2.000 TL.</p>
  <p><b>Tahakkuk esası Aralık gideri:</b> elektrik 8.000 + reklam 2.000 = 10.000 TL; gelir 200.000 TL. <b>Nakit esasında</b> ise tahsilat 150.000 TL, elektrik için ödeme yok.</p>
  ${jt(EX('ilke-ornek',[J('Aralık elektriğinin tahakkuku',[B(770,8000),A(381,8000)]),J('Reklamın Aralık payı',[B(760,2000),A(180,2000)])]))}`},
 {k:'k1',type:'kesif',core:true,title:'Nakit esası ve tahakkuk esası',mount:K_tahakkuk},
 {k:'t',type:'turetim',title:'Nakit sonuç ile kâr arasındaki köprü',html:()=>`
  <p>Bir dönemin kârı ile nakit hareketi arasındaki fark, bilançodaki tahakkuk kalemlerindeki değişimden gelir:</p>
  <div class="eq">Nakit sonuç = Kâr − Δ Alacaklar − Δ Peşin giderler (180) + Δ Ödenmemiş giderler (381, 335)</div>
  <p>Dönem başında ve sonunda bu kalemler eşitse iki esas aynı sonucu verir. Büyüyen ve vadeli satan bir işletmede alacaklar arttığı için kâr nakitten yüksek görünür; nakit akış tablosunun dolaylı yöntemi bu köprüyü kurar.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'kayit',p:'Aralık\'a ait 15.000 TL yönetim binası elektriği Ocak\'ta ödenecek. 31 Aralık kaydını yapın (7/A).',entry:[B(770,15000),A(381,15000)],hint:'Bu döneme ait, ödenmemiş gider.',sol:''},
  {id:2,tag:'kayit',p:'1 Kasım\'da bir kiracıdan 6 aylık depo kirası olarak 60.000 TL peşin tahsil edildi (kira geliri 649).',entry:[B(102,60000),A(380,60000)],hint:'Tahsil edilen tutar henüz kazanılmadı.',sol:'31 Aralık\'ta 2 aylık pay (20.000 TL) 380\'den 649\'a aktarılır.'},
  {id:3,tag:'hesap',p:'Önceki sorudaki kiranın 31 Aralık\'ta gelir yazılacak kısmı kaç TL\'dir?',ans:20000,abs:1,unit:'TL',hint:'Kasım ve Aralık.',sol:'60.000 × 2/6 = <b>20.000 TL</b>.'},
  {id:4,tag:'kayit',p:'Önceki sorudaki aktarımı yapın.',entry:[B(380,20000),A(649,20000)],hint:'Gelecek aylara ait gelir azalır, gelir hesabı artar.',sol:''},
  {id:5,tag:'grafik',p:'Vadeli satışları artan bir işletmede, giderler değişmezse nakit esasındaki sonuç tahakkuk esasındaki kâra göre nasıl olur?',opts:['Daha yüksek','Daha düşük','Aynı','Belirsiz'],correct:1,hint:'Keşifteki vadeli satış oranını artırdığınızda ne oldu?',sol:'Tahsil edilmeyen satışlar kâra girer ama nakde girmez: nakit sonuç <b>daha düşük</b> olur.'},
  {id:6,tag:'kavram',yl:1,p:'TFRS 15\'e göre hasılat ne zaman kaydedilir?',opts:['Fatura kesildiğinde','Nakit tahsil edildiğinde','Mal ya da hizmet üzerindeki kontrol müşteriye geçtiğinde','Sözleşme imzalandığında'],correct:2,hint:'Kontrolün devri.',sol:'<b>Kontrol müşteriye geçtiğinde</b>.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary">
  <li>Gelirler gerçekleştiğinde, giderler katlanıldığında ve gelirlerle eşleştirilerek kaydedilir.</li>
  <li>Nakit ile kâr arasındaki farklar 120, 180, 181, 380, 381 ve 335 gibi hesaplarda bilançoya yansır.</li>
  <li>Peşin tahsil edilen gelir yükümlülük (380), peşin ödenen gider varlıktır (180).</li></ul>
  <p class="lmeta">İzlence: Hafta 8 (genel kabul görmüş bilanço ve gelir tablosu ilkeleri) · ÖÇ1.</p>`}
]},

hazir:{title:'Hazır değerler ve menkul kıymetler',sure:'35 dk',steps:[
 {k:'a',type:'anlatim',title:'10 ve 11 grubu hesaplar',html:()=>`
  <table class="tbl sym"><thead><tr><th>Hesap</th><th>İşleyiş</th></tr></thead><tbody>
   <tr><td>100 Kasa</td><td>Nakit girişi borç, çıkışı alacak; alacak bakiyesi veremez</td></tr>
   <tr><td>101 Alınan Çekler</td><td>Müşteriden alınan çek borç; tahsil, ciro ya da iade edilince alacak</td></tr>
   <tr><td>102 Bankalar</td><td>Vadesiz ve vadeli mevduat</td></tr>
   <tr><td>103 Verilen Çekler ve Ödeme Emirleri (−)</td><td>İşletmenin verdiği çekler alacak; banka ödeyince borç</td></tr>
   <tr><td>108 Diğer Hazır Değerler</td><td>Kredi kartıyla yapılan satışların bankaya geçmemiş tutarları gibi</td></tr>
   <tr><td>110 Hisse Senetleri · 111–112 Tahvil ve bonolar</td><td>Kısa süreli elde tutmak için alınan menkul kıymetler; satış kârı 645, zararı 655</td></tr></tbody></table>
  <p><b>Çek</b> görüldüğünde ödenen bir ödeme aracıdır; ileri tarihli çekler de uygulamada 101'de izlenir. Verilen çek, banka ödeyene kadar bankadaki paradan düşülmesi gereken bir tutar olduğu için 103 düzenleyici hesabında bekler.</p>
  <p>Hisse senedi alışında aracı kuruma ödenen komisyon ders kitaplarında çoğunlukla <b>653 Komisyon Giderleri</b>'ne yazılır; maliyete eklenmesini savunan görüş de vardır.</p>
  <div class="note yl yl-only"><b>TFRS 9</b>'a göre alım satım amaçlı hisse senetleri <b>gerçeğe uygun değer farkı kâr veya zarara yansıtılan</b> finansal varlıklardır: her raporlama tarihinde borsa değerine getirilir ve işlem maliyetleri doğrudan gider yazılır. VUK'ta ise borsada işlem gören hisse senetleri borsa rayicine göre değerlenebilir.</div>`},
 {k:'o',type:'ornek',title:'Bir çekin iki yüzü',html:()=>`
  <p>Defne Ticaret müşterisinden 40.000 TL'lik çek aldı ve bankaya tahsile verdi; ayrıca satıcısına 25.000 TL'lik çek yazdı.</p>${jt(TX_HAZIR.slice(0,4).map(x=>x.e))}
  <p>Satıcı çeki bankaya götürene kadar 102'deki 40.000 TL'nin 25.000 TL'si aslında harcanmıştır; 103 bu tutarı gösterir.</p>`},
 {k:'k1',type:'kesif',core:true,title:'Çekler ve hisse senetleri',mount:K_hazir},
 {k:'t',type:'turetim',title:'103 neden aktifte ama alacak bakiyeli?',html:()=>`
  <p>Çek verildiğinde satıcıya olan borç kapanır ama bankadaki para henüz çıkmamıştır. 102'yi hemen alacaklandırmak banka ekstresiyle mutabakatı bozar; borcu açık tutmak ise satıcıya olan borcu iki kez gösterir. Çözüm, bankadaki parayı azaltan bir <b>düzenleyici aktif hesap</b> kullanmaktır:</p>
  <div class="eq">Kullanılabilir hazır değer = 102 Bankalar − 103 Verilen Çekler</div>
  <p>Banka çeki ödeyince iki hesap birlikte azalır ve 103 kapanır.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'kayit',p:'Müşteriden alacağına karşılık 18.000 TL\'lik çek alındı.',entry:[B(101,18000),A(120,18000)],hint:'Alınan çek bir hazır değerdir.',sol:''},
  {id:2,tag:'kayit',p:'Satıcıya olan borç için 30.000 TL\'lik şirket çeki verildi.',entry:[B(320,30000),A(103,30000)],hint:'Banka henüz ödemedi.',sol:''},
  {id:3,tag:'kayit',p:'Bu çek bankaca ödendi.',entry:[B(103,30000),A(102,30000)],hint:'İki hesap birlikte azalır.',sol:''},
  {id:4,tag:'kayit',p:'2.000 adet hisse senedi 12 TL\'den alındı; 120 TL komisyonla birlikte bankadan ödendi.',entry:[B(110,24000),B(653,120),A(102,24120)],alt:[[B(110,24120),A(102,24120)]],hint:'Komisyon 653\'e (ya da maliyete) yazılabilir.',sol:'Komisyonun maliyete eklendiği kayıt da kabul edilir.'},
  {id:5,tag:'kayit',p:'Maliyeti 24.000 TL olan bu hisseler 21.000 TL\'ye satıldı; bedel bankaya geçti.',entry:[B(102,21000),B(655,3000),A(110,24000)],hint:'Satış zararı hangi hesapta?',sol:''},
  {id:6,tag:'kavram',yl:1,p:'TFRS 9\'a göre alım satım amaçlı hisse senedinin alış komisyonu nasıl muhasebeleştirilir?',opts:['Maliyete eklenir','Doğrudan gider yazılır','Özkaynağa yazılır','Aktifleştirilip itfa edilir'],correct:1,hint:'GUD farkı kâr veya zarara yansıtılan varlıklar.',sol:'İşlem maliyetleri <b>doğrudan gider</b> yazılır.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary">
  <li>Alınan çekler 101'de, verilen çekler banka ödeyene kadar 103'te izlenir.</li>
  <li>Kısa süreli menkul kıymetler 110–112'de; satış kârı 645, zararı 655.</li>
  <li>Alış komisyonu çoğunlukla 653'e yazılır.</li></ul>
  <p class="lmeta">İzlence: Hafta 10 (dönen varlıklar) ve ders içeriğindeki "nakit hareketleri" ile "menkul kıymet işlemleri" · ÖÇ3.</p>`}
]},

alacak:{title:'Ticari alacaklar, alacak senetleri ve şüpheli alacaklar',sure:'40 dk',steps:[
 {k:'a',type:'anlatim',title:'12 grubu hesaplar',html:()=>`
  <table class="tbl sym"><thead><tr><th>Hesap</th><th>İşleyiş</th></tr></thead><tbody>
   <tr><td>120 Alıcılar</td><td>Senetsiz ticari alacaklar</td></tr>
   <tr><td>121 Alacak Senetleri</td><td>Müşteriden alınan bono ve poliçeler; tahsil, ciro, iskonto ya da protesto edilince alacaklanır</td></tr>
   <tr><td>122 Alacak Senetleri Reeskontu (−)</td><td>Dönem sonunda senedin içindeki gelecek dönem faizi (657 / 122)</td></tr>
   <tr><td>126 Verilen Depozito ve Teminatlar</td><td>Kira depozitosu, elektrik–su güvence bedeli</td></tr>
   <tr><td>128 Şüpheli Ticari Alacaklar · 129 Karşılığı (−)</td><td>Dava ya da icra safhasındaki alacaklar ve bunlar için ayrılan karşılık</td></tr></tbody></table>
  <h3>Şüpheli alacaklar</h3>
  <p>VUK'a göre dava ya da icra safhasındaki alacaklar ile dava ve icra takibine değmeyecek kadar küçük ve protesto edilmiş ya da yazıyla birden fazla istenmiş alacaklar <b>şüpheli alacak</b> sayılır ve karşılık ayrılabilir. Kayıtlar: 128 / 120 (sınıflama), 654 / 129 (karşılık). Sonradan tahsil edilen kısım için 129 / 644 kaydı yapılır.</p>
  <div class="note yl yl-only"><b>TFRS 9</b> şüpheli alacak yerine <b>beklenen kredi zararı</b> modelini kullanır: alacak doğduğu anda, geçmiş tecrübe ve geleceğe yönelik bilgilerle beklenen kayıp için karşılık ayrılır. Ticari alacaklarda basitleştirilmiş yaklaşım (ömür boyu beklenen kredi zararı, vade yaşlandırma tablosu) uygulanabilir. Dava şartı yoktur.</div>`},
 {k:'o',type:'ornek',title:'Davalık bir alacak',html:()=>`
  <p>Bir müşterinin 100.000 TL'lik borcu için 2026'da dava açıldı. 2027'de 60.000 TL tahsil edildi, kalanının tahsil edilemeyeceği kesinleşti.</p>
  ${jt(EX('alacak-ornek',[J('2026: şüpheli alacağa aktarma',[B(128,100000),A(120,100000)]),J('2026 sonu: karşılık',[B(654,100000),A(129,100000)]),J('2027: tahsilat',[B(102,60000),A(128,60000)]),J('2027: tahsil edilen kısmın karşılığı',[B(129,60000),A(644,60000)]),J('2027: değersiz kısmın kapatılması',[B(129,40000),A(128,40000)])]))}
  <p>Net etki: 2026'da 100.000 TL gider, 2027'de 60.000 TL gelir; iki yılda toplam 40.000 TL zarar.</p>`},
 {k:'k1',type:'kesif',core:true,title:'Şüpheli alacak karşılığı',mount:K_supheli},
 {k:'t',type:'turetim',title:'Karşılık neden alacağı doğrudan silmez?',html:()=>`
  <p>Dava sürerken alacağın tahsil edilip edilemeyeceği belli değildir; hukuken alacak devam eder. Karşılık, <b>ihtiyatlılık</b> gereği olası kaybı bu dönemin gideri yapar ama alacak hesabını (128) korur. Bilançoda alacak net gösterilir:</p>
  <div class="eq">Net ticari alacak = 120 + 121 + 128 − 122 − 129</div>
  <p>Belirsizlik ortadan kalkınca (tahsilat ya da kesinleşen kayıp) karşılık kapatılır; böylece gider ve gelir doğru dönemlerde yer alır.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'kayit',p:'Müşteriye 60.000 TL + %20 KDV\'lik mal satıldı; karşılığında 3 ay vadeli senet alındı.',entry:[B(121,72000),A(600,60000),A(391,12000)],hint:'Senetli alacak.',sol:''},
  {id:2,tag:'kayit',p:'Ofis kirası için ev sahibine 2 aylık kira tutarında 40.000 TL depozito bankadan ödendi.',entry:[B(126,40000),A(102,40000)],hint:'Depozito geri alınacak bir tutardır.',sol:''},
  {id:3,tag:'kayit',p:'Hakkında icra takibi başlatılan 25.000 TL\'lik alacak şüpheli alacaklara aktarıldı.',entry:[B(128,25000),A(120,25000)],hint:'Sınıflama kaydı.',sol:''},
  {id:4,tag:'kayit',p:'Bu alacak için dönem sonunda karşılık ayrıldı.',entry:[B(654,25000),A(129,25000)],hint:'Karşılık giderleri 65 grubundadır.',sol:''},
  {id:5,tag:'kayit',p:'Ertesi yıl alacağın tamamı bankaya tahsil edildi (iki madde yerine tek madde yazın).',entry:[B(102,25000),B(129,25000),A(128,25000),A(644,25000)],hint:'Hem alacak hem karşılık kapanır; karşılık gelire döner.',sol:'Tahsilat (102 / 128) ve karşılığın iptali (129 / 644) birleştirildi.'},
  {id:6,tag:'kavram',yl:1,p:'TFRS 9\'a göre ticari alacak için karşılık ne zaman ayrılmaya başlanır?',opts:['Dava açıldığında','Alacak doğduğunda, beklenen kredi zararı için','Alacak bir yıl gecikince','Hiçbir zaman'],correct:1,hint:'Beklenen kayıp modeli.',sol:'<b>Alacak doğduğunda</b>, beklenen kredi zararı tutarında.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary">
  <li>Senetsiz alacaklar 120, senetli olanlar 121; depozitolar 126.</li>
  <li>Dava ya da icra safhasındaki alacak 128'e aktarılır ve 654 / 129 ile karşılık ayrılır.</li>
  <li>Tahsil edilen kısmın karşılığı 644'e gelir yazılır; kesinleşen kayıp 129 / 128 ile kapatılır.</li></ul>
  <p class="lmeta">İzlence: Hafta 10 (dönen varlıklar) ve ders içeriğindeki "ticari alacak işlemleri" ile "depozito işlemleri" · ÖÇ3.</p>`}
]},

bordro:{title:'Ücret bordrosu ve personel giderleri',sure:'35 dk',steps:[
 {k:'a',type:'anlatim',title:'Brüt ücretten net ücrete',html:()=>`
  <p><b>Ücret bordrosu</b> her ay çalışanların brüt ücretini, yasal kesintileri ve net ödenecek tutarı gösterir. Kesintiler:</p>
  <ul><li><b>SGK işçi payı</b> (malullük, yaşlılık ve ölüm %9 + genel sağlık %5 = %14) ve <b>işsizlik sigortası işçi payı</b> (%1).</li>
  <li><b>Gelir vergisi</b>: brüt ücretten SGK ve işsizlik payları düşülerek bulunan matraha, kümülatif matraha göre artan oranlı tarifeyle (%15'ten başlar) uygulanır.</li>
  <li><b>Damga vergisi</b>: brüt ücretin binde 7,59'u.</li>
  <li>Asgari ücrete isabet eden kısım gelir vergisi ve damga vergisinden istisnadır.</li></ul>
  <p>İşveren ayrıca <b>SGK işveren payı</b> (2026 için genel oran %21,75) ve <b>işsizlik sigortası işveren payı</b> (%2) öder; şartları sağlayan işverenler prim teşvikinden yararlanabilir.</p>
  <h3>Kayıtlar</h3>
  <p>Brüt ücret personelin çalıştığı fonksiyona göre 720 / 730 / 760 / 770 hesabına (7/B'de 791 / 792) yazılır. Kesintiler <b>360 Ödenecek Vergi ve Fonlar</b> (GV, DV) ve <b>361 Ödenecek Sosyal Güvenlik Kesintileri</b>'ne, net ücret <b>335 Personele Borçlar</b>'a alacak kaydedilir.</p>
  <div class="note tr">Prim oranları, taban–tavan tutarları, gelir vergisi dilimleri ve teşvikler her yıl değişir. Simülatördeki varsayılanlar 2026 için yayımlanan genel oranlardır; derste kullanmadan önce SGK ve Gelir İdaresi duyurularını kontrol edin.</div>
  <div class="note yl yl-only"><b>TMS 19 Çalışanlara Sağlanan Faydalar</b> kısa vadeli faydaların hizmetin sunulduğu dönemde gider yazılmasını ister; kullanılmamış izinler için de karşılık ayrılır. Kıdem tazminatı bir tanımlanmış fayda planı gibi aktüeryal yöntemle ölçülür.</div>`},
 {k:'o',type:'ornek',title:'Bir yönetim çalışanının bordrosu',html:()=>{const x=bordro(50000,{si:14,ii:1,gv:15,dv:0.759,se:21.75,ie:2,tes:0});return `
  <p><b>Soru.</b> Brüt ücret 50.000 TL; gelir vergisi %15 (ilk dilim), asgari ücret istisnası göz ardı.</p>
  <table class="tbl"><tbody><tr><td class="l">SGK işçi payı (%14)</td><td>${nf(x.sgk,2)}</td></tr><tr><td class="l">İşsizlik işçi payı (%1)</td><td>${nf(x.isz,2)}</td></tr>
   <tr><td class="l">GV matrahı</td><td>${nf(x.mat,2)}</td></tr><tr><td class="l">Gelir vergisi (%15)</td><td>${nf(x.gv,2)}</td></tr><tr><td class="l">Damga vergisi (‰7,59)</td><td>${nf(x.dv,2)}</td></tr>
   <tr class="tot"><td class="l">Net ücret</td><td>${nf(x.net,2)}</td></tr><tr><td class="l">İşveren SGK (%21,75) + işsizlik (%2)</td><td>${nf(x.isv+x.isvz,2)}</td></tr><tr class="tot"><td class="l">İşverene toplam maliyet</td><td>${nf(x.top,2)}</td></tr></tbody></table>`;}},
 {k:'k1',type:'kesif',core:true,title:'Bordro hesaplayıcısı',mount:K_bordro},
 {k:'t',type:'turetim',title:'Kesintiler neden borç hesaplarına gider?',html:()=>`
  <p>Brüt ücretin tamamı işletmenin gideridir; ama tamamı çalışana ödenmez. İşletme, çalışan adına vergi ve primleri keserek devlete ve SGK'ya ödemekle yükümlüdür; bu yüzden kesintiler işletmenin <b>borcudur</b>:</p>
  <div class="eq">Brüt ücret (gider) = 361 (prim kesintileri) + 360 (GV + DV) + 335 (net ücret)</div>
  <p>İşveren payları ise çalışandan kesilmez; brüt ücretin üzerine eklenen ayrı bir gider ve borçtur. Bu yüzden çalışanın işverene maliyeti net ücretin yaklaşık 1,5 katı ve üzeridir.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'Brüt ücret 40.000 TL. SGK işçi payı (%14) ve işsizlik işçi payı (%1) toplamı kaç TL\'dir?',ans:6000,abs:1,unit:'TL',hint:'%15.',sol:'40.000 × 0,15 = <b>6.000 TL</b>.'},
  {id:2,tag:'hesap',p:'Aynı ücret için gelir vergisi %15 ise (istisna göz ardı) gelir vergisi kaç TL\'dir?',ans:5100,abs:1,unit:'TL',hint:'Matrah = brüt − SGK ve işsizlik payları.',sol:'(40.000 − 6.000) × 0,15 = <b>5.100 TL</b>.'},

tablo:{title:'Finansal tabloların hazırlanması: bir yılın özeti',sure:'40 dk',steps:[
 {k:'a',type:'anlatim',title:'Mizandan tablolara',html:()=>`
  <p>Dönem sonunda envanter işlemleri (sayım, satılan malın maliyeti, amortisman, tahakkuklar) yapıldıktan sonra <b>kesin mizan</b> çıkarılır. Gelir tablosu 6 grubu hesaplardan, bilanço 1–5 sınıflarındaki hesaplardan hazırlanır:</p>
  <ul><li><b>Gelir tablosu</b>: Brüt satışlar − satış indirimleri = net satışlar − satışların maliyeti = brüt satış kârı − faaliyet giderleri = faaliyet kârı ± diğer gelir ve giderler ± olağan dışı kalemler = dönem kârı − vergi = dönem net kârı.</li>
  <li><b>Bilanço</b>: Aktifte dönen varlıklar (1) ve duran varlıklar (2) likidite sırasıyla; pasifte kısa vadeli (3) ve uzun vadeli (4) yabancı kaynaklar ile özkaynaklar (5) vade sırasıyla.</li></ul>
  <p>Düzenleyici hesaplar (257, 103, 129, 501, 580) bağlı oldukları kalemin altında eksi olarak gösterilir. Kapanış kayıtlarının ayrıntıları Muhasebe II'de işlenir.</p>
  <div class="note yl yl-only"><b>TMS 1</b> bir tam finansal tablo setini sayar: finansal durum tablosu, kâr veya zarar ve diğer kapsamlı gelir tablosu, özkaynak değişim tablosu, nakit akış tablosu ve dipnotlar.</div>`},
 {k:'o',type:'ornek',title:'Satılan malın maliyetinden brüt kâra',html:()=>`
  <p>Defne Ticaret'in ilk yılında 500.000 TL'lik mal alındı, yıl sonunda 140.000 TL'lik mal kaldı: SMM = 0 + 500.000 − 140.000 = 360.000 TL. Satışlar 720.000 TL olduğu için brüt satış kârı 360.000 TL'dir. Faaliyet giderleri (kira, elektrik 90.000 TL ve amortisman 40.000 TL) düşülünce dönem kârı 230.000 TL olur. Keşifte bu yılı işlem işlem kuracaksınız.</p>`},
 {k:'k1',type:'kesif',core:true,title:'Bir yıl, sekiz işlem, iki tablo',mount:K_yil},
 {k:'t',type:'turetim',title:'İki tablo neden birbirini doğrular?',html:()=>`
  <p>Gelir tablosundaki dönem kârı, bilançoda özkaynaklar içinde yer alır. Kayıtlar çift taraflı olduğu için:</p>
  <div class="eq">Aktif toplamı = Yabancı kaynaklar + Sermaye + (Gelirler − Giderler)</div>
  <p>Bilanço denk çıkıyor ama gelir tablosundaki kâr yanlışsa, hata büyük olasılıkla bir varlık ya da borç hesabının gelir–gider hesabıyla karıştırılmasındandır (ör. demirbaş alımını gider yazmak). Bu nedenle iki tablo birlikte okunur.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'Net satışlar 900.000 TL, satışların maliyeti 540.000 TL, faaliyet giderleri 210.000 TL. Faaliyet kârı kaç TL\'dir?',ans:150000,abs:1,unit:'TL',hint:'Önce brüt satış kârı.',sol:'900.000 − 540.000 − 210.000 = <b>150.000 TL</b>.'},
  {id:2,tag:'kavram',p:'Bilançonun aktifinde kalemler hangi sıraya göre dizilir?',opts:['Tutara göre','Likiditeye göre (paraya dönüşme kolaylığı)','Alfabetik','Alış tarihine göre'],correct:1,hint:'Kasa en üstte.',sol:'<b>Likidite</b> sırasına göre.'},
  {id:3,tag:'kavram',p:'Birikmiş amortismanlar (257) bilançoda nasıl gösterilir?',opts:['Pasifte, yabancı kaynak olarak','Aktifte, maddi duran varlıkların altında eksi olarak','Gelir tablosunda gider olarak','Özkaynaklarda'],correct:1,hint:'Düzenleyici hesap.',sol:'<b>Maddi duran varlıkların altında eksi</b> olarak.'},
  {id:4,tag:'hesap',p:'Dönem başı stok 80.000, alışlar 420.000, dönem sonu stok 100.000 TL. Satışların maliyeti kaç TL\'dir?',ans:400000,abs:1,unit:'TL',hint:'DBS + alışlar − DSS.',sol:'80.000 + 420.000 − 100.000 = <b>400.000 TL</b>.'},
  {id:5,tag:'kavram',p:'Demirbaş alımı yanlışlıkla gider yazılırsa ne olur?',opts:['Bilanço denk çıkmaz','Bilanço denk çıkar ama kâr ve aktif eksik gösterilir','Yalnızca nakit akışı etkilenir','Hiçbir tablo etkilenmez'],correct:1,hint:'Hata çift taraflı kaydı bozuyor mu?',sol:'Kayıt yine denktir; ama <b>aktif ve kâr aynı tutarda eksik</b> gösterilir.'},
  {id:6,tag:'kavram',yl:1,p:'TMS 1\'e göre aşağıdakilerden hangisi tam finansal tablo setinde <b>yer almaz</b>?',opts:['Nakit akış tablosu','Özkaynak değişim tablosu','Faaliyet raporu','Dipnotlar'],correct:2,hint:'Biri yönetimin anlatımıdır, finansal tablo değildir.',sol:'<b>Faaliyet raporu</b> finansal tablo setinin parçası değildir.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary">
  <li>Kesin mizandan gelir tablosu (6 grubu) ve bilanço (1–5 sınıfları) hazırlanır.</li>
  <li>Aktif likidite, pasif vade sırasıyla dizilir; düzenleyici hesaplar eksi gösterilir.</li>
  <li>Dönem kârı iki tabloyu birbirine bağlar.</li></ul>
  <p class="lmeta">İzlence: Hafta 13 (finansal tabloların hazırlanması), 14 (uygulama) · ÖÇ1–ÖÇ5.</p>`}
]}

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muhasebe II Simülatörü</title>
<meta name="description" content="Muhasebe II Simülatörü: tarayıcıda çalışan etkileşimli ders aracı. M. M. Tuncer Çalışkan.">
<style>
:root{color-scheme:light;
  --page:#f9f9f9;--surface:#ffffff;--ink:#191919;--ink2:#666666;--grid:#e7e7e7;--axis:#c2c2c2;--border:rgba(11,11,11,.10);
  --s1:#257de0;--s2:#f47230;--s3:#00b894;--s4:#f2a600;--s5:#ee7fac;
  --good:#0aac23;--crit:#dc3c3d;--goodtext:#006c10;
  --accent:#257de0;--accent-ink:#1757ac;--wash:#eef5fd;--ylwash:#f4f1fd;--ylink:#6a4ce2;}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --page:#0b0b0b;--surface:#191919;--ink:#efefef;--ink2:#9c9c9c;--grid:#303030;--axis:#474747;--border:rgba(255,255,255,.10);
  --s1:#338ced;--s2:#e76624;--s3:#00a888;--s4:#d28e05;--s5:#e24d8b;--goodtext:#53c556;
  --accent:#338ced;--accent-ink:#84b9f3;--wash:#14243a;--ylwash:#211c35;--ylink:#9887ef;}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15.5px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1080px;margin:0 auto;padding:18px 20px 60px}
a{color:var(--accent-ink)}
h1{font-size:1.55rem;line-height:1.25;margin:.15em 0}
h2{font-size:1.22rem;line-height:1.3;margin:.15em 0}
h3{font-size:1.02rem;margin:1.3em 0 .35em}
p{margin:.55em 0}
ul,ol{margin:.4em 0;padding-left:1.3em} li{margin:.2em 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px}
.hero{display:flex;gap:18px 28px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin:8px 0 16px}
.kicker{font-size:.78rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.lead{color:var(--ink2);max-width:62ch}
.toggles{display:flex;flex-direction:column;gap:8px}
.tg{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink2)} .tg .lbl{min-width:46px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-right:1px solid var(--border);background:transparent;color:var(--ink);padding:5px 11px;font:inherit;font-size:.85rem;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.seg button:focus-visible,.btn:focus-visible,.stp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;font-size:.88rem}
.howto b{display:block;font-size:.9rem;margin-bottom:2px}
.unit h2{font-size:1rem;margin:26px 0 10px;color:var(--ink2);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lc{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;transition:border-color .15s,transform .15s}

.lc.off{opacity:.6}
.lc .no{font-size:.76rem;color:var(--ink2)} .lc .tt{font-weight:600;margin:2px 0 8px;line-height:1.35} .lc .mt{font-size:.8rem;color:var(--ink2)}
.chip{display:inline-block;font-size:.72rem;line-height:1.5;padding:0 8px;border-radius:99px;border:1px solid var(--border);color:var(--ink2);margin-right:4px;vertical-align:middle;white-space:nowrap}
.chip.pilot{background:var(--wash);color:var(--accent-ink);border-color:transparent}
.chip.gap{border-style:dashed}
.chip.ok{color:var(--goodtext);border-color:transparent;background:rgba(10,172,35,.11)}
.chip.yl{background:var(--ylwash);color:var(--ylink);border-color:transparent}
.lh{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end;margin:4px 0 12px}
.back{font-size:.86rem;text-decoration:none}
.lmeta{font-size:.8rem;color:var(--ink2)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px}
.stp{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:99px;padding:3px 11px 3px 3px;font:inherit;font-size:.78rem;cursor:pointer;white-space:nowrap}
.stp .sn{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--page);font-weight:600;font-size:.76rem}
.stp.cur{border-color:var(--accent);color:var(--ink)} .stp.cur .sn{background:var(--accent);color:#fff}
.stp.done .sn{background:var(--good);color:#fff}
.stp:disabled{opacity:.4;cursor:not-allowed}
.step .sh{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:12px}
.chip.t-kesif{background:var(--wash);color:var(--accent-ink);border-color:transparent}
.chip.t-alistirma{background:rgba(242,166,0,.15);color:inherit;border-color:transparent}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
.lockmsg{font-size:.84rem;color:var(--ink2);text-align:center}
.btn{font:inherit;font-size:.92rem;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer}

.btn.sm{padding:3px 10px;font-size:.8rem}

.eq{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:1.08rem;text-align:center;margin:12px 0;padding:10px 12px;background:var(--page);border-radius:8px;overflow-x:auto}
.eq i{font-style:italic}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px}
.fr>span{line-height:1.3;padding:0 3px} .fr>span:first-child{border-bottom:1px solid currentColor}
.tbl{border-collapse:collapse;font-size:.87rem;margin:10px 0;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid var(--grid);padding:5px 12px;text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--ink2);font-weight:600}
.tbl.sym td{text-align:left}
.tbl tr.tot td{font-weight:700;border-top:1.5px solid var(--axis)}
.tbl tr.sub td{color:var(--ink2)}
.tbl td.l{text-align:left}
.note{padding:10px 14px;border-radius:8px;margin:14px 0;background:var(--page);font-size:.92rem}
.note.yl{background:var(--ylwash);border-left:3px solid var(--ylink)}
.note.yl::before{content:var(--yl-label,"İleri düzey");display:block;font-size:.7rem;font-weight:700;color:var(--ylink);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.note.tr::before{content:"Mevzuat notu";display:block;font-size:.7rem;font-weight:700;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.note.warn{border-left:3px solid var(--s4)}
body:not(.yl) .yl-only{display:none!important}
.k-intro{margin-bottom:14px}
.kgrid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px}
.kgrid>*{min-width:0}
@media (max-width:840px){.kgrid{grid-template-columns:minmax(0,1fr)}}
.sl{display:block;margin:0 0 13px}
.sl-top{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;color:var(--ink2)}
.sl output{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0}
.segw{margin:0 0 13px} .segw .seg{margin-top:4px}
.task{border:1px dashed var(--accent);border-radius:10px;padding:10px 12px;margin-bottom:16px;background:var(--wash);font-size:.86rem}
.task.all{border-style:solid;border-color:var(--good)}
.task-h{font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.task-s{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink2)}
.ti{display:flex;gap:8px;margin:5px 0}
.cb{flex:0 0 16px;height:16px;border:1.5px solid var(--ink2);border-radius:4px;margin-top:3px;position:relative}
.ti.ok .cb{background:var(--good);border-color:var(--good)}
.ti.ok .cb::after{content:"";position:absolute;left:4px;top:0;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.ti.ok>span:last-child{color:var(--ink2)}
.ro{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.ro-i{border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--surface)}
.ro-i.wide{grid-column:1/-1}
.ro-l{font-size:.74rem;color:var(--ink2);line-height:1.35}
.ro-v{font-weight:600;font-variant-numeric:tabular-nums}
.flag{display:inline-flex;gap:5px;align-items:center;font-weight:600;font-size:.82rem;padding:1px 9px;border-radius:99px}
.flag.good{color:var(--goodtext);background:rgba(10,172,35,.12)}
.flag.bad{color:var(--crit);background:rgba(220,60,61,.11)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.8rem;color:var(--ink2);margin-bottom:2px}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--ink2)}
.sw.l1{border-color:var(--s1)} .sw.l2{border-color:var(--s2)} .sw.l3{border-color:var(--s3)}
.sw.ref{border-top:1.5px dashed var(--ink2)}
.sw.box{width:12px;height:12px;border:0;border-radius:3px}
.sw.box.f1{background:var(--s1)} .sw.box.f2{background:var(--s2)} .sw.box.f3{background:var(--s3)} .sw.box.f4{background:var(--s4)} .sw.box.f5{background:var(--s5)}
.sw.box.fg{background:var(--axis)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.tick{fill:var(--ink2);font-size:11.5px;font-variant-numeric:tabular-nums}
.atitle{fill:var(--ink2);font-size:12px}
.l1,.l2,.l3{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.l1{stroke:var(--s1)} .l2{stroke:var(--s2)} .l3{stroke:var(--s3)}
.ref{stroke:var(--ink2);stroke-width:1.25;stroke-dasharray:4 4;fill:none}
.cur{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.d2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.d3{fill:var(--s3);stroke:var(--surface);stroke-width:2}
.f1{fill:var(--s1)} .f2{fill:var(--s2)} .f3{fill:var(--s3)} .f4{fill:var(--s4)} .f5{fill:var(--s5)} .fg{fill:var(--axis)}
.seg-r{stroke:var(--surface);stroke-width:2}
.area1{fill:var(--s1);opacity:.14} .area-g{fill:var(--good);opacity:.14} .area-c{fill:var(--crit);opacity:.12}
.bar1{fill:var(--s1)} .bar1.dim{opacity:.38}
.ref2{stroke:var(--axis);stroke-width:1.25;stroke-dasharray:2 3;fill:none}
.sw.box.bar1{background:var(--s1)} .sw.box.area1{background:var(--s1);opacity:.3}
.sw.box.area-g{background:var(--good);opacity:.35} .sw.box.area-c{background:var(--crit);opacity:.3}
.sw.dot{width:10px;height:10px;border:0;border-radius:50%;background:var(--ink)} .sw.dot.d2{background:var(--s2)} .sw.dot.d3{background:var(--s3)}
.dim{opacity:.38}
.lab,.lab2{font-size:12px;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.lab{fill:var(--ink)} .lab2{fill:var(--ink2)}
.labin{font-size:11.5px;fill:#fff;font-variant-numeric:tabular-nums}
.labin.dk{fill:#0b0b0b}
.hov line{stroke:var(--ink2);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,.14);border-radius:8px;padding:6px 10px;font-size:.78rem;line-height:1.45;white-space:nowrap;z-index:5;font-variant-numeric:tabular-nums}
details.dt summary{cursor:pointer;font-size:.82rem;color:var(--ink2);margin-top:10px}
.dtw{max-height:260px;overflow:auto}
.q{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:12px 0}
.qh{display:flex;gap:4px;align-items:center;margin-bottom:6px}
.qn{margin-left:auto;font-size:.76rem;color:var(--ink2)}
.qa{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
input.num,input.acc,select.sel{font:inherit;padding:6px 10px;border:1px solid var(--axis);border-radius:8px;background:var(--surface);color:var(--ink)}
input.num{width:190px}
.unit{color:var(--ink2);font-size:.9rem}
.opts label{display:flex;gap:8px;align-items:flex-start;padding:3px 0;cursor:pointer}
.opts input{margin-top:5px}
.fb{margin-top:10px;padding:8px 12px;border-radius:8px;font-size:.9rem}
.fb:empty{display:none}
.fb.ok{background:rgba(10,172,35,.11)}
.fb.try{background:rgba(242,166,0,.15)}
.fb.rev{background:var(--wash)}
.qsum{font-size:.86rem;color:var(--ink2);margin-bottom:4px}
.about{font-size:.8rem;color:var(--ink2);margin-top:30px;border-top:1px solid var(--grid);padding-top:14px}
.map summary{cursor:pointer;font-weight:600}
.map{margin-top:26px}
.done-box{text-align:center;padding:30px}
.summary li{margin:.35em 0}
/* ---- Muhasebeye özgü bileşenler ---- */
.jt{border-collapse:collapse;font-size:.88rem;margin:8px 0 12px;font-variant-numeric:tabular-nums;min-width:min(100%,520px)}
.jt td,.jt th{padding:4px 10px;border-bottom:1px solid var(--grid)}
.jt th{color:var(--ink2);font-weight:600;font-size:.78rem;text-align:right}
.jt th:first-child{text-align:left}
.jt td.n{text-align:right;width:110px}
.jt td.cr{padding-left:38px}
.jt tr.mh td{border-bottom:1.5px solid var(--axis);font-size:.78rem;color:var(--ink2);text-align:center}
.jt tr.ex td{font-size:.8rem;color:var(--ink2);font-style:italic;border-bottom:1.5px solid var(--axis)}
.jt tr.tot td{font-weight:700}
.ta-wrap{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}
.ta{min-width:200px;flex:1 1 200px;max-width:300px;font-size:.84rem;font-variant-numeric:tabular-nums}
.ta-h{text-align:center;font-weight:600;border-bottom:2px solid var(--ink);padding:2px 4px}
.ta-b{display:grid;grid-template-columns:1fr 1fr;min-height:50px}
.ta-b>div{padding:3px 6px}
.ta-b>div:first-child{border-right:2px solid var(--ink)}
.ta-b>div:last-child{text-align:right}
.ta-l{display:flex;justify-content:space-between;gap:6px} .ta-b>div:last-child .ta-l{flex-direction:row-reverse}
.ta-l span:first-child{color:var(--ink2);font-size:.74rem}
.ta-f{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--axis);font-size:.78rem}
.ta-f>div{padding:2px 6px} .ta-f>div:last-child{text-align:right}
.ta-bal{text-align:center;font-size:.78rem;color:var(--ink2)}
.ta.new .ta-h{color:var(--accent-ink)}
.je{border-collapse:collapse;margin-top:8px;font-size:.88rem}
.je td,.je th{padding:3px 4px}
.je th{color:var(--ink2);font-weight:600;font-size:.76rem;text-align:left}
.je input.acc{width:250px}
.je input.num{width:130px;text-align:right}
.je .tot td{font-size:.82rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.xbtn{border:0;background:transparent;color:var(--ink2);cursor:pointer;font-size:1rem}
.tx-list{display:flex;flex-direction:column;gap:6px}
.tx{display:flex;gap:8px;align-items:flex-start;text-align:left;font:inherit;font-size:.84rem;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.tx:hover:not(:disabled){border-color:var(--accent)}
.tx:disabled{opacity:.5;cursor:default}
.tx .txn{font-weight:700;color:var(--ink2);min-width:18px}
.tx select{max-width:100%;min-width:0}
.tx.on{border-color:var(--good);background:rgba(10,172,35,.07)}
.cls-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;padding:6px 0;border-bottom:1px solid var(--grid);font-size:.88rem}
/* Metin en az 180 px yer alır; sığmazsa açılır liste alt satıra iner (dar panelde kelime kelime kırılmayı önler) */
.cls-row>span{flex:1 1 180px;min-width:0}
.cls-row select{flex:0 1 auto;max-width:100%;min-width:0}
.cls-row.ok select{border-color:var(--good)} .cls-row.bad select{border-color:var(--crit)}
.fs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.fs{grid-template-columns:1fr}}
.fs .tbl{width:100%}
.mono{font-variant-numeric:tabular-nums}
/* Motorun tablolara eklediği kapsayıcı: dar ekranda tablo sayfayı değil kendini kaydırır */
.tw{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fs>.tw>.tbl{width:100%}
/* ---- Telefon (≤600 px): metin sütunları kelime kelime kırılmasın, geniş tablolar kendi içinde kaysın ---- */
@media (max-width:600px){
  #app{padding:12px 10px 50px}
  .card{padding:14px 12px}
  .q{padding:12px 10px}
  .tbl th,.tbl td{padding:4px 7px}
  .tbl:not(.sym) td:not(:first-child){white-space:nowrap}
  /* Tablo, sütun sayısına göre bir alt genişlik alır; ekrana sığmazsa .tw içinde yana kayar */
  .tbl.sym:has(tr>:nth-child(2)){min-width:21em}
  .tbl.sym:has(tr>:nth-child(3)){min-width:31em}
  .tbl.sym:has(tr>:nth-child(4)){min-width:40em}
  .tbl:not(.sym):has(tr>:nth-child(4)){min-width:30em}
  .tbl:not(.sym):has(tr>:nth-child(5)){min-width:36em}
  .jt{min-width:21em}
  .jt td,.jt th{padding:4px 6px}
  .jt td.n{width:auto;white-space:nowrap}
  .jt td.cr{padding-left:18px}
  .je{width:100%;font-size:.84rem}
  .je td,.je th{padding:3px 2px}
  .je input.acc{width:100%;min-width:7.5em;padding:6px}
  .je input.num{width:4.6em;padding:6px 4px}
}

<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================
   Muhasebe simülatörleri — ortak motor, sürüm 0.1 (pilot), 27.11.2026
   Özgün kod. Mimari 12_Finans_Simulatoru ile aynıdır; ders akışı
   fikri M. Songur'un Mikroekonomi Simülatörü'nden esinlenmiştir,
   o çalışmadan kod alınmamıştır.
   ============================================================ */

/* ---------- Yardımcılar ---------- */
const $=(s,r=document)=>r.querySelector(s);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function nf(x,d=0){return Number(x).toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d});}
function tl(x,d=0){return (x<-1e-9?'−':'')+nf(Math.abs(x),d)+' TL';}
function pc(x,d=1){return (x<-1e-12?'−%':'%')+nf(Math.abs(x)*100,d);}
function pp(x,d=1){return (x<-1e-12?'−':'')+nf(Math.abs(x)*100,d)+' puan';}
function kTL(v){const a=Math.abs(v),s=v<0?'−':'';if(a>=1e6)return s+nf(a/1e6,(a%1e6)?1:0)+' mn';if(a>=1e3)return s+nf(a/1e3,0)+' bin';return s+nf(a,0);}
function fr(n,d){return `<span class="fr"><span>${n}</span><span>${d}</span></span>`;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function r2(x){return Math.round(x*100)/100;}
const pctFmt=v=>'%'+nf(v,Number.isInteger(v)?0:1);

/* ---------- Tekdüzen Hesap Planı (ders kapsamındaki hesaplar) ----------

function niceStep(span,n){const s0=span/n,mag=Math.pow(10,Math.floor(Math.log10(s0))),e=s0/mag;return mag*(e>=7.5?10:e>=3.5?5:e>=1.5?2:1);}

function niceMax(v,n=5){if(!(v>0))return 1;const st=niceStep(v,n);return Math.ceil(v*1.0001/st)*st;}
function niceRange(lo,hi,n=5){if(hi-lo<1e-9){hi=lo+1;}const st=niceStep(hi-lo,n);return [Math.floor(lo/st)*st,Math.ceil(hi/st)*st];}

    rect(x0,x1,v0,v1,cls,round=true){const lo=Math.min(v0,v1),hi=Math.max(v0,v1);if(hi-lo<1e-9)return;
      const px0=X(x0),px1=X(x1),w=px1-px0,yt=Y(hi),yb=Y(lo),h=yb-yt,r=round?Math.min(4,w/2,h):0;
      if(!r){f.add(`<rect class="${cls}" x="${px0}" y="${yt}" width="${w}" height="${h}"/>`);return;}
      const up=v1>=v0; /* veri ucu: up ise üst, değilse alt */
      const p=up?`M${px0},${yb}V${yt+r}Q${px0},${yt} ${px0+r},${yt}H${px1-r}Q${px1},${yt} ${px1},${yt+r}V${yb}Z`
               :`M${px0},${yt}V${yb-r}Q${px0},${yb} ${px0+r},${yb}H${px1-r}Q${px1},${yb} ${px1},${yb-r}V${yt}Z`;

/* Yığılmış sütun (bilanço): cols=[{name, items:[[etiket,değer,sınıf]]}] */

/* Şelale: items=[{l, v, t:'total'|'delta'}] */
function waterfall(host,items,o={}){

  const lo=Math.min(0,...bars.map(x=>Math.min(x.a,x.b))),hi=Math.max(0,...bars.map(x=>Math.max(x.a,x.b)));

/* Gruplu sütun: cats=['..'], series=[{n, cls, v:[..]}] */
function groupChart(host,cats,series,o={}){

/* ---------- Alıştırmalar ---------- */
function parseNum(s){
  s=String(s).trim().replace(/\s/g,'').replace(/TL|tl|adet|yıl|gün|pay|%/g,'').replace(/[−–]/g,'-');
  if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  return Number(s);
}
function isRight(q,v){if(!isFinite(v))return false;const t=q.abs!=null?q.abs:Math.max(Math.abs(q.ans)*(q.rel||0.005),0.01);return Math.abs(v-q.ans)<=t;}
function netMap(lines){const m={};lines.forEach(([c,b,a])=>{m[c]=(m[c]||0)+b-a;});Object.keys(m).forEach(c=>{if(Math.abs(m[c])<0.5)delete m[c];});return m;}
/* Öğrenci satırlarını beklenen kayıtla (ya da alternatifleriyle) karşılaştırır */
function gradeEntry(q,lines){
  const tol=q.tol||1;const sm=netMap(lines);
  const res=[q.entry].concat(q.alt||[]).map(ex=>{const em=netMap(ex);const codes=new Set([...Object.keys(em),...Object.keys(sm)]);let good=0,bad=0;
    codes.forEach(c=>{if(em[c]!=null&&sm[c]!=null&&Math.abs(em[c]-sm[c])<=tol)good++;else bad++;});
    return {ok:bad===0,good,total:Object.keys(em).length,wrongAcc:Object.keys(sm).filter(c=>em[c]==null)};});
  return res.find(r=>r.ok)||res.reduce((a,b)=>(b.good-b.wrongAcc.length)>(a.good-a.wrongAcc.length)?b:a);
}
let DLID=0;
function ensureDatalist(){if(document.getElementById('tdhp-dl'))return;const d=el('datalist','');d.id='tdhp-dl';d.innerHTML=Object.values(TDHP).map(a=>`<option value="${a.c} ${a.n}">`).join('');document.body.appendChild(d);}
function renderExercises(root,lid,step,api){
  const qs=step.qs.filter(q=>!q.yl||S.lvl==='yl');
  const sum=el('div','qsum');root.appendChild(sum);
  root.insertAdjacentHTML('beforeend','<p class="lmeta">Sayısal cevaplarda ondalık için virgül kullanın (ör. 42,58); binlik ayırıcı zorunlu değildir. Yevmiye sorularında hesap kodunu (ör. 153) ya da listeden hesabı seçin; her satıra yalnızca borç <i>ya da</i> alacak tutarı yazın. İlk yanlışta ipucu, ikinci yanlışta çözüm gösterilir.</p>');
  ensureDatalist();
  const upd=()=>{const n=qs.length,d=qs.filter(q=>(S.qs[lid+':'+q.id]||{}).s).length,f=qs.filter(q=>{const s=S.qs[lid+':'+q.id];return s&&s.s==='ok'&&s.a===0;}).length;
    sum.innerHTML=`Cevaplanan: <b>${d}/${n}</b> · İlk denemede doğru: <b>${f}</b>`;if(d===n)api.unlock();};
  qs.forEach((q,i)=>{
    const key=lid+':'+q.id;const st=S.qs[key]||(S.qs[key]={a:0,s:''});
    const c=el('div','q');const kay=q.tag==='kayit';
    const solHTML=()=>(kay?jt([J(q.ed||'',q.entry)],{num:false}):'')+(q.sol||'');
    let inner='';
    if(q.opts)inner=`<div class="opts" role="radiogroup">${q.opts.map((o,k)=>`<label><input type="radio" name="r${key}" value="${k}"><span>${o}</span></label>`).join('')}</div><div class="qa"><button type="button" class="btn chk">Kontrol et</button></div>`;
    else if(kay)inner=`<table class="je"><thead><tr><th>Hesap</th><th>Borç (TL)</th><th>Alacak (TL)</th><th></th></tr></thead><tbody></tbody><tfoot><tr class="tot"><td style="text-align:right">Toplam</td><td class="tb" style="text-align:right">0</td><td class="tc" style="text-align:right">0</td><td></td></tr></tfoot></table>
      <div class="qa"><button type="button" class="btn sm addr">+ Satır ekle</button><button type="button" class="btn chk">Kontrol et</button></div>`;
    else inner=`<div class="qa"><input class="num" inputmode="decimal" aria-label="Cevap" placeholder="Cevabınız"> <span class="unit">${q.unit||''}</span><button type="button" class="btn chk">Kontrol et</button></div>`;
    c.innerHTML=`<div class="qh"><span class="chip">${TAG[q.tag]}</span>${q.yl?`<span class="chip yl">${CONFIG.lvlLabels[1]}</span>`:''}<span class="qn">Soru ${i+1}/${qs.length}</span></div><div>${q.p}</div>${inner}<div class="fb"></div>`;
    root.appendChild(c);
    const fb=$('.fb',c),btn=$('.chk',c),inp=$('input.num',c);
    let tbody,addRow,rowsData;
    if(kay){tbody=$('tbody',c);
      const tot=()=>{let b=0,a=0;tbody.querySelectorAll('tr').forEach(r=>{b+=parseNum(r.querySelector('.vb').value)||0;a+=parseNum(r.querySelector('.va').value)||0;});$('.tb',c).textContent=nf(b,b%1?2:0);$('.tc',c).textContent=nf(a,a%1?2:0);};
      addRow=()=>{const r=el('tr','',`<td><input class="acc" list="tdhp-dl" placeholder="ör. 102 Bankalar" aria-label="Hesap"></td><td><input class="num vb" inputmode="decimal" aria-label="Borç"></td><td><input class="num va" inputmode="decimal" aria-label="Alacak"></td><td><button type="button" class="xbtn" title="Satırı sil">×</button></td>`);
        tbody.appendChild(r);r.querySelectorAll('input').forEach(x=>x.addEventListener('input',tot));$('.xbtn',r).onclick=()=>{if(tbody.children.length>1){r.remove();tot();}};};
      addRow();addRow();$('.addr',c).onclick=addRow;
      rowsData=()=>{const out=[],errs=[];tbody.querySelectorAll('tr').forEach((r,k)=>{const as=r.querySelector('.acc').value,vb=r.querySelector('.vb').value,va=r.querySelector('.va').value;
        if(!as.trim()&&!vb.trim()&&!va.trim())return;
        const code=findCode(as);const b=vb.trim()?parseNum(vb):0,a=va.trim()?parseNum(va):0;
        if(!code)errs.push(`${k+1}. satırdaki hesap tanınmadı ("${as||'boş'}").`);
        else if(!isFinite(b)||!isFinite(a))errs.push(`${k+1}. satırdaki tutar sayı değil.`);
        else if((b>0)===(a>0))errs.push(`${k+1}. satıra yalnızca borç ya da yalnızca alacak tutarı yazın.`);
        else out.push([code,b,a]);});
        return {out,errs};};
    }
    const lock=()=>{c.querySelectorAll('input,button.chk,button.addr,button.xbtn').forEach(x=>x.disabled=true);};
    const show=(extra)=>{
      if(st.s==='ok'){fb.className='fb ok';fb.innerHTML='<b>Doğru.</b> '+solHTML();lock();}
      else if(st.s==='rev'){fb.className='fb rev';fb.innerHTML='<b>Çözüm:</b> '+solHTML();lock();}
      else if(st.a===1){fb.className='fb try';fb.innerHTML='<b>Henüz değil; bir kez daha deneyin.</b> '+(extra||'')+'İpucu: '+q.hint;}
    };
    btn.onclick=()=>{
      let right,extra='';
      if(q.opts){const r=c.querySelector('input[type=radio]:checked');if(!r){fb.className='fb try';fb.textContent='Bir seçenek işaretleyin.';return;}right=+r.value===q.correct;}
      else if(kay){const {out,errs}=rowsData();
        if(errs.length){fb.className='fb try';fb.innerHTML=errs.join('<br>');return;}
        if(out.length<2){fb.className='fb try';fb.textContent='Bir yevmiye maddesinde en az bir borç ve bir alacak satırı olmalıdır.';return;}
        const t=entryTotals(out);if(Math.abs(t.b-t.a)>0.5){fb.className='fb try';fb.innerHTML=`Kayıt denk değil: borç toplamı ${nf(t.b)}, alacak toplamı ${nf(t.a)}. Çift taraflı kayıtta iki toplam eşit olmalıdır.`;return;}
        const g=gradeEntry(q,out);right=g.ok;
        if(!right)extra=`Beklenen ${g.total} hesaptan ${Math.min(g.good,g.total)} tanesi doğru tutar ve yönde.${g.wrongAcc.length?` Bu kayıtta yer almaması gereken hesap: ${g.wrongAcc.join(', ')}.`:''} `;}
      else{const v=parseNum(inp.value);if(!isFinite(v)){fb.className='fb try';fb.textContent='Sayısal bir değer girin.';return;}right=isRight(q,v);}
      if(right)st.s='ok';else{st.a++;if(st.a>=2)st.s='rev';}
      S.qs[key]=st;save();show(extra);upd();
    };
    if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});
    show();
  });
  upd();
}

/* Bir adımın etkileşimlerini dener: kaydırıcılar, seçim düğmeleri, işlem listeleri, yevmiye cevapları */
let UICHK=0,TXCHK=0;
function poke(b,st,err,tag){
  if(b.querySelector('.tx-list'))TXCHK++;
  b.querySelectorAll('input[type=range]').forEach(r=>{[r.min,r.max,r.defaultValue].forEach(v=>{r.value=v;r.dispatchEvent(new Event('input'));});});
  b.querySelectorAll('.seg button').forEach(x=>x.click());
  for(let g=0;g<40;g++){const cur=b.querySelector('.tx-list .tx button.primary');if(!cur)break;const sel=cur.parentNode.querySelector('select');if(sel)sel.value='0';cur.click();}
  b.querySelectorAll('[data-s]').forEach((x,i)=>{if(i===0)x.click();});
  b.querySelectorAll('.cls-row select').forEach(s=>{s.value=s.options[1]?s.options[1].value:'';s.dispatchEvent(new Event('change'));});
  b.querySelectorAll('button[data-step]').forEach(x=>{for(let k=0;k<12;k++)if(!x.disabled)x.click();});
  if(st.qs){const qs=st.qs.filter(q=>!q.yl||S.lvl==='yl');b.querySelectorAll('.q').forEach((c,i)=>{const q=qs[i];if(!q||q.tag!=='kayit')return;
    const tb=c.querySelector('tbody');while(tb.children.length<q.entry.length)c.querySelector('.addr').click();
    q.entry.forEach((x,k)=>{const r=tb.children[k];r.querySelector('.acc').value=an(x[0]);r.querySelector('.vb').value=x[1]?nf(x[1],2):'';r.querySelector('.va').value=x[2]?nf(x[2],2):'';});
    c.querySelector('.chk').click();UICHK++;if(!c.querySelector('.fb.ok'))err(`${tag} S${q.id}: doğru kayıt arayüzde kabul edilmedi (${c.querySelector('.fb').textContent.slice(0,90)})`);});}
}
function selfTest(){
  NOSAVE=true;const out=[];let fail=0;const keep=JSON.parse(JSON.stringify(S));S.qs={};S.unl={};
  const err=(m)=>{fail++;out.push('HATA  '+m);};
  window.addEventListener('error',e=>err('pencere: '+e.message));
  Object.keys(LESSONS).forEach(id=>{if(!CAT[id])err(`${id}: katalogda yok`);});
  const host=el('div','');host.style.cssText='position:absolute;left:-9999px;width:1000px';document.body.appendChild(host);
  let nSteps=0,nQ=0,nK=0;
  ['lisans','yl'].forEach(lvl=>{S.lvl=lvl;S.mode='tam';applyLvl();
    Object.entries(LESSONS).forEach(([id,L])=>{visSteps(L).forEach(st=>{
      const b=el('div','');host.appendChild(b);
      try{mountStep(b,id,st,{unlocked:false,unlock(){}});nSteps++;}catch(e){err(`${lvl} ${id}/${st.k}: ${e.message}`);}
      try{poke(b,st,err,`${lvl} ${id}/${st.k}`);}catch(e){err(`${lvl} ${id}/${st.k} etkileşim: ${e.message}`);}
      S.qs={};
      if(st.qs&&lvl==='yl')st.qs.forEach(q=>{nQ++;
        if(q.tag==='kayit'){nK++;[q.entry].concat(q.alt||[]).forEach((ex,k)=>{const t=entryTotals(ex);if(Math.abs(t.b-t.a)>0.01)err(`${id} S${q.id} kayıt${k?' alt'+k:''} denk değil (${t.b} / ${t.a})`);
            ex.forEach(x=>{if(!TDHP[x[0]])err(`${id} S${q.id}: hesap yok ${x[0]}`);});});
          if(!gradeEntry(q,q.entry).ok)err(`${id} S${q.id}: doğru cevap kabul edilmiyor`);
          const wrong=q.entry.map(x=>[x[0],x[2],x[1]]);if(gradeEntry(q,wrong).ok)err(`${id} S${q.id}: ters kayıt kabul ediliyor`);}
        else if(q.opts){if(!(q.correct>=0&&q.correct<q.opts.length))err(`${id} S${q.id}: doğru seçenek yok`);}
        else if(!isFinite(q.ans))err(`${id} S${q.id}: cevap sayı değil`);
        if(!q.hint)err(`${id} S${q.id}: ipucu yok`);});
      b.remove();});});});
  /* Ders metinlerindeki örnek maddelerin denkliği */
  (window.EXAMPLE_ENTRIES||[]).forEach(([n,ex])=>{const t=entryTotals(ex.l);if(Math.abs(t.b-t.a)>0.01)err(`örnek madde denk değil: ${n} (${t.b} / ${t.a})`);ex.l.forEach(x=>{if(!TDHP[x[0]])err(`örnek madde ${n}: hesap yok ${x[0]}`);});});
  [...new Set(JT_ERR)].slice(0,20).forEach(m=>err('ekranda denk olmayan ya da tanımsız hesaplı madde: '+m));
  out.push(`Ekranda üretilen yevmiye maddesi: ${JT_N}`);
  host.remove();S=keep;NOSAVE=false;applyLvl();
  out.unshift(`${CONFIG.title}: ${Object.keys(LESSONS).length} ders, ${nSteps} adım açıldı (iki düzey), ${nQ} soru (${nK} yevmiye) denetlendi, ${(window.EXAMPLE_ENTRIES||[]).length} örnek madde; arayüzde ${UICHK} yevmiye cevabı girildi, ${TXCHK} işlem listesi sonuna kadar oynatıldı. Hata: ${fail}`);
  app.innerHTML=`<pre id="selftest">${out.join('\n')}</pre>`;document.title=fail?'SELFTEST FAIL '+fail:'SELFTEST OK';
}

window.EXAMPLE_ENTRIES=[];
function EX(name,entries){entries.forEach((e,i)=>window.EXAMPLE_ENTRIES.push([name+' #'+(i+1),e]));return entries;}

  applyLvl();

function krediYil(Am,i,m,v){ /* m: kullanım ayı (1–12, ayın ilk günü), v: vade (ay) */
  const s=m-1,e=s+v-1,acc=[0,0,0],cash=[0,0,0],aylik=Am*i/12;
  for(let k=s;k<=e;k++){const y=Math.floor(k/12);if(y<3)acc[y]+=aylik;}
  const ye=Math.floor(e/12);if(ye<3)cash[ye]+=aylik*v;
  return {acc,cash,ye,e,top:aylik*v};
}

  const ck=checklist(L.task,[{id:'a',t:'Yıl sonunu <b>aşan</b> bir kredi oluşturun ve 31 Aralık tahakkuk kaydını görün.'},{id:'b',t:'Tamamen 2026 içinde kapanan bir kredi oluşturun: tahakkuka gerek kalıyor mu?'},{id:'c',t:'Vadesi <b>12 aydan uzun</b> bir kredi oluşturun ve sınıflandırmanın nasıl değiştiğini görün.'}],api);

    if(u){if(tah>0)ck.mark('a');if(r.ye===0)ck.mark('b');if(v.v>12)ck.mark('c');}

  [a,i,m,v].forEach(x=>x.on(()=>draw(1)));draw(0);

function K_taksit(root,api){

    const rem=P.v-k*T,c=Math.min(T,rem),l=Math.max(0,rem-T);
    ro.set('k',tl(rem));ro.set('c',tl(c));ro.set('l',tl(l));
    const ents=[];if(k>0)ents.push(J(`30.06.${2026+k}: taksit ödemesi`,[B(303,T),A(102,T)]));
    ents.push(J(`31.12.${2026+k}: gelecek yıl ödenecek taksitin kısa vadeye aktarılması`,[B(400,T),A(303,T)]));
    L.x.innerHTML='<h3>Seçili yılın kayıtları</h3>'+jt(ents);
    if(u){seen.add(N+':'+k);let all=true;for(let j=0;j<N;j++)if(!seen.has(N+':'+j))all=false;if(all)ck.mark('a');if(l<0.5&&rem>0.5)ck.mark('b');}
  }
  [P,n,y].forEach(x=>x.on(()=>draw(1)));draw(0);
}

/* ============================================================

  box.innerHTML=SINIF_HES.map(([c,v])=>`<div class="cls-row" data-c="${c}"><span>${an(c)}<br><span class="lmeta">${tl(v)}</span></span><select class="sel" aria-label="${c} için bölüm"><option value="">Seçin…</option>${SINIF_OPT.map((o,k)=>`<option value="${k}">${o}</option>`).join('')}</select></div>`).join('');
  const ro=readouts(L.ro,[['n','Doğru yerleşen'],['A','Aktif toplamı'],['P','Pasif toplamı']]);
  function draw(){
    let ok=0;box.querySelectorAll('.cls-row').forEach(r=>{const c=r.dataset.c,s=sec[c];r.classList.toggle('ok',s!=null&&s===dogru(c));r.classList.toggle('bad',s!=null&&s!==dogru(c));if(s===dogru(c))ok++;});
    const yer=k=>SINIF_HES.filter(([c])=>sec[c]===k&&dogru(c)===k);
    const sum=arr=>arr.reduce((s,x)=>s+x[1],0);
    const blk=(k)=>{const a=yer(k);return a.length?`<tr class="sub"><td colspan="2">${SINIF_OPT[k]}</td></tr>`+a.map(([c,v])=>`<tr><td>${an(c)}</td><td>${nf(v)}</td></tr>`).join('')+`<tr><td><b>Toplam</b></td><td><b>${nf(sum(a))}</b></td></tr>`:'';};
    const A=sum(yer(0))+sum(yer(1)),P=sum(yer(2))+sum(yer(3))+sum(yer(4));
    L.ch.innerHTML=`<div class="fs"><table class="tbl"><thead><tr><th>AKTİF</th><th>TL</th></tr></thead><tbody>${blk(0)}${blk(1)}<tr class="tot"><td>Aktif toplamı</td><td>${nf(A)}</td></tr></tbody></table>
     <table class="tbl"><thead><tr><th>PASİF</th><th>TL</th></tr></thead><tbody>${blk(2)}${blk(3)}${blk(4)}<tr class="tot"><td>Pasif toplamı</td><td>${nf(P)}</td></tr></tbody></table></div>`;
    ro.set('n',`${ok} / ${SINIF_HES.length}`);ro.set('A',tl(A));ro.set('P',tl(P));
    if(ok===SINIF_HES.length){ck.mark('a');L.x.innerHTML=`<p><span class="flag good">✓ Aktif = Pasif = ${tl(A)}</span></p><p class="lmeta">Gelir tablosundaki dönem net kârı (${tl(213750)}) bilançoda 590 hesabıyla özkaynaklarda yer alır. Vergi karşılığı (370) ile peşin ödenen vergi (371) kısa vadeli yabancı kaynaklarda net gösterilir.</p>`;}
  }
  box.querySelectorAll('select').forEach(s=>s.addEventListener('change',()=>{const c=s.closest('.cls-row').dataset.c;sec[c]=s.value===''?null:+s.value;draw();}));
  draw();
}

ticari:{title:'Ticari borçlar, borç senetleri reeskontu ve alınan avanslar',sure:'45 dk',steps:[
 {k:'a',type:'anlatim',title:'32 ve 34 grubu hesaplar',html:()=>`
  <p><b>Ticari borçlar</b> işletmenin esas faaliyetiyle ilgili mal ve hizmet alımlarından doğan borçlarıdır. Senetsiz borçlar <b>320 Satıcılar</b>, senede bağlananlar <b>321 Borç Senetleri</b> hesabında izlenir. Alınan depozito ve teminatlar 326, diğer ticari borçlar 329 hesabına yazılır.</p>
  <h3>Borç senetleri reeskontu</h3>
  <p>Vadesi gelmemiş bir borç senedinin üzerindeki tutar, vadeye kadar işleyecek faizi de içerir. Dönem sonunda senet, <b>değerleme günündeki değerine</b> indirgenebilir. Aradaki faiz <b>322 Borç Senetleri Reeskontu (−)</b> hesabına borç, <b>647 Reeskont Faiz Gelirleri</b> hesabına alacak yazılır. Yeni dönemin ilk günü kayıt ters çevrilir (657 borç, 322 alacak).</p>
  <div class="eq">Dış iskonto = ${fr('<i>N</i> · <i>i</i> · <i>t</i>','365')} &nbsp;&nbsp;&nbsp; İç iskonto = ${fr('<i>N</i> · <i>i</i> · <i>t</i>','365 + <i>i</i> · <i>t</i>')}</div>
  <p><i>N</i> senedin nominal değeri, <i>i</i> yıllık faiz oranı, <i>t</i> değerleme gününden vadeye kalan gündür.</p>
  <div class="note tr">VUK'a göre senetlerin reeskonta tabi tutulması isteğe bağlıdır; ancak alacak senetlerini reeskonta tabi tutan işletme borç senetlerini de reeskonta tabi tutmak zorundadır. Uygulamada genellikle TCMB'nin ilan ettiği reeskont faiz oranı kullanılır.</div>
  <h3>Alınan sipariş avansları</h3>
  <p>Mal ya da hizmet teslim edilmeden önce müşteriden alınan tutarlar satış değildir; işletme için bir <b>yükümlülüktür</b> ve <b>340 Alınan Sipariş Avansları</b> hesabında izlenir. Teslim yapıldığında satış kaydedilir ve 340 borçlandırılarak kapatılır. KDV kural olarak teslimle doğar; teslimden önce fatura düzenlenirse fatura tarihinde doğar.</p>
  <div class="note yl yl-only"><b>TFRS 15</b> açısından alınan avans bir <b>sözleşme yükümlülüğüdür</b>; hasılat, mal üzerindeki kontrol müşteriye geçtiğinde kaydedilir. TFRS 9'a göre ticari borçlar itfa edilmiş maliyetle ölçülür; vadesi bir yıldan kısa ve önemli finansman bileşeni içermeyen ticari borçlarda iskonto etkisi genellikle önemsizdir ve indirgeme yapılmayabilir.</div>`},

 {k:'t',type:'turetim',title:'İki iskonto formülü nereden gelir?',html:()=>`
  <p>Senedin bugünkü değeri <i>BD</i>, basit faizle vadeye kadar büyüyünce nominal değere ulaşır: <i>N</i> = <i>BD</i>(1 + <i>i</i> · <i>t</i> / 365). Buradan <b>iç iskonto</b> (gerçek faiz) bulunur:</p>

gelirgider:{title:'Gelir ve gider hesapları; 7/A ve 7/B seçenekleri',sure:'45 dk',steps:[
 {k:'a',type:'anlatim',title:'6 grubu ve 7 grubu hesaplar',html:()=>`

  <h3>7 Maliyet hesapları: iki seçenek</h3>

  <p><b>7/B seçeneği</b> giderleri <b>çeşitlerine</b> göre izler: 790 ilk madde ve malzeme, 791 işçi ücret ve giderleri, 792 memur ücret ve giderleri, 793 dışarıdan sağlanan fayda ve hizmetler, 794 çeşitli giderler, 795 vergi–resim–harçlar, 796 amortismanlar, 797 finansman giderleri. Dönem sonunda tutarlar analitik kayıtlardan yararlanılarak fonksiyonlara dağıtılır; karşı hesap <b>798 Gider Çeşitleri Yansıtma Hesabı</b>'dır.</p>

  <div class="note yl yl-only"><b>TMS 1</b>'e göre giderler kâr veya zarar tablosunda ya <b>niteliğine</b> (çeşit) ya da <b>fonksiyonuna</b> göre sunulur. Fonksiyon esasını seçen işletme, giderlerin niteliğine ilişkin ek bilgiyi (amortisman ve itfa payları, çalışanlara sağlanan faydalar) dipnotlarda verir. 7/A ve 7/B ayrımı bu iki sunum seçeneğinin defter düzeyindeki karşılığıdır.</div>`},

/* ============================================================

CONFIG.version='1.0, 28.11.2026';

/* Bilanço ve gelir tablosunu bakiyelerden kurar (TDHP sınıf ve grup sırasıyla) */
function tablolar(m){
  const codes=Object.keys(m).filter(c=>Math.abs(net(m,c))>0.005).sort();
  const sec=(pred,sign)=>{let s='',tot=0,lastG='';codes.filter(pred).forEach(c=>{const v=sign*net(m,c),g=c.slice(0,2);if(g!==lastG){s+=`<tr class="sub"><td colspan="2">${GRP[g]||CLS[c[0]]}</td></tr>`;lastG=g;}s+=`<tr><td>${an(c)}</td><td>${nf(v,v%1?2:0)}</td></tr>`;tot+=v;});return {s,tot};};
  const A1=sec(c=>c[0]==='1',1),A2=sec(c=>c[0]==='2',1),P3=sec(c=>c[0]==='3',-1),P4=sec(c=>c[0]==='4',-1),P5=sec(c=>c[0]==='5',-1);
  const hd=(t,x)=>x.s?`<tr><td colspan="2"><b>${t}</b></td></tr>${x.s}<tr><td><b>${t} toplamı</b></td><td><b>${nf(x.tot,2)}</b></td></tr>`:'';
  const A=A1.tot+A2.tot,P=P3.tot+P4.tot+P5.tot;
  return {A,P,html:`<div class="fs"><table class="tbl"><thead><tr><th>AKTİF</th><th>TL</th></tr></thead><tbody>${hd('Dönen varlıklar',A1)}${hd('Duran varlıklar',A2)}<tr class="tot"><td>Aktif toplamı</td><td>${nf(A,2)}</td></tr></tbody></table>
   <table class="tbl"><thead><tr><th>PASİF</th><th>TL</th></tr></thead><tbody>${hd('Kısa vadeli yabancı kaynaklar',P3)}${hd('Uzun vadeli yabancı kaynaklar',P4)}${hd('Özkaynaklar',P5)}<tr class="tot"><td>Pasif toplamı</td><td>${nf(P,2)}</td></tr></tbody></table></div>`};
}

/* ---------- DERS 1 — Muhasebe I kayıt kurallarının tekrarı ---------- */
const BAKIYE_HES=['100','103','120','129','153','191','257','300','320','322','391','500','501','580','600','610','621','647','770','771'];
function K_bakiye(root,api){
  const L=kl(root,'Muhasebe II\'nin konuları kaynak, gelir ve gider hesaplarıdır. Başlamadan önce yirmi hesabın <b>normal bakiye yönünü</b> seçin. Adında "(−)" geçen düzenleyici hesaplara ve "yansıtma" hesaplarına dikkat edin.');
  const ck=checklist(L.task,[{id:'a',t:'Yirmi hesabın hepsini doğru işaretleyin.'}],api);
  const box=el('div','');L.ctl.appendChild(box);const sec={};
  box.innerHTML=BAKIYE_HES.map(c=>`<div class="cls-row" data-c="${c}"><span>${an(c)}</span><select class="sel" aria-label="${c}"><option value="">Seçin…</option><option value="B">Borç bakiyesi</option><option value="A">Alacak bakiyesi</option></select></div>`).join('');
  const ro=readouts(L.ro,[['n','Doğru'],['h','Son seçim']]);

ozkaynak:{title:'Özkaynak hesapları',sure:'35 dk',steps:[
 {k:'a',type:'anlatim',title:'5 sınıfı: özkaynaklar',html:()=>`
  <table class="tbl sym"><thead><tr><th>Grup</th><th>Hesaplar</th></tr></thead><tbody>
   <tr><td>50 Ödenmiş sermaye</td><td>500 Sermaye, 501 Ödenmemiş Sermaye (−), 502–503 Sermaye düzeltmesi olumlu / olumsuz farkları</td></tr>
   <tr><td>52 Sermaye yedekleri</td><td>520 Hisse Senedi İhraç Primleri, 521 İptal Kârları, 522 MDV Yeniden Değerleme Artışları, 529</td></tr>
   <tr><td>54 Kâr yedekleri</td><td>540 Yasal, 541 Statü, 542 Olağanüstü yedekler, 548 Diğer, 549 Özel fonlar</td></tr>
   <tr><td>57 · 58</td><td>570 Geçmiş Yıllar Kârları · 580 Geçmiş Yıllar Zararları (−)</td></tr>
   <tr><td>59 Dönem net kârı (zararı)</td><td>590 Dönem Net Kârı · 591 Dönem Net Zararı (−)</td></tr></tbody></table>
  <p><b>Sermaye yedekleri</b> ortaklarla yapılan işlemlerden (ör. pay primleri) ya da yeniden değerlemelerden, <b>kâr yedekleri</b> ise dağıtılmayan kârlardan oluşur. Yeni yılın başında 590 ve 591 bakiyeleri sırasıyla 570 ve 580'e aktarılır; kâr, genel kurul kararıyla dağıtılır.</p>
  <div class="note tr">Vergi Usul Kanunu'na göre enflasyon düzeltmesi yapıldığında özkaynak kalemlerinin düzeltme farkları 502/503 ve ilgili alt hesaplarda izlenir. Düzeltmenin hangi dönemlerde uygulanacağı kanunla belirlenir ve son yıllarda birkaç kez değişmiştir; güncel durumu kontrol edin.</div>
  <div class="note yl yl-only"><b>TMS 1</b> özkaynak değişim tablosu ister: her kalem için dönem başı bakiye, dönem kârı veya zararı, diğer kapsamlı gelir, ortaklarla işlemler (sermaye artırımı, kâr payı) ve dönem sonu bakiye. Keşifteki tablo bunun basit bir biçimidir.</div>`},
 {k:'o',type:'ornek',title:'Kârın yolculuğu: 590 → 570 → 500',html:()=>`
  <p>2026 kârı 300.000 TL. Genel kurul 15.000 TL yasal yedek ayırıp 100.000 TL kâr payı dağıtıyor; kalan 185.000 TL 570'te kalıyor. Bir ay sonra 570'ten 150.000 TL ile sermaye artırılıyor.</p>${jt(TX_OZK.slice(0,2).map(x=>x.e))}
  <p>Özkaynak toplamı ilk kayıtta 100.000 TL azalır (ortaklara borç doğar); ikinci kayıtta değişmez.</p>`},
 {k:'k1',type:'kesif',core:true,title:'Özkaynağın iki yılı',mount:K_ozk},
 {k:'t',type:'turetim',title:'Hangi işlem özkaynak toplamını değiştirir?',html:()=>`
  <p>Özkaynak = Varlıklar − Yabancı kaynaklar olduğu için yalnızca <b>net varlığı değiştiren</b> işlemler toplamı değiştirir: dönem kârı veya zararı, ortakların koyduğu yeni sermaye, ortaklara kâr payı ya da sermaye iadesi. Bedelsiz artırım, yedek ayırma, 590'ın 570'e devri gibi işlemler yalnızca özkaynak kalemleri arasında yer değiştirmedir.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'kayit',p:'Yeni yılın ilk günü 590\'daki 250.000 TL dönem net kârı geçmiş yıllar kârına aktarıldı.',entry:[B(590,250000),A(570,250000)],hint:'590 kapanır.',sol:''},
  {id:2,tag:'kayit',p:'Yeni yılın ilk günü 591\'deki 80.000 TL dönem net zararı geçmiş yıllar zararına aktarıldı.',entry:[B(580,80000),A(591,80000)],hint:'591 borç bakiyelidir; alacaklandırılarak kapanır.',sol:''},
  {id:3,tag:'kayit',p:'Olağanüstü yedeklerden 100.000 TL ile sermaye artırıldı.',entry:[B(542,100000),A(500,100000)],hint:'İç kaynaktan artırım.',sol:''},
  {id:4,tag:'kavram',p:'Aşağıdaki işlemlerden hangisi özkaynak <b>toplamını</b> değiştirmez?',opts:['Dönem net kârı','Ortaklara nakit kâr payı dağıtımı','Geçmiş yıllar kârından bedelsiz sermaye artırımı','Nakdi sermaye artırımının ödenmesi'],correct:2,hint:'Net varlık değişiyor mu?',sol:'<b>Bedelsiz artırım</b> yalnızca özkaynak içinde yer değiştirmedir.'},
  {id:5,tag:'hesap',p:'500 Sermaye 1.000.000, 501 Ödenmemiş Sermaye 200.000, 540 80.000, 570 150.000, 580 60.000 TL. Özkaynak toplamı kaç TL\'dir?',ans:970000,abs:1,unit:'TL',hint:'Düzenleyici hesapları düşün.',sol:'1.000.000 − 200.000 + 80.000 + 150.000 − 60.000 = <b>970.000 TL</b>.'},
  {id:6,tag:'kavram',yl:1,p:'TMS 1\'e göre ortaklara dağıtılan kâr payı hangi tabloda gösterilir?',opts:['Kâr veya zarar tablosunda gider olarak','Özkaynak değişim tablosunda ortaklarla işlemler arasında','Yalnızca dipnotta','Nakit akış tablosunda yalnızca'],correct:1,hint:'Kâr payı gider değildir.',sol:'<b>Özkaynak değişim tablosunda</b> (ödenen kısım ayrıca nakit akış tablosunda).'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary"><li>Özkaynak: ödenmiş sermaye, sermaye yedekleri, kâr yedekleri, geçmiş yıl kâr ve zararları, dönem net kârı veya zararı.</li><li>590/591 yeni yılın başında 570/580'e aktarılır; dağıtım genel kurul kararıyla yapılır.</li><li>Yalnızca net varlığı değiştiren işlemler özkaynak toplamını değiştirir.</li></ul>
  <p class="lmeta">İzlence: Hafta 7 (özkaynak hesapları) · ÖÇ3.</p>`}
]},

donemsellik:{title:'Dönemsellik: gelecek dönemlere ait gelir ve giderler, tahakkuklar',sure:'35 dk',steps:[
 {k:'a',type:'anlatim',title:'18, 28, 38 ve 48 grupları',html:()=>`
  <table class="tbl sym"><thead><tr><th>Durum</th><th>12 ay içinde</th><th>12 aydan sonra</th></tr></thead><tbody>
   <tr><td>Peşin ödenen gider</td><td>180 Gelecek Aylara Ait Giderler</td><td>280 Gelecek Yıllara Ait Giderler</td></tr>
   <tr><td>Henüz tahsil edilmemiş gelir</td><td>181 Gelir Tahakkukları</td><td>281 Gelir Tahakkukları</td></tr>
   <tr><td>Peşin tahsil edilen gelir</td><td>380 Gelecek Aylara Ait Gelirler</td><td>480 Gelecek Yıllara Ait Gelirler</td></tr>
   <tr><td>Henüz ödenmemiş gider</td><td>381 Gider Tahakkukları</td><td>481 Gider Tahakkukları</td></tr></tbody></table>
  <p>Bu hesaplar, nakit hareketi ile gelir ve giderin ait olduğu dönem arasındaki farkı köprüler. Dönem sonunda her sözleşme için şu soru sorulur: <b>Bu yıla ait tutar ne kadar, bu yıl ne kadar ödendi ya da tahsil edildi?</b> Fark yukarıdaki hesaplardan birine gider.</p>
  <div class="note yl yl-only"><b>TFRS 15</b>'te peşin tahsil edilen bedel <b>sözleşme yükümlülüğü</b>, edimi yerine getirildiği hâlde faturalanmamış bedel <b>sözleşme varlığı</b>dır. <b>TFRS 16</b>'ya göre kiracılar çoğu kira sözleşmesinde kullanım hakkı varlığı ve kira yükümlülüğü kaydeder; peşin kira ödemesi 180/280 yerine kullanım hakkı varlığının maliyetine girer.</div>`},
 {k:'o',type:'ornek',title:'İki yıllık reklam sözleşmesi',html:()=>`
  <p>1 Ekim 2026'da 24 aylık reklam hizmeti için 240.000 TL peşin ödendi. 2026'ya 3 ay (30.000 TL), 2027'ye 12 ay (120.000 TL), 2028'e 9 ay (90.000 TL) düşer. 31.12.2026'da 120.000 TL 180'de, 90.000 TL 280'de gösterilir.</p>
  ${jt(EX('donem-ornek',[J('1.10.2026: peşin ödeme',[B(180,240000),A(102,240000)]),J('31.12.2026: 2026 payı ve uzun vadeli kısmın sınıflanması',[B(760,30000),B(280,90000),A(180,120000)])]))}
  <p>1.1.2027'de değil, 31.12.2027'de 2028 payının 12 ay içine girmesiyle 280'deki 90.000 TL 180'e aktarılır.</p>`},
 {k:'k1',type:'kesif',core:true,title:'Tutar hangi yıllara dağılır?',mount:K_donem},
 {k:'t',type:'turetim',title:'Dört hesap çiftinin simetrisi',html:()=>`
  <p>Dört durum iki eksende ayrılır: <b>gelir mi gider mi</b> ve <b>nakit önce mi sonra mı</b>. Nakit önce geldiyse (peşin) işletmenin bir hakkı (180/280) ya da borcu (380/480) doğar; nakit sonra gelecekse bir alacağı (181) ya da borcu (381) doğar. Hepsinde ortak kural: gelir ve gider yalnızca ait olduğu döneme yazılır.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'1 Kasım\'da 12 aylık kira için 60.000 TL peşin ödendi. 31 Aralık\'ta 180\'de kalan tutar kaç TL\'dir?',ans:50000,abs:1,unit:'TL',hint:'2 ay bu yıla aittir.',sol:'60.000 × 10/12 = <b>50.000 TL</b>.'},
  {id:2,tag:'kayit',p:'Bankadaki vadeli mevduatın Aralık\'a ait 12.000 TL faizi Ocak\'ta tahsil edilecek. 31 Aralık kaydı?',entry:[B(181,12000),A(642,12000)],hint:'Kazanılmış ama tahsil edilmemiş gelir.',sol:''},
  {id:3,tag:'kayit',p:'1 Aralık\'ta bir kiracıdan 3 aylık kira olarak 30.000 TL peşin tahsil edildi ve tamamı 380\'e alındı. 31 Aralık\'ta Aralık payını gelire aktarın (649).',entry:[B(380,10000),A(649,10000)],hint:'Bir ay geçti.',sol:''},
  {id:4,tag:'kayit',p:'1 Temmuz 2026\'da 36 aylık bakım sözleşmesi için 360.000 TL peşin ödendi (7/A, yönetim). Tek madde ile: 2026 payını gider yazın, 12 ay içindeki kısmı 180\'e, kalanı 280\'e alın.',entry:[B(770,60000),B(180,120000),B(280,180000),A(102,360000)],hint:'Aylık 10.000 TL; 2026\'ya 6 ay.',sol:'2026: 60.000; 2027: 120.000 (180); 2028–2029: 180.000 (280).'},
  {id:5,tag:'kavram',yl:1,p:'TFRS 15\'e göre müşteriden peşin tahsil edilen ama henüz hizmeti verilmemiş bedel nedir?',opts:['Hasılat','Sözleşme yükümlülüğü','Sözleşme varlığı','Özkaynak'],correct:1,hint:'İşletmenin edimi henüz yerine getirilmedi.',sol:'<b>Sözleşme yükümlülüğü</b>.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary"><li>Peşin ödenen gider 180/280, peşin tahsil edilen gelir 380/480.</li><li>Tahakkuk eden gelir 181, tahakkuk eden gider 381.</li><li>12 ay içine düşen kısım kısa vadeli, sonrası uzun vadeli gruplarda gösterilir.</li></ul>
  <p class="lmeta">İzlence: ÖÇ5 ve ÖÇ6 (dönem içi ve dönem sonu gelir–gider kayıtları); haftalık planda ayrı başlık yok. Önerilen yer: 12. hafta.</p>`}
]},

monografi:{title:'Muhasebe monografisi: bir yılın bütün kayıtları',sure:'60 dk',steps:[
 {k:'a',type:'anlatim',title:'Monografi nedir?',html:()=>`
  <p><b>Monografi</b>, bir işletmenin bir dönemdeki bütün muhasebe işlemlerinin açılıştan kapanışa kadar sırayla kaydedilmesidir: açılış kaydı → dönem içi işlemler → envanter ve değerleme → dönemsellik → yansıtma → gelir tablosu hesaplarının kapatılması → vergi → net kâr → kesin mizan ve tablolar → kapanış kaydı.</p>
  <p>Bu dersteki monografi, Muhasebe I Simülatörü'nün son dersinde kurulan Defne Ticaret'in <b>ikinci yılıdır</b>. Açılış bilançosu o dersin sonucudur (ilk yılın kârı 570'e aktarılmış, vergi göz ardı edilmiş). Kâr dağıtımı yapılmadığı varsayılmıştır.</p>`},
 {k:'o',type:'ornek',title:'Açılış kaydı',html:()=>`${jt([MONO_AC],{num:false})}<p>Açılış kaydında borç bakiyeli hesaplar borçlandırılır, alacak bakiyeli hesaplar alacaklandırılır; böylece geçen yılın kapanış bilançosu yeni yılın defterlerine aynen taşınır.</p>`},
 {k:'k1',type:'kesif',core:true,title:'Defne Ticaret\'in 2027 yılı',mount:K_mono},
 {k:'t',type:'turetim',title:'Monografiden çıkan dersler',html:()=>`
  <p>Monografide kapanıştan önce bilanço ancak gelir ve gider hesapları da hesaba katılırsa denk çıkar; kapanıştan sonra ise yalnızca 1–5. sınıflar kalır ve dönem net kârı 590'da görünür. Dönem sonu kayıtlarının her biri (SMM, amortisman, dönemsellik, tahakkuk, reeskont) kârı değiştirir ama nakdi değiştirmez; bu yüzden yıl sonu banka bakiyesi kârla aynı hızda artmaz.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'Monografide dönem kârı (vergi öncesi) kaç TL\'dir? (2 ondalık)',ans:MONO_K,abs:0.05,unit:'TL',hint:'Gelirler (600 ve 647) − giderler (621, 631, 632, 660).',sol:`1.300.000 + ${nf(MONO_RS,2)} − 1.216.000 = <b>${nf(MONO_K,2)} TL</b>.`},
  {id:2,tag:'hesap',p:'Yıl sonu banka bakiyesi kaç TL\'dir?',ans:1076000,abs:1,unit:'TL',hint:'Açılış 560.000; giriş ve çıkışları toplayın.',sol:'560.000 + 300.000 + 1.200.000 + 400.000 − 900.000 − 372.000 − 88.000 − 24.000 = <b>1.076.000 TL</b>.'},
  {id:3,tag:'kavram',p:'Kapanış kaydı yapıldıktan sonra hangi hesapların bakiyesi kalır?',opts:['Yalnızca gelir tablosu hesaplarının','Hiçbir hesabın','Yalnızca 1–5. sınıf hesapların','Yalnızca 7. sınıf hesapların'],correct:1,hint:'Kapanış kaydı bilanço hesaplarını da kapatır.',sol:'Kapanış kaydından sonra <b>bütün hesaplar</b> sıfırlanır; bakiyeler yeni yılın açılış kaydıyla geri gelir.'},
  {id:4,tag:'kavram',p:'Monografide hangi kayıt kârı değiştirdiği hâlde nakdi değiştirmez?',opts:['Satıcılara ödeme','Amortisman','Kredi kullanımı','Alıcılardan tahsilat'],correct:1,hint:'Nakit çıkışı olmayan gider.',sol:'<b>Amortisman</b> (aynı şekilde SMM, faiz tahakkuku, reeskont).'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary"><li>Monografi açılıştan kapanışa bir yılın bütün kayıtlarıdır.</li><li>Dönem sonu kayıtları kârı değiştirir, nakdi değiştirmez.</li><li>Kapanış sonrası net kâr 590'da, yükümlülükler (370, 381) bilançoda yer alır.</li></ul>
  <p class="lmeta">İzlence: Hafta 14 (muhasebe monografisi çözümleri) · ÖÇ7, ÖÇ8.</p>`}
]}
});

<style>
:root{color-scheme:light;

  --page:#0b0b0b;--surface:#191919;--ink:#efefef;--ink2:#9c9c9c;--grid:#303030;--axis:#474747;--border:rgba(255,255,255,.10);
  --s1:#338ced;--s2:#e76624;--s3:#00a888;--s4:#d28e05;--s5:#e24d8b;--goodtext:#53c556;
  --accent:#338ced;--accent-ink:#84b9f3;--wash:#14243a;--ylwash:#211c35;--ylink:#9887ef;}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15.5px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1080px;margin:0 auto;padding:18px 20px 60px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px}
.hero{display:flex;gap:18px 28px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin:8px 0 16px}

.k-intro{margin-bottom:14px}

.segw{margin:0 0 13px} .segw .seg{margin-top:4px}

.task-h{font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}

.ti{display:flex;gap:8px;margin:5px 0}

.ro{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.ro-i{border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--surface)}
.ro-l{font-size:.74rem;color:var(--ink2);line-height:1.35}
.ro-v{font-weight:600;font-variant-numeric:tabular-nums}
.flag{display:inline-flex;gap:5px;align-items:center;font-weight:600;font-size:.82rem;padding:1px 9px;border-radius:99px}
.flag.good{color:var(--goodtext);background:rgba(10,172,35,.12)}
.flag.bad{color:var(--crit);background:rgba(220,60,61,.11)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.8rem;color:var(--ink2);margin-bottom:2px}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--ink2)}
.sw.l1{border-color:var(--s1)} .sw.l2{border-color:var(--s2)} .sw.l3{border-color:var(--s3)}
.sw.ref{border-top:1.5px dashed var(--ink2)}
.sw.box{width:12px;height:12px;border:0;border-radius:3px}
.sw.box.f1{background:var(--s1)} .sw.box.f2{background:var(--s2)} .sw.box.f3{background:var(--s3)} .sw.box.f4{background:var(--s4)} .sw.box.f5{background:var(--s5)}
.sw.box.fg{background:var(--axis)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.tick{fill:var(--ink2);font-size:11.5px;font-variant-numeric:tabular-nums}
.atitle{fill:var(--ink2);font-size:12px}
.l1,.l2,.l3{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.l1{stroke:var(--s1)} .l2{stroke:var(--s2)} .l3{stroke:var(--s3)}
.ref{stroke:var(--ink2);stroke-width:1.25;stroke-dasharray:4 4;fill:none}
.cur{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.d2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.d3{fill:var(--s3);stroke:var(--surface);stroke-width:2}
.f1{fill:var(--s1)} .f2{fill:var(--s2)} .f3{fill:var(--s3)} .f4{fill:var(--s4)} .f5{fill:var(--s5)} .fg{fill:var(--axis)}
.seg-r{stroke:var(--surface);stroke-width:2}
.area1{fill:var(--s1);opacity:.14} .area-g{fill:var(--good);opacity:.14} .area-c{fill:var(--crit);opacity:.12}
.bar1{fill:var(--s1)} .bar1.dim{opacity:.38}
.ref2{stroke:var(--axis);stroke-width:1.25;stroke-dasharray:2 3;fill:none}
.sw.box.bar1{background:var(--s1)} .sw.box.area1{background:var(--s1);opacity:.3}
.sw.box.area-g{background:var(--good);opacity:.35} .sw.box.area-c{background:var(--crit);opacity:.3}
.sw.dot{width:10px;height:10px;border:0;border-radius:50%;background:var(--ink)} .sw.dot.d2{background:var(--s2)} .sw.dot.d3{background:var(--s3)}
.dim{opacity:.38}
.lab,.lab2{font-size:12px;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.lab{fill:var(--ink)} .lab2{fill:var(--ink2)}
.labin{font-size:11.5px;fill:#fff;font-variant-numeric:tabular-nums}
.labin.dk{fill:#0b0b0b}
.hov line{stroke:var(--ink2);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,.14);border-radius:8px;padding:6px 10px;font-size:.78rem;line-height:1.45;white-space:nowrap;z-index:5;font-variant-numeric:tabular-nums}
details.dt summary{cursor:pointer;font-size:.82rem;color:var(--ink2);margin-top:10px}
.dtw{max-height:260px;overflow:auto}
.q{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:12px 0}
.qh{display:flex;gap:4px;align-items:center;margin-bottom:6px}
.qn{margin-left:auto;font-size:.76rem;color:var(--ink2)}
.qa{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
input.num,input.acc,select.sel{font:inherit;padding:6px 10px;border:1px solid var(--axis);border-radius:8px;background:var(--surface);color:var(--ink)}
input.num{width:190px}
.unit{color:var(--ink2);font-size:.9rem}
.opts label{display:flex;gap:8px;align-items:flex-start;padding:3px 0;cursor:pointer}
.opts input{margin-top:5px}
.fb{margin-top:10px;padding:8px 12px;border-radius:8px;font-size:.9rem}
.fb:empty{display:none}
.fb.ok{background:rgba(10,172,35,.11)}
.fb.try{background:rgba(242,166,0,.15)}
.fb.rev{background:var(--wash)}
.qsum{font-size:.86rem;color:var(--ink2);margin-bottom:4px}
.about{font-size:.8rem;color:var(--ink2);margin-top:30px;border-top:1px solid var(--grid);padding-top:14px}
.map summary{cursor:pointer;font-weight:600}
.map{margin-top:26px}
.done-box{text-align:center;padding:30px}
.summary li{margin:.35em 0}
/* ---- Muhasebeye özgü bileşenler ---- */
.jt{border-collapse:collapse;font-size:.88rem;margin:8px 0 12px;font-variant-numeric:tabular-nums;min-width:min(100%,520px)}
.jt td,.jt th{padding:4px 10px;border-bottom:1px solid var(--grid)}
.jt th{color:var(--ink2);font-weight:600;font-size:.78rem;text-align:right}

.ta-wrap{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}

.ta-bal{text-align:center;font-size:.78rem;color:var(--ink2)}
.ta.new .ta-h{color:var(--accent-ink)}
.je{border-collapse:collapse;margin-top:8px;font-size:.88rem}

.fs .tbl{width:100%}
.mono{font-variant-numeric:tabular-nums}

</style>

<script>
"use strict";
/* ============================================================
   Muhasebe simülatörleri — ortak motor, sürüm 0.1 (pilot), 27.11.2026
   Özgün kod. Mimari 12_Finans_Simulatoru ile aynıdır; ders akışı
   fikri M. Songur'un Mikroekonomi Simülatörü'nden esinlenmiştir,
   o çalışmadan kod alınmamıştır.
   ============================================================ */

/* ---------- Yardımcılar ---------- */
const $=(s,r=document)=>r.querySelector(s);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function nf(x,d=0){return Number(x).toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d});}
function tl(x,d=0){return (x<-1e-9?'−':'')+nf(Math.abs(x),d)+' TL';}
function pc(x,d=1){return (x<-1e-12?'−%':'%')+nf(Math.abs(x)*100,d);}
function pp(x,d=1){return (x<-1e-12?'−':'')+nf(Math.abs(x)*100,d)+' puan';}
function kTL(v){const a=Math.abs(v),s=v<0?'−':'';if(a>=1e6)return s+nf(a/1e6,(a%1e6)?1:0)+' mn';if(a>=1e3)return s+nf(a/1e3,0)+' bin';return s+nf(a,0);}
function fr(n,d){return `<span class="fr"><span>${n}</span><span>${d}</span></span>`;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function r2(x){return Math.round(x*100)/100;}
const pctFmt=v=>'%'+nf(v,Number.isInteger(v)?0:1);

/* ---------- Tekdüzen Hesap Planı (ders kapsamındaki hesaplar) ----------
   Bakiye yönü: B = borç bakiyesi verir, A = alacak bakiyesi verir, X = her ikisi */
const TDHP_SRC=`100|Kasa|B;101|Alınan Çekler|B;102|Bankalar|B;103|Verilen Çekler ve Ödeme Emirleri (−)|A;108|Diğer Hazır Değerler|B;
110|Hisse Senetleri|B;111|Özel Kesim Tahvil, Senet ve Bonoları|B;112|Kamu Kesimi Tahvil, Senet ve Bonoları|B;118|Diğer Menkul Kıymetler|B;119|Menkul Kıymetler Değer Düşüklüğü Karşılığı (−)|A;
120|Alıcılar|B;121|Alacak Senetleri|B;122|Alacak Senetleri Reeskontu (−)|A;126|Verilen Depozito ve Teminatlar|B;127|Diğer Ticari Alacaklar|B;128|Şüpheli Ticari Alacaklar|B;129|Şüpheli Ticari Alacaklar Karşılığı (−)|A;
131|Ortaklardan Alacaklar|B;135|Personelden Alacaklar|B;136|Diğer Çeşitli Alacaklar|B;
150|İlk Madde ve Malzeme|B;151|Yarı Mamuller|B;152|Mamuller|B;153|Ticari Mallar|B;157|Diğer Stoklar|B;158|Stok Değer Düşüklüğü Karşılığı (−)|A;159|Verilen Sipariş Avansları|B;
180|Gelecek Aylara Ait Giderler|B;181|Gelir Tahakkukları|B;190|Devreden KDV|B;191|İndirilecek KDV|B;193|Peşin Ödenen Vergiler ve Fonlar|B;195|İş Avansları|B;196|Personel Avansları|B;

function niceStep(span,n){const s0=span/n,mag=Math.pow(10,Math.floor(Math.log10(s0))),e=s0/mag;return mag*(e>=7.5?10:e>=3.5?5:e>=1.5?2:1);}
function niceTicks(a,b,n=5){if(!(b>a))return [a];const st=niceStep(b-a,n),out=[];for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-6;v+=st)out.push(Math.round(v/st)*st||0);return out;}
function niceMax(v,n=5){if(!(v>0))return 1;const st=niceStep(v,n);return Math.ceil(v*1.0001/st)*st;}
function niceRange(lo,hi,n=5){if(hi-lo<1e-9){hi=lo+1;}const st=niceStep(hi-lo,n);return [Math.floor(lo/st)*st,Math.ceil(hi/st)*st];}

function frame(host,o){

      if(p.x<f.m.l-4||p.x>f.W-f.m.r+4||p.y<f.m.t-4||p.y>f.H-f.m.b+4){hide();return;}

      (r.pts||[]).forEach(q=>{if(isFinite(q[1])&&q[1]>=f.o.y[0]&&q[1]<=f.o.y[1])s+=`<circle cx="${f.X(q[0])}" cy="${f.Y(q[1])}" r="5" class="${q[2]||'cur'}"/>`;});
      g.innerHTML=s;

  const pw=W-m.l-m.r,ph=H-m.t-m.b;

  else{(o.xticks||niceTicks(o.x[0],o.x[1],6)).forEach(v=>{if(v<o.x[0]-1e-9||v>o.x[1]+1e-9)return;s+=`<text class="tick" x="${X(v)}" y="${H-m.b+18}" text-anchor="middle">${o.xfmt?o.xfmt(v):nf(v)}</text>`;});}

    /* x0..x1 veri biriminde; v0..v1 değer aralığı; round: uç yuvarlatma (veri ucu) */

/* ---------- Alıştırmalar ---------- */
function parseNum(s){
  s=String(s).trim().replace(/\s/g,'').replace(/TL|tl|adet|yıl|gün|pay|%/g,'').replace(/[−–]/g,'-');
  if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  return Number(s);
}
function isRight(q,v){if(!isFinite(v))return false;const t=q.abs!=null?q.abs:Math.max(Math.abs(q.ans)*(q.rel||0.005),0.01);return Math.abs(v-q.ans)<=t;}
function netMap(lines){const m={};lines.forEach(([c,b,a])=>{m[c]=(m[c]||0)+b-a;});Object.keys(m).forEach(c=>{if(Math.abs(m[c])<0.5)delete m[c];});return m;}
/* Öğrenci satırlarını beklenen kayıtla (ya da alternatifleriyle) karşılaştırır */
function gradeEntry(q,lines){
  const tol=q.tol||1;const sm=netMap(lines);
  const res=[q.entry].concat(q.alt||[]).map(ex=>{const em=netMap(ex);const codes=new Set([...Object.keys(em),...Object.keys(sm)]);let good=0,bad=0;
    codes.forEach(c=>{if(em[c]!=null&&sm[c]!=null&&Math.abs(em[c]-sm[c])<=tol)good++;else bad++;});
    return {ok:bad===0,good,total:Object.keys(em).length,wrongAcc:Object.keys(sm).filter(c=>em[c]==null)};});
  return res.find(r=>r.ok)||res.reduce((a,b)=>(b.good-b.wrongAcc.length)>(a.good-a.wrongAcc.length)?b:a);
}

  ensureDatalist();
  const upd=()=>{const n=qs.length,d=qs.filter(q=>(S.qs[lid+':'+q.id]||{}).s).length,f=qs.filter(q=>{const s=S.qs[lid+':'+q.id];return s&&s.s==='ok'&&s.a===0;}).length;
    sum.innerHTML=`Cevaplanan: <b>${d}/${n}</b> · İlk denemede doğru: <b>${f}</b>`;if(d===n)api.unlock();};
  qs.forEach((q,i)=>{
    const key=lid+':'+q.id;const st=S.qs[key]||(S.qs[key]={a:0,s:''});
    const c=el('div','q');const kay=q.tag==='kayit';
    const solHTML=()=>(kay?jt([J(q.ed||'',q.entry)],{num:false}):'')+(q.sol||'');
    let inner='';
    if(q.opts)inner=`<div class="opts" role="radiogroup">${q.opts.map((o,k)=>`<label><input type="radio" name="r${key}" value="${k}"><span>${o}</span></label>`).join('')}</div><div class="qa"><button type="button" class="btn chk">Kontrol et</button></div>`;
    else if(kay)inner=`<table class="je"><thead><tr><th>Hesap</th><th>Borç (TL)</th><th>Alacak (TL)</th><th></th></tr></thead><tbody></tbody><tfoot><tr class="tot"><td style="text-align:right">Toplam</td><td class="tb" style="text-align:right">0</td><td class="tc" style="text-align:right">0</td><td></td></tr></tfoot></table>
      <div class="qa"><button type="button" class="btn sm addr">+ Satır ekle</button><button type="button" class="btn chk">Kontrol et</button></div>`;
    else inner=`<div class="qa"><input class="num" inputmode="decimal" aria-label="Cevap" placeholder="Cevabınız"> <span class="unit">${q.unit||''}</span><button type="button" class="btn chk">Kontrol et</button></div>`;
    c.innerHTML=`<div class="qh"><span class="chip">${TAG[q.tag]}</span>${q.yl?`<span class="chip yl">${CONFIG.lvlLabels[1]}</span>`:''}<span class="qn">Soru ${i+1}/${qs.length}</span></div><div>${q.p}</div>${inner}<div class="fb"></div>`;
    root.appendChild(c);
    const fb=$('.fb',c),btn=$('.chk',c),inp=$('input.num',c);
    let tbody,addRow,rowsData;
    if(kay){tbody=$('tbody',c);
      const tot=()=>{let b=0,a=0;tbody.querySelectorAll('tr').forEach(r=>{b+=parseNum(r.querySelector('.vb').value)||0;a+=parseNum(r.querySelector('.va').value)||0;});$('.tb',c).textContent=nf(b,b%1?2:0);$('.tc',c).textContent=nf(a,a%1?2:0);};
      addRow=()=>{const r=el('tr','',`<td><input class="acc" list="tdhp-dl" placeholder="ör. 102 Bankalar" aria-label="Hesap"></td><td><input class="num vb" inputmode="decimal" aria-label="Borç"></td><td><input class="num va" inputmode="decimal" aria-label="Alacak"></td><td><button type="button" class="xbtn" title="Satırı sil">×</button></td>`);
        tbody.appendChild(r);r.querySelectorAll('input').forEach(x=>x.addEventListener('input',tot));$('.xbtn',r).onclick=()=>{if(tbody.children.length>1){r.remove();tot();}};};
      addRow();addRow();$('.addr',c).onclick=addRow;
      rowsData=()=>{const out=[],errs=[];tbody.querySelectorAll('tr').forEach((r,k)=>{const as=r.querySelector('.acc').value,vb=r.querySelector('.vb').value,va=r.querySelector('.va').value;
        if(!as.trim()&&!vb.trim()&&!va.trim())return;
        const code=findCode(as);const b=vb.trim()?parseNum(vb):0,a=va.trim()?parseNum(va):0;
        if(!code)errs.push(`${k+1}. satırdaki hesap tanınmadı ("${as||'boş'}").`);
        else if(!isFinite(b)||!isFinite(a))errs.push(`${k+1}. satırdaki tutar sayı değil.`);
        else if((b>0)===(a>0))errs.push(`${k+1}. satıra yalnızca borç ya da yalnızca alacak tutarı yazın.`);
        else out.push([code,b,a]);});
        return {out,errs};};
    }
    const lock=()=>{c.querySelectorAll('input,button.chk,button.addr,button.xbtn').forEach(x=>x.disabled=true);};
    const show=(extra)=>{
      if(st.s==='ok'){fb.className='fb ok';fb.innerHTML='<b>Doğru.</b> '+solHTML();lock();}
      else if(st.s==='rev'){fb.className='fb rev';fb.innerHTML='<b>Çözüm:</b> '+solHTML();lock();}
      else if(st.a===1){fb.className='fb try';fb.innerHTML='<b>Henüz değil; bir kez daha deneyin.</b> '+(extra||'')+'İpucu: '+q.hint;}
    };
    btn.onclick=()=>{
      let right,extra='';
      if(q.opts){const r=c.querySelector('input[type=radio]:checked');if(!r){fb.className='fb try';fb.textContent='Bir seçenek işaretleyin.';return;}right=+r.value===q.correct;}
      else if(kay){const {out,errs}=rowsData();
        if(errs.length){fb.className='fb try';fb.innerHTML=errs.join('<br>');return;}
        if(out.length<2){fb.className='fb try';fb.textContent='Bir yevmiye maddesinde en az bir borç ve bir alacak satırı olmalıdır.';return;}
        const t=entryTotals(out);if(Math.abs(t.b-t.a)>0.5){fb.className='fb try';fb.innerHTML=`Kayıt denk değil: borç toplamı ${nf(t.b)}, alacak toplamı ${nf(t.a)}. Çift taraflı kayıtta iki toplam eşit olmalıdır.`;return;}
        const g=gradeEntry(q,out);right=g.ok;
        if(!right)extra=`Beklenen ${g.total} hesaptan ${Math.min(g.good,g.total)} tanesi doğru tutar ve yönde.${g.wrongAcc.length?` Bu kayıtta yer almaması gereken hesap: ${g.wrongAcc.join(', ')}.`:''} `;}
      else{const v=parseNum(inp.value);if(!isFinite(v)){fb.className='fb try';fb.textContent='Sayısal bir değer girin.';return;}right=isRight(q,v);}
      if(right)st.s='ok';else{st.a++;if(st.a>=2)st.s='rev';}
      S.qs[key]=st;save();show(extra);upd();
    };
    if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});
    show();
  });
  upd();
}

/* Bir adımın etkileşimlerini dener: kaydırıcılar, seçim düğmeleri, işlem listeleri, yevmiye cevapları */
let UICHK=0,TXCHK=0;
function poke(b,st,err,tag){
  if(b.querySelector('.tx-list'))TXCHK++;
  b.querySelectorAll('input[type=range]').forEach(r=>{[r.min,r.max,r.defaultValue].forEach(v=>{r.value=v;r.dispatchEvent(new Event('input'));});});
  b.querySelectorAll('.seg button').forEach(x=>x.click());
  for(let g=0;g<40;g++){const cur=b.querySelector('.tx-list .tx button.primary');if(!cur)break;const sel=cur.parentNode.querySelector('select');if(sel)sel.value='0';cur.click();}
  b.querySelectorAll('[data-s]').forEach((x,i)=>{if(i===0)x.click();});
  b.querySelectorAll('.cls-row select').forEach(s=>{s.value=s.options[1]?s.options[1].value:'';s.dispatchEvent(new Event('change'));});
  b.querySelectorAll('button[data-step]').forEach(x=>{for(let k=0;k<12;k++)if(!x.disabled)x.click();});
  if(st.qs){const qs=st.qs.filter(q=>!q.yl||S.lvl==='yl');b.querySelectorAll('.q').forEach((c,i)=>{const q=qs[i];if(!q||q.tag!=='kayit')return;
    const tb=c.querySelector('tbody');while(tb.children.length<q.entry.length)c.querySelector('.addr').click();
    q.entry.forEach((x,k)=>{const r=tb.children[k];r.querySelector('.acc').value=an(x[0]);r.querySelector('.vb').value=x[1]?nf(x[1],2):'';r.querySelector('.va').value=x[2]?nf(x[2],2):'';});
    c.querySelector('.chk').click();UICHK++;if(!c.querySelector('.fb.ok'))err(`${tag} S${q.id}: doğru kayıt arayüzde kabul edilmedi (${c.querySelector('.fb').textContent.slice(0,90)})`);});}
}
function selfTest(){
  NOSAVE=true;const out=[];let fail=0;const keep=JSON.parse(JSON.stringify(S));S.qs={};S.unl={};
  const err=(m)=>{fail++;out.push('HATA  '+m);};
  window.addEventListener('error',e=>err('pencere: '+e.message));
  Object.keys(LESSONS).forEach(id=>{if(!CAT[id])err(`${id}: katalogda yok`);});
  const host=el('div','');host.style.cssText='position:absolute;left:-9999px;width:1000px';document.body.appendChild(host);
  let nSteps=0,nQ=0,nK=0;
  ['lisans','yl'].forEach(lvl=>{S.lvl=lvl;S.mode='tam';applyLvl();
    Object.entries(LESSONS).forEach(([id,L])=>{visSteps(L).forEach(st=>{
      const b=el('div','');host.appendChild(b);
      try{mountStep(b,id,st,{unlocked:false,unlock(){}});nSteps++;}catch(e){err(`${lvl} ${id}/${st.k}: ${e.message}`);}
      try{poke(b,st,err,`${lvl} ${id}/${st.k}`);}catch(e){err(`${lvl} ${id}/${st.k} etkileşim: ${e.message}`);}
      S.qs={};
      if(st.qs&&lvl==='yl')st.qs.forEach(q=>{nQ++;
        if(q.tag==='kayit'){nK++;[q.entry].concat(q.alt||[]).forEach((ex,k)=>{const t=entryTotals(ex);if(Math.abs(t.b-t.a)>0.01)err(`${id} S${q.id} kayıt${k?' alt'+k:''} denk değil (${t.b} / ${t.a})`);
            ex.forEach(x=>{if(!TDHP[x[0]])err(`${id} S${q.id}: hesap yok ${x[0]}`);});});
          if(!gradeEntry(q,q.entry).ok)err(`${id} S${q.id}: doğru cevap kabul edilmiyor`);
          const wrong=q.entry.map(x=>[x[0],x[2],x[1]]);if(gradeEntry(q,wrong).ok)err(`${id} S${q.id}: ters kayıt kabul ediliyor`);}
        else if(q.opts){if(!(q.correct>=0&&q.correct<q.opts.length))err(`${id} S${q.id}: doğru seçenek yok`);}
        else if(!isFinite(q.ans))err(`${id} S${q.id}: cevap sayı değil`);
        if(!q.hint)err(`${id} S${q.id}: ipucu yok`);});
      b.remove();});});});
  /* Ders metinlerindeki örnek maddelerin denkliği */
  (window.EXAMPLE_ENTRIES||[]).forEach(([n,ex])=>{const t=entryTotals(ex.l);if(Math.abs(t.b-t.a)>0.01)err(`örnek madde denk değil: ${n} (${t.b} / ${t.a})`);ex.l.forEach(x=>{if(!TDHP[x[0]])err(`örnek madde ${n}: hesap yok ${x[0]}`);});});
  [...new Set(JT_ERR)].slice(0,20).forEach(m=>err('ekranda denk olmayan ya da tanımsız hesaplı madde: '+m));
  out.push(`Ekranda üretilen yevmiye maddesi: ${JT_N}`);
  host.remove();S=keep;NOSAVE=false;applyLvl();
  out.unshift(`${CONFIG.title}: ${Object.keys(LESSONS).length} ders, ${nSteps} adım açıldı (iki düzey), ${nQ} soru (${nK} yevmiye) denetlendi, ${(window.EXAMPLE_ENTRIES||[]).length} örnek madde; arayüzde ${UICHK} yevmiye cevabı girildi, ${TXCHK} işlem listesi sonuna kadar oynatıldı. Hata: ${fail}`);
  app.innerHTML=`<pre id="selftest">${out.join('\n')}</pre>`;document.title=fail?'SELFTEST FAIL '+fail:'SELFTEST OK';
}
/* İçerik dosyaları örnek maddelerini buraya kaydeder (öz-sınama için) */
window.EXAMPLE_ENTRIES=[];
function EX(name,entries){entries.forEach((e,i)=>window.EXAMPLE_ENTRIES.push([name+' #'+(i+1),e]));return entries;}

function route(){
  applyLvl();
  const h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='selftest'){selfTest();return;}
  PREVIEW=h[3]==='onizle';NOSAVE=PREVIEW;
  if(h[0]==='ders'&&h[1])renderLesson(h[1],h[2]!=null&&h[2]!==''?+h[2]:null);
  else renderHome();
}
function BASLAT(){
  if(CONFIG.typeLabels)Object.assign(TYPE,CONFIG.typeLabels);
  loadState();
  document.documentElement.style.setProperty('--yl-label',`"${CONFIG.lvlLabels[1]}"`);
  CAT={};let NO=0;CATALOG.forEach(u=>u.items.forEach(x=>{x.no=++NO;CAT[x.id]=x;}));
  window.addEventListener('hashchange',route);
  route();
}

function K_taahhut(root,api){
  const L=kl(root,'Ortaklar esas sözleşmeyle sermaye <b>taahhüt eder</b>; taahhüt edilen ama henüz ödenmemiş kısım <b>501 Ödenmemiş Sermaye (−)</b> hesabında izlenir. Ortaklardan biri sermaye payını <b>ayni</b> olarak (bina) getiriyor, diğerleri nakit ödüyor. Kuruluş için mevzuat koşullarını sağlayın.');
  const ck=checklist(L.task,[{id:'a',t:'Esas sermayeyi <b>asgari tutarın altına</b> indirin ve uyarıyı görün.'},{id:'b',t:'Bir anonim şirkette tescil öncesi nakit ödemeyi <b>%25\'in altına</b> indirin.'},{id:'c',t:'Bütün koşulları sağlayan bir <b>anonim şirket</b> kuruluşu oluşturun.'}],api);
  let tur='AS';seg(L.ctl,'Şirket türü',[['AS','Anonim şirket'],['LTD','Limited şirket']],'AS',v=>{tur=v;draw(1);});
  const S0=sl(L.ctl,{label:'Esas sermaye',min:20000,max:5000000,step:10000,value:1000000,fmt:v=>tl(v)});
  const ay=sl(L.ctl,{label:'Ayni sermaye payı (bina)',min:0,max:80,step:5,value:30,fmt:v=>'%'+v});
  const od=sl(L.ctl,{label:'Tescilden önce ödenen nakit (nakdi sermayenin %\'si)',min:0,max:100,step:5,value:25,fmt:v=>'%'+v});
  legend(L.leg,[['box f1','500 Sermaye'],['box f4','Ayni olarak getirilen'],['box f3','Nakit ödenen'],['box f2','501 Ödenmemiş sermaye']]);
  const ro=readouts(L.ro,[['asg','Asgari esas sermaye'],['min','Tescil öncesi en az nakit'],['ods','Bilançoda ödenmiş sermaye'],['du','Durum']]);
  function draw(u){
    const S=S0.v,AY=S*ay.v/100,NK=S-AY,OD=NK*od.v/100,OM=S-AY-OD,asg=tur==='AS'?250000:50000,minN=tur==='AS'?NK*.25:0;
    stackChart(L.ch,[{name:'Taahhüt|(500 Sermaye)',items:[['Sermaye',S,'f1']]},{name:'Ödeme durumu',items:[['Ayni',AY,'f4'],['Nakit',OD,'f3'],['501',OM,'f2']]}],{aria:'Taahhüt edilen ve ödenen sermaye'});
    const e1=S>=asg,e2=OD+1e-6>=minN,ok=e1&&e2;
    ro.set('asg',tl(asg));ro.set('min',tur==='AS'?tl(minN):'Kanunda tescil öncesi oran yok');ro.set('ods',tl(S-OM));
    ro.set('du',ok?'<span class="flag good">✓ Koşullar sağlanıyor</span>':`<span class="flag bad">${!e1?'Asgari sermayenin altında':'%25 kuralı sağlanmıyor'}</span>`);
    const ents=[J('Sermaye taahhüdü',[B(501,S),A(500,S)])];if(AY>0)ents.push(J('Ayni sermaye: bina',[B(252,AY),A(501,AY)]));if(OD>0)ents.push(J('Nakdi sermayenin ödenen kısmı (şirket adına açılan banka hesabı)',[B(102,OD),A(501,OD)]));
    L.x.innerHTML='<h3>Kayıtlar</h3>'+jt(ents)+`<p class="lmeta">Kalan ${tl(OM)} tescilden sonra 24 ay içinde ödenmelidir. Bilançoda özkaynaklar: 500 Sermaye ${nf(S)} − 501 Ödenmemiş sermaye ${nf(OM)} = ${nf(S-OM)} TL.</p>`;
    if(u){if(!e1)ck.mark('a');if(tur==='AS'&&!e2)ck.mark('b');if(tur==='AS'&&ok)ck.mark('c');}
  }
  [S0,ay,od].forEach(x=>x.on(()=>draw(1)));draw(0);
}

    L.x.innerHTML='<h3>Kayıtlar (KDV gösterilmemiştir)</h3>'+jt(ents)+(p==='tfrs'?'<div class="note yl yl-only">VUK\'ta aktifleştiren bir şirket TFRS tablolarında bu tutarı gider yazdığında, iki defter arasındaki fark beş yılda kapanan bir <b>geçici farktır</b> ve ertelenmiş vergi doğurur.</div>':'');
    dtable(L.main,['Yıl','Aktifleştirme','Doğrudan gider'],[1,2,3,4,5].map(t=>[t,tl(akt[t-1]),tl(dg[t-1])]).concat([['Toplam',tl(G),tl(G)]]));
    const d=L.main.querySelector('details.dt');if(d&&!d._b){d._b=1;d.addEventListener('toggle',()=>{if(d.open)ck.mark('b');});}
  }

   ============================================================ */
function K_artirim(root,api){
  const N=100000;
  const L=kl(root,`Defne Ticaret\'in ${nf(N)} payı var (pay başına nominal ${NOM} TL, sermaye ${tl(N*NOM)}). Payın piyasa fiyatı nominal değerin üzerinde. <b>Bedelli</b> artırımda yeni paylar nakit karşılığı satılır; <b>bedelsiz</b> artırımda iç kaynaklar sermayeye eklenir ve paylar ortaklara ücretsiz dağıtılır. Artırımdan sonraki <b>teorik pay fiyatını</b> ve eski ortağın yeni pay alma (rüçhan) hakkının değerini izleyin.`);
  const ck=checklist(L.task,[{id:'a',t:'<b>Bedelsiz</b> artırımda şirketin toplam piyasa değerinin değişmediğini görün.'},{id:'b',t:'Payları nominal değerin üzerinde satarak <b>primli</b> bir bedelli artırım yapın.'},{id:'c',t:'İhraç fiyatını piyasa fiyatına eşitleyin: rüçhan hakkının değeri ne olur?'}],api);
  let tur='bedelli';seg(L.ctl,'Artırım türü',[['bedelli','Bedelli (nakit)'],['bedelsiz','Bedelsiz (iç kaynak)']],'bedelli',v=>{tur=v;draw(1);});
  const P=sl(L.ctl,{label:'Artırım öncesi pay fiyatı',min:10,max:100,step:1,value:30,fmt:v=>tl(v)});
  const r=sl(L.ctl,{label:'Artırım oranı',min:10,max:200,step:10,value:50,fmt:v=>'%'+v});
  const E=sl(L.ctl,{label:'İhraç fiyatı (bedelli)',min:10,max:100,step:1,value:10,fmt:v=>tl(v)});
  legend(L.leg,[['box f1','Artırım öncesi piyasa değeri'],['box f3','Şirkete giren yeni nakit']]);

    f.hline(base/2,'ref','Yarı');f.hline(base/3,'ref','Üçte iki kayıp');

function karDagit(NK,GYZ,C,Y,s){
  const mah=Math.min(NK,GYZ),D0=NK-mah;
  const I=Math.max(0,Math.min(.05*D0,.2*C-Y));
  const R1=D0-I,T1=Math.min(.05*C,R1),R2=R1-T1,T2=s*R2/1.1,II=.1*T2,K=R2-T2-II;
  return {mah,D0,I,T1,T2,II,K,cap:.05*D0>.2*C-Y+1e-6};
}
function karKayit(r,NK,hes){
  const l=[B(590,NK)];if(r.mah>0)l.push(A(580,r.mah));if(r.I+r.II>0.5)l.push(A(540,r2(r.I+r.II)));if(r.T1+r.T2>0.5)l.push(A(331,r2(r.T1+r.T2)));
  const k=r2(NK-r.mah-r2(r.I+r.II)-r2(r.T1+r.T2));if(k>0.5)l.push(A(hes,k));return J('Kâr dağıtımı (genel kurul kararı)',l);
}

  const ck=checklist(L.task,[{id:'a',t:'I. tertip yedeğin <b>%20 sınırına takıldığı</b> bir durum oluşturun.'},{id:'b',t:'Geçmiş yıl zararını kârdan büyük yapın: dağıtım yapılabiliyor mu?'},{id:'c',t:'II. tertip yedek doğuran bir ikinci kâr payı dağıtın.'}],api);

    ro.set('i',tl(r.I)+(r.cap?' <span class="flag bad">sınırda</span>':''));ro.set('t',tl(r.T1+r.T2));ro.set('ii',tl(r.II));ro.set('k',tl(r.K));ro.set('y',tl(Y.v+r.I+r.II));
    L.x.innerHTML='<h3>Dağıtım kaydı</h3>'+jt([karKayit(r,NK.v,hes)],{num:false});
    dtable(L.main,['Kalem','Hesaplama','Tutar'],[['Dağıtılabilir kâr','590 − 580',tl(r.D0)],['I. tertip','min(%5 × dağıtılabilir; %20 × sermaye − 540)',tl(r.I)],['Birinci kâr payı','%5 × ödenmiş sermaye',tl(r.T1)],['İkinci kâr payı','oran × kalan / 1,1',tl(r.T2)],['II. tertip','%10 × ikinci kâr payı',tl(r.II)]]);
    if(u){if(r.cap&&NK.v>G.v)ck.mark('a');if(G.v>=NK.v&&NK.v>0)ck.mark('b');if(r.II>0.5)ck.mark('c');}

function K_oran(root,api){
  const NA=200000,NB=50000;

  const ck=checklist(L.task,[{id:'a',t:'<b>Adil</b> değiştirme oranını bulun (ortaklık payı = değer katkısı, ±0,5 puan).'},{id:'b',t:'Oranı yüksek tutup Liman ortaklarına değer aktarıldığını görün.'},{id:'c',t:'Oranı düşük tutup Defne ortaklarına değer aktarıldığını görün.'}],api);
  const VA=sl(L.ctl,{label:'Defne\'nin net değeri',min:1000000,max:10000000,step:100000,value:3000000,fmt:v=>tl(v)});
  const VB=sl(L.ctl,{label:'Liman\'ın net değeri',min:200000,max:5000000,step:50000,value:900000,fmt:v=>tl(v)});
  const r=sl(L.ctl,{label:'Uygulanan değiştirme oranı',min:0.2,max:5,step:0.01,value:1,fmt:v=>nf(v,2)});
  legend(L.leg,[['box f1','Birleşik şirkete değer katkısı'],['box f2','Birleşme sonrası ortaklık payı']]);
  const ro=readouts(L.ro,[['ad','Adil değiştirme oranı'],['n','Verilecek yeni pay'],['sa','Sermaye artışı'],['pr','Birleşme primi'],['dt','Liman ortaklarına değer aktarımı']]);
  function draw(u){
    const fair=(VB.v/NB)/(VA.v/NA),n=NB*r.v,own=n/(NA+n),vs=VB.v/(VA.v+VB.v),tr=own*(VA.v+VB.v)-VB.v;
    groupChart(L.ch,['Liman ortakları','Defne ortakları'],[{n:'Değer katkısı',cls:'f1',v:[vs*100,(1-vs)*100]},{n:'Ortaklık payı',cls:'f2',v:[own*100,(1-own)*100]}],{yfmt:v=>'%'+nf(v,0),ylab:'Yüzde',vfmt:v=>'%'+nf(v,1),tfmt:v=>'%'+nf(v,1),aria:'Değer katkısı ve ortaklık payı'});
    ro.set('ad',nf(fair,3));ro.set('n',nf(Math.round(n)));ro.set('sa',tl(Math.round(n)*NOM));ro.set('pr',tl(VB.v-Math.round(n)*NOM));
    ro.set('dt',Math.abs(tr)<VB.v*0.005?'Yok (adil)':tr>0?`<span class="flag bad">+${tl(tr)}</span>`:`<span class="flag bad">${tl(tr)}</span>`);
    if(u){const d=(own-vs)*100;if(Math.abs(d)<=0.5)ck.mark('a');if(d>2)ck.mark('b');if(d<-2)ck.mark('c');}
  }
  [VA,VB,r].forEach(x=>x.on(()=>draw(1)));draw(0);
  L.x.innerHTML='<p class="lmeta">Basitleştirme: net değer hem değiştirme oranının hem de muhasebe kaydının temeli alınmıştır. Uygulamada değiştirme oranı bilirkişi raporundaki gerçek değerlere (ör. indirgenmiş nakit akışı, piyasa değeri) dayanır; muhasebe kaydı ise vergisiz birleşmede kayıtlı değerlerle yapılır. Kesirli paylar için denkleştirme ödemesi yapılabilir.</p>';
}

   <tr><td>Asgari esas sermaye</td><td>250.000 TL (kayıtlı sermaye sisteminde başlangıç sermayesi 500.000 TL)</td><td>50.000 TL</td></tr>

   <tr><td>Kalan kısmın ödenmesi</td><td>Tescilden sonra 24 ay içinde</td><td>Tescilden sonra 24 ay içinde</td></tr></tbody></table>
  <div class="note tr">Asgari sermaye tutarları 7887 sayılı Cumhurbaşkanı Kararı (RG 25.11.2023) ile artırılmış ve 1.1.2024'ten itibaren kurulan şirketlere uygulanmaktadır; daha önce kurulan şirketlerin sermayeyi artırması için uyum süreleri ayrıca düzenlenmiştir. Tutarlar yeniden değişebilir.</div>
  <p><b>Ayni sermaye</b> (bina, makine, taşıt, marka gibi para dışı varlıklar) bilirkişi raporundaki değeriyle kaydedilir: ilgili varlık hesabı borç, 501 alacak.</p>
  <h3>Kuruluş giderleri</h3>
  <p>Noter, danışmanlık, tescil, ilan ve harç giderleri VUK uygulamasında doğrudan gider yazılabilir ya da <b>262 Kuruluş ve Örgütlenme Giderleri</b> hesabında aktifleştirilerek beş yılda eşit tutarlarla itfa edilebilir (770 borç, 268 alacak).</p>
  <div class="note yl yl-only"><b>TMS 38 Maddi Olmayan Duran Varlıklar</b> kuruluş ve faaliyete başlama giderlerinin aktifleştirilmesine izin vermez; bu giderler oluştuğunda gider yazılır. <b>TMS 32</b>'ye göre ise yeni pay ihracıyla doğrudan ilişkili işlem maliyetleri gider yazılmaz, özkaynaktan düşülür.</div>`},
 {k:'o',type:'ornek',title:'Defne Ticaret A.Ş.\'nin kuruluşu',html:()=>`
  <p><b>Soru.</b> Defne Ticaret A.Ş. 2 Ocak 2026'da 1.000.000 TL esas sermayeyle kuruluyor. Ortak A payını 300.000 TL değerindeki bir binayla, ortaklar B ve C 700.000 TL'yi nakit olarak taahhüt ediyor. Tescil öncesinde nakdi sermayenin %25'i bankaya yatırılıyor. Kuruluş için 30.000 TL + %20 KDV noter ve danışmanlık gideri ile 10.000 TL KDV'siz tescil harcı bankadan ödeniyor ve aktifleştiriliyor.</p>
  <p><b>Tescil öncesi en az nakit:</b> 700.000 × %25 = 175.000 TL.</p>
  ${jt(ORN_KUR)}
  <p>Bilançoda ödenmiş sermaye: 1.000.000 − 525.000 = <b>475.000 TL</b>. Kalan 525.000 TL 24 ay içinde ödenecek. Kuruluş giderleri yıllık 8.000 TL itfa edilecek.</p>`},
 {k:'k1',type:'kesif',core:true,title:'Taahhütten ödemeye: mevzuat koşulları',mount:K_taahhut},
 {k:'k2',type:'kesif',core:false,title:'Kuruluş giderleri: VUK ve TFRS',mount:K_kurgider},
 {k:'t',type:'turetim',title:'501 neden borç bakiyeli bir özkaynak hesabıdır?',html:()=>`
  <p>Taahhüt anında şirketin ortaklardan bir <b>alacağı</b> doğar, ama bu alacak bilançonun aktifinde gösterilmez. Bunun yerine özkaynakların içinde bir düzenleyici hesap kullanılır: 500 taahhüt edilen tutarın tamamını gösterir, 501 ise henüz ödenmemiş kısmı düşer. Böylece:</p>
  <div class="eq">Özkaynaktaki sermaye = 500 Sermaye − 501 Ödenmemiş Sermaye = Fiilen ödenmiş sermaye</div>
  <p>Bu gösterim, alacaklıların işletmeye fiilen konmuş sermayeyi görmesini sağlar. Taahhüdün ödenmesi (nakit ya da ayni) aktifi artırır ve 501'i azaltır; özkaynak toplamı da aynı tutarda artar.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'kayit',p:'Bir anonim şirketin ortakları 2.000.000 TL esas sermaye taahhüt etti.',entry:[B(501,2000000),A(500,2000000)],hint:'Taahhüt anında para henüz girmemiştir.',sol:''},
  {id:2,tag:'hesap',p:'Bu sermayenin 1.600.000 TL\'si nakit olarak taahhüt edildi. Tescilden önce en az kaç TL ödenmelidir?',ans:400000,abs:1,unit:'TL',hint:'TTK md. 344: nakdi taahhüdün en az %25\'i.',sol:'1.600.000 × %25 = <b>400.000 TL</b>.'},
  {id:3,tag:'kayit',p:'400.000 TL şirket adına açılan banka hesabına yatırıldı.',entry:[B(102,400000),A(501,400000)],hint:'Ödenmemiş sermaye azalır.',sol:''},
  {id:4,tag:'kayit',p:'Bir ortak taahhüdü karşılığında bilirkişi değeri 400.000 TL olan bir kamyonu şirkete getirdi.',entry:[B(254,400000),A(501,400000)],hint:'Ayni sermaye ilgili varlık hesabına borç yazılır.',sol:''},
  {id:5,tag:'kayit',p:'Kuruluş giderleri 60.000 TL + 12.000 TL KDV bankadan ödendi ve aktifleştirildi.',entry:[B(262,60000),B(191,12000),A(102,72000)],hint:'Aktifleştirilen kuruluş giderleri 26 grubunda izlenir.',sol:''},
  {id:6,tag:'hesap',p:'Aktifleştirilen bu 60.000 TL\'lik kuruluş gideri için yıllık itfa payı kaç TL\'dir?',ans:12000,abs:1,unit:'TL',hint:'Beş yılda eşit tutarlarla.',sol:'60.000 / 5 = <b>12.000 TL</b> (770 borç, 268 alacak).'},
  {id:7,tag:'kavram',p:'2026 yılında kayıtlı sermaye sistemini benimsemeden kurulacak bir anonim şirketin esas sermayesi en az kaç TL olmalıdır?',opts:['50.000 TL','100.000 TL','250.000 TL','500.000 TL'],correct:2,hint:'7887 sayılı Cumhurbaşkanı Kararı.',sol:'<b>250.000 TL</b>. 500.000 TL kayıtlı sermaye sistemindeki başlangıç sermayesidir; 50.000 TL limited şirketin asgari sermayesidir.'},
  {id:8,tag:'kavram',yl:1,p:'TFRS\'ye göre rapor veren bir şirketin kuruluş giderleri nasıl muhasebeleştirilir?',opts:['Maddi olmayan duran varlık olarak aktifleştirilir, 5 yılda itfa edilir','Oluştuğunda gider yazılır','Özkaynaktan düşülür','Şerefiyeye eklenir'],correct:1,hint:'TMS 38 kuruluş giderleri için açık bir hüküm içerir.',sol:'TMS 38\'e göre <b>gider yazılır</b>. Yalnızca pay ihracına doğrudan bağlanabilen işlem maliyetleri (TMS 32) özkaynaktan düşülür.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary">
  <li>Taahhüt: 501 borç / 500 alacak. Ödeme: varlık hesabı borç / 501 alacak.</li>
  <li>Bilançoda ödenmiş sermaye = 500 − 501.</li>
  <li>AŞ'de asgari sermaye 250.000 TL, Ltd'de 50.000 TL (1.1.2024'ten itibaren kurulanlar); AŞ'de nakdi taahhüdün en az %25'i tescilden önce ödenir.</li>
  <li>VUK'ta kuruluş giderleri gider yazılabilir ya da 262'de aktifleştirilip 5 yılda itfa edilir; TFRS'de gider yazılır.</li></ul>
  <p class="lmeta">İzlence: Hafta 3 (sermaye taahhüdü ve ödenmesi), 4 (kuruluş giderleri) · ÖÇ2.</p>`}
]},

sermaye:{title:'Sermaye artırımı ve azaltımı',sure:'45 dk',steps:[
 {k:'a',type:'anlatim',title:'Artırım türleri ve azaltım',html:()=>`
  <p>Esas sermaye sisteminde sermaye genel kurul kararıyla, kayıtlı sermaye sisteminde ise esas sözleşmedeki tavan içinde yönetim kurulu kararıyla artırılır.</p>
  <table class="tbl sym"><thead><tr><th>Artırım türü</th><th>Kayıt</th></tr></thead><tbody>
   <tr><td><b>Bedelli (nakdi ya da ayni)</b></td><td>Taahhüt: 501 / 500 · Ödeme: 102 (ya da varlık) / 501</td></tr>
   <tr><td><b>Primli ihraç</b> (nominal değerin üzerinde)</td><td>102 / 500 (nominal) ve <b>520 Hisse Senedi İhraç Primleri</b> (fark)</td></tr>
   <tr><td><b>İç kaynaklardan (bedelsiz)</b></td><td>520, 522, 542, 570 gibi özkaynak kalemleri / 500</td></tr></tbody></table>
  <p>Bedelsiz artırımda şirkete yeni değer girmez; yalnızca özkaynak kalemleri arasında yer değişir ve pay sayısı artar. Bu yüzden pay başına değer düşer. Bedelli artırımda eski ortakların <b>yeni pay alma (rüçhan) hakkı</b> vardır; ihraç fiyatı piyasa fiyatının altındaysa bu hakkın bir değeri oluşur.</p>
  <div class="eq">Teorik fiyat = ${fr('<i>N</i> · <i>P</i> + <i>n</i> · <i>E</i>','<i>N</i> + <i>n</i>')} &nbsp;&nbsp;&nbsp; (bedelsizde <i>E</i> = 0)</div>
  <h3>Sermaye azaltımı</h3>
  <p>Sermaye ortaklara iade amacıyla (500 / 331, sonra 331 / 102) ya da <b>zararları kapatmak</b> amacıyla (500 / 580) azaltılabilir. Azaltım alacaklıların güvencesini etkileyebileceği için TTK'daki usule (genel kurul kararı, denetim raporu, alacaklılara çağrı) uyulur. Zarar kapatma amaçlı azaltım çoğu zaman eş zamanlı bir artırımla birlikte yapılır.</p>
  <div class="note yl yl-only"><b>TMS 32</b>'ye göre özkaynak işlemlerinin doğrudan işlem maliyetleri (aracı kurum komisyonu, izahname giderleri) gider yazılmaz; vergi etkisi düşülerek özkaynaktan indirilir.</div>`},
 {k:'o',type:'ornek',title:'Defne Ticaret\'in iki artırımı',html:()=>`
  <p><b>Soru.</b> Defne Ticaret'in sermayesi 1.000.000 TL'dir (100.000 pay, nominal 10 TL); pay fiyatı 30 TL. (1) Sermaye %50 oranında, nominal değerden (10 TL) bedelli olarak artırılıyor ve tamamı ödeniyor. (2) Ardından olağanüstü yedeklerden 200.000 TL bedelsiz artırım yapılıyor.</p>
  ${jt(ORN_ART)}
  <p><b>Bedelli artırımdan sonra teorik fiyat:</b> (100.000 × 30 + 50.000 × 10) / 150.000 = <b>23,33 TL</b>. Eski ortağın pay başına değer kaybı 6,67 TL'dir; rüçhan hakkını kullanan ortak bu kaybı yeni paylardaki kazançla telafi eder.</p>
  <p><b>Bedelsizden sonra:</b> 150.000 paya 20.000 bedelsiz pay eklenir. Şirket değeri değişmediği için teorik fiyat 23,33 × 150.000 / 170.000 = <b>20,59 TL</b>'ye iner.</p>`},
 {k:'k1',type:'kesif',core:true,title:'Bedelli, bedelsiz ve primli artırım',mount:K_artirim},
 {k:'k2',type:'kesif',core:true,title:'Sermaye kaybı ve zarar kapatma amaçlı azaltım',mount:K_azaltim},
 {k:'t',type:'turetim',title:'Rüçhan hakkının değeri nereden gelir?',html:()=>`
  <p>Artırımdan önce şirketin piyasa değeri <i>N P</i>'dir. Bedelli artırım şirkete <i>n E</i> nakit getirir. Piyasa artırımdan önceki değeri ve giren nakdi doğru değerliyorsa artırım sonrası değer <i>N P</i> + <i>n E</i>, pay başına değer ise teorik fiyattır.</p>
  <p><i>E</i> &lt; <i>P</i> olduğunda teorik fiyat <i>P</i>'nin altına düşer. Eski ortağın her payı <i>P</i> − <i>P</i><sub>t</sub> kadar değer kaybeder; ama yeni payları <i>E</i>'den alıp <i>P</i><sub>t</sub>'den değerleme hakkı (rüçhan hakkı) bu kaybı karşılar. Rüçhan hakkını kullanmayan ortağın payı <b>sulanır</b>.</p>
  <div class="eq">Rüçhan hakkı değeri (eski pay başına) = <i>P</i> − <i>P</i><sub>t</sub> = ${fr('<i>n</i>(<i>P</i> − <i>E</i>)','<i>N</i> + <i>n</i>')}</div>
  <p><i>E</i> = <i>P</i> ise değer sıfırdır. Bedelsiz artırımda <i>E</i> = 0'dır; değer kaybı tamamen yeni bedelsiz paylarla karşılanır, ortağın servetinde değişiklik olmaz.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'kayit',p:'Genel kurul sermayenin nakden 600.000 TL artırılmasına karar verdi; ortaklar yeni payları taahhüt etti.',entry:[B(501,600000),A(500,600000)],hint:'Bedelli artırımın ilk adımı kuruluştaki taahhüt kaydıyla aynıdır.',sol:''},
  {id:2,tag:'kayit',p:'Olağanüstü yedeklerden 150.000 TL ve geçmiş yıllar kârlarından 50.000 TL sermayeye eklendi.',entry:[B(542,150000),B(570,50000),A(500,200000)],hint:'İç kaynaklar borçlanır, sermaye alacaklanır.',sol:''},
  {id:3,tag:'kayit',p:'Nominal değeri 10 TL olan 20.000 pay, pay başına 25 TL\'den nakit karşılığı satıldı ve bedeli bankaya yatırıldı (tek madde).',entry:[B(102,500000),A(500,200000),A(520,300000)],hint:'Nominal değer sermayeye, aşan kısım ihraç primine.',sol:'20.000 × 25 = 500.000 TL; sermaye 20.000 × 10 = 200.000 TL; prim 300.000 TL. Taahhüt ve ödeme ayrı maddelerle (501 üzerinden) de yapılabilirdi.'},
  {id:4,tag:'hesap',p:'200.000 paylı bir şirkette pay fiyatı 40 TL\'dir. 100.000 bedelsiz pay dağıtılırsa teorik pay fiyatı kaç TL olur? (2 ondalık)',ans:200000*40/300000,abs:0.01,unit:'TL',hint:'Şirket değeri değişmez, pay sayısı artar.',sol:'200.000 × 40 / 300.000 = <b>26,67 TL</b>.'},
  {id:5,tag:'hesap',p:'Aynı şirkette (pay fiyatı 40 TL) %50 oranında, pay başına 10 TL\'den bedelli artırım yapılırsa teorik pay fiyatı kaç TL olur?',ans:30,abs:0.01,unit:'TL',hint:'Teorik fiyat = (N · P + n · E) / (N + n).',sol:'(200.000 × 40 + 100.000 × 10) / 300.000 = <b>30 TL</b>.'},
  {id:6,tag:'kayit',p:'Geçmiş yıllar zararlarını kapatmak için sermaye 250.000 TL azaltıldı.',entry:[B(500,250000),A(580,250000)],hint:'580 borç bakiyeli bir düzenleyici hesaptır; kapatmak için alacaklandırılır.',sol:''},
  {id:7,tag:'kavram',p:'TTK md. 376\'ya göre sermaye ile kanuni yedek akçeler toplamının <b>üçte ikisi</b> zarar sebebiyle karşılıksız kalırsa ne olur?',opts:['Yönetim kurulu yalnızca bilgi verir','Genel kurul sermayenin üçte biriyle yetinmeye ya da sermayenin tamamlanmasına karar vermezse şirket kendiliğinden sona erer','Şirket derhâl iflas eder','Kâr dağıtımı zorunlu hâle gelir'],correct:1,hint:'Keşif 2\'deki ikinci eşik.',sol:'Genel kurul <b>üçte biriyle yetinme</b> ya da <b>tamamlama</b> kararı almazsa şirket kendiliğinden sona erer.'},
  {id:8,tag:'kavram',yl:1,p:'TMS 32\'ye göre yeni pay ihracında aracı kuruma ödenen 50.000 TL komisyon nasıl muhasebeleştirilir?',opts:['Finansman gideri yazılır','Vergi etkisi düşülerek özkaynaktan indirilir','Aktifleştirilip itfa edilir','Satılan malın maliyetine eklenir'],correct:1,hint:'Özkaynak işleminin doğrudan maliyeti.',sol:'Özkaynak işleminin doğrudan maliyeti olarak <b>özkaynaktan düşülür</b>.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary">
  <li>Bedelli artırım: 501 / 500, sonra 102 / 501. Nominalin üzerindeki satış bedeli 520'ye yazılır.</li>
  <li>Bedelsiz artırım özkaynak kalemleri arasında yer değişimidir; şirket değeri değişmez, pay başına değer düşer.</li>
  <li>Rüçhan hakkı, ihraç fiyatı piyasa fiyatının altındayken eski ortağı sulanmaya karşı korur.</li>
  <li>Zarar kapatma amaçlı azaltım: 500 / 580. TTK md. 376 yarı ve üçte iki eşiklerinde genel kurulun harekete geçmesini ister.</li></ul>
  <p class="lmeta">İzlence: Hafta 5 (sermaye artırımı), 7 (sermaye azaltımı) · ÖÇ3.</p>`}
]},

kar:{title:'Kâr dağıtımı, yedek akçeler ve kâr payı stopajı',sure:'45 dk',steps:[
 {k:'a',type:'anlatim',title:'Kâr dağıtımının sırası',html:()=>`
  <p>Dönem net kârı (590) genel kurul kararıyla dağıtılır. Dağıtım şu sırayla yapılır:</p>
  <ol><li><b>Geçmiş yıl zararlarının mahsubu</b> (580).</li>
  <li><b>I. tertip genel kanuni yedek akçe</b> (540): yıllık kârın %5'i, ödenmiş sermayenin %20'sine ulaşıncaya kadar (TTK md. 519/1).</li>
  <li><b>Birinci kâr payı</b>: ödenmiş sermayenin %5'i.</li>
  <li>Esas sözleşmede öngörülmüşse <b>statü yedekleri</b> (541).</li>
  <li><b>İkinci kâr payı</b> ve buna bağlı <b>II. tertip genel kanuni yedek akçe</b>: %5 kâr payı ödendikten sonra dağıtılacak toplam tutarın %10'u (TTK md. 519/2-c).</li>
  <li>Kalan tutar <b>olağanüstü yedek</b> (542) ya da <b>geçmiş yıllar kârı</b> (570) olarak bırakılır.</li></ol>
  <p>Genel kanuni yedek akçe, sermayenin yarısını aşmadıkça yalnızca zararların kapatılmasına, işlerin iyi gitmediği zamanlarda işletmeyi sürdürmeye ya da işsizliğin önüne geçmeye ve sonuçlarını hafifletmeye yönelik önlemler için kullanılabilir (TTK md. 519/3).</p>
  <div class="note">Simülatörde yönetim kuruluna ve çalışanlara kâr payı, statü yedekleri ve kâr payı avansı gösterilmemiştir. II. tertip yedek, ders kitaplarında yaygın olan yorumla (birinci kâr payını aşan dağıtım × %10) hesaplanmıştır.</div>
  <h3>Kayıtlar</h3>
  <p>Genel kurul kararıyla 590 borçlandırılır; 580, 540, 542/570 ve ortaklara ödenecek kâr payı için <b>331 Ortaklara Borçlar</b> alacaklandırılır. Ödemede gerçek kişi ortaklar için yapılan stopaj 360'a alınır.</p>
  <div class="note yl yl-only"><b>TMS 10</b>'a göre raporlama döneminden sonra ilan edilen kâr payları o dönemin bilançosunda <b>yükümlülük olarak gösterilmez</b>; dipnotta açıklanır. Kâr payı borcu, genel kurulun dağıtım kararıyla doğar.</div>`},
 {k:'o',type:'ornek',title:'Defne Ticaret\'in 2026 kârının dağıtımı',html:()=>{const r=ORN_KR;return `
  <p><b>Soru.</b> 590 Dönem Net Kârı 900.000 TL, 580 Geçmiş Yıllar Zararları 100.000 TL, ödenmiş sermaye 2.000.000 TL, mevcut genel kanuni yedek 360.000 TL. Genel kurul toplam 500.000 TL kâr payı dağıtmaya, kalanı olağanüstü yedeğe ayırmaya karar veriyor. Ortakların tamamı gerçek kişi; stopaj %15.</p>
  <table class="tbl"><tbody>
   <tr><td class="l">Dağıtılabilir kâr: 900.000 − 100.000</td><td>${nf(r.D0)}</td></tr>
   <tr><td class="l">I. tertip: min(%5 × 800.000 = 40.000; %20 × 2.000.000 − 360.000 = 40.000)</td><td>${nf(r.I)}</td></tr>
   <tr><td class="l">Birinci kâr payı: %5 × 2.000.000</td><td>${nf(r.T1)}</td></tr>
   <tr><td class="l">İkinci kâr payı: 500.000 − 100.000</td><td>${nf(r.T2)}</td></tr>
   <tr><td class="l">II. tertip: %10 × 400.000</td><td>${nf(r.II)}</td></tr>
   <tr class="tot"><td class="l">Olağanüstü yedeğe kalan</td><td>${nf(r.K)}</td></tr></tbody></table>
  ${jt(ORN_KAR)}`;}},
 {k:'k1',type:'kesif',core:true,title:'Kâr dağıtım tablosu',mount:K_kar},
 {k:'k2',type:'kesif',core:false,title:'Kâr payının ödenmesi ve stopaj',mount:K_stopaj},
 {k:'t',type:'turetim',title:'İkinci kâr payının üst sınırı',html:()=>`
  <p>Birinci kâr payından sonra kalan tutar <i>R</i> olsun. Ortaklara <i>T</i><sub>2</sub> kadar ikinci kâr payı dağıtılırsa ayrıca 0,1 · <i>T</i><sub>2</sub> II. tertip yedek ayrılmalıdır. İkisinin toplamı kalan kârı aşamaz:</p>
  <div class="eq"><i>T</i><sub>2</sub> + 0,1 · <i>T</i><sub>2</sub> ≤ <i>R</i> &nbsp;⇒&nbsp; <i>T</i><sub>2</sub> ≤ ${fr('<i>R</i>','1,1')}</div>
  <p>Bu yüzden kalan kârın tamamı dağıtılmak istense bile ortaklara ancak <i>R</i>/1,1 ödenebilir; kalan <i>R</i>/11 yedeğe gider. Keşifteki kaydırıcı, kalan kârın ne kadarının dağıtılacağını bu sınıra göre ölçekler.</p>
  <p><b>I. tertip sınırı:</b> 540'ın bakiyesi ödenmiş sermayenin %20'sine ulaşınca I. tertip ayrılmaz; ama II. tertip yedek bu sınırdan bağımsız olarak ayrılmaya devam eder.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[

birlesme:{title:'Şirket birleşmesi: devralma ve değiştirme oranı',sure:'45 dk',steps:[
 {k:'a',type:'anlatim',title:'Birleşmenin hukuki ve muhasebe çerçevesi',html:()=>`
  <p>TTK'ya göre (md. 134 vd.) şirketler iki yolla birleşir: <b>devralma yoluyla</b> (bir şirket ötekini devralır) ya da <b>yeni kuruluş yoluyla</b> (iki şirket yeni bir şirkette birleşir). Devrolunan şirket tasfiyesiz sona erer; ortakları devralan şirketin paylarını alır.</p>
  <h3>Değiştirme oranı</h3>
  <p>Birleşme sözleşmesi, devrolunan şirketin bir payı karşılığında kaç devralan payı verileceğini belirler:</p>
  <div class="eq">Değiştirme oranı = ${fr('Devrolunan şirketin pay başına değeri','Devralan şirketin pay başına değeri')} &nbsp;&nbsp; Yeni pay sayısı = Devrolunan pay sayısı × oran</div>
  <p>Kesirli paylar için sınırlı bir <b>denkleştirme ödemesi</b> yapılabilir. Devralan şirket, devrolunan şirketin bütün paylarına sahipse <b>kolaylaştırılmış birleşme</b> hükümleri uygulanır; bu durumda sermaye artırımı gerekmez.</p>
  <h3>Devralanın kaydı (kayıtlı değerlerle)</h3>
  <p>Vergisiz birleşmede devrolunanın varlık ve borçları kayıtlı değerleriyle devralınır: varlık hesapları borç, borç hesapları alacak, artırılan sermaye 500 alacak. Devralınan net varlıklar artırılan sermayeyi aşarsa fark <b>birleşme primi</b> olarak özkaynakta izlenir (uygulamada 520 ya da 529 hesabının bir alt hesabında).</p>
  <div class="note yl yl-only"><b>TFRS 3 İşletme Birleşmeleri</b> satın alma yöntemini öngörür: devralan belirlenir, devralınan tanımlanabilir varlık ve yükümlülükler <b>gerçeğe uygun değerle</b> ölçülür; devir bedelini aşan kısım <b>şerefiye</b>dir. Şerefiye amortismana tabi tutulmaz, her yıl değer düşüklüğü testine (TMS 36) girer. Ortak kontrol altındaki işletmelerin birleşmeleri TFRS 3'ün kapsamı dışındadır.</div>`},
 {k:'o',type:'ornek',title:'Defne Ticaret Liman Lojistik\'i devralıyor',html:()=>`
  <p><b>Soru.</b> Defne'nin net varlıkları 3.000.000 TL, 200.000 payı var (nominal 10 TL). Liman'ın varlıkları: banka 200.000, alıcılar 300.000, ticari mallar 400.000, binalar 600.000 TL; borçları: satıcılar 350.000, banka kredisi 250.000 TL; 50.000 payı var. Değiştirme oranını ve Defne'nin kaydını bulun.</p>
  <p><b>Pay başına değerler:</b> Defne 3.000.000 / 200.000 = 15 TL; Liman (1.500.000 − 600.000) / 50.000 = 18 TL. <b>Değiştirme oranı</b> 18 / 15 = <b>1,2</b>.</p>
  <p><b>Yeni pay:</b> 50.000 × 1,2 = 60.000 → sermaye artışı 600.000 TL; birleşme primi 900.000 − 600.000 = 300.000 TL.</p>
  ${jt(ORN_BIR)}
  <p>Birleşme sonrası Liman'ın eski ortakları 60.000 / 260.000 = %23,1 paya sahip olur; bu, birleşik şirkete katkılarına (900.000 / 3.900.000 = %23,1) eşittir.</p>`},
 {k:'k1',type:'kesif',core:true,title:'Değiştirme oranı ve ortaklık payı',mount:K_oran},
 {k:'k2',type:'kesif',core:false,level:'yl',title:'TFRS 3: şerefiye ve pazarlıklı satın alma',mount:K_serefiye},
 {k:'t',type:'turetim',title:'Adil değiştirme oranı neden pay başına değerlerin oranıdır?',html:()=>`
  <p>Devralanın <i>N</i><sub>A</sub> payı ve <i>V</i><sub>A</sub> değeri, devrolunanın <i>N</i><sub>B</sub> payı ve <i>V</i><sub>B</sub> değeri olsun. Devrolunan ortaklarına <i>n</i> yeni pay verilir. Birleşmenin adil olması için onların birleşik şirketteki payı, katkılarına eşit olmalıdır:</p>
  <div class="eq">${fr('<i>n</i>','<i>N</i><sub>A</sub> + <i>n</i>')} = ${fr('<i>V</i><sub>B</sub>','<i>V</i><sub>A</sub> + <i>V</i><sub>B</sub>')} &nbsp;⇒&nbsp; <i>n</i> = <i>N</i><sub>A</sub> ${fr('<i>V</i><sub>B</sub>','<i>V</i><sub>A</sub>')} &nbsp;⇒&nbsp; ${fr('<i>n</i>','<i>N</i><sub>B</sub>')} = ${fr('<i>V</i><sub>B</sub> / <i>N</i><sub>B</sub>','<i>V</i><sub>A</sub> / <i>N</i><sub>A</sub>')}</div>
  <p>Oran bundan yüksek tutulursa devrolunan ortakları katkılarından fazla pay alır ve fark devralan ortaklarının servetinden aktarılır; düşük tutulursa tersi olur. Bu nedenle değiştirme oranı bağımsız bir değerleme ve birleşme raporuyla gerekçelendirilir ve ortakların denetimine açılır.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'Devralan şirketin pay başına değeri 20 TL, devrolunan şirketinki 30 TL\'dir. Değiştirme oranı kaçtır?',ans:1.5,abs:0.001,unit:'',hint:'Devrolunanın değeri / devralanın değeri.',sol:'30 / 20 = <b>1,5</b>: devrolunanın her payı için 1,5 devralan payı verilir.'},

  {id:4,tag:'kayit',p:'Devralınan varlıklar: banka 300.000, ticari mallar 500.000, makineler 700.000 TL; borçlar: satıcılar 400.000 TL. Sermaye 600.000 TL artırıldı; farkı birleşme primi olarak 520\'de izleyin.',entry:[B(102,300000),B(153,500000),B(253,700000),A(320,400000),A(500,600000),A(520,500000)],alt:[[B(102,300000),B(153,500000),B(253,700000),A(320,400000),A(500,600000),A(529,500000)]],hint:'Net varlık 1.100.000 TL; sermaye artışı 600.000 TL.',sol:'Prim 1.100.000 − 600.000 = 500.000 TL. 529 alt hesabında izlenmesi de kabul edilir.'},
  {id:5,tag:'hesap',p:'Devralanın birleşmeden önce 150.000 payı vardı ve 60.000 yeni pay ihraç etti. Devrolunanın eski ortaklarının birleşik şirketteki payı yüzde kaçtır? (2 ondalık)',ans:100*60000/210000,abs:0.01,unit:'%',hint:'Yeni pay / toplam pay.',sol:`60.000 / 210.000 = <b>%${nf(100*60000/210000,2)}</b>.`},
  {id:6,tag:'kavram',p:'Hangi durumda kolaylaştırılmış birleşme hükümleri uygulanabilir?',opts:['İki şirketin sermayesi eşitse','Devralan, devrolunanın oy hakkı veren bütün paylarına sahipse','Devrolunan şirket zarardaysa','Birleşme yeni kuruluş yoluyla yapılıyorsa'],correct:1,hint:'Sermaye artırımına gerek kalmayan durum.',sol:'Devralan, devrolunanın <b>oy hakkı veren bütün paylarına</b> sahipse (ya da aynı kişi iki şirketin bütün paylarına sahipse) kolaylaştırılmış birleşme uygulanır.'},
  {id:7,tag:'hesap',yl:1,p:'TFRS 3\'e göre devir bedeli 2.000.000 TL, devralınan net tanımlanabilir varlıkların gerçeğe uygun değeri 1.700.000 TL ise şerefiye kaç TL\'dir?',ans:300000,abs:1,unit:'TL',hint:'Bedel − net GUD.',sol:'2.000.000 − 1.700.000 = <b>300.000 TL</b> şerefiye (261).'}
 ]},

/* ============================================================
   Şirketler Muhasebesi — ek dersler (sürüm 0.2, 27.11.2026)
   Şirket türleri ve şahıs şirketleri · Tahvil ihracı · Vergi yükümlülükleri
   · Bölünme · Tasfiye
   ============================================================ */

/* ---------- DERS 1 — Şirket türleri ve şahıs şirketleri ---------- */
const TURAD={kol:'Kollektif şirket',kom:'Komandit şirket',ltd:'Limited şirket',as:'Anonim şirket'};
function sorumluluk(tur,V,Do,Dk,Aw,Bw){
  const D=Do+Dk,acik=Math.max(0,D-V),kamuAcik=D>0?Dk*acik/D:0;let a=0,b=0;
  if(tur==='kol'){a=Math.min(Aw,acik/2);b=Math.min(Bw,acik/2);let rem=acik-a-b;const xa=Math.min(Aw-a,rem);a+=xa;rem-=xa;const xb=Math.min(Bw-b,rem);b+=xb;}
  else if(tur==='kom'){a=Math.min(Aw,acik);}
  else if(tur==='ltd'){a=Math.min(Aw,kamuAcik/2);b=Math.min(Bw,kamuAcik/2);}
  return {D,acik,kamuAcik,a,b,kayip:acik-a-b,sirket:Math.min(V,D)};
}
function K_sorumluluk(root,api){
  const L=kl(root,'Şirket borçlarını ödeyemediğinde açığı kim karşılar? İki ortaklı bir şirkette (paylar eşit) A ortağının kişisel varlığı 2.000.000 TL; B ortağınınkini siz belirleyin. Komandit şirkette A <b>komandite</b> (sınırsız sorumlu), B <b>komanditer</b> (koyduğu sermayeyle sınırlı sorumlu) ortaktır. Ortakların sermaye borçlarını tamamen ödediği varsayılmıştır.');
  const ck=checklist(L.task,[{id:'a',t:'Şirket borçlarını varlıklarının üstüne çıkararak bir <b>açık</b> oluşturun.'},{id:'b',t:'Dört şirket türünün hepsini deneyin.'},{id:'c',t:'Kollektif şirkette B\'nin kişisel varlığı yetmediğinde açığı <b>A\'nın tamamladığını</b> görün.'}],api);
  let tur='kol';const seen=new Set(['kol']);
  seg(L.ctl,'Şirket türü',Object.entries(TURAD).map(([k,v])=>[k,v.split(' ')[0]]),'kol',v=>{tur=v;seen.add(v);if(seen.size===4)ck.mark('b');draw(1);});
  const V=sl(L.ctl,{label:'Şirketin varlıkları',min:0,max:5000000,step:100000,value:1500000,fmt:v=>tl(v)});
  const Do=sl(L.ctl,{label:'Özel borçlar (satıcılar, banka)',min:0,max:5000000,step:100000,value:2400000,fmt:v=>tl(v)});
  const Dk=sl(L.ctl,{label:'Kamu borçları (vergi, SGK)',min:0,max:1000000,step:50000,value:200000,fmt:v=>tl(v)});
  const Bw=sl(L.ctl,{label:'B ortağının kişisel varlığı',min:0,max:3000000,step:50000,value:300000,fmt:v=>tl(v)});
  legend(L.leg,[['box f2','Özel borç'],['box f5','Kamu borcu'],['box f1','Şirket varlıkları'],['box f4','A ortağı'],['box f3','B ortağı'],['box fg','Karşılanmayan (alacaklının kaybı)']]);
  const ro=readouts(L.ro,[['ac','Açık (borç − varlık)'],['a','A ortağının ödediği'],['b','B ortağının ödediği'],['k','Alacaklıların kaybı']]);
  function draw(u){
    const r=sorumluluk(tur,V.v,Do.v,Dk.v,2000000,Bw.v);
    stackChart(L.ch,[{name:'Şirket borçları',items:[['Özel',Do.v,'f2'],['Kamu',Dk.v,'f5']]},{name:'Borcu karşılayan',items:[['Şirket',r.sirket,'f1'],['A',r.a,'f4'],['B',r.b,'f3'],['Karşılanmayan',r.kayip,'fg']]}],{aria:'Şirket borçlarının karşılanması'});
    ro.set('ac',tl(r.acik));ro.set('a',tl(r.a));ro.set('b',tl(r.b));ro.set('k',tl(r.kayip));
    const not={kol:'Kollektif şirket ortakları, şirket borçlarından şirket malvarlığıyla ödenemeyen kısım için <b>sınırsız ve müteselsil</b> sorumludur: alacaklı açığın tamamını ortaklardan herhangi birinden isteyebilir. Ortaklar aralarında sözleşmedeki paylara göre rücu eder.',
      kom:'Komandit şirkette komandite ortak kollektif ortak gibi sınırsız sorumludur; komanditer ortak yalnızca koymayı taahhüt ettiği sermaye kadar sorumludur.',
      ltd:'Limited şirket ortakları şirket borçlarından sorumlu değildir; ancak şirketten tahsil edilemeyen <b>kamu alacaklarından</b> sermaye payları oranında sorumludur (6183 sayılı Kanun md. 35).',
      as:'Anonim şirkette pay sahipleri yalnızca taahhüt ettikleri sermayeyi ödemekle yükümlüdür. Tahsil edilemeyen kamu alacakları için sorumluluk pay sahiplerine değil kanuni temsilcilere (yönetim kurulu üyelerine) yöneltilir.'}[tur];
    L.x.innerHTML=`<div class="note">${not}</div>`;
    if(u){if(r.acik>0)ck.mark('a');if(tur==='kol'&&r.acik>0&&Bw.v<r.acik/2&&r.a>r.acik/2+1)ck.mark('c');}
  }
  [V,Do,Dk,Bw].forEach(x=>x.on(()=>draw(1)));draw(0);
}
function paylas(K,sa,sb,kural){
  if(kural==='faiz'&&K>0){const fa=.1*sa,fb=.1*sb,r=K-fa-fb;return [fa+r/2,fb+r/2];}
  if(kural==='sermaye')return [K*sa/(sa+sb),K*sb/(sa+sb)];
  return [K/2,K/2];
}
function K_paylasim(root,api){
  const L=kl(root,'Kollektif şirkette kâr ve zarar ortaklar arasında <b>şirket sözleşmesine</b> göre paylaşılır; sözleşmede hüküm yoksa ortaklar eşit pay alır. Şahıs şirketleri kurumlar vergisi mükellefi değildir ve kanuni yedek akçe ayırma zorunlulukları yoktur; ortakların payları ortaklar adına açılan <b>alt hesaplarda</b> izlenir.');
  const ck=checklist(L.task,[{id:'a',t:'Üç paylaşım kuralını da deneyin.'},{id:'b',t:'Dönemi <b>zararla</b> kapatın ve zararın ortaklara nasıl yüklendiğini görün.'}],api);

/* ---------- DERS 5 — Tahvil ihracı ---------- */
function tahvilFiyat(N,c,y,n){let P=0;for(let t=1;t<=n;t++)P+=(c*N+(t===n?N:0))/Math.pow(1+y,t);return P;}
function tahvilPlan(N,c,y,n){const P=tahvilFiyat(N,c,y,n),d=[],e=[];let cv=P;for(let t=0;t<=n;t++){d.push([t,P+(N-P)*t/n]);if(t>0)cv=cv*(1+y)-c*N;e.push([t,t===n?N:cv]);}return {P,d,e};}
function K_tahvil(root,api){
  const N=1000000;
  const L=kl(root,`Defne Ticaret nominal değeri ${tl(N)} olan, yılda bir kupon ödeyen tahvil ihraç ediyor. Piyasa getirisi kupon oranından yüksekse yatırımcı tahvili nominal değerin altında alır (<b>iskontolu ihraç</b>). Aradaki fark <b>408 Menkul Kıymetler İhraç Farkı (−)</b> hesabında izlenir ve vadeye kadar faiz giderine dönüştürülür. Defter değerinin vadeye kadar nominal değere nasıl ulaştığını iki yöntemle izleyin.`);
  const ck=checklist(L.task,[{id:'a',t:'Tahvili <b>iskontolu</b> ihraç edin.'},{id:'b',t:'Kupon oranını piyasa getirisine eşitleyin: ihraç farkı ne olur?'},{id:'c',t:'İskontolu ve 5 yıl vadeli bir tahvilde doğrusal ve etkin faiz yöntemlerinin 1. yıl faiz giderlerini karşılaştırın.'}],api);
  const c=sl(L.ctl,{label:'Kupon oranı',min:0,max:60,step:1,value:30,fmt:v=>'%'+v});
  const y=sl(L.ctl,{label:'Piyasa getirisi (ihraç anında)',min:5,max:70,step:1,value:40,fmt:v=>'%'+v});
  const n=sl(L.ctl,{label:'Vade',min:2,max:5,step:1,value:3,fmt:v=>v+' yıl'});
  legend(L.leg,[['l1','Doğrusal itfa (uygulamada yaygın)'],['l2','Etkin faiz yöntemi (TFRS 9)'],['ref','Nominal değer']]);
  const ro=readouts(L.ro,[['P','İhraç bedeli'],['f','İhraç farkı (408)'],['gd','1. yıl faiz gideri · doğrusal'],['ge','1. yıl faiz gideri · etkin faiz'],['t','Toplam faiz gideri (vade boyunca)']]);
  function draw(u){
    const cc=c.v/100,yy=y.v/100,nn=n.v,R=tahvilPlan(N,cc,yy,nn),P=R.P,F=N-P;
    const lo=Math.min(P,N),hi=Math.max(P,N),pad=(hi-lo)*.15+20000;
    const f=frame(L.ch,{x:[0,nn],y:niceRange(lo-pad,hi+pad,5),xlab:'Yıl sonu',ylab:'Tahvilin defter değeri (TL)',yfmt:kTL,xticks:[...Array(nn+1).keys()],aria:'Tahvil defter değeri'});
    f.hline(N,'ref','Nominal');f.line(R.d,'l1');f.line(R.e,'l2');R.d.forEach(p=>f.dot(p[0],p[1],'d1',4));R.e.forEach(p=>f.dot(p[0],p[1],'d2',4));
    f.hover(x=>{const t=clamp(Math.round(x),0,nn);return {x:t,pts:[[t,R.d[t][1],'d1'],[t,R.e[t][1],'d2']],html:`<b>${t}. yıl sonu</b><br>Doğrusal: ${tl(R.d[t][1])}<br>Etkin faiz: ${tl(R.e[t][1])}`};});
    const gd=cc*N+F/nn,ge=P*yy;
    ro.set('P',tl(P));ro.set('f',F>0.5?tl(F):F<-0.5?'Primli ihraç: '+tl(-F):'Yok (başa baş)');ro.set('gd',tl(gd));ro.set('ge',tl(ge));ro.set('t',tl(cc*N*nn+F));
    let h='';
    if(F>0.5){h='<h3>Kayıtlar (doğrusal itfa)</h3>'+jt([J('Tahvil ihracı',[B(102,r2(P)),B(408,r2(F)),A(405,N)]),J('1. yıl kupon ödemesi',[B(780,cc*N||0.01),A(102,cc*N||0.01)].filter(x=>cc>0||x)),J('1. yıl ihraç farkı itfası',[B(780,r2(F/nn)),A(408,r2(F/nn))])].filter(e=>e.l[0][1]>0.5));}
    else if(F<-0.5)h='<div class="note">Primli ihraçta ihraç bedeli nominal değeri aşar. TDHP\'de tahvil ihraç primi için ayrı bir hesap yoktur ve uygulama farklılık gösterir; TFRS 9\'a göre tahvil ihraç bedeliyle kaydedilir ve etkin faiz yöntemiyle vadede nominal değere indirgenir (yeşil çizgi).</div>';
    else h='<h3>Kayıt</h3>'+jt([J('Başa baş ihraç',[B(102,N),A(405,N)])],{num:false});
    L.x.innerHTML=h+'<p class="lmeta">Vadesine bir yıldan az kalan tahviller 405\'ten 304 Tahvil Anapara Borç, Taksit ve Faizleri hesabına aktarılır.</p>';
    if(u){if(F>0.5)ck.mark('a');if(c.v===y.v)ck.mark('b');if(F>0.5&&nn===5)ck.mark('c');}
  }
  [c,y,n].forEach(x=>x.on(()=>draw(1)));draw(0);
}

  const kk0=kk.v;
  function draw(u){

    waterfall(L.ch,[{l:'Ticari|kâr',v:tk.v,t:'total'},{l:'KKEG',v:kk.v},{l:'İstisna ve|indirimler',v:-is.v},{l:'Matrah',v:Mr,t:'total'}],{aria:'Ticari kârdan vergi matrahına',h:300});
    ro.set('m',Mr<0?'Mali zarar: '+tl(-Mr):tl(M));ro.set('v',tl(Vn));ro.set('as',tl(asg)+(asg>Vn?' <span class="flag bad">bağlayıcı</span>':''));

    const ents=[];if(V>0.5)ents.push(J('Kurumlar vergisi karşılığı',[B(691,V),A(370,V)]));if(gv.v>0)ents.push(J('Peşin ödenen geçici verginin bilanço gösterimi',[B(371,gv.v),A(193,gv.v)]));
    L.x.innerHTML=(ents.length?'<h3>Dönem sonu kayıtları</h3>'+jt(ents):'')+'<p class="lmeta">Gelir tablosundaki vergi gideri (691) kurumlar vergisi matrahından düşülmez; kendisi de kanunen kabul edilmeyen giderdir. KKEG örnekleri: vergi cezaları ve gecikme zamları, örtülü kazanç dağıtımı, belirli sınırları aşan binek araç giderleri.</p><div class="note yl yl-only"><b>Yurt içi asgari kurumlar vergisi</b> (5520 sayılı Kanun md. 32/C, 2025\'ten itibaren): hesaplanan vergi, indirim ve istisnalar düşülmeden önceki kurum kazancının %10\'undan az olamaz. Kanun bazı istisna ve indirimlerin bu hesapta da düşülmesine izin verir; burada hiçbir istisnanın düşülemediği varsayılmıştır. TFRS katmanında ödenecek tutar asgari vergiyle karşılaştırılarak bulunur.</div>';
    if(u){if(O<0)ck.mark('a');if(Mr<=0&&tk.v>0)ck.mark('b');if(kk.v!==kk0)ck.mark('c');}

function gecici(q){let cum=0,pd=0;const due=[],cums=[];q.forEach(v=>{cum+=v;cums.push(cum);const d=Math.max(0,.25*Math.max(0,cum)-pd);due.push(d);pd+=d;});const yil=.25*Math.max(0,cum);return {due,cums,pd,yil,son:yil-pd};}
function K_gecici(root,api){
  const L=kl(root,'Geçici vergi, yılın üçer aylık dönemlerinde <b>yılbaşından itibaren birikimli</b> kâr üzerinden hesaplanır; önceki dönemlerde ödenen geçici vergiler düşülür. Yıl sonunda kurumlar vergisi beyannamesinde ödenen geçici vergilerin tamamı mahsup edilir; fazlası iade ya da diğer vergi borçlarına mahsup edilir. Matrahın ticari kâra eşit olduğu varsayılmıştır.');
  const ck=checklist(L.task,[{id:'a',t:'Birikimli kârın düştüğü bir dönem oluşturun: o dönem geçici vergi çıkıyor mu?'},{id:'b',t:'Yıllık beyanda <b>iade / mahsup</b> doğan bir durum oluşturun.'}],api);

    ro.set('c',tl(r.cums[3]));ro.set('p',tl(r.pd));ro.set('y',tl(r.yil));ro.set('s',r.son>=0?'Ödenecek '+tl(r.son):`<span class="flag good">İade / mahsup ${tl(-r.son)}</span>`);
    dtable(L.main,['Dönem','Birikimli kâr','%25','Önceki ödemeler','Bu dönem ödenen'],r.due.map((d,i)=>[i+1,tl(r.cums[i]),tl(.25*Math.max(0,r.cums[i])),tl(r.due.slice(0,i).reduce((a,b)=>a+b,0)),tl(d)]));
    const ilk=r.due.findIndex(d=>d>0.5);
    L.x.innerHTML=(ilk>=0?'<h3>Her ödemenin kaydı</h3>'+jt([J(`Geçici vergi ödemesi (${ilk+1}. dönem)`,[B(193,r.due[ilk]),A(102,r.due[ilk])])],{num:false}):'')+'<div class="note tr">4. dönem geçici vergi beyanı 7338 sayılı Kanunla 2022\'den itibaren kaldırılmış, 7566 sayılı Kanunla (RG 19.12.2025) 1.1.2025\'ten başlayan dönemler için yeniden getirilmiştir. Uygulamadan önce güncel mevzuatı kontrol edin.</div>';
    if(u){if(r.cums.some((c,i)=>i>0&&c<r.cums[i-1]&&r.due[i]===0))ck.mark('a');if(r.son<-0.5)ck.mark('b');}
  }
  qs.forEach(x=>x.on(()=>draw(1)));draw(0);
}

function K_tasfiyeAdim(root,api){
  const L=kl(root,'Ticari faaliyetine son veren bir şirketin tasfiye başlangıç bilançosundan başlayarak varlıkları paraya çevirin, borçları ödeyin ve kalanı ortaklara dağıtın. Mizan her adımdan sonra güncellenir; sonunda bütün hesaplar sıfırlanmalıdır. Vergi göz ardı edilmiştir.');
  const ck=checklist(L.task,[{id:'a',t:'Sekiz adımın hepsini kaydedin ve bütün hesapların sıfırlandığını görün.'},{id:'b',t:'En az <b>altı</b> tahmini doğru yapın.'}],api);
  const ro=readouts(L.ro,[['b','Banka bakiyesi'],['h','Bakiyesi kalan hesap sayısı']]);
  function draw(ents,i){
    const all=[TAS_AC].concat(ents),z=mizan(all,{hl:i>=0?ents[i].l.map(x=>x[0]):[]}),m=balances(all);
    L.ch.innerHTML='<h3 style="margin-top:0">Mizan</h3>'+z.html;
    ro.set('b',tl(net(m,'102')));ro.set('h',Object.keys(m).filter(c=>Math.abs(net(m,c))>0.5).length);
    L.x.innerHTML=ents.length?'<h3>Tasfiye kayıtları</h3>'+jt(ents,{start:2}):'<h3>Açılış</h3>'+jt([TAS_AC]);
  }
  txList(L.ctl,TX_TAS,(ents,i,ok,res)=>{draw(ents,i);if(ents.length===TX_TAS.length){ck.mark('a');if(res.filter(Boolean).length>=6)ck.mark('b');}});
  draw([],-1);
}
function K_tasfiyeOran(root,api){
  const DD=1200000,BOR=400000,SER=500000,OZ=800000,PAY=50000;
  const L=kl(root,`Aynı şirkette varlıkların defter değeri ${tl(DD)}, borçlar ${tl(BOR)}, özkaynak ${tl(OZ)} (sermaye ${tl(SER)}, ${nf(PAY)} pay). Varlıkların tasfiyede kaça satılabileceği ve tasfiye giderleri ortaklara kalan tutarı belirler.`);
  const ck=checklist(L.task,[{id:'a',t:'Ortaklara <b>özkaynağın defter değerinden fazla</b> kalan bir durum oluşturun.'},{id:'b',t:'Ortaklara <b>sermayeden az</b> kalan bir durum oluşturun.'},{id:'c',t:'Şirketin <b>borca batık</b> olduğu bir durum oluşturun.'}],api);
  const r=sl(L.ctl,{label:'Satış bedeli / defter değeri',min:20,max:130,step:5,value:90,fmt:v=>'%'+v});
  const g=sl(L.ctl,{label:'Tasfiye giderleri',min:0,max:200000,step:10000,value:30000,fmt:v=>tl(v)});
  legend(L.leg,[['box f1','Toplam'],['box f3','Artış'],['box f2','Azalış']]);
  const ro=readouts(L.ro,[['k','Ortaklara kalan'],['p','Pay başına'],['d','Durum']]);
  function draw(u){
    const sat=DD*r.v/100,K=sat-g.v-BOR;
    waterfall(L.ch,[{l:'Varlıkların|defter değeri',v:DD,t:'total'},{l:'Satış|farkı',v:sat-DD},{l:'Tasfiye|giderleri',v:-g.v},{l:'Borçların|ödenmesi',v:-BOR},{l:'Ortaklara|kalan',v:K,t:'total'}],{aria:'Tasfiyede ortaklara kalan tutar'});
    ro.set('k',tl(K));ro.set('p',tl(K/PAY,2));
    ro.set('d',K<0?'<span class="flag bad">Borca batık: tasfiye memurları mahkemeye bildirir</span>':K<SER?'<span class="flag bad">Sermayenin altında</span>':'<span class="flag good">Sermaye korunuyor</span>');
    L.x.innerHTML='<p class="lmeta">Vergi açısından tasfiye sonunda ortaklara dağıtılan tutarın ortağın sermaye payını aşan kısmı kâr payı sayılır ve gerçek kişi ortaklarda stopaja tabidir. Tasfiye dönemleri için ayrıca tasfiye kârı üzerinden kurumlar vergisi hesaplanır.</p>';
    if(u){if(K>OZ+0.5)ck.mark('a');if(K>=0&&K<SER)ck.mark('b');if(K<0)ck.mark('c');}
  }
  [r,g].forEach(x=>x.on(()=>draw(1)));draw(0);
}

turler:{title:'Şirket türleri, ortakların sorumluluğu ve şahıs şirketlerinde kâr–zarar paylaşımı',sure:'40 dk',steps:[
 {k:'a',type:'anlatim',title:'Ticaret şirketleri',html:()=>`

 {k:'o',type:'ornek',title:'Defne ve Ortakları Kollektif Şirketi',html:()=>{const e=EX('turler-ornek',[J('Kârın paylaştırılması (sermaye oranında)',[B(590,450000),A(331,300000,'A ortağı'),A(331,150000,'B ortağı')]),J('A ortağının kâr payını çekmesi',[B(331,300000,'A ortağı'),A(102,300000)])]);return `

 {k:'t',type:'turetim',title:'Sorumluluk muhasebeyi neden değiştirir?',html:()=>`
  <p>Sermaye şirketlerinde alacaklının güvencesi yalnızca şirket malvarlığıdır. Bu yüzden kanun sermayenin korunmasını ister: asgari sermaye, kanuni yedek akçe, sermaye kaybı halinde genel kurulun harekete geçmesi (TTK md. 376) ve sermaye azaltımında alacaklıların korunması. Önceki derslerdeki 501, 540 ve 580 hesaplarının hepsi bu korumanın muhasebedeki izidir.</p>
  <p>Şahıs şirketlerinde ise ortakların kişisel malvarlığı da güvencedir. Bu nedenle sermayenin korunmasına ilişkin kurallar gevşektir; ortaklar sermaye ve cari hesapları arasında daha serbest para hareketi yapabilir ve yedek ayırma zorunluluğu yoktur. Muhasebedeki temel fark, her ortağın hesabının ayrı tutulmasıdır: kimin ne kadar sermaye koyduğu ve ne kadar kâr çektiği ortaklar arası hesaplaşmanın temelidir.</p>`},

ihrac:{title:'Hisse senedi ve tahvil ihracı: iskontolu tahvil, ihraç farkı ve etkin faiz',sure:'40 dk',steps:[
 {k:'a',type:'anlatim',title:'Pay ve tahvil ihracı',html:()=>`
  <p><b>Pay (hisse senedi) ihracı</b> sermaye artırımıdır ve 3. derste işlendi: nominal değer 500'e, nominal değeri aşan satış bedeli 520 Hisse Senedi İhraç Primleri'ne yazılır. <b>Tahvil</b> ise şirketin borçlanma aracıdır; sahibine faiz (kupon) ve vadede anapara ödenir.</p>
  <table class="tbl sym"><thead><tr><th>Hesap</th><th>Kullanım</th></tr></thead><tbody>
   <tr><td>405 Çıkarılmış Tahviller</td><td>Vadesi bir yıldan uzun tahvillerin nominal değeri</td></tr>
   <tr><td>408 Menkul Kıymetler İhraç Farkı (−)</td><td>İskontolu ihraçta nominal değer ile ihraç bedeli arasındaki fark</td></tr>
   <tr><td>304 Tahvil Anapara Borç, Taksit ve Faizleri</td><td>Vadesine bir yıldan az kalan tahviller</td></tr>
   <tr><td>780 → 661 Uzun Vadeli Borçlanma Giderleri</td><td>Kupon faizleri ve ihraç farkının itfası</td></tr></tbody></table>
  <p>Piyasa getirisi kupon oranından yüksekse tahvil nominal değerin altında satılır. İhraç farkı yatırımcıya vadede ödenecek ek faizdir; bu yüzden vadeye kadar faiz giderine dönüştürülür (780 borç / 408 alacak). Uygulamada itfa çoğu zaman <b>eşit tutarlarla</b> yapılır.</p>
  <div class="eq">Tahvil fiyatı = Σ<sub><i>t</i>=1</sub><sup><i>n</i></sup> ${fr('<i>c N</i>','(1 + <i>y</i>)<sup><i>t</i></sup>')} + ${fr('<i>N</i>','(1 + <i>y</i>)<sup><i>n</i></sup>')}</div>
  <div class="note yl yl-only"><b>TFRS 9</b>'a göre ihraç edilen tahvil bir finansal yükümlülüktür; ilk kayıtta gerçeğe uygun değerinden (ihraç bedeli, işlem maliyetleri düşülerek) ölçülür, sonra <b>etkin faiz yöntemiyle itfa edilmiş maliyetten</b> izlenir. Her dönemin faiz gideri, dönem başı defter değeri × ihraç anındaki piyasa getirisidir; eşit tutarlı itfa yalnızca fark önemsizse kabul edilebilir.</div>`},
 {k:'o',type:'ornek',title:'Defne Ticaret\'in iki yıllık tahvili',html:()=>{const P=TAH_P,F=r2(1000000-P),e=EX('ihrac-ornek',[J('Tahvil ihracı',[B(102,P),B(408,F),A(405,1000000)]),J('1. yıl kupon ödemesi',[B(780,200000),A(102,200000)]),J('1. yıl ihraç farkı itfası (eşit tutarlı)',[B(780,r2(F/2)),A(408,r2(F/2))])]);return `
  <p><b>Soru.</b> Nominal değeri 1.000.000 TL, kupon oranı %20 (yıllık), vadesi 2 yıl olan tahvil, piyasa getirisi %25 iken ihraç ediliyor. İhraç bedelini bulun ve ilk yılın kayıtlarını yapın.</p>
  <p><b>İhraç bedeli:</b> 200.000 / 1,25 + 1.200.000 / 1,25<sup>2</sup> = 160.000 + 768.000 = <b>${nf(P)} TL</b>. İhraç farkı ${nf(F)} TL.</p>${jt(e)}
  <p>1. yıl toplam faiz gideri 200.000 + 36.000 = 236.000 TL. Etkin faiz yöntemiyle 928.000 × %25 = 232.000 TL olurdu.</p>`;}},

  <p>İhraç bedeli <i>P</i>, kupon akışlarının <i>y</i> oranıyla indirgenmiş değeridir. Her yıl defter değeri faiz kadar artar, kupon ödemesi kadar azalır:</p>

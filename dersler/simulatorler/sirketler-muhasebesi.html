 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary">
  <li>Pay ihracı sermaye artırımıdır (500, 520); tahvil ihracı borçlanmadır (405, 304).</li>
  <li>Piyasa getirisi kupon oranından yüksekse tahvil iskontolu satılır; fark 408'de izlenir ve vadeye kadar faiz giderine dönüştürülür.</li>
  <li>Toplam faiz gideri = kuponlar + ihraç farkı; yöntem yalnızca dağılımı değiştirir.</li>
  <li class="yl-only">TFRS 9 etkin faiz yöntemini ister: faiz gideri = dönem başı defter değeri × ihraç anındaki getiri.</li></ul>
  <p class="lmeta">İzlence: Hafta 10 · ÖÇ4 (izlencede bu hafta ÖÇ4'e bağlı; pay ihracı içerik olarak ÖÇ3 ile ilişkilidir).</p>`}
]},

vergi:{title:'Kurumlar vergisi, geçici vergi ve dönem sonu vergi kayıtları',sure:'40 dk',steps:[
 {k:'a',type:'anlatim',title:'Kurumlar vergisinin hesaplanması',html:()=>`
  <p>Sermaye şirketleri <b>kurumlar vergisi</b> mükellefidir. Vergi, ticari kârdan şu düzeltmelerle bulunan matrah üzerinden hesaplanır:</p>
  <div class="eq">Matrah = Ticari kâr + Kanunen kabul edilmeyen giderler − İstisna ve indirimler (− mahsup edilebilir geçmiş yıl zararları)</div>
  <p>Genel oran %25'tir (bazı finans kuruluşlarında daha yüksek). Yıl içinde üçer aylık dönemler için <b>geçici vergi</b> ödenir; geçici vergi yılbaşından itibaren birikimli kâr üzerinden hesaplanır ve önceki dönemlerde ödenenler düşülür.</p>
  <h3>Kayıtlar</h3>
  <ul><li>Geçici vergi ödemesi: 193 Peşin Ödenen Vergiler ve Fonlar borç / 102 alacak.</li>
  <li>Yıl sonu vergi karşılığı: 691 borç / 370 alacak.</li>
  <li>Bilanço gösterimi: 371 borç / 193 alacak; bilançoda 370 − 371 net görünür.</li>
  <li>Beyanname döneminde ödeme: 370 borç / 371 ve 102 alacak.</li></ul>
  <div class="note tr">Kurumlar vergisi oranı %25, yurt içi asgari kurumlar vergisi %10'dur (5520 sayılı Kanun md. 32/C, 7524 sayılı Kanunla 2025'ten itibaren). 4. dönem geçici vergi 7338 sayılı Kanunla kaldırılmış, 7566 sayılı Kanunla 2025'ten başlayan dönemler için yeniden getirilmiştir. Oranlar ve dönemler sık değiştiği için uygulamadan önce güncel mevzuatı kontrol edin.</div>
  <div class="note yl yl-only"><b>TMS 12</b>'ye göre gelir tablosundaki vergi gideri cari vergi ile ertelenmiş verginin toplamıdır. KKEG gibi <b>kalıcı farklar</b> ertelenmiş vergi doğurmaz; amortisman yöntemi farkı gibi <b>geçici farklar</b> doğurur. Geçmiş yıl zararları, gelecekte vergiye tabi kâr elde edilmesi muhtemelse ertelenmiş vergi varlığı oluşturur.</div>`},
 {k:'o',type:'ornek',title:'Defne Ticaret\'in 2026 kurumlar vergisi',html:()=>{const e=EX('vergi-ornek',[J('Kurumlar vergisi karşılığı',[B(691,462500),A(370,462500)]),J('Geçici vergilerin 371\'e aktarılması',[B(371,400000),A(193,400000)]),J('Beyanname döneminde ödeme',[B(370,462500),A(371,400000),A(102,62500)])]);return `
  <p><b>Soru.</b> Ticari kâr 2.000.000 TL; KKEG 150.000 TL (vergi cezaları, sınırı aşan binek araç giderleri); iştirak kazancı istisnası 300.000 TL; yıl içinde 400.000 TL geçici vergi ödenmiş. Kayıtları yapın.</p>
  <p><b>Matrah:</b> 2.000.000 + 150.000 − 300.000 = 1.850.000 TL. <b>Vergi:</b> 1.850.000 × %25 = <b>462.500 TL</b>. Ödenecek: 462.500 − 400.000 = <b>62.500 TL</b>.</p>${jt(e)}`;}},
 {k:'k1',type:'kesif',core:true,title:'Ticari kârdan vergi matrahına',mount:K_kv},
 {k:'k2',type:'kesif',core:true,title:'Geçici vergi dönemleri',mount:K_gecici},
 {k:'t',type:'turetim',title:'Geçici vergi neden birikimli kâr üzerinden hesaplanır?',html:()=>`
  <p>Geçici vergi, yıllık verginin yıl içine yayılmış bir peşin ödemesidir. <i>k</i>. dönemde ödenecek tutar:</p>
  <div class="eq"><i>GV</i><sub><i>k</i></sub> = max(0; 0,25 × <i>K</i><sub>1..<i>k</i></sub> − Σ<sub><i>j</i>&lt;<i>k</i></sub> <i>GV</i><sub><i>j</i></sub>)</div>
  <p>Birikimli kâr düştüğünde formül negatif sonuç verir; ama ödenmiş geçici vergi yıl içinde iade edilmez, o dönem sıfır ödenir. Böylece yıl içinde toplam ödenen, birikimli kârın <b>ulaştığı en yüksek değerin</b> %25'i olur. Yıllık vergi ise yıl sonu kârına göre hesaplanır; yıl sonu kârı en yüksek birikimli kârdan düşükse fark yıllık beyanda iade edilir ya da başka vergi borçlarına mahsup edilir.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'Ticari kâr 1.000.000 TL, KKEG 80.000 TL, istisnalar 200.000 TL. Kurumlar vergisi matrahı kaç TL\'dir?',ans:880000,abs:1,unit:'TL',hint:'KKEG eklenir, istisna düşülür.',sol:'1.000.000 + 80.000 − 200.000 = <b>880.000 TL</b>.'},
  {id:2,tag:'hesap',p:'Oran %25 ise hesaplanan kurumlar vergisi kaç TL\'dir?',ans:220000,abs:1,unit:'TL',hint:'Matrah × oran.',sol:'880.000 × 0,25 = <b>220.000 TL</b>.'},
  {id:3,tag:'kayit',p:'Bu vergi için yıl sonu karşılık kaydını yapın.',entry:[B(691,220000),A(370,220000)],hint:'Gelir tablosundaki vergi hesabı ile bilançodaki karşılık hesabı.',sol:''},
  {id:4,tag:'kayit',p:'1. dönem geçici vergisi 60.000 TL bankadan ödendi.',entry:[B(193,60000),A(102,60000)],hint:'Peşin ödenen vergi bir dönen varlıktır.',sol:''},
  {id:5,tag:'hesap',p:'Birikimli kâr 1. dönemde 400.000 TL, 2. dönemde 700.000 TL. 1. dönemde 100.000 TL geçici vergi ödendi. 2. dönemde ödenecek geçici vergi kaç TL\'dir?',ans:75000,abs:1,unit:'TL',hint:'Birikimli kâr × %25 − önceki ödemeler.',sol:'700.000 × 0,25 − 100.000 = <b>75.000 TL</b>.'},
  {id:6,tag:'kavram',p:'Aşağıdakilerden hangisi kanunen kabul edilmeyen gider (KKEG) örneğidir?',opts:['Personel ücretleri','Ödenen vergi cezaları','İşyeri kirası','Normal amortisman'],correct:1,hint:'Matrahtan indirilmesi kanunla yasaklanan giderler.',sol:'<b>Vergi cezaları</b> (ve gecikme zamları) matrahtan indirilemez.'},
  {id:7,tag:'hesap',yl:1,p:'Ticari kâr 1.000.000 TL, KKEG yok, istisna 900.000 TL; bu istisnanın asgari vergi hesabında düşülemediğini varsayın. Asgari kurumlar vergisi dikkate alındığında ödenecek vergi kaç TL\'dir?',ans:100000,abs:1,unit:'TL',hint:'Normal vergi ile istisna öncesi kazancın %10\'unu karşılaştırın.',sol:'Normal: (1.000.000 − 900.000) × %25 = 25.000; asgari: 1.000.000 × %10 = 100.000 → <b>100.000 TL</b>.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary">
  <li>Matrah = ticari kâr + KKEG − istisna ve indirimler; genel oran %25, asgari vergi %10.</li>
  <li>Geçici vergi birikimli kâr üzerinden hesaplanır ve 193'te izlenir; yıllık beyanda mahsup edilir, fazlası iade ya da mahsup edilir.</li>
  <li>Kayıtlar: 691 / 370 (karşılık), 371 / 193 (gösterim), 370 / 371 ve 102 (ödeme).</li>
  <li>Kâr payı stopajı 4. derste işlendi.</li></ul>
  <p class="lmeta">İzlence: Dersin içeriğindeki "vergi yükümlülükleri" (haftalık planda ayrı hafta yok) · ÖÇ4.</p>`}
]},

bolunme:{title:'Şirket bölünmesi: tam ve kısmi bölünme, iştirak ve ortaklık modeli',sure:'35 dk',steps:[
 {k:'a',type:'anlatim',title:'Bölünme türleri',html:()=>`
  <p>TTK'ya göre (md. 159 vd.) iki tür bölünme vardır:</p>
  <ul><li><b>Tam bölünme:</b> Şirketin bütün malvarlığı bölümlere ayrılarak başka şirketlere devredilir; bölünen şirket sona erer. Ortaklarına devralan şirketlerin payları verilir.</li>
  <li><b>Kısmi bölünme:</b> Şirketin bir ya da birden fazla bölümü başka şirketlere devredilir; bölünen şirket devam eder. Karşılık paylar ya <b>bölünen şirketin ortaklarına</b> (ortaklık modeli) ya da <b>bölünen şirketin kendisine</b> (iştirak modeli) verilir.</li></ul>
  <h3>Kayıtlar (kayıtlı değerlerle)</h3>
  <p>Vergi kanunlarındaki koşullar sağlandığında bölünme kayıtlı değerler üzerinden ve vergisiz yapılır. İştirak modelinde bölünen şirket devrettiği varlık ve borçları kapatır, karşılığında aldığı payları <b>242 İştirakler</b> ya da <b>245 Bağlı Ortaklıklar</b> hesabına alır. Ortaklık modelinde devredilen net varlık kadar özkaynak azalır (sermaye azaltımı ya da özkaynak kalemleri). Devralan şirket varlıkları borç, borçları alacak, sermayesini 500'e alacak kaydeder.</p>
  <div class="note yl yl-only">Bölünen şirketin kendi bağlı ortaklığına yaptığı devir (iştirak modeli) grup açısından bir kontrol değişikliği yaratmaz ve <b>TFRS 3</b> kapsamında bir işletme birleşmesi değildir; konsolide tablolarda varlıklar kayıtlı değerleriyle kalır.</div>`},
 {k:'o',type:'ornek',title:'Defne Ticaret lojistik bölümünü ayırıyor',html:()=>`
  <p><b>Soru.</b> Defne Ticaret'in bilançosu aşağıdadır. Lojistik bölümü (depo binası 800.000 TL, taşıtlar 500.000 TL, bu varlıkları finanse eden 400.000 TL banka kredisi) kısmi bölünmeyle yeni kurulan Defne Lojistik A.Ş.'ye devrediliyor. İki model için kayıtları yapın.</p>
  ${jt([BOL_ONCE],{num:false})}
  <p><b>Devredilen net varlık:</b> 800.000 + 500.000 − 400.000 = <b>900.000 TL</b>. Yeni şirketin sermayesi 900.000 TL olacak.</p>
  ${jt([BOL_IST,BOL_ORT,BOL_YENI])}`},
 {k:'k1',type:'kesif',core:true,title:'İştirak modeli ve ortaklık modeli',mount:K_bolunme},
 {k:'t',type:'turetim',title:'İki modelde değer nereye gider?',html:()=>`
  <p>Bölünme öncesinde ortaklar, Defne Ticaret'in tamamına sahiptir. <b>İştirak modelinde</b> ortakların sahip olduğu şey değişmez: Defne'nin aktifinde 1.300.000 TL'lik varlık ve 400.000 TL'lik borç yerine 900.000 TL'lik bağlı ortaklık payı yer alır; ortaklar lojistik bölümüne Defne üzerinden dolaylı olarak sahiptir.</p>
  <p><b>Ortaklık modelinde</b> ortaklar lojistik bölümüne doğrudan sahip olur. Bu yüzden 900.000 TL'lik net varlık Defne'den çıkar ve karşılığı Defne'ye değil ortaklara gider; Defne'nin özkaynağı aynı tutarda azalır. Ortakların toplam serveti iki modelde de aynıdır (iki şirketin özkaynakları toplamı 1.800.000 TL); değişen, servetin hangi şirket üzerinden tutulduğudur.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'kavram',p:'Bölünen şirketin sona erdiği bölünme türü hangisidir?',opts:['Kısmi bölünme','Tam bölünme','İştirak modeli','Kolaylaştırılmış bölünme'],correct:1,hint:'Malvarlığının tamamı devredilir.',sol:'<b>Tam bölünmede</b> bütün malvarlığı devredilir ve bölünen şirket sona erer.'},
  {id:2,tag:'kayit',p:'İştirak modeliyle kısmi bölünme: maliyeti 600.000 TL olan makineler ve bunlara bağlı 200.000 TL banka kredisi yeni kurulan ve tamamına sahip olunacak şirkete devredildi.',entry:[B(245,400000),B(300,200000),A(253,600000)],hint:'Net varlık karşılığında alınan paylar bağlı ortaklıktır.',sol:'Net devir 400.000 TL; paylar 245\'e alınır.'},
  {id:3,tag:'kayit',p:'Aynı devri yeni şirketin (devralanın) defterinde kaydedin; sermayesi 400.000 TL.',entry:[B(253,600000),A(300,200000),A(500,400000)],hint:'Devralınan varlık borç, üstlenilen borç ve sermaye alacak.',sol:''},
  {id:4,tag:'kavram',p:'Ortaklık modelinde yeni şirketin payları kime verilir?',opts:['Bölünen şirketin kendisine','Bölünen şirketin ortaklarına','Alacaklılara','Devralan şirketin yöneticilerine'],correct:1,hint:'Modelin adı ipucu veriyor.',sol:'<b>Bölünen şirketin ortaklarına</b>.'},
  {id:5,tag:'hesap',p:'Ortaklık modelinde 2. sorudaki devir yapılsaydı bölünen şirketin özkaynağı kaç TL azalırdı?',ans:400000,abs:1,unit:'TL',hint:'Devredilen net varlık.',sol:'600.000 − 200.000 = <b>400.000 TL</b>.'},
  {id:6,tag:'kavram',p:'Vergisiz bölünmede varlıklar devralan şirkete hangi değerle devredilir?',opts:['Gerçeğe uygun değerle','Kayıtlı (defter) değerleriyle','Piyasa değeriyle','Yeniden değerleme sonrası değerle'],correct:1,hint:'Vergisiz devrin temel koşulu.',sol:'<b>Kayıtlı değerlerle</b>; böylece bölünme anında vergilendirilecek bir değer artışı doğmaz.'},
  {id:7,tag:'kavram',yl:1,p:'İştirak modeliyle kendi %100 bağlı ortaklığına bölüm devreden şirket, konsolide tablolarında bu işlemi TFRS 3\'e göre işletme birleşmesi olarak mı gösterir?',opts:['Evet, şerefiye hesaplanır','Hayır; kontrol değişmediği için varlıklar kayıtlı değerleriyle kalır','Evet, pazarlıklı satın alma kazancı doğar','Yalnızca bölünme vergisizse'],correct:1,hint:'Devirden önce de sonra da varlıkları aynı şirket kontrol ediyor.',sol:'Kontrol değişmez; işlem <b>TFRS 3 kapsamında değildir</b>.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary">
  <li>Tam bölünmede şirket sona erer; kısmi bölünmede devam eder.</li>
  <li>İştirak modelinde paylar bölünen şirkete gelir (242/245); özkaynak değişmez.</li>
  <li>Ortaklık modelinde paylar ortaklara gider; bölünen şirketin özkaynağı devredilen net varlık kadar azalır.</li>
  <li>Vergisiz bölünmede devir kayıtlı değerlerle yapılır.</li></ul>
  <p class="lmeta">İzlence: Hafta 12 · ÖÇ5.</p>`}
]},

tasfiye:{title:'Tasfiye: varlıkların paraya çevrilmesi, borçların ödenmesi ve dağıtım',sure:'40 dk',steps:[
 {k:'a',type:'anlatim',title:'Tasfiye süreci',html:()=>`
  <p>Sona eren bir sermaye şirketi <b>tasfiye</b> edilir (TTK md. 529 vd.). Şirketin tüzel kişiliği tasfiye süresince devam eder; unvanına "<b>tasfiye hâlinde</b>" ibaresi eklenir ve şirketi tasfiye memurları temsil eder.</p>
  <ol><li>Tasfiye memurları <b>tasfiye başlangıç bilançosunu</b> çıkarır.</li>
  <li>Alacaklılar ticaret sicili gazetesinde ve şirketin internet sitesinde <b>üç kez ilanla</b> alacaklarını bildirmeye çağrılır.</li>
  <li>Alacaklar tahsil edilir, varlıklar paraya çevrilir, borçlar ödenir. Şirket borca batık çıkarsa tasfiye memurları durumu mahkemeye bildirir.</li>
  <li>Borçlar ödendikten sonra kalan tutar, kanunda öngörülen bekleme süresinden sonra ortaklara paylarına göre dağıtılır.</li>
  <li>Tasfiye sonu bilançosu hazırlanır, şirket sicilden silinir.</li></ol>
  <h3>Kayıtlar</h3>
  <p>Tasfiye kâr ve zararları gelir tablosu hesaplarında izlenir (satışlar 600 / 621, satış zararları ve tasfiye giderleri 689, kârlar 679) ve 690'da toplanır. Uygulamada ayrıca "tasfiye kâr ve zararı" adlı yardımcı bir hesap da kullanılır. Kalan özkaynak 331 Ortaklara Borçlar hesabına aktarılır ve ödenir.</p>
  <div class="note tr">Vergi açısından tasfiye dönemleri için tasfiye kârı üzerinden kurumlar vergisi hesaplanır; ortaklara dağıtılan tutarın sermaye payını aşan kısmı kâr payı sayılır ve gerçek kişi ortaklarda stopaja tabidir. Simülatörde vergi göz ardı edilmiştir.</div>
  <div class="note yl yl-only"><b>TMS 1</b>'e göre yönetim işletmeyi tasfiye etmeyi amaçlıyorsa ya da faaliyetini sürdürmekten başka gerçekçi bir seçeneği yoksa finansal tablolar <b>işletmenin sürekliliği esasına göre hazırlanmaz</b>; bu durum ve kullanılan esas açıklanır.</div>`},
 {k:'o',type:'ornek',title:'Tasfiye başlangıç bilançosu',html:()=>`
  <p>Ticari faaliyetine son veren bir anonim şirketin tasfiye başlangıç bilançosu:</p>${jt([TAS_AC],{num:false})}
  <p>Aktif toplamı 1.200.000 TL (bina net 600.000 TL), borçlar 400.000 TL, özkaynak 800.000 TL. Varlıklar defter değerinden satılabilse ortaklara 800.000 TL kalırdı. Keşif 1'de tahsil edilemeyen alacaklar, satış farkları ve tasfiye giderleri bu tutarı 760.000 TL'ye indirecek.</p>`},
 {k:'k1',type:'kesif',core:true,title:'Tasfiye adım adım',mount:K_tasfiyeAdim},
 {k:'k2',type:'kesif',core:false,title:'Ortaklara ne kalır?',mount:K_tasfiyeOran},
 {k:'t',type:'turetim',title:'Tasfiye neden bütün hesapları sıfırlar?',html:()=>`
  <p>Tasfiyede her varlık ya paraya çevrilir ya da (tahsil edilemiyorsa) zarar yazılır; her borç ödenir. Gelir tablosu hesapları 690'da toplanır ve 690 özkaynağa kapatılır. Bu noktada bilançoda yalnızca banka ve özkaynak kalır:</p>
  <div class="eq">Banka = Özkaynak (defter değeri) ± Tasfiye kâr veya zararı</div>
  <p>Kalan banka bakiyesi ortaklara borç olarak aktarılıp ödenince denklemin iki tarafı da sıfırlanır. Ortaklara kalan tutar, özkaynağın defter değerinden ancak varlıklar defter değerinden yüksek satılabilirse fazla olur.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'kavram',p:'Tasfiye hâlindeki bir şirketi kim temsil eder?',opts:['Yönetim kurulu','Tasfiye memurları','Ticaret sicili müdürü','Alacaklılar kurulu'],correct:1,hint:'Tasfiye sürecini yürüten organ.',sol:'<b>Tasfiye memurları</b>.'},
  {id:2,tag:'kavram',p:'Tasfiyede alacaklılar alacaklarını bildirmeye kaç kez ilanla çağrılır?',opts:['Bir','İki','Üç','Çağrı gerekmez'],correct:2,hint:'TTK\'daki çağrı sayısı.',sol:'<b>Üç kez</b>.'},
  {id:3,tag:'kayit',p:'150.000 TL\'lik alacağın 140.000 TL\'si tahsil edildi; kalanı tahsil edilemeyecek.',entry:[B(102,140000),B(689,10000),A(120,150000)],hint:'Tahsil edilemeyen kısım tasfiye zararıdır.',sol:''},
  {id:4,tag:'kayit',p:'Maliyeti 400.000 TL, birikmiş amortismanı 250.000 TL olan makine 120.000 TL\'ye peşin satıldı (KDV göz ardı).',entry:[B(102,120000),B(257,250000),B(689,30000),A(253,400000)],hint:'Net defter değeri 150.000 TL.',sol:''},

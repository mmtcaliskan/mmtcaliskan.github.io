<style>

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15.5px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.hero{display:flex;gap:18px 28px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin:8px 0 16px}

.ti{display:flex;gap:8px;margin:5px 0}

.flag{display:inline-flex;gap:5px;align-items:center;font-weight:600;font-size:.82rem;padding:1px 9px;border-radius:99px}

.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.8rem;color:var(--ink2);margin-bottom:2px}

.sw{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--ink2)}

.sw.ref{border-top:1.5px dashed var(--ink2)}
.sw.box{width:12px;height:12px;border:0;border-radius:3px}
.sw.box.f1{background:var(--s1)} .sw.box.f2{background:var(--s2)} .sw.box.f3{background:var(--s3)} .sw.box.f4{background:var(--s4)} .sw.box.f5{background:var(--s5)}
.sw.box.fg{background:var(--axis)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.tick{fill:var(--ink2);font-size:11.5px;font-variant-numeric:tabular-nums}
.atitle{fill:var(--ink2);font-size:12px}
.l1,.l2,.l3{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.l1{stroke:var(--s1)} .l2{stroke:var(--s2)} .l3{stroke:var(--s3)}
.ref{stroke:var(--ink2);stroke-width:1.25;stroke-dasharray:4 4;fill:none}
.cur{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.d2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.d3{fill:var(--s3);stroke:var(--surface);stroke-width:2}
.f1{fill:var(--s1)} .f2{fill:var(--s2)} .f3{fill:var(--s3)} .f4{fill:var(--s4)} .f5{fill:var(--s5)} .fg{fill:var(--axis)}
.seg-r{stroke:var(--surface);stroke-width:2}
.area1{fill:var(--s1);opacity:.14} .area-g{fill:var(--good);opacity:.14} .area-c{fill:var(--crit);opacity:.12}
.bar1{fill:var(--s1)} .bar1.dim{opacity:.38}
.ref2{stroke:var(--axis);stroke-width:1.25;stroke-dasharray:2 3;fill:none}
.sw.box.bar1{background:var(--s1)} .sw.box.area1{background:var(--s1);opacity:.3}
.sw.box.area-g{background:var(--good);opacity:.35} .sw.box.area-c{background:var(--crit);opacity:.3}
.sw.dot{width:10px;height:10px;border:0;border-radius:50%;background:var(--ink)} .sw.dot.d2{background:var(--s2)} .sw.dot.d3{background:var(--s3)}
.dim{opacity:.38}
.lab,.lab2{font-size:12px;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.lab{fill:var(--ink)} .lab2{fill:var(--ink2)}
.labin{font-size:11.5px;fill:#fff;font-variant-numeric:tabular-nums}

.hov line{stroke:var(--ink2);stroke-width:1}

.dtw{max-height:260px;overflow:auto}

.qn{margin-left:auto;font-size:.76rem;color:var(--ink2)}

input.num,input.acc,select.sel{font:inherit;padding:6px 10px;border:1px solid var(--axis);border-radius:8px;background:var(--surface);color:var(--ink)}
input.num{width:190px}
.unit{color:var(--ink2);font-size:.9rem}
.opts label{display:flex;gap:8px;align-items:flex-start;padding:3px 0;cursor:pointer}
.opts input{margin-top:5px}
.fb{margin-top:10px;padding:8px 12px;border-radius:8px;font-size:.9rem}
.fb:empty{display:none}

.qsum{font-size:.86rem;color:var(--ink2);margin-bottom:4px}
.about{font-size:.8rem;color:var(--ink2);margin-top:30px;border-top:1px solid var(--grid);padding-top:14px}
.map summary{cursor:pointer;font-weight:600}

.done-box{text-align:center;padding:30px}
.summary li{margin:.35em 0}
/* ---- Muhasebeye özgü bileşenler ---- */
.jt{border-collapse:collapse;font-size:.88rem;margin:8px 0 12px;font-variant-numeric:tabular-nums;min-width:min(100%,520px)}

.mono{font-variant-numeric:tabular-nums}

<script>
"use strict";
/* ============================================================
   Muhasebe simülatörleri — ortak motor, sürüm 0.1 (pilot), 27.11.2026
   Özgün kod. Mimari 12_Finans_Simulatoru ile aynıdır; ders akışı
   fikri M. Songur'un Mikroekonomi Simülatörü'nden esinlenmiştir,
   o çalışmadan kod alınmamıştır.
   ============================================================ */

/* ---------- Yardımcılar ---------- */
const $=(s,r=document)=>r.querySelector(s);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function nf(x,d=0){return Number(x).toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d});}
function tl(x,d=0){return (x<-1e-9?'−':'')+nf(Math.abs(x),d)+' TL';}
function pc(x,d=1){return (x<-1e-12?'−%':'%')+nf(Math.abs(x)*100,d);}
function pp(x,d=1){return (x<-1e-12?'−':'')+nf(Math.abs(x)*100,d)+' puan';}
function kTL(v){const a=Math.abs(v),s=v<0?'−':'';if(a>=1e6)return s+nf(a/1e6,(a%1e6)?1:0)+' mn';if(a>=1e3)return s+nf(a/1e3,0)+' bin';return s+nf(a,0);}
function fr(n,d){return `<span class="fr"><span>${n}</span><span>${d}</span></span>`;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function r2(x){return Math.round(x*100)/100;}
const pctFmt=v=>'%'+nf(v,Number.isInteger(v)?0:1);

/* ---------- Tekdüzen Hesap Planı (ders kapsamındaki hesaplar) ----------
   Bakiye yönü: B = borç bakiyesi verir, A = alacak bakiyesi verir, X = her ikisi */
const TDHP_SRC=`100|Kasa|B;101|Alınan Çekler|B;102|Bankalar|B;103|Verilen Çekler ve Ödeme Emirleri (−)|A;108|Diğer Hazır Değerler|B;
110|Hisse Senetleri|B;111|Özel Kesim Tahvil, Senet ve Bonoları|B;112|Kamu Kesimi Tahvil, Senet ve Bonoları|B;118|Diğer Menkul Kıymetler|B;119|Menkul Kıymetler Değer Düşüklüğü Karşılığı (−)|A;
120|Alıcılar|B;121|Alacak Senetleri|B;122|Alacak Senetleri Reeskontu (−)|A;126|Verilen Depozito ve Teminatlar|B;127|Diğer Ticari Alacaklar|B;128|Şüpheli Ticari Alacaklar|B;129|Şüpheli Ticari Alacaklar Karşılığı (−)|A;
131|Ortaklardan Alacaklar|B;135|Personelden Alacaklar|B;136|Diğer Çeşitli Alacaklar|B;
150|İlk Madde ve Malzeme|B;151|Yarı Mamuller|B;152|Mamuller|B;153|Ticari Mallar|B;157|Diğer Stoklar|B;158|Stok Değer Düşüklüğü Karşılığı (−)|A;159|Verilen Sipariş Avansları|B;
180|Gelecek Aylara Ait Giderler|B;181|Gelir Tahakkukları|B;190|Devreden KDV|B;191|İndirilecek KDV|B;193|Peşin Ödenen Vergiler ve Fonlar|B;195|İş Avansları|B;196|Personel Avansları|B;

function niceStep(span,n){const s0=span/n,mag=Math.pow(10,Math.floor(Math.log10(s0))),e=s0/mag;return mag*(e>=7.5?10:e>=3.5?5:e>=1.5?2:1);}
function niceTicks(a,b,n=5){if(!(b>a))return [a];const st=niceStep(b-a,n),out=[];for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-6;v+=st)out.push(Math.round(v/st)*st||0);return out;}
function niceMax(v,n=5){if(!(v>0))return 1;const st=niceStep(v,n);return Math.ceil(v*1.0001/st)*st;}
function niceRange(lo,hi,n=5){if(hi-lo<1e-9){hi=lo+1;}const st=niceStep(hi-lo,n);return [Math.floor(lo/st)*st,Math.ceil(hi/st)*st];}

function frame(host,o){

      if(p.x<f.m.l-4||p.x>f.W-f.m.r+4||p.y<f.m.t-4||p.y>f.H-f.m.b+4){hide();return;}

      (r.pts||[]).forEach(q=>{if(isFinite(q[1])&&q[1]>=f.o.y[0]&&q[1]<=f.o.y[1])s+=`<circle cx="${f.X(q[0])}" cy="${f.Y(q[1])}" r="5" class="${q[2]||'cur'}"/>`;});
      g.innerHTML=s;

  const pw=W-m.l-m.r,ph=H-m.t-m.b;

  else{(o.xticks||niceTicks(o.x[0],o.x[1],6)).forEach(v=>{if(v<o.x[0]-1e-9||v>o.x[1]+1e-9)return;s+=`<text class="tick" x="${X(v)}" y="${H-m.b+18}" text-anchor="middle">${o.xfmt?o.xfmt(v):nf(v)}</text>`;});}

    /* x0..x1 veri biriminde; v0..v1 değer aralığı; round: uç yuvarlatma (veri ucu) */

/* ---------- Alıştırmalar ---------- */
function parseNum(s){
  s=String(s).trim().replace(/\s/g,'').replace(/TL|tl|adet|yıl|gün|pay|%/g,'').replace(/[−–]/g,'-');
  if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  return Number(s);
}
function isRight(q,v){if(!isFinite(v))return false;const t=q.abs!=null?q.abs:Math.max(Math.abs(q.ans)*(q.rel||0.005),0.01);return Math.abs(v-q.ans)<=t;}
function netMap(lines){const m={};lines.forEach(([c,b,a])=>{m[c]=(m[c]||0)+b-a;});Object.keys(m).forEach(c=>{if(Math.abs(m[c])<0.5)delete m[c];});return m;}
/* Öğrenci satırlarını beklenen kayıtla (ya da alternatifleriyle) karşılaştırır */
function gradeEntry(q,lines){
  const tol=q.tol||1;const sm=netMap(lines);
  const res=[q.entry].concat(q.alt||[]).map(ex=>{const em=netMap(ex);const codes=new Set([...Object.keys(em),...Object.keys(sm)]);let good=0,bad=0;
    codes.forEach(c=>{if(em[c]!=null&&sm[c]!=null&&Math.abs(em[c]-sm[c])<=tol)good++;else bad++;});
    return {ok:bad===0,good,total:Object.keys(em).length,wrongAcc:Object.keys(sm).filter(c=>em[c]==null)};});
  return res.find(r=>r.ok)||res.reduce((a,b)=>(b.good-b.wrongAcc.length)>(a.good-a.wrongAcc.length)?b:a);
}

  ensureDatalist();
  const upd=()=>{const n=qs.length,d=qs.filter(q=>(S.qs[lid+':'+q.id]||{}).s).length,f=qs.filter(q=>{const s=S.qs[lid+':'+q.id];return s&&s.s==='ok'&&s.a===0;}).length;
    sum.innerHTML=`Cevaplanan: <b>${d}/${n}</b> · İlk denemede doğru: <b>${f}</b>`;if(d===n)api.unlock();};

function af(r,n){return Math.abs(r)<1e-12?n:(1-Math.pow(1+r,-n))/r;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function gauss(R){const u=R()||1e-9,v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function Ncdf(x){const t=1/(1+0.2316419*Math.abs(x)),d=0.3989422804*Math.exp(-x*x/2),p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p;}
function bs(S,K,r,s,T,call){const d1=(Math.log(S/K)+(r+s*s/2)*T)/(s*Math.sqrt(T)),d2=d1-s*Math.sqrt(T);return call?S*Ncdf(d1)-K*Math.exp(-r*T)*Ncdf(d2):K*Math.exp(-r*T)*Ncdf(-d2)-S*Ncdf(-d1);}

/* ---------- DERS 1 — CAPM ve beta ---------- */
function K_beta(root,api){
  const L=kl(root,'Bir hissenin betası, aylık getirilerinin piyasa getirisine göre regresyonunun eğimidir. Aşağıda 60 aylık getiriler <b>gerçek beta</b> ve <b>firmaya özgü oynaklık</b> ile üretiliyor; siz yalnızca noktaları görüp betayı tahmin ediyorsunuz. Firmaya özgü risk tahmini nasıl etkiler?');
  const ck=checklist(L.task,[{id:'a',t:'Firmaya özgü oynaklığı artırın: R² ne oluyor, tahmin edilen beta nerede kalıyor?'},{id:'b',t:'"Yeni örnek" ile aynı ayarlarda beta tahmininin örnekten örneğe değiştiğini görün.'}],api);
  const b=sl(L.ctl,{label:'Gerçek beta',min:0,max:2.5,step:0.1,value:1.2,fmt:v=>nf(v,1)});
  const e=sl(L.ctl,{label:'Firmaya özgü aylık oynaklık',min:1,max:15,step:1,value:5,fmt:v=>'%'+v});
  let seed=3,yeni=0;const bx=el('div','','<button type="button" class="btn sm">Yeni örnek</button>');L.ctl.appendChild(bx);$('button',bx).onclick=()=>{seed++;yeni++;if(yeni>=2)ck.mark('b');draw(0);};
  legend(L.leg,[['sw dot','Aylık getiri çiftleri'],['l1','Tahmin edilen regresyon doğrusu']]);
  const ro=readouts(L.ro,[['bh','Tahmin edilen beta'],['r2','R²'],['se','Betanın standart hatası',1],['al','Alfa (aylık)',1]]);
  const e0=e.v;
  function draw(u){
    const R=rng(seed),pts=[];for(let k=0;k<60;k++){const m=.01+.06*gauss(R),y=.005+b.v*m+e.v/100*gauss(R);pts.push([m,y]);}
    const n=pts.length,mx=pts.reduce((s,p)=>s+p[0],0)/n,my=pts.reduce((s,p)=>s+p[1],0)/n;let sxy=0,sxx=0,syy=0;pts.forEach(([x,y])=>{sxy+=(x-mx)*(y-my);sxx+=(x-mx)**2;syy+=(y-my)**2;});
    const bh=sxy/sxx,a=my-bh*mx,r2=sxy*sxy/(sxx*syy),sres=Math.sqrt(Math.max(0,(syy-bh*sxy)/(n-2))),se=sres/Math.sqrt(sxx);
    const f=frame(L.ch,{x:[-.2,.2],y:[-.5,.5],xlab:'Piyasa getirisi (aylık)',ylab:'Hisse getirisi',xfmt:v=>'%'+nf(v*100,0),yfmt:v=>'%'+nf(v*100,0),aria:'Hisse ve piyasa getirileri'});
    pts.forEach(p=>f.dot(p[0],p[1],'d2',3.5));f.line([[-.2,a-.2*bh],[.2,a+.2*bh]],'l1');
    ro.set('bh',nf(bh,2));ro.set('r2',nf(r2,2));ro.set('se',nf(se,2));ro.set('al','%'+nf(a*100,2));
    if(u&&e.v>e0&&e.v>=10)ck.mark('a');
  }
  [b,e].forEach(x=>x.on(()=>draw(1)));draw(0);
}

/* ---------- DERS 2 — Sermaye yapısı ve AOSM ---------- */
function wacc(w,o){const DE=w/(1-w),bl=o.bu*(1+(1-o.t)*DE),re=o.rf+bl*o.mrp,rd=o.rf+o.s0+o.k*w*w;return {bl,re,rd,W:(1-w)*re+w*rd*(1-o.t)};}
function K_wacc(root,api){
  const L=kl(root,'Anka Makine\'nin borç oranı (borç / toplam değer) arttıkça iki şey olur: daha ucuz borç (faiz vergiden düşülür) ağırlık kazanır, ama hem özkaynak hem borç daha riskli hâle gelip pahalanır. Ağırlıklı ortalama sermaye maliyetinin (AOSM) en düşük olduğu borç oranını bulun.');
  const ck=checklist(L.task,[{id:'a',t:'AOSM\'nin <b>en düşük</b> olduğu borç oranını bulun (±5 puan).'},{id:'b',t:'Vergi oranını sıfırlayın: en düşük nokta nereye kayıyor?'}],api);
  const w=sl(L.ctl,{label:'Borç oranı, D / V',min:0,max:80,step:5,value:20,fmt:v=>'%'+v});
  const t=sl(L.ctl,{label:'Kurumlar vergisi',min:0,max:40,step:1,value:25,fmt:v=>'%'+v});
  const k=sl(L.ctl,{label:'Borçla artan kredi riski primi',min:0,max:40,step:5,value:15,fmt:v=>nf(v,0)});
  legend(L.leg,[['l1','AOSM'],['l2','Özkaynak maliyeti'],['l3','Vergi sonrası borç maliyeti']]);
  const ro=readouts(L.ro,[['re','Özkaynak maliyeti'],['rd','Borç maliyeti (vergi öncesi)'],['W','AOSM'],['bl','Kaldıraçlı beta',1]]);
  function draw(u){
    const o={rf:.15,mrp:.07,bu:1,t:t.v/100,s0:.02,k:k.v/100},P=[],E=[],D=[];let best=[0,9];
    for(let x=0;x<=80;x+=1){const r=wacc(x/100,o);P.push([x,r.W]);E.push([x,r.re]);D.push([x,r.rd*(1-o.t)]);if(r.W<best[1])best=[x,r.W];}
    const c=wacc(w.v/100,o);

/* ---------- DERS 6 — Temettü politikası ---------- */
const EPS_SERI=[4,4.4,3.2,4.8,5.5,4.1,6,6.6,5.2,7.2,7.8,6.4];
function lintner(c,p){const out=[];let d=EPS_SERI[0]*p;EPS_SERI.forEach((e,i)=>{if(i>0)d=d+c*(p*e-d);out.push(d);});return out;}
function K_lintner(root,api){
  const L=kl(root,'Lintner (1956) gözlemi: yöneticiler temettüyü kârla birlikte dalgalandırmaz; hedef dağıtım oranına <b>kısmi uyum</b> sağlar: <b>D<sub>t</sub> = D<sub>t−1</sub> + c(p·E<sub>t</sub> − D<sub>t−1</sub>)</b>. Uyum hızı <i>c</i> küçüldükçe temettü yumuşar.');
  const ck=checklist(L.task,[{id:'a',t:'Uyum hızını 1 yapın: temettü kârı birebir izliyor mu?'},{id:'b',t:'Uyum hızını 0,3\'ün altına indirin ve temettünün kârdaki düşüşlere tepkisini gözleyin.'}],api);
  const c=sl(L.ctl,{label:'Uyum hızı, c',min:0.1,max:1,step:0.05,value:0.4,fmt:v=>nf(v,2)});
  const p=sl(L.ctl,{label:'Hedef dağıtım oranı, p',min:10,max:80,step:5,value:40,fmt:v=>'%'+v});
  legend(L.leg,[['l1','Hisse başına kâr'],['l2','Hisse başına temettü'],['l3','Hedef temettü p·E']]);
  const ro=readouts(L.ro,[['sd','Temettü değişimlerinin oynaklığı'],['se','Hedef temettünün oynaklığı']]);
  function draw(u){
    const D=lintner(c.v,p.v/100),P=p.v/100,n=EPS_SERI.length;
    const f=frame(L.ch,{x:[1,n],y:[0,8],xlab:'Yıl',ylab:'TL / hisse',aria:'Lintner temettü modeli'});
    f.line(EPS_SERI.map((e,i)=>[i+1,e]),'l1');f.line(EPS_SERI.map((e,i)=>[i+1,e*P]),'l3');f.line(D.map((d,i)=>[i+1,d]),'l2');
    f.hover(x=>{const i=clamp(Math.round(x),1,n)-1;return {x:i+1,pts:[[i+1,EPS_SERI[i],'d1'],[i+1,D[i],'d2']],html:`<b>${i+1}. yıl</b><br>EPS: ${nf(EPS_SERI[i],2)}<br>DPS: ${nf(D[i],2)}`};});
    const sd=a=>{const ch=a.slice(1).map((v,i)=>v-a[i]),m=ch.reduce((s,v)=>s+v,0)/ch.length;return Math.sqrt(ch.reduce((s,v)=>s+(v-m)**2,0)/ch.length);};
    ro.set('sd',nf(sd(D),3));ro.set('se',nf(sd(EPS_SERI.map(e=>e*P)),3));
    if(u){if(c.v>=1)ck.mark('a');if(c.v<0.3)ck.mark('b');}
  }
  [c,p].forEach(x=>x.on(()=>draw(1)));draw(0);
}

/* ---------- DERS 7 — Nakit yönetimi ---------- */
function K_baumol(root,api){
  const L=kl(root,'Baumol modeli: Anka Makine yıl boyunca düzenli olarak <b>T</b> = 1.200.000 TL nakit harcıyor ve nakdini faiz getiren yatırımlardan <b>C</b> büyüklüğündeki aktarımlarla sağlıyor. Her aktarımın sabit maliyeti <b>F</b>; elde tutulan nakdin fırsat maliyeti <b>r</b>. Toplam maliyeti en aza indiren aktarım büyüklüğünü bulun.');
  const ck=checklist(L.task,[{id:'a',t:'Toplam maliyeti en düşük yapan C\'yi bulun (±%10).'},{id:'b',t:'Faiz oranını artırın: en iyi C büyüyor mu, küçülüyor mu?'}],api);
  const C=sl(L.ctl,{label:'Aktarım büyüklüğü, C',min:5000,max:150000,step:1000,value:80000,fmt:v=>tl(v)});
  const F=sl(L.ctl,{label:'Aktarım başına maliyet, F',min:50,max:1000,step:50,value:200,fmt:v=>tl(v)});
  const r=sl(L.ctl,{label:'Fırsat maliyeti, r',min:5,max:60,step:1,value:30,fmt:v=>'%'+v});
  legend(L.leg,[['l1','Toplam maliyet'],['l2','Elde tutma maliyeti (C/2)·r'],['l3','İşlem maliyeti (T/C)·F']]);
  const ro=readouts(L.ro,[['c','C* = √(2TF / r)'],['t','Seçilen C\'de toplam maliyet'],['n','Yıllık aktarım sayısı']]);
  const r0=r.v;
  function draw(u){
    const T=1.2e6,R=r.v/100,FF=F.v,cs=Math.sqrt(2*T*FF/R),cost=c=>c/2*R+T/c*FF,P=[],H=[],I=[];
    for(let c=5000;c<=150000;c+=1000){P.push([c,cost(c)]);H.push([c,c/2*R]);I.push([c,T/c*FF]);}
    const f=frame(L.ch,{x:[5000,150000],y:[0,niceMax(Math.min(cost(5000),cost(150000))*1.3)],xlab:'Aktarım büyüklüğü, C (TL)',ylab:'Yıllık maliyet (TL)',xfmt:kTL,yfmt:kTL,aria:'Baumol modeli maliyet eğrileri'});
    f.line(H,'l2');f.line(I,'l3');f.line(P,'l1');f.vline(cs,'ref','C*');f.dot(C.v,cost(C.v),'cur',6);
    ro.set('c',tl(cs));ro.set('t',tl(cost(C.v)));ro.set('n',nf(T/C.v,1));
    if(u){if(Math.abs(C.v-cs)/cs<=.1)ck.mark('a');if(r.v>r0)ck.mark('b');}
  }
  [C,F,r].forEach(x=>x.on(()=>draw(1)));draw(0);
}
function K_millerorr(root,api){
  const L=kl(root,'Miller–Orr modeli: günlük nakit akışları rastlantısal. Nakit üst sınıra (H) çıkınca fazlası yatırıma aktarılıp hedef düzeye (Z) inilir; alt sınıra (L) düşünce yatırımdan nakit çekilip Z\'ye çıkılır. Z = L + (3Fσ² / 4r)<sup>1/3</sup>, H = L + 3(Z − L).');
  const ck=checklist(L.task,[{id:'a',t:'Günlük oynaklığı artırın: bant genişliyor mu, işlem sayısı nasıl değişiyor?'},{id:'b',t:'Yeni bir yıl simüle edin.'}],api);
  const s=sl(L.ctl,{label:'Günlük nakit akışı std. sapması, σ',min:1000,max:15000,step:500,value:5000,fmt:v=>tl(v)});

    for(let d=1;d<=250;d++){c+=sig*gauss(R);if(c>=H||c<=Lv){P.push([d,c]);c=Z;n++;}P.push([d,c]);}
    const f=frame(L.ch,{x:[0,250],y:[0,niceMax(H*1.1)],xlab:'İş günü',ylab:'Nakit (TL)',yfmt:kTL,aria:'Miller–Orr nakit bandı'});

function K_eoq(root,api){

  const ck=checklist(L.task,[{id:'a',t:'Toplam maliyeti en düşük yapan sipariş miktarını bulun (±%10).'},{id:'b',t:'Stok tutma maliyetini iki katına çıkarın: ESM yarıya mı iniyor?'}],api);
  const Q=sl(L.ctl,{label:'Sipariş miktarı, Q',min:100,max:3000,step:50,value:1500,fmt:v=>nf(v)+' adet'});
  const S=sl(L.ctl,{label:'Sipariş başına maliyet, S',min:100,max:2000,step:100,value:500,fmt:v=>tl(v)});
  const H=sl(L.ctl,{label:'Birim stok tutma maliyeti, H (yıllık)',min:5,max:80,step:5,value:20,fmt:v=>tl(v)});
  legend(L.leg,[['l1','Toplam maliyet'],['l2','Tutma maliyeti (Q/2)·H'],['l3','Sipariş maliyeti (D/Q)·S']]);
  const ro=readouts(L.ro,[['e','ESM = √(2DS / H)'],['t','Seçilen Q\'da toplam maliyet'],['n','Yıllık sipariş sayısı']]);
  const H0=H.v;
  function draw(u){
    const D=12000,cost=q=>q/2*H.v+D/q*S.v,e=Math.sqrt(2*D*S.v/H.v),P=[],A=[],B=[];for(let q=100;q<=3000;q+=25){P.push([q,cost(q)]);A.push([q,q/2*H.v]);B.push([q,D/q*S.v]);}
    const f=frame(L.ch,{x:[100,3000],y:[0,niceMax(Math.min(cost(100),cost(3000))*1.2)],xlab:'Sipariş miktarı (adet)',ylab:'Yıllık maliyet (TL)',yfmt:kTL,aria:'Ekonomik sipariş miktarı'});
    f.line(A,'l2');f.line(B,'l3');f.line(P,'l1');f.vline(e,'ref','ESM');f.dot(Q.v,cost(Q.v),'cur',6);
    ro.set('e',nf(e,0)+' adet');ro.set('t',tl(cost(Q.v)));ro.set('n',nf(D/Q.v,1));
    if(u){if(Math.abs(Q.v-e)/e<=.1)ck.mark('a');if(H.v>=2*H0)ck.mark('b');}
  }
  [Q,S,H].forEach(x=>x.on(()=>draw(1)));draw(0);
}

/* ---------- DERS 9 — Türev ürünler ve risk yönetimi ---------- */
const POZ={lc:['Alım opsiyonu al (long call)',1],sc:['Alım opsiyonu sat (short call)',-1],lp:['Satım opsiyonu al (long put)',1],sp:['Satım opsiyonu sat (short put)',-1],lf:['Vadeli al (long forward)',1],ls:['Dayanak varlık al',1]};
function getiri(k,S,K,F,prim){if(k==='lc'||k==='sc')return POZ[k][1]*(Math.max(S-K,0)-prim);if(k==='lp'||k==='sp')return POZ[k][1]*(Math.max(K-S,0)-prim);if(k==='lf')return S-F;return S-100;}
function K_opsiyon(root,api){
  const L=kl(root,'Dayanak varlığın bugünkü fiyatı 100 TL. Pozisyonları seçin; grafik vadedeki <b>kâr/zarar</b> profilini (prim dahil) gösterir. Birden fazla pozisyon birleştirilerek stratejiler kurulur. Opsiyon primleri Black–Scholes ile hesaplanır (yıllık %40 oynaklık, %30 faiz, 3 ay).');
  const ck=checklist(L.task,[{id:'a',t:'<b>Korumalı satım</b> kurun: dayanak varlık al + satım opsiyonu al.'},{id:'b',t:'<b>Straddle</b> kurun: aynı kullanım fiyatlı alım ve satım opsiyonu al.'},{id:'c',t:'<b>Örtülü alım</b> kurun: dayanak varlık al + alım opsiyonu sat.'}],api);
  const K=sl(L.ctl,{label:'Kullanım fiyatı, K',min:60,max:140,step:5,value:100,fmt:v=>tl(v)});
  const sec=new Set(['lc']);
  const box=el('div','opts',Object.entries(POZ).map(([k,v])=>`<label><input type="checkbox" value="${k}" ${k==='lc'?'checked':''}><span>${v[0]}</span></label>`).join(''));L.ctl.appendChild(box);
  box.querySelectorAll('input').forEach(x=>x.onchange=()=>{x.checked?sec.add(x.value):sec.delete(x.value);draw(1);});
  legend(L.leg,[['l1','Toplam kâr/zarar'],['ref','Sıfır çizgisi']]);
  const ro=readouts(L.ro,[['c','Alım primi'],['p','Satım primi'],['f','Vadeli fiyat'],['pcp','Alım − satım (parite)',1]]);
  function draw(u){
    const S0=100,r=.3,s=.4,T=.25,Kv=K.v,cp=bs(S0,Kv,r,s,T,true),pp_=bs(S0,Kv,r,s,T,false),F=S0*Math.exp(r*T),pts=[];
    for(let S=40;S<=160;S+=1){let v=0;sec.forEach(k=>{v+=getiri(k,S,Kv,F,k==='lc'||k==='sc'?cp:pp_);});pts.push([S,v]);}
    const ys=pts.map(p=>p[1]),[y0,y1]=niceRange(Math.min(...ys,-10),Math.max(...ys,10),5);
    const f=frame(L.ch,{x:[40,160],y:[y0,y1],xlab:'Vadedeki dayanak fiyatı (TL)',ylab:'Kâr / zarar (TL)',aria:'Opsiyon stratejisi getiri diyagramı'});
    f.hline(0,'ref');f.vline(Kv,'ref','K');if(sec.size)f.line(pts,'l1');
    f.hover(x=>{const S=clamp(Math.round(x),40,160),v=pts[S-40][1];return {x:S,pts:[[S,v,'d1']],html:`<b>S<sub>T</sub> = ${S}</b><br>Kâr/zarar: ${tl(v,2)}`};});
    ro.set('c',tl(cp,2));ro.set('p',tl(pp_,2));ro.set('f',tl(F,2));ro.set('pcp',`${nf(cp-pp_,2)} = S − K·e<sup>−rT</sup> = ${nf(S0-Kv*Math.exp(-r*T),2)}`);
    const h=k=>sec.has(k);if(u){if(h('ls')&&h('lp')&&sec.size===2)ck.mark('a');if(h('lc')&&h('lp')&&sec.size===2)ck.mark('b');if(h('ls')&&h('sc')&&sec.size===2)ck.mark('c');}
  }
  K.on(()=>draw(1));draw(0);
}

 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'E/V = %70, r<sub>E</sub> = %26, r<sub>D</sub> = %22, t = %25. AOSM yüzde kaçtır?',ans:.7*26+.3*22*.75,abs:0.01,unit:'%',hint:'Vergi sonrası borç maliyetini unutmayın.',sol:'0,7 × 26 + 0,3 × 16,5 = 18,2 + 4,95 = <b>%23,15</b>.'},
  {id:2,tag:'kavram',p:'AOSM hesabında ağırlıklar hangi değerlerle bulunmalıdır?',opts:['Defter değerleri','Piyasa değerleri','Nominal değerler','Vergi değerleri'],correct:1,hint:'Yatırımcıların bugün beklediği getiriler.',sol:'<b>Piyasa değerleri</b> (bulunamıyorsa hedef sermaye yapısı).'},
  {id:3,tag:'kavram',p:'AOSM hangi projeler için doğru iskonto oranıdır?',opts:['Bütün projeler','Şirketin mevcut faaliyetleriyle aynı risk ve finansman yapısındaki projeler','Yalnızca borçla finanse edilen projeler','Risksiz projeler'],correct:1,hint:'Finans I, Ders 10.',sol:'<b>Şirketin ortalama riskine benzer</b> projeler.'},
  {id:4,tag:'hesap',yl:1,p:'β<sub>U</sub> = 0,9; D/E = 0,8; t = %25. Hamada ile kaldıraçlı beta kaçtır?',ans:.9*(1+.75*.8),abs:0.005,unit:'',hint:'β<sub>U</sub>[1 + (1 − t)D/E].',sol:'0,9 × (1 + 0,6) = <b>1,44</b>.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary"><li>AOSM = (E/V)r<sub>E</sub> + (D/V)r<sub>D</sub>(1 − t), piyasa değeri ağırlıklarıyla.</li><li>Borç arttıkça hem r<sub>E</sub> hem r<sub>D</sub> artar; AOSM U biçimlidir.</li><li>AOSM, şirket ortalaması riskindeki projelerin iskonto oranıdır.</li></ul>
  <p class="lmeta">İzlence: Hafta 2–3 (sermaye yapısı ve AOSM) · ÖÇ1.</p>`}
]},

mm:{title:'Sermaye yapısı teorileri: Modigliani–Miller ve dengeleme teorisi',sure:'40 dk',steps:[
 {k:'a',type:'anlatim',title:'Borç değer yaratır mı?',html:()=>`
  <ul><li><b>MM I (vergisiz, 1958):</b> Mükemmel piyasada şirket değeri sermaye yapısından bağımsızdır: <i>V</i><sub>L</sub> = <i>V</i><sub>U</sub>. Yatırımcı kaldıracı kendisi de yaratabilir.</li>
  <li><b>MM II (vergisiz):</b> <i>r</i><sub>E</sub> = ρ + (ρ − <i>r</i><sub>D</sub>)<i>D</i>/<i>E</i>; AOSM sabittir.</li>
  <li><b>MM (vergili, 1963):</b> Faiz vergiden düşüldüğü için <i>V</i><sub>L</sub> = <i>V</i><sub>U</sub> + <i>t D</i>; teori %100 borcu önerir.</li>
  <li><b>Dengeleme (trade-off) teorisi:</b> <i>V</i><sub>L</sub> = <i>V</i><sub>U</sub> + BD(vergi kalkanı) − BD(finansal sıkıntı maliyetleri). Optimum, marjinal vergi kazancı ile marjinal sıkıntı maliyetinin eşitlendiği noktadır.</li>
  <li><b>Hiyerarşi (pecking order) teorisi:</b> Bilgi asimetrisi nedeniyle şirketler önce iç kaynakları, sonra borcu, en son yeni pay ihracını kullanır.</li></ul>`},
 {k:'o',type:'ornek',title:'Vergi kalkanının değeri',html:()=>`
  <p>Anka Makine'nin borçsuz değeri 10 milyon TL. 4 milyon TL kalıcı borç alırsa (vergi %25) MM'ye göre değer 10 + 0,25 × 4 = <b>11 milyon TL</b> olur. Finansal sıkıntı maliyetinin bugünkü değeri 0,25 × 4²/10 = 0,4 milyon TL ise dengeleme teorisine göre değer 10,6 milyon TL'dir.</p>`},
 {k:'k1',type:'kesif',core:true,title:'Üç teori, üç eğri',mount:K_mm},
 {k:'k2',type:'kesif',core:false,title:'MM II: özkaynak maliyeti ve AOSM',mount:K_mm2},
 {k:'t',type:'turetim',title:'Vergi kalkanının bugünkü değeri ve optimum borç',html:()=>`
  <p>Kalıcı <i>D</i> borcunun yıllık faizi <i>r</i><sub>D</sub><i>D</i>, vergi tasarrufu <i>t r</i><sub>D</sub><i>D</i>'dir. Bu bir perpetüitedir; borç riskiyle iskontolanırsa bugünkü değeri <i>t r</i><sub>D</sub><i>D</i> / <i>r</i><sub>D</sub> = <i>t D</i>.</p>
  <p>Sıkıntı maliyeti <i>c D</i><sup>2</sup>/<i>V</i><sub>U</sub> ise <i>V</i> = <i>V</i><sub>U</sub> + <i>t D</i> − <i>c D</i><sup>2</sup>/<i>V</i><sub>U</sub>. Türev sıfıra eşitlenince <i>D</i>* = <i>t V</i><sub>U</sub> / (2<i>c</i>): vergi oranı yüksek, sıkıntı maliyeti düşük şirketler daha fazla borçlanır.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'V<sub>U</sub> = 20 milyon TL, kalıcı borç 6 milyon TL, vergi %25. MM (vergili) şirket değeri kaç milyon TL\'dir?',ans:21.5,abs:0.01,unit:'mn TL',hint:'V<sub>U</sub> + tD.',sol:'20 + 0,25 × 6 = <b>21,5 milyon TL</b>.'},
  {id:2,tag:'hesap',p:'ρ = %22, r<sub>D</sub> = %18, D/E = 1,5. MM II (vergisiz) özkaynak maliyeti yüzde kaçtır?',ans:28,abs:0.05,unit:'%',hint:'ρ + (ρ − r<sub>D</sub>)D/E.',sol:'22 + 4 × 1,5 = <b>%28</b>.'},
  {id:3,tag:'grafik',p:'Finansal sıkıntı maliyetleri artarsa dengeleme teorisindeki optimum borç ne olur?',opts:['Artar','Azalır','Değişmez','Sıfır olur'],correct:1,hint:'Keşif 1.',sol:'<b>Azalır</b>: D* = tV<sub>U</sub>/(2c).'},
  {id:4,tag:'kavram',p:'Hiyerarşi teorisine göre kârlı şirketler neden daha az borçludur?',opts:['Vergi kalkanına ihtiyaçları yoktur','İç kaynakları yettiği için dış finansmana başvurmazlar','Borç verilmez','Sıkıntı maliyetleri yüksektir'],correct:1,hint:'Finansman sırası.',sol:'İlk tercih <b>iç kaynaklardır</b>; kârlı şirket borçlanmaya ihtiyaç duymaz.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary"><li>MM vergisiz: değer sermaye yapısından bağımsız; MM II: r<sub>E</sub> borçla doğrusal artar.</li><li>MM vergili: V<sub>L</sub> = V<sub>U</sub> + tD.</li><li>Dengeleme: vergi kalkanı ile sıkıntı maliyetleri arasında optimum; hiyerarşi: iç kaynak → borç → pay.</li></ul>
  <p class="lmeta">İzlence: Hafta 4–5 (sermaye yapısı teorileri) · ÖÇ3.</p>`}
]},

calisma:{title:'Çalışma sermayesi yönetimi ve nakit dönüşüm süresi',sure:'35 dk',steps:[
 {k:'a',type:'anlatim',title:'Faaliyet döngüsü',html:()=>`
  <p><b>Net çalışma sermayesi</b> = dönen varlıklar − kısa vadeli borçlar. Faaliyet döngüsü, mal alımından satışın tahsiline kadar geçen süredir; satıcı kredisi bu sürenin bir kısmını finanse eder:</p>
  <div class="eq">NDS = ${fr('Stok','SMM / 365')} + ${fr('Alacaklar','Satışlar / 365')} − ${fr('Ticari borçlar','SMM / 365')}</div>
  <p>NDS kısaldıkça finanse edilmesi gereken tutar ve faiz maliyeti azalır. Ancak stoku çok azaltmak satış kaybına, vadeleri kısaltmak müşteri kaybına, satıcıya geç ödemek erken ödeme iskontosunun kaçırılmasına yol açabilir.</p>`},
 {k:'o',type:'ornek',title:'Anka Makine\'nin nakit dönüşüm süresi',html:()=>`
  <p>Stok 250.000, SMM 900.000 → stok süresi ≈ 101 gün. Alacak 250.000, satış 1.500.000 → ≈ 61 gün. Ticari borç 110.000 → ≈ 45 gün. NDS ≈ 101 + 61 − 45 = <b>117 gün</b>; finanse edilecek tutar ≈ 900.000/365 × 117 ≈ 288.500 TL.</p>`},
 {k:'k1',type:'kesif',core:true,title:'Nakit dönüşüm süresi',mount:K_nds},
 {k:'k2',type:'kesif',core:false,title:'Tutucu, orta ve atak politika',mount:K_politika},
 {k:'t',type:'turetim',title:'Erken ödeme iskontosunun maliyeti',html:()=>`
  <p>"2/10 net 40" koşulu: 10 gün içinde ödenirse %2 indirim, aksi hâlde 40 günde tam ödeme. İndirimden vazgeçmek 30 gün için %2/%98 faiz ödemek demektir:</p>
  <div class="eq">Yıllık maliyet = (1 + ${fr('0,02','0,98')})<sup>365/30</sup> − 1 ≈ %27,9</div>
  <p>Şirketin borçlanma maliyeti bundan düşükse borç alıp indirimi kullanmak daha ucuzdur.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'Stok süresi 80, alacak süresi 50, borç süresi 60 gün. NDS kaç gündür?',ans:70,abs:0.5,unit:'gün',hint:'Stok + alacak − borç.',sol:'<b>70 gün</b>.'},
  {id:2,tag:'hesap',p:'Yıllık SMM 730.000 TL ve NDS 70 gün ise yaklaşık finanse edilecek tutar kaç TL\'dir?',ans:140000,abs:1,unit:'TL',hint:'Günlük SMM × NDS.',sol:'2.000 × 70 = <b>140.000 TL</b>.'},
  {id:3,tag:'hesap',p:'"1/10 net 30" koşulunda iskontodan vazgeçmenin yıllık bileşik maliyeti yüzde kaçtır? (1 ondalık)',ans:100*(Math.pow(1+1/99,365/20)-1),abs:0.1,unit:'%',hint:'20 gün için %1/%99.',sol:`(1 + 1/99)<sup>365/20</sup> − 1 ≈ <b>%${nf(100*(Math.pow(1+1/99,365/20)-1),1)}</b>.`},
  {id:4,tag:'kavram',p:'Hangi değişiklik NDS\'yi kısaltır?',opts:['Stok süresinin uzaması','Müşterilere daha uzun vade verilmesi','Satıcılara daha geç ödeme yapılması','Alacak tahsil süresinin uzaması'],correct:2,hint:'Borç süresi formülde eksi işaretlidir.',sol:'<b>Satıcılara daha geç ödeme</b>.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary"><li>NDS = stok süresi + alacak süresi − borç süresi.</li><li>NDS × günlük maliyet ≈ finanse edilecek çalışma sermayesi.</li><li>Erken ödeme iskontosundan vazgeçmenin örtük maliyeti çoğu zaman yüksektir.</li></ul>
  <p class="lmeta">İzlence: Hafta 6–7 (çalışma sermayesi) · ÖÇ4.</p>`}
]},

alacak:{title:'Alacak yönetimi ve kredi politikası',sure:'30 dk',steps:[
 {k:'a',type:'anlatim',title:'Kredi politikasının dört unsuru',html:()=>`
  <p>Kredi politikası; <b>kredi standartları</b> (kime vade verilecek), <b>kredi koşulları</b> (vade, erken ödeme iskontosu), <b>tahsilat politikası</b> ve <b>kredi limitlerinden</b> oluşur. Politikayı gevşetmek satışları artırır ama üç maliyet doğurur: alacaklara bağlanan paranın fırsat maliyeti, tahsil edilemeyen alacaklar ve tahsilat giderleri.</p>
  <div class="eq">Δ Kâr = Δ Satış × katkı oranı − Δ Kötü alacak − <i>r</i> × Δ (Alacak yatırımı)</div>
  <p>Alacak yatırımı maliyet bedeliyle ölçülür: (Satış / 365) × tahsil süresi × (değişken maliyet / satış).</p>
  <div class="note">Bu ders, izlencede çalışma sermayesinin bileşenlerinden eksik bırakılan alacak yönetimini kapsar.</div>`},
 {k:'o',type:'ornek',title:'Vadeyi 60 günden 90 güne uzatmak',html:()=>{const S1=1.725e6,kat=225000*.4,kot=S1*.02-15000,ar=(S1/365*90-1.5e6/365*60)*.6;return `
  <p>Satışlar %15 artıyor (1.725.000 TL); katkı oranı %40; kötü alacak oranı %1'den %2'ye çıkıyor; tahsil süresi 60 günden 90 güne uzuyor; fırsat maliyeti %30.</p>
  <p>Ek katkı ${tl(kat)} − kötü alacak artışı ${tl(kot)} − alacak finansmanı ${tl(ar*.3)} = <b>${tl(kat-kot-ar*.3)}</b>. Satışlar artsa da politika kârı azaltıyor.</p>`;}},
 {k:'k1',type:'kesif',core:true,title:'Kredi politikasını gevşetmek',mount:K_kredi2},
 {k:'t',type:'turetim',title:'Neden maliyet bedeli?',html:()=>`
  <p>Alacaktaki satış tutarının bir kısmı kârdır; şirket bu kısmı hiç harcamamıştır. Alacak için gerçekten bağlanan para, satılan malın değişken maliyetidir. Bu yüzden fırsat maliyeti hesabında alacak yatırımı değişken maliyet oranıyla çarpılır.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'Yıllık satış 3.650.000 TL, tahsil süresi 40 gün, değişken maliyet oranı %70. Alacak yatırımı (maliyetle) kaç TL\'dir?',ans:280000,abs:1,unit:'TL',hint:'(S/365) × gün × v.',sol:'10.000 × 40 × 0,7 = <b>280.000 TL</b>.'},
  {id:2,tag:'hesap',p:'Politika satışları 200.000 TL artırıyor (katkı oranı %35), kötü alacakları 20.000 TL, alacak yatırımını 100.000 TL artırıyor (r = %30). Kâr etkisi kaç TL\'dir?',ans:200000*.35-20000-30000,abs:1,unit:'TL',hint:'70.000 − 20.000 − 30.000.',sol:'<b>20.000 TL</b> artış.'},
  {id:3,tag:'kavram',p:'Aşağıdakilerden hangisi kredi politikasının unsuru değildir?',opts:['Kredi standartları','Kredi koşulları','Tahsilat politikası','Temettü politikası'],correct:3,hint:'Biri dağıtım kararıdır.',sol:'<b>Temettü politikası</b>.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary"><li>Kredi politikası: standartlar, koşullar, tahsilat, limitler.</li><li>Gevşetmenin kârı = ek katkı − kötü alacak − alacak finansmanı.</li><li>Alacak yatırımı maliyet bedeliyle ölçülür.</li></ul>
  <p class="lmeta">İzlence: Çalışma sermayesi (Hafta 6–7) · ÖÇ4. İzlencede ayrı başlık yok.</p>`}
]},

temettu:{title:'Temettü politikaları',sure:'35 dk',steps:[
 {k:'a',type:'anlatim',title:'Temettü ilgisiz mi?',html:()=>`
  <p><b>MM temettü ilgisizliği (1961):</b> Yatırım kararı verilmişse, vergi ve işlem maliyeti olmayan bir piyasada temettü politikası şirket değerini etkilemez. Temettü ödenince hisse fiyatı aynı tutarda düşer; isteyen yatırımcı hisse satarak kendi temettüsünü yaratır.</p>
  <p>Gerçek dünyada temettünün önemli olmasının nedenleri: <b>vergiler</b> (temettü ve sermaye kazancı farklı vergilenir), <b>sinyal etkisi</b> (temettü artışı yönetimin geleceğe güvenini gösterir), <b>vekâlet maliyetleri</b> (dağıtılan nakit yöneticilerin israf edebileceği nakdi azaltır) ve <b>yatırımcı tercihleri</b> (müşteri etkisi).</p>
  <p><b>Lintner (1956)</b> gözlemi: şirketler hedef bir dağıtım oranına sahiptir ama temettüyü kârdaki geçici dalgalanmalara göre değiştirmez; kısmi uyum sağlar ve temettü kesmekten kaçınır.</p>
  <div class="note tr">Türkiye'de gerçek kişi ortaklara dağıtılan kâr paylarında stopaj oranı 22.12.2024'ten itibaren %15'tir; tam mükellef kurumlara dağıtımda stopaj yoktur. Borsada işlem gören hisselerin alım satım kazançlarında stopaj uygulaması ayrıca düzenlenir.</div>`},
 {k:'o',type:'ornek',title:'Temettünün hisse fiyatına etkisi',html:()=>`
  <p>Anka Makine hissesi 50 TL. Hisse başına 5 TL temettü dağıtılırsa (vergi yoksa) temettü sonrası fiyat 45 TL olur: 100 hisseli bir yatırımcının serveti 100 × 45 + 500 = 5.000 TL, temettüden önceki 5.000 TL ile aynıdır.</p>`},
 {k:'k1',type:'kesif',core:true,title:'Lintner: temettünün yumuşatılması',mount:K_lintner},
 {k:'k2',type:'kesif',core:true,title:'Temettü mü, hisse geri alımı mı?',mount:K_ilgisiz},
 {k:'t',type:'turetim',title:'Kendi temettünü yaratmak',html:()=>`
  <p>Şirket temettü ödemiyorsa ama yatırımcı nakit istiyorsa, hisselerinin <i>D</i>/<i>P</i> oranını satar. Vergisiz dünyada temettü alan yatırımcıyla aynı nakde ve aynı servete ulaşır; tek fark, şirketteki payının biraz azalmasıdır. Tersine, temettü istemeyen yatırımcı aldığı temettüyle yeni hisse alabilir. Yatırımcı her iki yönü kendisi yapabildiğine göre şirketin seçimi değer yaratamaz. Vergiler bu simetriyi bozar: temettü daha ağır vergileniyorsa geri alım daha avantajlıdır.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'Hisse fiyatı 80 TL; hisse başına 6 TL temettü ödenecek. Vergi yoksa temettü sonrası teorik fiyat kaç TL\'dir?',ans:74,abs:0.01,unit:'TL',hint:'Fiyat temettü kadar düşer.',sol:'<b>74 TL</b>.'},
  {id:2,tag:'hesap',p:'Lintner modelinde D<sub>t−1</sub> = 2 TL, E<sub>t</sub> = 6 TL, hedef oran %50, uyum hızı 0,4. D<sub>t</sub> kaç TL\'dir?',ans:2.4,abs:0.005,unit:'TL',hint:'D<sub>t−1</sub> + c(p·E<sub>t</sub> − D<sub>t−1</sub>).',sol:'2 + 0,4 × (3 − 2) = <b>2,40 TL</b>.'},
  {id:3,tag:'kavram',p:'MM temettü ilgisizliğinin varsayımlarından biri değildir:',opts:['Vergi yoktur','İşlem maliyeti yoktur','Yatırım kararı temettüden bağımsızdır','Yöneticiler temettüyü yumuşatır'],correct:3,hint:'Biri Lintner\'ın gözlemidir.',sol:'<b>Temettünün yumuşatılması</b> Lintner\'ın ampirik gözlemidir, MM\'nin varsayımı değildir.'},
  {id:4,tag:'grafik',p:'Lintner modelinde uyum hızı küçüldükçe temettü serisi nasıl olur?',opts:['Daha oynak','Daha düzgün (yumuşak)','Kârla birebir aynı','Sıfır'],correct:1,hint:'Keşif 1.',sol:'<b>Daha yumuşak</b>; kârdaki geçici düşüşlere az tepki verir.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary"><li>MM: mükemmel piyasada temettü politikası ilgisizdir.</li><li>Vergiler, sinyal, vekâlet maliyetleri ve müşteri etkisi politikayı önemli kılar.</li><li>Lintner: hedef oran ve kısmi uyum; temettü yumuşatılır.</li></ul>
  <p class="lmeta">İzlence: Hafta 8–9 (temettü politikaları) · ÖÇ2.</p>`}
]},

nakit:{title:'Nakit yönetimi: Baumol ve Miller–Orr modelleri',sure:'35 dk',steps:[
 {k:'a',type:'anlatim',title:'Ne kadar nakit?',html:()=>`
  <p>Nakit tutmanın nedenleri: işlem (günlük ödemeler), ihtiyat (beklenmeyen ihtiyaçlar) ve spekülasyon (fırsatlar). Fazla nakit faiz kaybettirir, az nakit sık aktarım maliyeti ya da ödeme güçlüğü yaratır.</p>
  <div class="eq">Baumol: <i>C</i>* = √(2<i>T F</i> / <i>r</i>) &nbsp;&nbsp;&nbsp; Miller–Orr: <i>Z</i> = <i>L</i> + (3<i>F</i>σ<sup>2</sup> / 4<i>r</i>)<sup>1/3</sup>, &nbsp;<i>H</i> = <i>L</i> + 3(<i>Z</i> − <i>L</i>)</div>
  <p>Baumol nakit çıkışlarının düzenli ve kesin olduğunu varsayar; Miller–Orr günlük nakit akışlarını rastlantısal kabul eder ve bir kontrol bandı kurar. Miller–Orr'da <i>r</i> <b>günlük</b> faiz, σ<sup>2</sup> günlük nakit akışlarının varyansıdır.</p>`},
 {k:'o',type:'ornek',title:'Anka Makine için iki model',html:()=>{const cs=Math.sqrt(2*1.2e6*200/.3),Z=Math.cbrt(3*200*25e6/(4*.3/365));return `
  <p><b>Baumol:</b> T = 1.200.000, F = 200 TL, r = %30 → C* = √(2 × 1.200.000 × 200 / 0,30) = <b>${tl(cs)}</b>; yılda ${nf(1.2e6/cs,0)} aktarım.</p>
  <p><b>Miller–Orr:</b> σ = 5.000 TL/gün, günlük r = 0,30/365, L = 20.000 → Z − L = (3 × 200 × 5.000² / (4 × 0,000822))<sup>1/3</sup> ≈ ${tl(Z)}; Z ≈ ${tl(20000+Z)}, H ≈ ${tl(20000+3*Z)}.</p>`;}},
 {k:'k1',type:'kesif',core:true,title:'Baumol modeli',mount:K_baumol},
 {k:'k2',type:'kesif',core:true,title:'Miller–Orr kontrol bandı',mount:K_millerorr},
 {k:'t',type:'turetim',title:'Baumol formülünün türetilmesi',html:()=>`
  <p>Toplam maliyet TC(<i>C</i>) = (<i>C</i>/2)<i>r</i> + (<i>T</i>/<i>C</i>)<i>F</i>. Türev: <i>r</i>/2 − <i>T F</i>/<i>C</i><sup>2</sup> = 0 → <i>C</i>* = √(2<i>T F</i>/<i>r</i>). Optimumda iki maliyet eşittir. Formül stok yönetimindeki ESM ile aynı yapıdadır: nakit, "stoku tutulan" bir maldır.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'T = 2.400.000 TL, F = 300 TL, r = %36. Baumol optimum aktarım büyüklüğü kaç TL\'dir?',ans:Math.sqrt(2*2.4e6*300/.36),rel:0.001,unit:'TL',hint:'√(2TF/r).',sol:`√(2 × 2.400.000 × 300 / 0,36) = <b>${tl(Math.sqrt(2*2.4e6*300/.36))}</b>.`},
  {id:2,tag:'hesap',p:'Miller–Orr: L = 10.000, Z = 25.000 TL. Üst sınır H kaç TL\'dir?',ans:55000,abs:1,unit:'TL',hint:'H = L + 3(Z − L).',sol:'10.000 + 3 × 15.000 = <b>55.000 TL</b>.'},
  {id:3,tag:'grafik',p:'Faiz oranı artarsa Baumol optimum aktarım büyüklüğü ne olur?',opts:['Artar','Azalır','Değişmez','Sıfır olur'],correct:1,hint:'r paydada.',sol:'Elde nakit tutmak pahalılaşır; <b>C* küçülür</b>.'},
  {id:4,tag:'kavram',p:'Miller–Orr modelinde nakit akışlarının oynaklığı artarsa bant ne olur?',opts:['Daralır','Genişler','Değişmez','Kaybolur'],correct:1,hint:'σ² formülde.',sol:'<b>Genişler</b> (σ<sup>2/3</sup> ile).'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary"><li>Baumol: C* = √(2TF/r); düzenli nakit çıkışları.</li><li>Miller–Orr: rastlantısal akışlar; Z ve H bandı, oynaklıkla genişler.</li><li>İki model de elde tutma maliyeti ile işlem maliyetini dengeler.</li></ul>
  <p class="lmeta">İzlence: Hafta 10 (nakit yönetimi) · ÖÇ5.</p>`}
]},

stok:{title:'Stok yönetimi: ekonomik sipariş miktarı ve emniyet stoku',sure:'35 dk',steps:[
 {k:'a',type:'anlatim',title:'Ne kadar, ne zaman?',html:()=>`
  <p>Stok yönetiminin iki sorusu: <b>ne kadar</b> sipariş verilmeli ve <b>ne zaman</b>? Ekonomik sipariş miktarı (ESM) sipariş ve tutma maliyetlerinin toplamını en aza indirir:</p>
  <div class="eq">ESM = √(2<i>D S</i> / <i>H</i>) &nbsp;&nbsp;&nbsp; Yeniden sipariş noktası = günlük talep × teslim süresi + emniyet stoku</div>
  <p>Talep ve teslim süresi belirsiz olduğunda <b>emniyet stoku</b> stoksuz kalma riskini azaltır. Tam zamanında (JIT) üretim stok tutma maliyetini düşürür ama tedarik zinciri riskini artırır.</p>`},
 {k:'o',type:'ornek',title:'Anka Makine\'nin parça stoku',html:()=>`
  <p>D = 12.000 adet/yıl, S = 500 TL, H = 20 TL → ESM = √(2 × 12.000 × 500 / 20) = <b>775 adet</b>; yılda yaklaşık 15,5 sipariş. 300 iş gününde günlük talep 40 adet; teslim süresi 8 gün ise emniyet stoku olmadan yeniden sipariş noktası 320 adettir.</p>`},
 {k:'k1',type:'kesif',core:true,title:'Ekonomik sipariş miktarı',mount:K_eoq},
 {k:'k2',type:'kesif',core:true,title:'Emniyet stoku ve stoksuz kalma',mount:K_emniyet},
 {k:'t',type:'turetim',title:'ESM ve Baumol aynı formül',html:()=>`
  <p>TC(<i>Q</i>) = (<i>Q</i>/2)<i>H</i> + (<i>D</i>/<i>Q</i>)<i>S</i> → <i>Q</i>* = √(2<i>D S</i>/<i>H</i>). <i>H</i> iki katına çıkarsa <i>Q</i>* 1/√2 katına (yaklaşık %71'ine) iner, yarıya değil: karekök kuralı. Talep dört katına çıkarsa sipariş miktarı yalnızca iki katına çıkar; stok yönetiminde ölçek ekonomisi vardır.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'D = 8.000 adet, S = 400 TL, H = 16 TL. ESM kaç adettir?',ans:Math.sqrt(2*8000*400/16),abs:0.5,unit:'adet',hint:'√(2DS/H).',sol:'√400.000 ≈ <b>632 adet</b>.'},
  {id:2,tag:'hesap',p:'Günlük talep 50 adet, teslim süresi 6 gün, emniyet stoku 100 adet. Yeniden sipariş noktası kaç adettir?',ans:400,abs:0.5,unit:'adet',hint:'d × L + SS.',sol:'300 + 100 = <b>400 adet</b>.'},
  {id:3,tag:'grafik',p:'Stok tutma maliyeti iki katına çıkarsa ESM ne olur?',opts:['Yarıya iner','Yaklaşık %71\'ine iner','İki katına çıkar','Değişmez'],correct:1,hint:'Karekök.',sol:'1/√2 ≈ <b>0,71</b> katına iner.'},
  {id:4,tag:'kavram',p:'Emniyet stoku neden tutulur?',opts:['Sipariş maliyetini azaltmak için','Talep ve teslim süresindeki belirsizliğe karşı','Vergi avantajı için','ESM\'yi artırmak için'],correct:1,hint:'Keşif 2.',sol:'<b>Belirsizliğe karşı</b> stoksuz kalmamak için.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary"><li>ESM = √(2DS/H); toplam maliyet en düşük noktada sipariş ve tutma maliyetleri eşittir.</li><li>Yeniden sipariş noktası = d × L + emniyet stoku.</li><li>Emniyet stoku stoksuz kalma riskini azaltır, ortalama stoku artırır.</li></ul>
  <p class="lmeta">İzlence: Hafta 11 (stok yönetimi) · ÖÇ6.</p>`}
]},

turev:{title:'Borç yönetimi ve türev ürünler: vadeli işlemler, opsiyonlar, riskten korunma',sure:'50 dk',steps:[
 {k:'a',type:'anlatim',title:'Türev ürünler',html:()=>`
  <p><b>Türev ürün</b>, değeri bir dayanak varlığın (kur, faiz, emtia, hisse) fiyatına bağlı sözleşmedir.</p>
  <ul><li><b>Vadeli işlem (forward/futures):</b> Belirli bir tarihte belirli bir fiyattan alım ya da satım <b>yükümlülüğü</b>. Vadeli fiyat ≈ <i>S</i><sub>0</sub>(1 + <i>r</i>)<sup><i>T</i></sup> (taşıma maliyeti).</li>
  <li><b>Alım opsiyonu (call):</b> Kullanım fiyatından alma <b>hakkı</b>; vadede getiri max(<i>S</i><sub>T</sub> − <i>K</i>, 0).</li>
  <li><b>Satım opsiyonu (put):</b> Kullanım fiyatından satma hakkı; getiri max(<i>K</i> − <i>S</i><sub>T</sub>, 0).</li>
  <li><b>Swap:</b> Nakit akışlarının değiştirilmesi (ör. değişken faizi sabite çevirmek).</li></ul>
  <p><b>Alım–satım paritesi</b>: <i>C</i> − <i>P</i> = <i>S</i><sub>0</sub> − <i>K</i>e<sup>−<i>rT</i></sup>. <b>Borç yönetiminde</b> türevler faiz ve kur riskini yönetmek için kullanılır: döviz borcu olan şirket vadeli döviz alarak, değişken faizli krediyi faiz swapıyla sabitleyerek riskini azaltır.</p>
  <div class="note tr">Türkiye'de vadeli işlem ve opsiyon sözleşmeleri Borsa İstanbul Vadeli İşlem ve Opsiyon Piyasası'nda (VİOP) işlem görür; bankalar şirketlere tezgâh üstü vadeli kur ve swap işlemleri sunar.</div>
  <div class="note yl yl-only"><b>Black–Scholes:</b> <i>C</i> = <i>S</i>N(<i>d</i><sub>1</sub>) − <i>K</i>e<sup>−<i>rT</i></sup>N(<i>d</i><sub>2</sub>), <i>d</i><sub>1</sub> = [ln(<i>S</i>/<i>K</i>) + (<i>r</i> + σ<sup>2</sup>/2)<i>T</i>]/(σ√<i>T</i>), <i>d</i><sub>2</sub> = <i>d</i><sub>1</sub> − σ√<i>T</i>. Keşifteki primler bu formülle (sürekli bileşik faizle) hesaplanır. TFRS 9 riskten korunma muhasebesi, korunma aracının kazanç ve kayıplarının korunan kalemle aynı döneme eşleştirilmesine izin verir.</div>`},
 {k:'o',type:'ornek',title:'Kur riskinden korunma',html:()=>`
  <p>Anka Makine 3 ay sonra 100.000 USD ödeyecek. Vadeli kur 41,50 TL ile korunursa ödeme kur ne olursa olsun <b>4.150.000 TL</b> olur. 42 TL kullanım fiyatlı alım opsiyonu (prim 0,80 TL) alınırsa ödeme en fazla (42 + 0,80) × 100.000 = <b>4.280.000 TL</b> olur; kur 38 TL'ye düşerse ödeme (38 + 0,80) × 100.000 = 3.880.000 TL'dir.</p>`},
 {k:'k1',type:'kesif',core:true,title:'Getiri diyagramları ve stratejiler',mount:K_opsiyon},
 {k:'k2',type:'kesif',core:true,title:'Kur riskinden korunma: vadeli işlem ve opsiyon',mount:K_hedge},
 {k:'t',type:'turetim',title:'Alım–satım paritesi',html:()=>`
  <p>İki portföy düşünün: (A) bir alım opsiyonu + <i>K</i>e<sup>−<i>rT</i></sup> nakit; (B) bir satım opsiyonu + bir dayanak varlık. Vadede ikisi de max(<i>S</i><sub>T</sub>, <i>K</i>) öder. Aynı getiriyi sağlayan iki portföyün bugünkü fiyatı da aynı olmalıdır (arbitraj yokluğu):</p>
  <div class="eq"><i>C</i> + <i>K</i>e<sup>−<i>rT</i></sup> = <i>P</i> + <i>S</i><sub>0</sub></div>
  <p>Korumalı satım (varlık + put) getiri profili, alım opsiyonu + tahvil profilinin aynısıdır; keşifte iki stratejinin grafiklerini karşılaştırarak görebilirsiniz.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'Kullanım fiyatı 100 TL, prim 8 TL olan alım opsiyonu aldınız. Vadede fiyat 115 TL ise net kârınız kaç TL\'dir?',ans:7,abs:0.01,unit:'TL',hint:'max(S − K, 0) − prim.',sol:'15 − 8 = <b>7 TL</b>.'},
  {id:2,tag:'hesap',p:'Aynı opsiyonda başabaş vade fiyatı kaç TL\'dir?',ans:108,abs:0.01,unit:'TL',hint:'K + prim.',sol:'<b>108 TL</b>.'},
  {id:3,tag:'hesap',p:'S<sub>0</sub> = 100, K = 100, alım primi 10, e<sup>−rT</sup> = 0,93. Parite ile satım primi kaç TL\'dir?',ans:3,abs:0.01,unit:'TL',hint:'P = C − S + Ke<sup>−rT</sup>.',sol:'10 − 100 + 93 = <b>3 TL</b>.'},
  {id:4,tag:'kavram',p:'Gelecekte döviz ödeyecek bir ithalatçı kur riskini tamamen sabitlemek istiyor. En uygun araç?',opts:['Vadeli döviz satmak','Vadeli döviz almak','Satım opsiyonu almak','Hiçbir şey yapmamak'],correct:1,hint:'İthalatçı dövize ihtiyaç duyacak.',sol:'<b>Vadeli döviz almak</b> kuru sabitler.'},
  {id:5,tag:'grafik',p:'Straddle (aynı K\'lı alım ve satım opsiyonu almak) hangi beklentiye uygundur?',opts:['Fiyat değişmeyecek','Fiyat çok hareket edecek ama yönü belli değil','Fiyat kesin yükselecek','Faizler düşecek'],correct:1,hint:'Keşif 1\'deki V biçimi.',sol:'<b>Yüksek oynaklık beklentisi</b>; yön belirsiz.'},
  {id:6,tag:'hesap',yl:1,p:'S = 100, K = 100, r = %30 (sürekli), σ = %40, T = 0,25. Black–Scholes alım primi kaç TL\'dir? (2 ondalık)',ans:bs(100,100,.3,.4,.25,true),abs:0.05,unit:'TL',hint:'d<sub>1</sub> = (0 + (0,30 + 0,08) × 0,25)/(0,4 × 0,5) = 0,475.',sol:`d<sub>1</sub> = 0,475, d<sub>2</sub> = 0,275 → C ≈ <b>${tl(bs(100,100,.3,.4,.25,true),2)}</b>.`}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary"><li>Vadeli işlem yükümlülük, opsiyon haktır; opsiyon alıcısı prim öder.</li><li>Getiri: call max(S − K, 0), put max(K − S, 0); stratejiler bu profillerin toplamıdır.</li><li>Parite: C − P = S − Ke<sup>−rT</sup>.</li><li>Vadeli işlem riski sabitler; opsiyon kötü senaryoya karşı sigorta sağlar.</li></ul>
  <p class="lmeta">İzlence: Hafta 12–14 (borç yönetimi ve türev ürünler) · ÖÇ7.</p>`}
]}
};

risk:{title:'Sermaye bütçesinde risk: duyarlılık, senaryo, Monte Carlo, karar ağacı',sure:'45 dk',steps:[
 {k:'a',type:'anlatim',title:'Belirsizliği ölçmek',html:()=>`
  <p>NBD tek bir sayıdır ama tahminlere dayanır. Riski görmenin dört yolu:</p>
  <ul><li><b>Duyarlılık analizi</b>: Girdileri tek tek değiştirip NBD'nin tepkisini ölçmek; başabaş değerleri (NBD = 0) bulmak.</li>
  <li><b>Senaryo analizi</b>: Girdileri birlikte (iyimser, olası, kötümser) değiştirmek.</li>
  <li><b>Monte Carlo simülasyonu</b>: Girdileri olasılık dağılımlarından çekip NBD dağılımını elde etmek; P(NBD &lt; 0) gibi ölçüler üretmek.</li>
  <li><b>Karar ağacı</b>: Ardışık kararları ve sonradan öğrenilen bilgiyi modellemek; genişleme ya da vazgeçme gibi <b>reel opsiyonların</b> değerini göstermek.</li></ul>
  <p>Bu yöntemler NBD kuralının yerine geçmez; riskin kaynağını görünür kılar. Riskin fiyatı iskonto oranında yer alır.</p>`},
 {k:'o',type:'ornek',title:'Senaryo ve karar ağacı',html:()=>{const n=s=>npvBaz({...BAZ,S:s,C:200000+300000*s/900000});return `
  <p><b>Senaryolar</b> (nakit giderlerin %60'ı değişken): kötümser satış 700.000 (olasılık 0,25) → NBD ${tl(n(7e5))}; olası 900.000 (0,50) → ${tl(n(9e5))}; iyimser 1.100.000 (0,25) → ${tl(n(11e5))}. Beklenen NBD ${tl(.25*n(7e5)+.5*n(9e5)+.25*n(11e5))}.</p>
  <p><b>Karar ağacı:</b> Kötümser senaryo 1. yıl sonunda anlaşılırsa hat 700.000 TL'ye satılabiliyor (vazgeçme opsiyonu). Bu seçenek kötümser dalın değerini yükseltir ve projenin beklenen NBD'sini artırır: esneklik değerlidir.</p>`;}},
 {k:'k1',type:'kesif',core:true,title:'Duyarlılık analizi ve başabaş satış',mount:K_duyarlilik},
 {k:'k2',type:'kesif',core:true,title:'Monte Carlo simülasyonu',mount:K_mc},
 {k:'t',type:'turetim',title:'Beklenen NBD ile NBD dağılımı',html:()=>`
  <p>NBD girdilerin doğrusal bir fonksiyonuysa beklenen NBD, beklenen girdilerle hesaplanan NBD'ye eşittir. Monte Carlo'nun katkısı ortalamada değil <b>dağılımdadır</b>: kayıp olasılığı, kuyruk riski ve hangi girdilerin sonucu en çok oynattığı. Dikkat: Simülasyonda NBD için ayrıca risk ayarlı oran kullanılıyorsa, sonuç dağılımını bir de "riskli" diye ayrıca cezalandırmak riski iki kez saymak olur.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'Üç senaryoda NBD: −200.000 (olasılık 0,3), 100.000 (0,5), 400.000 (0,2). Beklenen NBD kaç TL\'dir?',ans:70000,abs:1,unit:'TL',hint:'Olasılık ağırlıklı ortalama.',sol:'−60.000 + 50.000 + 80.000 = <b>70.000 TL</b>.'},
  {id:2,tag:'hesap',p:'CNC projesinde satışlar her yıl aynı tutarda gerçekleşirse NBD\'yi sıfırlayan yıllık satış kaç TL\'dir? (Nakit gider 500.000 sabit, vergi %25, r = %20)',ans:(()=>bisect(s=>npvBaz({...BAZ,S:s}),1,2e6))(),rel:0.002,unit:'TL',hint:'(S − C)·0,75·AF + D·t·AF = 1.000.000.',sol:`(S − 500.000) × 0,75 × ${nf(af(.2,5),4)} + 50.000 × ${nf(af(.2,5),4)} = 1.000.000 → S ≈ <b>${tl(bisect(s=>npvBaz({...BAZ,S:s}),1,2e6))}</b>.`},
  {id:3,tag:'kavram',p:'Duyarlılık analizinin temel sınırlılığı nedir?',opts:['Hesaplaması zordur','Girdileri tek tek değiştirir; aralarındaki ilişkiyi yok sayar','Olasılık gerektirir','NBD\'yi değiştirir'],correct:1,hint:'Satış düşerken maliyet de düşebilir.',sol:'Girdileri <b>birbirinden bağımsız</b> değiştirir; senaryo ve Monte Carlo bu sınırı aşar.'},
  {id:4,tag:'grafik',p:'Monte Carlo\'da satış belirsizliği artarsa P(NBD < 0) ne olur?',opts:['Azalır','Artar','Değişmez','Sıfırlanır'],correct:1,hint:'Keşif 2.',sol:'Dağılım genişler; sol kuyruk sıfırın altına daha çok taşar: olasılık <b>artar</b>.'},
  {id:5,tag:'kavram',p:'Kötü giden bir projeden erken çıkabilme seçeneği projenin değerini nasıl etkiler?',opts:['Azaltır','Artırır ya da değiştirmez (negatif olamaz)','Her zaman sıfırdır','Yalnızca vergi etkisi yaratır'],correct:1,hint:'Bir hak, kullanılmak zorunda değildir.',sol:'Vazgeçme bir <b>reel opsiyondur</b>; değeri negatif olamaz.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary"><li>Duyarlılık tek girdi, senaryo birlikte değişen girdiler, Monte Carlo olasılık dağılımı, karar ağacı ardışık kararlar içindir.</li><li>Başabaş analizi NBD'yi sıfırlayan girdi değerlerini verir.</li><li>Esneklik (reel opsiyonlar) proje değerine eklenir.</li></ul>
  <p class="lmeta">İzlence: Hafta 13–14 · ÖÇ7.</p>`}
]}

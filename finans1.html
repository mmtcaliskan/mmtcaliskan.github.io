  <p>Bu nedenle farklı tarihlerdeki tutarlar doğrudan toplanamaz; önce <b>aynı tarihe taşınmaları</b> gerekir. Bir tutarı ileriye taşımaya <b>bileşikleştirme</b>, geriye taşımaya <b>iskontolama</b> denir.</p>
  <h3>Basit faiz ve bileşik faiz</h3>
  <p>Basit faizde faiz yalnızca anaparaya işler. Bileşik faizde ise her dönemin faizi anaparaya eklenir ve sonraki dönemlerde o da faiz kazanır. Buna <b>faizin faizi</b> denir.</p>
  <div class="eq">Basit faiz: <i>FV</i> = <i>PV</i> · (1 + <i>r</i> · <i>n</i>) &nbsp;&nbsp;&nbsp;&nbsp; Bileşik faiz: <i>FV</i> = <i>PV</i> · (1 + <i>r</i>)<sup><i>n</i></sup></div>
  <div class="eq">Bugünkü değer: <i>PV</i> = ${fr('<i>FV</i>','(1 + <i>r</i>)<sup><i>n</i></sup>')}</div>
  <table class="tbl sym"><tbody><tr><td><i>PV</i></td><td>Bugünkü değer (present value)</td></tr><tr><td><i>FV</i></td><td>Gelecek değer (future value)</td></tr><tr><td><i>r</i></td><td>Dönem faiz oranı</td></tr><tr><td><i>n</i></td><td>Dönem sayısı</td></tr><tr><td>(1 + <i>r</i>)<sup>−<i>n</i></sup></td><td>İskonto faktörü</td></tr></tbody></table>
  <div class="note yl yl-only">Faiz sürekli işletilirse <i>FV</i> = <i>PV</i> · <i>e</i><sup><i>rn</i></sup> olur. Bir tutarın ikiye katlanma süresi <i>T</i> = ln 2 / ln(1 + <i>r</i>) ile bulunur. ln(1 + <i>r</i>) ≈ <i>r</i> yaklaşımı "Kural 72"yi verir: <i>T</i> ≈ 72 / (100<i>r</i>). Yaklaşım, ln 2 ≈ 0,693 yerine 72 kullandığı için %8 dolayında en iyi sonucu verir; faiz yükseldikçe süreyi olduğundan kısa gösterir.</div>`},
 {k:'o',type:'ornek',title:'Anka Makine mevduata 100.000 TL yatırıyor',html:()=>{
  let rows='',b=1e5;for(let t=1;t<=3;t++){const fz=b*.25;rows+=`<tr><td>${t}</td><td>${tl(b,2)}</td><td>${tl(fz,2)}</td><td>${tl(b+fz,2)}</td></tr>`;b+=fz;}
  return `<p><b>Soru.</b> Anka Makine A.Ş. (kurgusal) 100.000 TL'lik nakit fazlasını yıllık %25 faizle 3 yıllığına değerlendiriyor. Vade sonunda hesapta ne kadar olur? Basit faizle ne olurdu?</p>
  <table class="tbl"><thead><tr><th>Yıl</th><th>Dönem başı</th><th>Faiz (%25)</th><th>Dönem sonu</th></tr></thead><tbody>${rows}</tbody></table>
  <p><b>Bileşik faiz:</b> <i>FV</i> = 100.000 × 1,25<sup>3</sup> = 100.000 × 1,953125 = <b>${tl(fv(1e5,.25,3),2)}</b>.</p>
  <p><b>Basit faiz:</b> <i>FV</i> = 100.000 × (1 + 0,25 × 3) = <b>${tl(175000,2)}</b>.</p>
  <p>Aradaki ${tl(fv(1e5,.25,3)-175000,2)} faizin faizidir. 2. yıldaki fazladan 6.250 TL, ilk yılın 25.000 TL faizinin faiz kazanmasından gelir; 3. yıldaki fazladan 14.062,50 TL ise birikmiş faizlerin faizidir.</p>
  <p><b>Ters yönde:</b> 3 yıl sonra alınacak ${tl(fv(1e5,.25,3),2)}'nin %25 iskonto oranıyla bugünkü değeri ${tl(fv(1e5,.25,3),2)} / 1,953125 = 100.000 TL'dir. Bileşikleştirme ile iskontolama aynı işlemin iki yönüdür.</p>`;}},
 {k:'k1',type:'kesif',core:true,title:'Basit ve bileşik faizle büyüme',mount:K_bilesik},
 {k:'k2',type:'kesif',core:true,title:'Bileşik sıklığı ve efektif yıllık faiz',mount:K_siklik},
 {k:'k3',type:'kesif',core:true,title:'Enflasyon ve reel faiz',mount:K_fisher},
 {k:'t',type:'turetim',title:'Formülleri kurmak: bileşik faiz ve annüite',html:()=>`
  <h3>1. Bileşik faiz formülü</h3>
  <p>Her yıl bakiye (1 + <i>r</i>) ile çarpılır:</p>
  <div class="eq"><i>FV</i><sub>1</sub> = <i>PV</i>(1 + <i>r</i>) &nbsp;→&nbsp; <i>FV</i><sub>2</sub> = <i>FV</i><sub>1</sub>(1 + <i>r</i>) = <i>PV</i>(1 + <i>r</i>)<sup>2</sup> &nbsp;→ … →&nbsp; <i>FV</i><sub><i>n</i></sub> = <i>PV</i>(1 + <i>r</i>)<sup><i>n</i></sup></div>
  <p>Basit faizde ise her yıl yalnızca <i>PV</i> · <i>r</i> eklenir; bu yüzden büyüme doğrusaldır.</p>
  <h3>2. Bileşik sıklığı</h3>
  <p>Yıllık nominal <i>r</i> faiz yılda <i>m</i> kez işletilirse dönem faizi <i>r</i>/<i>m</i>, dönem sayısı <i>m</i> olur:</p>
  <div class="eq"><i>EAR</i> = (1 + <i>r</i>/<i>m</i>)<sup><i>m</i></sup> − 1 <span class="yl-only">&nbsp;&nbsp;&nbsp; <i>m</i> → ∞ iken: <i>EAR</i> = <i>e</i><sup><i>r</i></sup> − 1</span></div>
  <h3>3. Annüite: eşit taksitlerin bugünkü değeri</h3>
  <p>Her yıl sonunda <i>C</i> tutarında, <i>n</i> yıl süren ödemelerin bugünkü değeri, ilk terimi <i>C</i>/(1 + <i>r</i>) ve oranı 1/(1 + <i>r</i>) olan bir geometrik seridir:</p>
  <div class="eq"><i>PV</i> = ${fr('<i>C</i>','1 + <i>r</i>')} + ${fr('<i>C</i>','(1 + <i>r</i>)<sup>2</sup>')} + … + ${fr('<i>C</i>','(1 + <i>r</i>)<sup><i>n</i></sup>')} = <i>C</i> · ${fr('1 − (1 + <i>r</i>)<sup>−<i>n</i></sup>','<i>r</i>')}</div>
  <p>Köşeli parantezdeki çarpana <b>annüite faktörü</b> denir. <i>n</i> → ∞ iken sürekli ödemenin (perpetüite) değeri <i>PV</i> = <i>C</i>/<i>r</i> olur.</p>
  <p><b>Uygulama (kredi taksiti):</b> 500.000 TL, 3 yıl vadeli, yıllık %40 faizli kredinin yıllık eşit taksiti <i>C</i> = 500.000 / ${nf(af(.4,3),4)} ≈ <b>${tl(500000/af(.4,3))}</b> olur. Kredi ödeme planının tamamı "Annüiteler ve kredi ödeme planı" dersinde ele alınacak.</p>
  <h3>4. Fisher denklemi</h3>
  <p>Nominal getiri hem reel getiriyi hem de enflasyonu karşılamalıdır: (1 + <i>i</i>) = (1 + <i>r</i><sub>reel</sub>)(1 + <i>π</i>). Sağ taraf açılınca 1 + <i>r</i><sub>reel</sub> + <i>π</i> + <i>r</i><sub>reel</sub><i>π</i> bulunur. <i>i</i> − <i>π</i> yaklaşımı çapraz terimi (<i>r</i><sub>reel</sub> · <i>π</i>) atar. Bu terim enflasyon yüksek olduğunda küçük değildir.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'50.000 TL yıllık %30 bileşik faizle 4 yıl değerlendirilirse vade sonunda kaç TL olur?',ans:fv(5e4,.3,4),unit:'TL',hint:'<i>FV</i> = <i>PV</i>(1 + <i>r</i>)<sup><i>n</i></sup>. Önce 1,30<sup>4</sup>\'ü hesaplayın.',sol:`1,30<sup>4</sup> = 2,8561 → 50.000 × 2,8561 = <b>${tl(fv(5e4,.3,4))}</b>.`},
  {id:2,tag:'hesap',p:'Anka Makine 3 yıl sonra 200.000 TL\'lik bir makine alacak. Yıllık %25 getirili bir hesaba bugün ne kadar yatırmalıdır?',ans:2e5/Math.pow(1.25,3),unit:'TL',hint:'Gelecek tutarı iskontolayın: <i>PV</i> = <i>FV</i> / (1 + <i>r</i>)<sup><i>n</i></sup>.',sol:`200.000 / 1,25<sup>3</sup> = 200.000 / 1,953125 = <b>${tl(2e5/Math.pow(1.25,3))}</b>.`},
  {id:3,tag:'hesap',p:'Bir banka yıllık nominal %36 faizi <b>aylık</b> bileşik olarak işletiyor. Efektif yıllık faiz yüzde kaçtır?',ans:(Math.pow(1.03,12)-1)*100,abs:0.1,unit:'%',hint:'Dönem faizi 0,36 / 12 = 0,03; dönem sayısı 12.',sol:`(1 + 0,03)<sup>12</sup> − 1 = ${nf(Math.pow(1.03,12),4)} − 1 → <b>${pc(Math.pow(1.03,12)-1,2)}</b>.`},
  {id:4,tag:'hesap',p:'Mevduat faizi %45, yıllık enflasyon %38. Fisher denklemine göre (kesin formülle) reel faiz yüzde kaçtır?',ans:(1.45/1.38-1)*100,abs:0.1,unit:'%',hint:'<i>r</i><sub>reel</sub> = (1 + <i>i</i>) / (1 + <i>π</i>) − 1.',sol:`1,45 / 1,38 − 1 = <b>${pc(1.45/1.38-1,2)}</b>. Yaklaşık formül %7 verir; hata yaklaşık 1,9 puandır.`},
  {id:5,tag:'kavram',p:'Faiz oranı yükselirse 5 yıl sonra alınacak sabit bir tutarın bugünkü değerine ne olur?',opts:['Artar','Azalır','Değişmez','Vadeye bağlı olarak artabilir de azalabilir de'],correct:1,hint:'Faiz oranı, bugünkü değer formülünde paydada yer alır.',sol:'<i>PV</i> = <i>FV</i>/(1 + <i>r</i>)<sup><i>n</i></sup>; <i>r</i> artınca payda büyür, bugünkü değer <b>azalır</b>.'},
  {id:6,tag:'hesap',p:'5 yıl boyunca her yıl sonunda 30.000 TL ödeyen bir kira sözleşmesinin, %20 iskonto oranıyla bugünkü değeri kaç TL\'dir?',ans:3e4*AF20_5,unit:'TL',hint:'Annüite formülünü kullanın: <i>C</i> · [1 − (1 + <i>r</i>)<sup>−<i>n</i></sup>] / <i>r</i>.',sol:`1,2<sup>5</sup> = 2,48832; [1 − 1/2,48832] / 0,2 = ${nf(AF20_5,4)} → 30.000 × ${nf(AF20_5,4)} = <b>${tl(3e4*AF20_5)}</b>.`},
  {id:7,tag:'grafik',p:'Basit faiz ve bileşik faiz keşfindeki grafikte, iki eğri arasındaki açıklık (faizin faizi) zaman geçtikçe nasıl değişir?',opts:['Sabit kalır','Daralır','Giderek genişler','Önce genişler, sonra daralır'],correct:2,hint:'Bileşik faiz üstel, basit faiz doğrusal büyür.',sol:'Üstel eğri doğrusal eğriden giderek uzaklaşır; açıklık <b>giderek genişler</b>.'},
  {id:8,tag:'hesap',yl:1,p:'100.000 TL, yıllık %30 <b>sürekli</b> bileşik faizle 2 yıl değerlendirilirse vade sonunda kaç TL olur?',ans:1e5*Math.exp(.6),unit:'TL',hint:'<i>FV</i> = <i>PV</i> · <i>e</i><sup><i>rn</i></sup>.',sol:`100.000 × <i>e</i><sup>0,6</sup> = 100.000 × ${nf(Math.exp(.6),5)} = <b>${tl(1e5*Math.exp(.6))}</b>.`}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary">
  <li>Farklı tarihlerdeki nakit akışları ancak <b>aynı tarihe taşındıktan sonra</b> karşılaştırılabilir ve toplanabilir.</li>
  <li>Bileşik faizde büyüme üsteldir. Basit faizle aradaki fark (faizin faizi) vade uzadıkça ve faiz yükseldikçe hızla büyür.</li>
  <li>Bileşik sıklığı arttıkça efektif yıllık faiz nominal faizi aşar: <i>EAR</i> = (1 + <i>r</i>/<i>m</i>)<sup><i>m</i></sup> − 1.</li>
  <li>Reel faiz (1 + <i>i</i>)/(1 + <i>π</i>) − 1'dir. <i>i</i> − <i>π</i> yaklaşımı yüksek enflasyonda büyük hata verir.</li>
  <li>Reel faiz negatifse nominal bakiye artarken satın alma gücü azalır.</li></ul>
  <div class="note tr">Türkiye'de 2021–2023 döneminde mevduat faizleri uzun süre enflasyonun altında kaldı. TL mevduatın nominal bakiyesi artarken satın alma gücü eridi. Bu, keşif 3'teki "negatif reel faiz" durumunun gerçek bir örneğidir.</div>
  <p class="lmeta">İzlence: Hafta 1–2 · ÖÇ1 (paranın zaman değeri kavramını günlük hayatta ve iş hayatındaki kararlarda kullanır).</p>`}
]},

tahvil:{title:'Tahvil değerlemesi ve faiz riski',sure:'40 dk',steps:[
 {k:'a',type:'anlatim',title:'Tahvil nedir, fiyatı nasıl belirlenir?',html:()=>`
  <p><b>Tahvil</b>, ihraç edenin (devlet ya da şirket) yatırımcıya belirli tarihlerde faiz (kupon) ve vade sonunda anapara ödemeyi taahhüt ettiği bir borç senedidir. Değerlemede dört kavram kullanılır:</p>
  <table class="tbl sym"><tbody><tr><td><i>F</i></td><td>Nominal (yüz) değer: vade sonunda geri ödenen anapara</td></tr>
  <tr><td><i>c</i></td><td>Kupon oranı; yıllık kupon <i>C</i> = <i>c</i> · <i>F</i></td></tr>
  <tr><td><i>n</i></td><td>Vadeye kalan yıl</td></tr>
  <tr><td><i>y</i></td><td>Piyasa getirisi ya da vadeye kadar getiri (YTM): benzer riskteki yatırımlardan beklenen getiri</td></tr></tbody></table>
  <p>Tahvilin fiyatı, gelecekte vaat ettiği nakit akışlarının piyasa getirisiyle iskontolanmış toplamıdır: kuponların bugünkü değeri (bir annüite) ile anaparanın bugünkü değerinin toplamı.</p>
  <div class="eq"><i>P</i> = <i>C</i> · ${fr('1 − (1 + <i>y</i>)<sup>−<i>n</i></sup>','<i>y</i>')} + ${fr('<i>F</i>','(1 + <i>y</i>)<sup><i>n</i></sup>')}</div>
  <p>Kupon oranı ile piyasa getirisinin karşılaştırılması tahvilin durumunu belirler:</p>
  <ul><li><i>y</i> &lt; <i>c</i> → <b>primli</b> (<i>P</i> &gt; <i>F</i>): tahvil piyasanın istediğinden yüksek kupon öder.</li>
  <li><i>y</i> = <i>c</i> → <b>başa baş</b> (<i>P</i> = <i>F</i>).</li>
  <li><i>y</i> &gt; <i>c</i> → <b>iskontolu</b> (<i>P</i> &lt; <i>F</i>).</li></ul>
  <p><b>Sıfır kuponlu tahvil</b> ara ödeme yapmaz: <i>P</i> = <i>F</i> / (1 + <i>y</i>)<sup><i>n</i></sup>.</p>
  <div class="note tr">Hazine'nin ihraç ettiği devlet iç borçlanma senetleri (DİBS) arasında hem iskontolu (kuponsuz) hem de kuponlu senetler bulunur. Kuponlu DİBS'ler genellikle altı ayda bir kupon öder. Bu simülatörde sadelik için yıllık kupon varsayılmıştır.</div>`},
 {k:'o',type:'ornek',title:'Anka Makine tahvil ihraç ediyor',html:()=>{const P=bondPrice(1000,.2,.25,5),A=af(.25,5);return `
  <p><b>Soru.</b> Anka Makine nominal değeri 1.000 TL, yıllık kupon oranı %20, vadesi 5 yıl olan bir tahvil ihraç ediyor. Benzer riskteki tahvillerde piyasa getirisi %25. Tahvilin fiyatı nedir?</p>
  <p><b>1. Kuponların bugünkü değeri:</b> Yıllık kupon <i>C</i> = 0,20 × 1.000 = 200 TL. Annüite faktörü (%25, 5 yıl) = [1 − 1,25<sup>−5</sup>] / 0,25 = ${nf(A,5)}. Kuponların bugünkü değeri 200 × ${nf(A,5)} = ${tl(200*A,2)}.</p>
  <p><b>2. Anaparanın bugünkü değeri:</b> 1.000 / 1,25<sup>5</sup> = 1.000 / ${nf(Math.pow(1.25,5),5)} = ${tl(1000/Math.pow(1.25,5),2)}.</p>
  <p><b>3. Fiyat:</b> <i>P</i> = ${tl(200*A,2)} + ${tl(1000/Math.pow(1.25,5),2)} = <b>${tl(P,2)}</b>.</p>
  <p>Piyasa getirisi (%25) kupon oranından (%20) yüksek olduğu için tahvil <b>iskontolu</b> satılır. Yatırımcı düşük kuponu, düşük fiyattan alarak telafi eder. Cari getiri 200 / ${nf(P,2)} = ${pc(200/P,2)}'dir. Fiyatın vadede 1.000 TL'ye yükselmesiyle elde edilen kazanç da eklenince toplam getiri %25'e ulaşır.</p>`;}},
 {k:'k1',type:'kesif',core:true,title:'Fiyat–getiri eğrisi: primli, başa baş, iskontolu',mount:K_fiyat},
 {k:'k2',type:'kesif',core:true,title:'Faiz riski: vade ve fiyat duyarlılığı',mount:K_faizriski},
 {k:'k3',type:'kesif',core:false,title:'Vadeye yaklaşma: fiyat nominal değere doğru gider',mount:K_yakinsama},
 {k:'t',type:'turetim',title:'Neden y = c iken fiyat nominal değere eşittir?',html:()=>`
  <p>Kupon <i>C</i> = <i>c</i> · <i>F</i> ve <i>y</i> = <i>c</i> olsun. Fiyat formülüne yerleştirelim:</p>
  <div class="eq"><i>P</i> = <i>cF</i> · ${fr('1 − (1 + <i>c</i>)<sup>−<i>n</i></sup>','<i>c</i>')} + <i>F</i>(1 + <i>c</i>)<sup>−<i>n</i></sup> = <i>F</i> − <i>F</i>(1 + <i>c</i>)<sup>−<i>n</i></sup> + <i>F</i>(1 + <i>c</i>)<sup>−<i>n</i></sup> = <i>F</i></div>
  <p>Kuponlar, yatırımcının istediği getiriyi tam olarak sağlar. Bu yüzden yatırımcı nominal değerden fazlasını ödemeye ya da daha azını kabul etmeye gerek görmez.</p>
  <h3>Faiz riski neden vadeyle artar?</h3>
  <p>Fiyat, her nakit akışının (1 + <i>y</i>)<sup>−<i>t</i></sup> ile iskontolanmış toplamıdır. <i>y</i> değiştiğinde uzak tarihli akışların iskonto faktörü daha çok değişir; uzun vadeli tahvilin değerinin büyük kısmı ise uzak tarihlerdedir.</p>
  <div class="note yl yl-only"><b>Macaulay süresi</b>, nakit akışlarının bugünkü değerleriyle ağırlıklandırılmış ortalama vadedir: <i>D</i> = Σ <i>t</i> · PV(<i>CF</i><sub><i>t</i></sub>) / <i>P</i>. <b>Düzeltilmiş süre</b> <i>D</i>* = <i>D</i> / (1 + <i>y</i>) olur ve birinci dereceden yaklaşım ΔP/P ≈ −<i>D</i>* · Δ<i>y</i> şeklindedir. Fiyat–getiri eğrisi dışbükey olduğu için bu yaklaşım faiz artışında düşüşü abartır, faiz düşüşünde artışı eksik gösterir. Konveksite düzeltmesiyle: ΔP/P ≈ −<i>D</i>* Δ<i>y</i> + ½ · <i>Konv</i> · (Δ<i>y</i>)<sup>2</sup>. Faiz riski keşfindeki son iki gösterge bu iki tahmini gerçek değişimle karşılaştırır.</div>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'Nominal değeri 1.000 TL, kupon oranı %10, vadesi 3 yıl olan tahvilin piyasa getirisi %12. Tahvilin fiyatı kaç TL\'dir?',ans:bondPrice(1000,.1,.12,3),unit:'TL',hint:'Kupon 100 TL. Kuponların bugünkü değerini (annüite) ve anaparanın bugünkü değerini ayrı ayrı hesaplayıp toplayın.',sol:`Annüite faktörü (%12, 3) = ${nf(af(.12,3),4)} → 100 × ${nf(af(.12,3),4)} = ${nf(100*af(.12,3),2)}; 1.000 / 1,12<sup>3</sup> = ${nf(1000/Math.pow(1.12,3),2)}. Fiyat = <b>${tl(bondPrice(1000,.1,.12,3),2)}</b>.`},
  {id:2,tag:'kavram',p:'Kupon oranı %20 olan bir tahvilde piyasa getirisi %30\'a çıkarsa tahvil nasıl işlem görür?',opts:['Primli','Başa baş','İskontolu','Kupon oranına bakmadan söylenemez'],correct:2,hint:'Piyasa getirisini kupon oranıyla karşılaştırın.',sol:'<i>y</i> = %30 &gt; <i>c</i> = %20 → fiyat nominal değerin altında: <b>iskontolu</b>.'},
  {id:3,tag:'hesap',p:'Nominal değeri 1.000 TL olan 4 yıl vadeli sıfır kuponlu tahvilin piyasa getirisi %30. Fiyatı kaç TL\'dir?',ans:1000/Math.pow(1.3,4),unit:'TL',hint:'Tek nakit akışı vade sonundaki 1.000 TL\'dir.',sol:`1.000 / 1,3<sup>4</sup> = 1.000 / 2,8561 = <b>${tl(1000/Math.pow(1.3,4),2)}</b>.`},
  {id:4,tag:'grafik',p:'Kupon oranları aynı olan 2 yıllık ve 20 yıllık iki tahvilde piyasa faizi 3 puan artarsa hangisinin fiyatı yüzde olarak daha çok düşer?',opts:['2 yıllık','20 yıllık','İkisi eşit düşer','İkisinin de fiyatı artar'],correct:1,hint:'Faiz riski keşfinde turuncu eğrinin eğimine bakın.',sol:'Uzun vadeli tahvilin nakit akışlarının büyük kısmı uzak tarihlerdedir; fiyatı faize daha duyarlıdır: <b>20 yıllık</b>.'},
  {id:5,tag:'hesap',p:'Kupon oranı %15 olan 5 yıl vadeli bir tahvil tam 1.000 TL\'den (nominal değerinden) işlem görüyor. Vadeye kadar getirisi yüzde kaçtır?',ans:15,abs:0.1,unit:'%',hint:'Tahvil başa baş işlem görüyorsa YTM ile kupon oranı arasında nasıl bir ilişki vardır?',sol:'Başa baş tahvilde <i>y</i> = <i>c</i> → YTM = <b>%15</b>.'},
  {id:6,tag:'grafik',p:'Piyasa getirisi sabit kalırsa primli bir tahvilin fiyatı vadeye yaklaştıkça ne olur?',opts:['Artmaya devam eder','Nominal değere doğru düşer','Sabit kalır','Önce düşer, sonra artar'],correct:1,hint:'Vadeye yaklaşma keşfindeki %30 kuponlu tahvilin yoluna bakın.',sol:'Vade sonunda fiyat nominal değere eşit olmak zorundadır; primli tahvilin fiyatı <b>nominal değere doğru düşer</b>.'},
  {id:7,tag:'hesap',yl:1,p:'Kupon oranı %10, vadesi 2 yıl, YTM %10 olan tahvilin Macaulay süresi kaç yıldır? (2 ondalık)',ans:bondRisk(1000,.1,.1,2).D,abs:0.01,unit:'yıl',hint:'Nakit akışları: 1. yıl 100, 2. yıl 1.100. Ağırlık = PV(CF<sub>t</sub>) / P.',sol:`PV: 90,91 ve 909,09; P = 1.000. <i>D</i> = (1 × 90,91 + 2 × 909,09) / 1.000 = <b>${nf(bondRisk(1000,.1,.1,2).D,3)} yıl</b>.`}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary">
  <li>Tahvil fiyatı, kuponların ve anaparanın piyasa getirisiyle iskontolanmış toplamıdır.</li>
  <li>Fiyat ile getiri ters yönde hareket eder; ilişki doğrusal değil, <b>dışbükeydir</b>.</li>
  <li><i>y</i> &lt; <i>c</i> primli, <i>y</i> = <i>c</i> başa baş, <i>y</i> &gt; <i>c</i> iskontolu.</li>
  <li>Vade uzadıkça (ve kupon düştükçe) fiyatın faiz değişimine duyarlılığı artar: <b>faiz riski</b>.</li>
  <li>Getiri sabit kaldığında fiyat vadeye yaklaştıkça nominal değere gider.</li>
  <li class="yl-only">Süre (duration) fiyat duyarlılığının birinci dereceden ölçüsüdür; konveksite eğriliği düzeltir.</li></ul>
  <p class="lmeta">İzlence: Hafta 5–6 · ÖÇ3 (finansal varlıkların değer hesaplamalarını yapar).</p>`}
]},

nbd:{title:'Yatırım projeleri: NBD, İVO ve geri ödeme süresi',sure:'45 dk',steps:[
 {k:'a',type:'anlatim',title:'Sermaye bütçelemesi ve karar ölçütleri',html:()=>`
  <p><b>Sermaye bütçelemesi</b>, getirisi birden çok yıla yayılan yatırımların (yeni makine, tesis, ürün hattı) değerlendirilmesidir. Temel soru şudur: Proje, aynı riskteki alternatif bir yatırımdan daha fazla değer yaratıyor mu? Alternatif yatırımın getirisi projenin <b>sermaye maliyetidir</b> (<i>r</i>): sermayenin fırsat maliyeti.</p>
  <h3>Net bugünkü değer (NBD)</h3>
  <div class="eq"><i>NBD</i> = <i>CF</i><sub>0</sub> + ${fr('<i>CF</i><sub>1</sub>','(1 + <i>r</i>)')} + ${fr('<i>CF</i><sub>2</sub>','(1 + <i>r</i>)<sup>2</sup>')} + … + ${fr('<i>CF</i><sub><i>n</i></sub>','(1 + <i>r</i>)<sup><i>n</i></sup>')}</div>
  <p><b>Karar:</b> NBD &gt; 0 ise proje kabul edilir. NBD, projenin işletmeye bugünkü TL cinsinden kattığı değerdir.</p>
  <h3>İç verim oranı (İVO)</h3>
  <p>NBD'yi sıfır yapan iskonto oranıdır. <b>Karar:</b> İVO &gt; <i>r</i> ise proje kabul edilir. İVO'nun formülü yoktur; deneme-yanılmayla ya da sayısal yöntemle bulunur.</p>
  <h3>Geri ödeme süresi</h3>
  <p>Yatırım tutarının nakit girişleriyle kaç yılda geri kazanıldığını gösterir. Hesabı kolaydır ama iki önemli zayıflığı vardır: paranın zaman değerini dikkate almaz ve geri ödeme tarihinden sonraki nakit akışlarını tamamen yok sayar. <b>İskontolu geri ödeme süresi</b> ilk sorunu giderir, ikincisini gidermez.</p>
  <h3>Kârlılık endeksi</h3>
  <p>Nakit girişlerinin bugünkü değerinin yatırıma oranıdır. Endeks 1'den büyükse NBD pozitiftir.</p>`},
 {k:'o',type:'ornek',title:'Anka Makine\'nin CNC hattı projesi',html:()=>{const C=[-1e6,35e4,35e4,35e4,35e4,35e4],N=npv(.2,C),I=irrAll(C)[0];return `
  <p><b>Soru.</b> Anka Makine 1.000.000 TL'lik bir CNC hattı almayı düşünüyor. Hat 5 yıl boyunca her yıl 350.000 TL net nakit girişi sağlayacak. Sermaye maliyeti %20. Proje kabul edilmeli mi?</p>
  <p><b>NBD:</b> Girişler eşit olduğu için annüite faktörü kullanılır: AF(%20, 5) = ${nf(AF20_5,4)}. Girişlerin bugünkü değeri 350.000 × ${nf(AF20_5,4)} = ${tl(35e4*AF20_5)}. NBD = ${tl(35e4*AF20_5)} − 1.000.000 = <b>${tl(N)}</b> &gt; 0 → <b>kabul</b>.</p>
  <p><b>İVO:</b> AF(İVO, 5) = 1.000.000 / 350.000 = 2,8571 olmalıdır. %22'de AF = ${nf(af(.22,5),4)}, %23'te AF = ${nf(af(.23,5),4)}. İVO bu ikisinin arasındadır; sayısal çözüm <b>${pc(I,2)}</b>. İVO &gt; %20 → <b>kabul</b>. İki ölçüt aynı kararı verir.</p>
  <p><b>Geri ödeme süresi:</b> 1.000.000 / 350.000 = ${nf(1e6/35e4,2)} yıl. <b>İskontolu geri ödeme:</b> ${nf(payback(C,.2),2)} yıl. Kârlılık endeksi ${nf(35e4*AF20_5/1e6,3)}.</p>`;}},
 {k:'k1',type:'kesif',core:true,title:'NBD profili ve İVO',mount:K_nbd},
 {k:'k2',type:'kesif',core:true,title:'NBD ile İVO çatıştığında',mount:K_siralama},
 {k:'k3',type:'kesif',core:false,level:'yl',title:'Alışılmadık nakit akışları ve çoklu İVO',mount:K_coklu},
 {k:'t',type:'turetim',title:'NBD profili neden azalır, ölçütler neden çatışır?',html:()=>`
  <p><b>Konvansiyonel</b> projede önce çıkış, sonra girişler gelir (−, +, +, …). <i>r</i> arttıkça her girişin bugünkü değeri düşer, yatırım ise bugün yapıldığı için iskontolanmaz. Bu yüzden NBD, <i>r</i>'nin azalan bir fonksiyonudur ve yatay ekseni bir kez keser. Bu noktada İVO = <i>r</i> olur. Dolayısıyla <b>bağımsız ve konvansiyonel</b> bir projede iki ölçüt hep aynı kararı verir: <i>r</i> &lt; İVO ⇔ NBD &gt; 0.</p>
  <h3>Birbirini dışlayan projelerde çatışma</h3>
  <p>Projelerden yalnızca biri seçilecekse ölçütler farklı sonuç verebilir. Bunun iki nedeni vardır:</p>
  <ul><li><b>Zamanlama:</b> Nakdi geç gelen projenin NBD'si iskonto oranına daha duyarlıdır; profili daha diktir. İki profil <b>Fisher kesişim oranında</b> kesişir. Bu oranın altında NBD sıralaması İVO sıralamasından farklıdır.</li>
  <li><b>Ölçek:</b> İVO bir orandır, büyüklüğü göstermez. Küçük bir proje yüksek İVO'ya, büyük bir proje ise daha yüksek NBD'ye sahip olabilir.</li></ul>
  <p>Böyle durumlarda <b>NBD'ye göre karar verilir</b>, çünkü hissedarın servetine eklenen TL tutarını ölçer. İVO ise ara nakit akışlarının yine İVO ile yeniden yatırılabileceğini örtük olarak varsayar; bu çoğu zaman gerçekçi değildir.</p>
  <div class="note yl yl-only"><b>Düzeltilmiş İVO (MİVO):</b> Olumlu akışlar proje sonuna yeniden yatırım oranıyla taşınır, olumsuz akışlar bugüne finansman oranıyla indirilir: MİVO = (FV<sub>girişler</sub> / PV<sub>çıkışlar</sub>)<sup>1/<i>n</i></sup> − 1. MİVO tek bir değer verir ve yeniden yatırım varsayımını açık hâle getirir. Nakit akışının işareti birden fazla kez değişiyorsa (Descartes işaret kuralı) NBD = 0 denkleminin birden çok kökü olabilir. Bu durumda İVO tek başına karar ölçütü olamaz.</div>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'Bir proje bugün 500.000 TL yatırım gerektiriyor ve 3 yıl boyunca her yıl 200.000 TL nakit girişi sağlıyor. Sermaye maliyeti %15. Projenin NBD\'si kaç TL\'dir?',ans:npv(.15,[-5e5,2e5,2e5,2e5]),unit:'TL',hint:'Girişler eşit: annüite faktörü AF(%15, 3) kullanın. NBD negatif çıkabilir; eksi işaretiyle yazın.',sol:`AF(%15, 3) = ${nf(af(.15,3),4)} → 200.000 × ${nf(af(.15,3),4)} = ${tl(2e5*af(.15,3))}; NBD = <b>${tl(npv(.15,[-5e5,2e5,2e5,2e5]))}</b> → ret.`},
  {id:2,tag:'hesap',p:'Yatırım 600.000 TL; yıllık nakit girişleri sırasıyla 150.000, 200.000, 250.000 ve 300.000 TL. Geri ödeme süresi kaç yıldır?',ans:3,abs:0.01,unit:'yıl',hint:'Girişleri yıl yıl toplayın ve 600.000 TL\'ye ulaşılan noktayı bulun.',sol:'Kümülatif: 150.000 → 350.000 → 600.000. Yatırım tam 3. yılın sonunda geri kazanılır: <b>3 yıl</b>.'},
  {id:3,tag:'kavram',p:'Konvansiyonel bir projenin sermaye maliyetiyle hesaplanan NBD\'si pozitifse İVO için ne söylenebilir?',opts:['İVO sermaye maliyetinden küçüktür','İVO sermaye maliyetine eşittir','İVO sermaye maliyetinden büyüktür','İVO negatiftir'],correct:2,hint:'NBD profili azalan bir eğridir ve yatay ekseni İVO\'da keser.',sol:'NBD(<i>r</i>) &gt; 0 ve profil azalan olduğuna göre sıfır noktası <i>r</i>\'nin sağındadır: <b>İVO &gt; <i>r</i></b>.'},
  {id:4,tag:'grafik',p:'Birbirini dışlayan A ve B projelerinin NBD profilleri %12\'de kesişiyor. A\'nın İVO\'su daha yüksek; %12\'nin altında B\'nin NBD\'si daha yüksek. Sermaye maliyeti %8 ise hangi proje seçilmeli?',opts:['A, çünkü İVO\'su yüksek','B, çünkü NBD\'si yüksek','İkisi de reddedilmeli','Fark etmez'],correct:1,hint:'Çatışma durumunda hangi ölçüt hissedar servetini doğrudan ölçer?',sol:'%8 kesişim oranının altında: NBD B\'yi seçer. Çatışmada NBD esas alınır → <b>B</b>.'},
  {id:5,tag:'hesap',p:'Bugün 1.000 TL yatırılan, 1. yıl hiçbir nakit getirmeyen ve 2. yıl sonunda 1.210 TL getiren projenin İVO\'su yüzde kaçtır?',ans:10,abs:0.1,unit:'%',hint:'1.000 × (1 + İVO)<sup>2</sup> = 1.210.',sol:'(1.210 / 1.000)<sup>1/2</sup> − 1 = 1,1 − 1 = <b>%10</b>.'},
  {id:6,tag:'kavram',p:'Aşağıdakilerden hangisi geri ödeme süresi yönteminin temel zayıflığıdır?',opts:['Hesaplanması çok zordur','Geri ödeme tarihinden sonraki nakit akışlarını yok sayar','Her zaman NBD ile aynı sonucu verir','Yalnızca eşit nakit akışlarında kullanılabilir'],correct:1,hint:'İki yöntemi düşünün: biri 3. yılda geri ödüyor ve bitiyor, diğeri 3,5. yılda geri ödüyor ama 10 yıl daha nakit getiriyor.',sol:'Geri ödeme süresi, yatırım geri kazanıldıktan sonraki bütün akışları <b>yok sayar</b>; paranın zaman değerini de dikkate almaz.'},
  {id:7,tag:'hesap',yl:1,p:'Nakit akışları −100, +230, −132 olan projenin, yeniden yatırım ve finansman oranının %15 olduğu durumda MİVO\'su yüzde kaçtır? (2 ondalık)',ans:mirr([-100,230,-132],.15)*100,abs:0.05,unit:'%',hint:'FV<sub>girişler</sub> = 230 × 1,15; PV<sub>çıkışlar</sub> = 100 + 132 / 1,15<sup>2</sup>.',sol:`FV = 264,50; PV = 100 + 99,81 = 199,81. MİVO = (264,50 / 199,81)<sup>1/2</sup> − 1 = <b>${pc(mirr([-100,230,-132],.15),2)}</b>.`}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary">
  <li>NBD, projenin değere katkısını bugünkü TL ile ölçer; NBD &gt; 0 ise kabul edilir.</li>
  <li>İVO, NBD'yi sıfırlayan orandır; bağımsız ve konvansiyonel projelerde NBD ile aynı kararı verir.</li>
  <li>Birbirini dışlayan projelerde zamanlama ya da ölçek farkı ölçütleri çatıştırabilir. Bu durumda NBD esas alınır.</li>
  <li>Geri ödeme süresi likidite hakkında fikir verir ama zaman değerini ve sonraki nakit akışlarını göz ardı eder.</li>
  <li class="yl-only">İşaret birden çok kez değişiyorsa birden çok İVO olabilir; MİVO ya da NBD kullanılır.</li></ul>
  <p class="lmeta">İzlence: Hafta 7–8 · ÖÇ2 (sermaye bütçelemesi konusuna hâkim olur) ve ÖÇ4 (yatırım projeleri analizi yapar).</p>`}
]},

portfoy:{title:'Risk, getiri ve portföy çeşitlendirmesi',sure:'40 dk',steps:[
 {k:'a',type:'anlatim',title:'Getiri, risk ve portföy',html:()=>`
  <p>Bir yatırımın dönem getirisi fiyat değişimi ile nakit getirisinin toplamıdır: <i>R</i> = (<i>P</i><sub>1</sub> − <i>P</i><sub>0</sub> + <i>D</i>) / <i>P</i><sub>0</sub>. Gelecek belirsiz olduğu için olası senaryolar ve olasılıkları üzerinden düşünülür:</p>
  <div class="eq"><i>E</i>(<i>R</i>) = Σ <i>p</i><sub><i>s</i></sub> <i>R</i><sub><i>s</i></sub> &nbsp;&nbsp;&nbsp;&nbsp; σ<sup>2</sup> = Σ <i>p</i><sub><i>s</i></sub> [<i>R</i><sub><i>s</i></sub> − <i>E</i>(<i>R</i>)]<sup>2</sup></div>
  <p>Standart sapma (σ), getirinin beklenen değerden ne kadar saptığını gösterir; finansta <b>toplam riskin</b> ölçüsü olarak kullanılır.</p>
  <h3>İki varlıklı portföy</h3>
  <p>Portföyün beklenen getirisi, varlıkların beklenen getirilerinin ağırlıklı ortalamasıdır. Riski ise ağırlıklı ortalama değildir; <b>korelasyona</b> (ρ) bağlıdır:</p>
  <div class="eq"><i>E</i>(<i>R</i><sub><i>p</i></sub>) = <i>w</i><sub>A</sub><i>E</i>(<i>R</i><sub>A</sub>) + <i>w</i><sub>B</sub><i>E</i>(<i>R</i><sub>B</sub>) &nbsp;&nbsp;&nbsp; σ<sub><i>p</i></sub><sup>2</sup> = <i>w</i><sub>A</sub><sup>2</sup>σ<sub>A</sub><sup>2</sup> + <i>w</i><sub>B</sub><sup>2</sup>σ<sub>B</sub><sup>2</sup> + 2<i>w</i><sub>A</sub><i>w</i><sub>B</sub>ρσ<sub>A</sub>σ<sub>B</sub></div>
  <p>ρ &lt; 1 olduğu sürece portföyün riski, varlık risklerinin ağırlıklı ortalamasından küçüktür. Buna <b>çeşitlendirme</b> denir.</p>
  <h3>Sistematik ve sistematik olmayan risk</h3>
  <p>Firmaya özgü riskler (bir grev, bir ürünün başarısızlığı) çok sayıda varlık bir araya getirilince birbirini götürür. Bütün varlıkları etkileyen piyasa çapındaki riskler (faiz, kur, büyüme) ise çeşitlendirmeyle giderilemez. Yatırımcı yalnızca <b>sistematik risk</b> için prim bekleyebilir. Bu düşünce, Finans II'de işlenecek sermaye varlıklarını fiyatlama modelinin (CAPM) temelidir.</p>`},
 {k:'o',type:'ornek',title:'Hisse fonu ve tahvil fonundan portföy',html:()=>{const E=.6*.3+.4*.22,v=.36*.16+.16*.01+2*.6*.4*.2*.4*.1;return `
  <p><b>Soru.</b> Anka Makine'nin emeklilik fonu varlıklarının %60'ını A hisse senedi fonuna (<i>E</i> = %30, σ = %40), %40'ını B tahvil fonuna (<i>E</i> = %22, σ = %10) yatırıyor. İki fon arasındaki korelasyon 0,2. Portföyün beklenen getirisi ve riski nedir? <span class="lmeta">(Sayılar öğretim amaçlı ve nominaldir.)</span></p>
  <p><b>Beklenen getiri:</b> 0,6 × 30 + 0,4 × 22 = <b>%${nf(E*100,1)}</b>.</p>
  <p><b>Varyans:</b> 0,6<sup>2</sup> × 0,40<sup>2</sup> + 0,4<sup>2</sup> × 0,10<sup>2</sup> + 2 × 0,6 × 0,4 × 0,2 × 0,40 × 0,10 = 0,0576 + 0,0016 + 0,00384 = ${nf(v,5)}.</p>
  <p><b>Standart sapma:</b> √${nf(v,5)} = <b>${pc(Math.sqrt(v),2)}</b>.</p>
  <p>Risklerin ağırlıklı ortalaması 0,6 × 40 + 0,4 × 10 = %28 olurdu. Portföyün riski bundan ${pp(.28-Math.sqrt(v),2)} daha düşüktür. Bu fark, korelasyonun 1'den küçük olmasının sağladığı <b>çeşitlendirme kazancıdır</b>.</p>`;}},
 {k:'k1',type:'kesif',core:true,title:'Korelasyon ve çeşitlendirme',mount:K_korelasyon},
 {k:'k2',type:'kesif',core:true,title:'Hisse sayısı ve sistematik risk',mount:K_cesit},
 {k:'t',type:'turetim',title:'Portföy varyansı ve sıfır risk ağırlığı',html:()=>`
  <p>Portföy getirisi <i>R</i><sub><i>p</i></sub> = <i>w</i><i>R</i><sub>A</sub> + (1 − <i>w</i>)<i>R</i><sub>B</sub>. Varyans kuralı Var(<i>aX</i> + <i>bY</i>) = <i>a</i><sup>2</sup>Var(<i>X</i>) + <i>b</i><sup>2</sup>Var(<i>Y</i>) + 2<i>ab</i>Cov(<i>X</i>,<i>Y</i>) ve Cov = ρσ<sub>A</sub>σ<sub>B</sub> kullanılınca anlatımdaki formül elde edilir.</p>
  <h3>İki uç durum</h3>
  <p><b>ρ = +1:</b> Varyans tam kareye dönüşür: σ<sub><i>p</i></sub><sup>2</sup> = (<i>w</i>σ<sub>A</sub> + (1 − <i>w</i>)σ<sub>B</sub>)<sup>2</sup>. Risk, ağırlıklı ortalamaya eşittir ve çeşitlendirmeden kazanç olmaz (grafikteki kesikli doğru).</p>
  <p><b>ρ = −1:</b> σ<sub><i>p</i></sub> = |<i>w</i>σ<sub>A</sub> − (1 − <i>w</i>)σ<sub>B</sub>|. Bu ifade şu ağırlıkta sıfırlanır:</p>
  <div class="eq"><i>w</i>* = ${fr('σ<sub>B</sub>','σ<sub>A</sub> + σ<sub>B</sub>')} = ${fr('10','40 + 10')} = %20</div>
  <h3>Eşit ağırlıklı <i>N</i> varlık</h3>
  <p>Her varlığın riski σ, ortalama korelasyon ρ̄ ise σ<sub><i>p</i></sub><sup>2</sup> = σ<sup>2</sup>/<i>N</i> + (1 − 1/<i>N</i>)ρ̄σ<sup>2</sup>. <i>N</i> büyüdükçe ilk terim sıfıra gider ve geriye ρ̄σ<sup>2</sup> kalır. Bu kalan kısım çeşitlendirilemeyen <b>sistematik risktir</b>.</p>
  <div class="note yl yl-only"><b>Minimum varyans portföyü:</b> dσ<sub><i>p</i></sub><sup>2</sup>/d<i>w</i> = 0 koşulundan <i>w</i>* = (σ<sub>B</sub><sup>2</sup> − ρσ<sub>A</sub>σ<sub>B</sub>) / (σ<sub>A</sub><sup>2</sup> + σ<sub>B</sub><sup>2</sup> − 2ρσ<sub>A</sub>σ<sub>B</sub>) bulunur. ρ &gt; σ<sub>B</sub>/σ<sub>A</sub> olduğunda <i>w</i>* &lt; 0 çıkar; bu, riskli varlığın açığa satılmasını gerektirir. Minimum varyans noktasının üstündeki kısım <b>etkin sınırdır</b>. Risksiz varlık eklendiğinde en yüksek Sharpe oranlı teğet portföy ve sermaye piyasası doğrusu elde edilir.</div>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'Bir hisse için senaryolar: kriz (olasılık 0,3) getiri −%10; normal (0,5) %20; büyüme (0,2) %50. Beklenen getiri yüzde kaçtır?',ans:17,abs:0.1,unit:'%',hint:'Her getiriyi olasılığıyla çarpıp toplayın.',sol:'0,3 × (−10) + 0,5 × 20 + 0,2 × 50 = −3 + 10 + 10 = <b>%17</b>.'},
  {id:2,tag:'hesap',p:'Aynı hissenin getirisinin standart sapması yüzde kaçtır?',ans:21,abs:0.1,unit:'%',hint:'Sapmalar −27, 3 ve 33 puan. Kareleri olasılıklarla ağırlıklandırın.',sol:'0,3 × 729 + 0,5 × 9 + 0,2 × 1.089 = 218,7 + 4,5 + 217,8 = 441 → σ = √441 = <b>%21</b>.'},
  {id:3,tag:'hesap',p:'%70 A (<i>E</i> = %30) ve %30 B (<i>E</i> = %22) içeren portföyün beklenen getirisi yüzde kaçtır?',ans:27.6,abs:0.05,unit:'%',hint:'Beklenen getiri ağırlıklı ortalamadır.',sol:'0,7 × 30 + 0,3 × 22 = 21 + 6,6 = <b>%27,6</b>.'},
  {id:4,tag:'hesap',p:'σ<sub>A</sub> = %40, σ<sub>B</sub> = %10, ρ = 0 ve ağırlıklar %50–%50 ise portföyün standart sapması yüzde kaçtır? (2 ondalık)',ans:Math.sqrt(.25*.16+.25*.01)*100,abs:0.05,unit:'%',hint:'ρ = 0 iken kovaryans terimi kaybolur.',sol:`σ<sub><i>p</i></sub><sup>2</sup> = 0,25 × 0,16 + 0,25 × 0,01 = 0,0425 → σ<sub><i>p</i></sub> = <b>${pc(Math.sqrt(.0425),2)}</b>.`},
  {id:5,tag:'grafik',p:'Korelasyon +1 iken iki varlığı birleştirmek portföy riskini ağırlıklı ortalamanın altına indirebilir mi?',opts:['Evet, her zaman','Hayır; risk tam olarak ağırlıklı ortalamaya eşittir','Yalnızca ağırlıklar eşitse','Yalnızca beklenen getiriler eşitse'],correct:1,hint:'Keşif 1\'deki kesikli doğruyu hatırlayın.',sol:'ρ = +1 iken σ<sub><i>p</i></sub> = <i>w</i>σ<sub>A</sub> + (1 − <i>w</i>)σ<sub>B</sub>; çeşitlendirme kazancı <b>yoktur</b>.'},
  {id:6,tag:'kavram',p:'Portföydeki hisse sayısı çok arttırıldığında hangi risk ortadan kalkmaz?',opts:['Firmaya özgü risk','Sistematik (piyasa) risk','Toplam risk tamamen ortadan kalkar','Hiçbiri; her iki risk de kalır'],correct:1,hint:'Keşif 2\'deki yatay kesikli çizgi neyi gösteriyordu?',sol:'Bütün varlıkları birlikte etkileyen <b>sistematik risk</b> çeşitlendirmeyle giderilemez.'},
  {id:7,tag:'hesap',yl:1,p:'σ<sub>A</sub> = %40, σ<sub>B</sub> = %10, ρ = 0 iken minimum varyans portföyünde A\'nın ağırlığı yüzde kaçtır? (2 ondalık)',ans:100*.01/.17,abs:0.05,unit:'%',hint:'<i>w</i>* = (σ<sub>B</sub><sup>2</sup> − ρσ<sub>A</sub>σ<sub>B</sub>) / (σ<sub>A</sub><sup>2</sup> + σ<sub>B</sub><sup>2</sup> − 2ρσ<sub>A</sub>σ<sub>B</sub>).',sol:`<i>w</i>* = 0,01 / (0,16 + 0,01) = <b>${pc(.01/.17,2)}</b>.`}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary">
  <li>Beklenen getiri olasılık ağırlıklı ortalamadır; standart sapma toplam riski ölçer.</li>
  <li>Portföyün beklenen getirisi ağırlıklı ortalamadır, riski ise korelasyona bağlıdır.</li>
  <li>ρ &lt; 1 olduğu sürece çeşitlendirme riski azaltır. ρ = −1 iken risk tamamen sıfırlanabilir.</li>
  <li>Varlık sayısı arttıkça firmaya özgü risk kaybolur, sistematik risk kalır. Piyasa yalnızca sistematik riski ödüllendirir.</li>
  <li>Bir sonraki adım: sermayenin fırsat maliyeti ve Finans II'deki CAPM.</li></ul>
  <p class="lmeta">İzlence: Hafta 11–12 · ÖÇ6 (portföy risk ve getirisini hesaplar).</p>`}
]},

basabas:{title:'Başabaş ve kaldıraç analizi',sure:'40 dk',steps:[
 {k:'a',type:'anlatim',title:'Maliyet yapısı, başabaş ve kaldıraç',html:()=>`
  <div class="note">Bu ders, izlencenin <b>ders içeriğinde</b> yer alıp haftalık planda karşılığı olmayan "başabaş ve kaldıraç analizleri" konusunu kapsar. Konu, 13–14. haftalardaki <b>sermaye bütçesinde risk analizi</b> ile ilişkilendirilmiştir (ÖÇ7).</div>
  <p>Maliyetler iki gruba ayrılır. <b>Sabit maliyetler</b> (<i>F</i>: kira, amortisman, yönetim giderleri) üretim miktarına bağlı değildir. <b>Değişken maliyetler</b> (<i>v</i> · <i>Q</i>: hammadde, enerji, parça başı işçilik) ise miktarla birlikte artar. Birim fiyat ile birim değişken maliyet arasındaki fark (<i>P</i> − <i>v</i>) <b>birim katkı payıdır</b>: her ek satışın sabit maliyetleri karşılamaya ve kâra katkısı.</p>
  <h3>Başabaş noktası</h3>
  <div class="eq"><i>FVÖK</i> = <i>Q</i>(<i>P</i> − <i>v</i>) − <i>F</i> = 0 &nbsp;⇒&nbsp; <i>Q</i><sub>BE</sub> = ${fr('<i>F</i>','<i>P</i> − <i>v</i>')} &nbsp;&nbsp;&nbsp; Başabaş cirosu = ${fr('<i>F</i>','1 − <i>v</i>/<i>P</i>')}</div>
  <p><b>Güvenlik marjı</b> (<i>Q</i> − <i>Q</i><sub>BE</sub>) / <i>Q</i>, satışların zarara girmeden yüzde kaç düşebileceğini gösterir.</p>
  <h3>Faaliyet kaldıracı</h3>
  <p>Sabit maliyetler, satışlardaki değişimin FVÖK'e (faiz ve vergi öncesi kâr) <b>büyütülerek</b> yansımasına yol açar:</p>
  <div class="eq"><i>DOL</i> = ${fr('%Δ<i>FVÖK</i>','%Δ<i>Q</i>')} = ${fr('<i>Q</i>(<i>P</i> − <i>v</i>)','<i>Q</i>(<i>P</i> − <i>v</i>) − <i>F</i>')}</div>
  <h3>Finansal ve birleşik kaldıraç</h3>
  <p>Borcun faiz gideri (<i>I</i>), FVÖK'teki değişimin hisse başına kâra (HBK) büyütülerek yansımasına yol açar:</p>
  <div class="eq"><i>DFL</i> = ${fr('%Δ<i>HBK</i>','%Δ<i>FVÖK</i>')} = ${fr('<i>FVÖK</i>','<i>FVÖK</i> − <i>I</i>')} &nbsp;&nbsp;&nbsp; <i>DCL</i> = <i>DOL</i> × <i>DFL</i></div>
  <p>Kaldıraç iki yönlü çalışır: satışlar arttığında kârı, azaldığında zararı büyütür. Bu nedenle kaldıraç derecesi bir <b>risk göstergesidir</b>.</p>`},
 {k:'o',type:'ornek',title:'Anka Makine\'nin maliyet yapısı',html:()=>`
  <p><b>Soru.</b> Anka Makine bir ürünü 500 TL'ye satıyor; birim değişken maliyet 300 TL, yıllık sabit maliyet 400.000 TL. Satışlar 3.000 adet, faiz gideri 50.000 TL, örnek vergi oranı %25, hisse sayısı 100.000. Başabaş noktasını ve kaldıraç derecelerini bulun.</p>
  <p><b>Başabaş:</b> Katkı payı 500 − 300 = 200 TL → <i>Q</i><sub>BE</sub> = 400.000 / 200 = <b>2.000 adet</b> (ciro 1.000.000 TL). Güvenlik marjı (3.000 − 2.000) / 3.000 = %33,3.</p>
  <p><b>FVÖK:</b> 3.000 × 200 − 400.000 = 200.000 TL. <b>DOL</b> = 600.000 / 200.000 = <b>3</b>.</p>
  <p><b>DFL</b> = 200.000 / (200.000 − 50.000) = <b>1,333</b>. <b>DCL</b> = 3 × 1,333 = <b>4</b>.</p>
  <p><b>Sağlama:</b> Satışlar %10 artarak 3.300 adede çıkarsa FVÖK 3.300 × 200 − 400.000 = 260.000 TL olur (+%30 = DOL × %10). Vergi öncesi kâr 150.000 TL'den 210.000 TL'ye çıkar (+%40 = DCL × %10). HBK 1,125 TL'den 1,575 TL'ye yükselir (+%40).</p>`},
 {k:'k1',type:'kesif',core:true,title:'Başabaş grafiği',mount:K_basabas},
 {k:'k2',type:'kesif',core:true,title:'Faaliyet kaldıracı başabaşa yaklaşırken',mount:K_dol},
 {k:'k3',type:'kesif',core:false,title:'Finansal kaldıraç ve hisse başına kâr',mount:K_fk},
 {k:'t',type:'turetim',title:'DOL formülü nereden gelir?',html:()=>`
  <p>FVÖK = <i>Q</i>(<i>P</i> − <i>v</i>) − <i>F</i>. Miktar Δ<i>Q</i> kadar değişince Δ<i>FVÖK</i> = Δ<i>Q</i>(<i>P</i> − <i>v</i>) olur; sabit maliyet değişmez. Buradan:</p>
  <div class="eq"><i>DOL</i> = ${fr('Δ<i>FVÖK</i> / <i>FVÖK</i>','Δ<i>Q</i> / <i>Q</i>')} = ${fr('Δ<i>Q</i>(<i>P</i> − <i>v</i>)','<i>Q</i>(<i>P</i> − <i>v</i>) − <i>F</i>')} · ${fr('<i>Q</i>','Δ<i>Q</i>')} = ${fr('<i>Q</i>(<i>P</i> − <i>v</i>)','<i>Q</i>(<i>P</i> − <i>v</i>) − <i>F</i>')}</div>
  <p>Payda başabaş noktasında sıfırdır. Bu yüzden başabaşa yaklaşırken DOL sınırsız büyür: başabaşa yakın çalışan bir firmada küçük bir satış değişimi kârı çok büyük oranda değiştirir. <i>F</i> = 0 iken DOL = 1'dir; sabit maliyet olmadan kaldıraç da olmaz.</p>
  <p>Aynı mantık finansal kaldıraç için de geçerlidir: HBK = (<i>FVÖK</i> − <i>I</i>)(1 − <i>t</i>)/<i>N</i>. (1 − <i>t</i>)/<i>N</i> sabit bir çarpan olduğu için %Δ<i>HBK</i> = Δ<i>FVÖK</i>/(<i>FVÖK</i> − <i>I</i>) olur ve <i>DFL</i> = <i>FVÖK</i>/(<i>FVÖK</i> − <i>I</i>) elde edilir.</p>
  <div class="note yl yl-only"><b>Muhasebe başabaşı ile NBD başabaşı.</b> Muhasebe başabaşı yatırımın sermaye maliyetini göz ardı eder. Yatırım tutarı <i>I</i><sub>0</sub>, ömrü <i>n</i> ve sermaye maliyeti <i>r</i> ise yatırımın <b>yıllık eşdeğer maliyeti</b> EAC = <i>I</i><sub>0</sub> / AF(<i>r</i>, <i>n</i>) olur. Vergisiz ve nakit sabit giderli basit durumda NBD başabaşı <i>Q</i><sub>NBD</sub> = (<i>F</i> + EAC) / (<i>P</i> − <i>v</i>) ile bulunur ve muhasebe başabaşından her zaman yüksektir. Duyarlılık, senaryo ve Monte Carlo analizleri "Sermaye bütçesinde risk" dersinde bu temelin üzerine kurulacak.</div>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'Fiyat 80 TL, birim değişken maliyet 50 TL, sabit maliyet 120.000 TL. Başabaş miktarı kaç adettir?',ans:4000,abs:0.5,unit:'adet',hint:'<i>Q</i><sub>BE</sub> = <i>F</i> / (<i>P</i> − <i>v</i>).',sol:'120.000 / (80 − 50) = <b>4.000 adet</b>.'},
  {id:2,tag:'hesap',p:'Aynı firma 6.000 adet satıyor. Faaliyet kaldıracı derecesi (DOL) kaçtır?',ans:3,abs:0.01,unit:'',hint:'Önce FVÖK\'ü bulun: 6.000 × 30 − 120.000.',sol:'FVÖK = 180.000 − 120.000 = 60.000. DOL = 180.000 / 60.000 = <b>3</b>.'},
  {id:3,tag:'hesap',p:'Bu firmada satışlar %10 artarsa FVÖK yüzde kaç artar?',ans:30,abs:0.1,unit:'%',hint:'%Δ<i>FVÖK</i> = <i>DOL</i> × %Δ<i>Q</i>.',sol:'3 × %10 = <b>%30</b>. Sağlama: 6.600 × 30 − 120.000 = 78.000 → 78.000 / 60.000 − 1 = %30.'},
  {id:4,tag:'hesap',p:'Firmanın yıllık faiz gideri 20.000 TL ise birleşik kaldıraç derecesi (DCL) kaçtır?',ans:4.5,abs:0.01,unit:'',hint:'DFL = FVÖK / (FVÖK − I); DCL = DOL × DFL.',sol:'DFL = 60.000 / 40.000 = 1,5 → DCL = 3 × 1,5 = <b>4,5</b>.'},
  {id:5,tag:'grafik',p:'Satışlar başabaş noktasına yaklaştıkça faaliyet kaldıracı derecesi ne olur?',opts:['Azalır ve 1\'e yaklaşır','Sabit kalır','Sınırsız büyür','Sıfıra iner'],correct:2,hint:'DOL formülünün paydası başabaşta kaça eşittir?',sol:'Payda (FVÖK) sıfıra yaklaşır; DOL <b>sınırsız büyür</b>.'},
  {id:6,tag:'hesap',yl:1,p:'Önceki örnekte (P = 500, v = 300, nakit sabit gider 400.000 TL), projenin başlangıç yatırımı 600.000 TL, ömrü 5 yıl, sermaye maliyeti %20. Vergiyi göz ardı ederek NBD başabaş miktarını bulun (adet).',ans:(4e5+6e5/AF20_5)/200,rel:0.005,unit:'adet',hint:'EAC = 600.000 / AF(%20, 5); <i>Q</i> = (<i>F</i> + EAC) / (<i>P</i> − <i>v</i>).',sol:`EAC = 600.000 / ${nf(AF20_5,4)} = ${tl(6e5/AF20_5)} → <i>Q</i> = (400.000 + ${nf(6e5/AF20_5,0)}) / 200 ≈ <b>${nf((4e5+6e5/AF20_5)/200,0)} adet</b>. Muhasebe başabaşı (2.000 adet) bu projenin sermaye maliyetini karşılamaz.`}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary">
  <li>Başabaş miktarı sabit maliyetin birim katkı payına oranıdır: <i>Q</i><sub>BE</sub> = <i>F</i>/(<i>P</i> − <i>v</i>).</li>
  <li>Sabit maliyetler faaliyet kaldıracı yaratır. Başabaşa yakın çalışan firmada DOL çok yüksektir.</li>
  <li>Faiz gideri finansal kaldıraç yaratır. İki kaldıraç çarpılarak birleşir: DCL = DOL × DFL.</li>
  <li>Kaldıraç kârı da zararı da büyütür; işletme riskinin ve finansal riskin ölçüsüdür.</li>
  <li class="yl-only">Muhasebe başabaşı sermaye maliyetini göz ardı eder; NBD başabaşı her zaman daha yüksektir.</li></ul>
  <p class="lmeta">İzlence: Ders içeriğindeki "başabaş ve kaldıraç analizleri" · Hafta 13–14 ile ilişkili · ÖÇ7 (sermaye bütçesinde risk analizi yapar).</p>`}
]}
};

const CATALOG=[

  {id:'pzd',h:'1–2',oc:'ÖÇ1',t:'Paranın zaman değeri, enflasyon ve reel faiz'},

/* ============================================================
   Finans I — ek dersler (sürüm 1.0, 28.11.2026)
   Annüiteler · Hisse değerlemesi · Proje nakit akışları · Oran analizi
   · Finansal planlama · Sermayenin fırsat maliyeti · Sermaye bütçesinde risk
   ============================================================ */

/* ---------- DERS 2 — Annüiteler ve kredi ödeme planı ---------- */
function krediPlan(P,r,n,tur){const out=[];let b=P;const A=tur==='es'?P*r/(1-Math.pow(1+r,-n)):0;
  for(let t=1;t<=n;t++){const f=b*r,ana=tur==='es'?A-f:P/n;b-=ana;out.push({t,tak:f+ana,f,ana,b:Math.max(0,b)});}return out;}
function K_kredi(root,api){
  const L=kl(root,'Anka Makine yeni bir forklift için banka kredisi kullanıyor. <b>Eşit taksitli</b> planda her ay aynı tutar ödenir; taksitin faiz payı giderek azalır. <b>Eşit anaparalı</b> planda anapara her ay aynıdır; faiz kalan borç üzerinden hesaplandığı için taksit giderek düşer. Vergi ve masraflar (BSMV, KKDF) göz ardı edilmiştir.');
  const ck=checklist(L.task,[{id:'a',t:'İki plan türünü de deneyin ve toplam faizleri karşılaştırın.'},{id:'b',t:'Toplam faizin anaparayı <b>aştığı</b> bir kredi oluşturun.'}],api);
  const P=sl(L.ctl,{label:'Kredi tutarı',min:100000,max:2000000,step:50000,value:600000,fmt:v=>tl(v)});
  const r=sl(L.ctl,{label:'Yıllık faiz (aylık = yıllık / 12)',min:6,max:72,step:1,value:42,fmt:v=>'%'+v});
  const n=sl(L.ctl,{label:'Vade',min:6,max:60,step:6,value:24,fmt:v=>v+' ay'});
  let tur='es';const seen=new Set(['es']);
  seg(L.ctl,'Plan türü',[['es','Eşit taksitli'],['ea','Eşit anaparalı']],'es',v=>{tur=v;seen.add(v);if(seen.size===2)ck.mark('a');draw(1);});
  legend(L.leg,[['l1','Taksit'],['l2','Faiz payı'],['l3','Anapara payı']]);
  const ro=readouts(L.ro,[['t1','İlk taksit'],['tn','Son taksit'],['tf','Toplam faiz'],['tp','Toplam geri ödeme']]);
  function draw(u){
    const pl=krediPlan(P.v,r.v/1200,n.v,tur),mx=Math.max(...pl.map(x=>x.tak));
    const f=frame(L.ch,{x:[1,n.v],y:[0,niceMax(mx*1.05)],xlab:'Ay',ylab:'TL',yfmt:kTL,aria:'Kredi ödeme planı'});
    f.line(pl.map(x=>[x.t,x.tak]),'l1');f.line(pl.map(x=>[x.t,x.f]),'l2');f.line(pl.map(x=>[x.t,x.ana]),'l3');

/* ---------- DERS 3 — Hisse senedi değerlemesi ---------- */
function K_gordon(root,api){
  const L=kl(root,'Gordon (sabit büyüme) modeline göre hisse fiyatı, gelecek yıl beklenen temettünün, istenen getiri ile büyüme oranı arasındaki farka bölünmesidir: <b>P<sub>0</sub> = D<sub>1</sub> / (r − g)</b>. Büyüme istenen getiriye yaklaştıkça fiyat hızla artar.');
  const ck=checklist(L.task,[{id:'a',t:'Büyüme oranını istenen getiriye çok yaklaştırın (fark 2 puandan az).'},{id:'b',t:'Büyümeyi istenen getiriye eşit ya da büyük yapın: model ne diyor?'},{id:'c',t:'Fiyatın tam 50 TL olduğu bir durum bulun (D<sub>0</sub> = 4 TL iken).'}],api);
  const D0=sl(L.ctl,{label:'Son ödenen temettü, D0',min:1,max:10,step:0.5,value:4,fmt:v=>tl(v,2)});
  const r=sl(L.ctl,{label:'İstenen getiri, r',min:5,max:50,step:1,value:25,fmt:v=>'%'+v});
  const g=sl(L.ctl,{label:'Sabit büyüme, g',min:-10,max:49,step:1,value:10,fmt:v=>'%'+v});
  legend(L.leg,[['l1','Fiyat (g\'nin fonksiyonu)'],['sw dot','Seçilen büyüme']]);
  const ro=readouts(L.ro,[['d1','D1 = D0(1 + g)'],['p','P0'],['dy','Temettü verimi D1 / P0'],['kg','Sermaye kazancı oranı']]);
  function draw(u){
    const R=r.v/100,G=g.v/100,pts=[];for(let x=-10;x<r.v-0.5;x+=0.5){const gg=x/100;pts.push([x,D0.v*(1+gg)/(R-gg)]);}
    const ok=G<R,P=ok?D0.v*(1+G)/(R-G):Infinity;
    const f=frame(L.ch,{x:[-10,50],y:[0,ok?niceMax(Math.min(Math.max(P*1.4,30),400)):200],xlab:'Büyüme, g (%)',ylab:'Fiyat (TL)',xfmt:v=>'%'+v,aria:'Gordon modeli fiyat-büyüme eğrisi'});
    f.line(pts,'l1');f.vline(r.v,'ref','g = r',0);if(ok){f.dot(g.v,P,'cur',6);f.text(g.v,P,tl(P,2),'lab','start',8,-8);}
    f.hover(x=>{const gg=Math.round(x*2)/2;if(gg>=r.v)return {html:'g ≥ r: model tanımsız'};const p=D0.v*(1+gg/100)/(R-gg/100);return {x:gg,pts:[[gg,p,'d1']],html:`<b>g = %${nf(gg,1)}</b><br>P0 = ${tl(p,2)}`};});
    ro.set('d1',tl(D0.v*(1+G),2));ro.set('p',ok?tl(P,2):'<span class="flag bad">Tanımsız (g ≥ r)</span>');ro.set('dy',ok?pc(R-G,1):'—');ro.set('kg',ok?pc(G,1):'—');
    if(u){if(ok&&r.v-g.v<2)ck.mark('a');if(!ok)ck.mark('b');if(ok&&D0.v===4&&Math.abs(P-50)<0.01)ck.mark('c');}
  }
  [D0,r,g].forEach(x=>x.on(()=>draw(1)));draw(0);
}
function K_pvgo(root,api){
  const L=kl(root,'Şirket kârının <b>b</b> kadarını yeniden yatırır, kalanını temettü olarak dağıtır. Yatırımların getirisi <b>ROE</b> ise büyüme <b>g = b × ROE</b> olur. Kârı tutmak hisse değerini her zaman artırır mı?');
  const ck=checklist(L.task,[{id:'a',t:'ROE > r iken kârı tutmanın değeri artırdığını görün.'},{id:'b',t:'ROE < r yapın: kâr tutmak değeri azaltıyor.'},{id:'c',t:'ROE = r yapın: dağıtım oranının önemi kalıyor mu?'}],api);
  const E=6;
  const roe=sl(L.ctl,{label:'Yeni yatırımların getirisi, ROE',min:5,max:45,step:1,value:30,fmt:v=>'%'+v});
  const r=sl(L.ctl,{label:'İstenen getiri, r',min:10,max:40,step:1,value:20,fmt:v=>'%'+v});
  const b=sl(L.ctl,{label:'Kâr tutma oranı, b',min:0,max:60,step:5,value:40,fmt:v=>'%'+v});
  legend(L.leg,[['l1','Hisse fiyatı (b\'nin fonksiyonu)'],['ref','Büyümesiz değer EPS / r']]);
  const ro=readouts(L.ro,[['g','g = b × ROE'],['p','P0'],['n','Büyümesiz değer'],['pv','Büyüme fırsatlarının BD (PVGO)']]);
  function draw(u){
    const R=r.v/100,Q=roe.v/100,price=bb=>{const gg=bb*Q;return gg<R?E*(1-bb)/(R-gg):NaN;},pts=[];
    for(let x=0;x<=60;x+=1)pts.push([x,price(x/100)]);
    const P=price(b.v/100),nog=E/R,fin=pts.filter(p=>isFinite(p[1])).map(p=>p[1]);
    const f=frame(L.ch,{x:[0,60],y:[0,niceMax(Math.min(Math.max(...fin,nog)*1.1,300))],xlab:'Kâr tutma oranı, b (%)',ylab:'Fiyat (TL)',xfmt:v=>'%'+v,aria:'Kâr tutma oranı ve hisse fiyatı'});
    f.hline(nog,'ref','EPS / r');f.line(pts,'l1');if(isFinite(P))f.dot(b.v,P,'cur',6);
    ro.set('g',pc(b.v/100*Q,1));ro.set('p',isFinite(P)?tl(P,2):'Tanımsız (g ≥ r)');ro.set('n',tl(nog,2));ro.set('pv',isFinite(P)?tl(P-nog,2):'—');
    L.x.innerHTML=`<p class="lmeta">Gelecek yıl beklenen hisse başına kâr EPS<sub>1</sub> = ${E} TL. Fiyat = EPS<sub>1</sub>(1 − b) / (r − b · ROE).</p>`;
    if(u){if(Q>R&&b.v>0)ck.mark('a');if(Q<R&&b.v>0)ck.mark('b');if(roe.v===r.v)ck.mark('c');}
  }
  [roe,r,b].forEach(x=>x.on(()=>draw(1)));draw(0);
}

/* ---------- DERS 6 — Proje nakit akışlarının tahmini ---------- */
function projeNA(o){ /* o: I,n,S,C,t,dep('normal'|'azalan'),nwc (satışın %'si),hurda */
  const dep=[];let nd=o.I;const d=Math.min(2/o.n,.5);for(let k=1;k<=o.n;k++){const a=o.dep==='normal'?o.I/o.n:(k===o.n?nd:nd*d);nd-=a;dep.push(a);}
  const W=o.S*o.nwc,cf=[-o.I-W],rows=[];
  for(let k=1;k<=o.n;k++){const favok=o.S-o.C,vergi=(favok-dep[k-1])*o.t,ocf=favok-vergi;let c=ocf;if(k===o.n){c+=W+o.hurda*(1-o.t);}cf.push(c);rows.push({k,favok,dep:dep[k-1],vergi,ocf,c});}
  return {cf,rows,W};
}

    dtable(L.main,['Yıl','FAVÖK','Amortisman','Vergi','Faaliyet NA','Toplam NA'],[[0,'','','','',tl(R.cf[0])]].concat(R.rows.map(x=>[x.k,tl(x.favok),tl(x.dep),tl(x.vergi),tl(x.ocf),tl(x.c)])));
    if(u){if(w.v>0)ck.mark('b');if(t.v!==t0)ck.mark('c');}

  [S,C,t,w,h].forEach(x=>x.on(()=>draw(1)));draw(0);

/* ---------- DERS 7 — Oran analizi ve DuPont ---------- */
function K_dupont(root,api){
  const L=kl(root,'Özkaynak kârlılığı (ROE) üç oranın çarpımıdır: <b>net kâr marjı</b> × <b>aktif devir hızı</b> × <b>finansal kaldıraç</b> (aktif / özkaynak). Aynı ROE\'ye farklı yollardan ulaşılabilir; ama yolun riski farklıdır.');
  const ck=checklist(L.task,[{id:'a',t:'ROE\'yi <b>%25 ya da üstüne</b> yalnızca kâr marjı ve devir hızıyla (kaldıraç ≤ 1,5) çıkarın.'},{id:'b',t:'ROE\'yi %25 ya da üstüne <b>kaldıraçla</b> (kaldıraç ≥ 3) çıkarın.'}],api);
  const m=sl(L.ctl,{label:'Net kâr marjı',min:1,max:25,step:0.5,value:7.5,fmt:pctFmt});
  const d=sl(L.ctl,{label:'Aktif devir hızı',min:0.3,max:3,step:0.1,value:1,fmt:v=>nf(v,1)+' kez'});
  const k=sl(L.ctl,{label:'Finansal kaldıraç (aktif / özkaynak)',min:1,max:5,step:0.1,value:2,fmt:v=>nf(v,1)});
  legend(L.leg,[['box f1','Oran']]);
  const ro=readouts(L.ro,[['roa','ROA = marj × devir'],['roe','ROE = ROA × kaldıraç'],['ba','Borç / aktif']]);
  function draw(u){
    const ROA=m.v/100*d.v,ROE=ROA*k.v;
    groupChart(L.ch,['Net kâr|marjı','ROA','ROE'],[{n:'Oran',cls:'f1',v:[m.v,ROA*100,ROE*100]}],{yfmt:v=>'%'+nf(v,0),ylab:'%',vfmt:v=>'%'+nf(v,1),tfmt:v=>'%'+nf(v,1),aria:'DuPont ayrıştırması',mb:58});
    ro.set('roa',pc(ROA,1));ro.set('roe',pc(ROE,1));ro.set('ba',pc(1-1/k.v,0));

    if(u&&ROE>=.25){if(k.v<=1.5)ck.mark('a');if(k.v>=3)ck.mark('b');}
  }
  [m,d,k].forEach(x=>x.on(()=>draw(1)));draw(0);
}

/* ---------- DERS 8 — Finansal planlama ---------- */
function dfi(S0,g,AS,LS,m,b){const S1=S0*(1+g);return AS*S0*g-LS*S0*g-m*S1*b;}
function K_dfi(root,api){
  const L=kl(root,'<b>Yüzde satış yöntemi</b>: satışlar artınca aktifler ve kendiliğinden doğan borçlar (satıcılar, tahakkuklar) satışlarla orantılı artar. Aradaki farkın dağıtılmayan kârla karşılanamayan kısmı <b>dış finansman ihtiyacıdır</b> (DFİ). Anka Makine: satış 1.500.000 TL, aktif / satış 1,0, kendiliğinden doğan borç / satış 0,2.');
  const ck=checklist(L.task,[{id:'a',t:'DFİ\'nin tam sıfır olduğu büyüme oranını (içsel büyüme) bulun (±0,5 puan).'},{id:'b',t:'Dağıtım oranını sıfırlayın: içsel büyüme nasıl değişti?'}],api);
  const g=sl(L.ctl,{label:'Satış büyümesi, g',min:0,max:60,step:0.5,value:20,fmt:pctFmt});
  const m=sl(L.ctl,{label:'Net kâr marjı',min:1,max:20,step:0.5,value:7.5,fmt:pctFmt});
  const p=sl(L.ctl,{label:'Kâr dağıtım oranı',min:0,max:100,step:5,value:40,fmt:v=>'%'+v});
  legend(L.leg,[['l1','DFİ (büyümenin fonksiyonu)'],['sw dot','Seçilen büyüme']]);
  const ro=readouts(L.ro,[['d','Dış finansman ihtiyacı'],['ig','İçsel büyüme oranı'],['sg','Sürdürülebilir büyüme (ROE ile)']]);
  function draw(u){
    const S0=1.5e6,M=m.v/100,b=1-p.v/100,pts=[];for(let x=0;x<=60;x+=1)pts.push([x,dfi(S0,x/100,1,.2,M,b)]);
    const D=dfi(S0,g.v/100,1,.2,M,b),ROA=M*1,ig=ROA*b/(1-ROA*b),ROE=M*1*2,sg=ROE*b/(1-ROE*b);
    const ys=pts.map(q=>q[1]),[y0,y1]=niceRange(Math.min(...ys,0),Math.max(...ys,0),5);
    const f=frame(L.ch,{x:[0,60],y:[y0,y1],xlab:'Satış büyümesi (%)',ylab:'DFİ (TL)',xfmt:v=>'%'+v,yfmt:kTL,aria:'Dış finansman ihtiyacı'});
    f.line(pts,'l1');f.vline(ig*100,'ref','İçsel büyüme %'+nf(ig*100,1));f.dot(g.v,D,'cur',6);
    f.hover(x=>{const gg=clamp(Math.round(x),0,60),v=dfi(S0,gg/100,1,.2,M,b);return {x:gg,pts:[[gg,v,'d1']],html:`<b>g = %${gg}</b><br>DFİ: ${tl(v)}`};});
    ro.set('d',D>0?tl(D):`Fon fazlası ${tl(-D)}`);ro.set('ig',pc(ig,2));ro.set('sg',pc(sg,2));
    L.x.innerHTML='<p class="lmeta">DFİ = (A/S)·ΔS − (L/S)·ΔS − m · S<sub>1</sub> · b. Sürdürülebilir büyüme, borç/özkaynak oranı sabit tutularak (özkaynak 750.000 TL, ROE = marj × devir × 2) ulaşılabilecek en yüksek büyümedir.</p>';
    if(u){if(Math.abs(g.v/100-ig)<=0.005)ck.mark('a');if(p.v===0)ck.mark('b');}
  }
  [g,m,p].forEach(x=>x.on(()=>draw(1)));draw(0);
}

/* ---------- DERS 10 — Sermayenin fırsat maliyeti ---------- */
const PROJELER=[['A',0.6,0.27],['B',0.8,0.33],['C',1.0,0.30],['D',1.4,0.40],['E',1.8,0.33],['F',2.2,0.52]];
function K_firsat(root,api){
  const L=kl(root,'Bir projenin iskonto oranı, yatırımcının <b>aynı riskteki</b> başka bir yatırımdan bekleyeceği getiridir (fırsat maliyeti). Riski sistematik risk ölçüsü beta (β) ile ölçen doğru: <b>r = r<sub>f</sub> + β(r<sub>m</sub> − r<sub>f</sub>)</b>. Altı projenin İVO\'larını hem şirketin tek iskonto oranıyla hem de risk ayarlı oranla değerlendirin.');
  const ck=checklist(L.task,[{id:'a',t:'Tek oranla <b>yanlışlıkla kabul</b> edilen bir yüksek riskli proje bulun.'},{id:'b',t:'Tek oranla <b>yanlışlıkla reddedilen</b> bir düşük riskli proje bulun.'}],api);
  const rf=sl(L.ctl,{label:'Risksiz faiz, rf',min:5,max:45,step:1,value:20,fmt:v=>'%'+v});
  const mrp=sl(L.ctl,{label:'Piyasa risk primi, rm − rf',min:2,max:15,step:0.5,value:8,fmt:pctFmt});
  const fw=sl(L.ctl,{label:'Şirketin tek iskonto oranı',min:10,max:50,step:1,value:30,fmt:v=>'%'+v});
  legend(L.leg,[['l1','Risk ayarlı getiri doğrusu'],['ref','Şirketin tek oranı'],['sw dot','Proje İVO\'su']]);
  const ro=readouts(L.ro,[['ya','Tek oranla yanlış kabul'],['yr','Tek oranla yanlış red']]);
  function draw(u){
    const RF=rf.v/100,M=mrp.v/100,W=fw.v/100,sml=bb=>RF+bb*M;
    const f=frame(L.ch,{x:[0,2.5],y:[0,.7],xlab:'Beta, β',ylab:'Getiri',xfmt:v=>nf(v,1),yfmt:v=>'%'+nf(v*100,0),aria:'Güvenlik piyasası doğrusu'});
    f.line([[0,RF],[2.5,sml(2.5)]],'l1');f.hline(W,'ref','Tek oran');
    const ya=[],yr=[];PROJELER.forEach(([ad,b,irr])=>{const kS=irr>=sml(b),kW=irr>=W;if(kW&&!kS)ya.push(ad);if(!kW&&kS)yr.push(ad);f.dot(b,irr,kS?'d3':'d2',6);f.text(b,irr,ad,'lab','start',8,-6);});
    f.hover(x=>{const p=PROJELER.reduce((a,q)=>Math.abs(q[1]-x)<Math.abs(a[1]-x)?q:a);return {html:`<b>Proje ${p[0]}</b><br>β = ${nf(p[1],1)} · İVO ${pc(p[2],0)}<br>Risk ayarlı oran: ${pc(sml(p[1]),1)}<br>${p[2]>=sml(p[1])?'Kabul':'Red'}`};});
    ro.set('ya',ya.join(', ')||'Yok');ro.set('yr',yr.join(', ')||'Yok');
    L.x.innerHTML='<p class="lmeta">Yeşil noktalar risk ayarlı orana göre kabul, turuncu noktalar red edilen projelerdir. Beta ve sermaye varlıklarını fiyatlama modeli Finans II\'nin ilk konusudur.</p>';
    if(u){if(ya.length)ck.mark('a');if(yr.length)ck.mark('b');}
  }
  [rf,mrp,fw].forEach(x=>x.on(()=>draw(1)));draw(0);
}

/* ---------- DERS 12 — Sermaye bütçesinde risk ---------- */
const BAZ={S:900000,C:500000,I:1e6,r:.2,t:.25};
function npvBaz(o){const dep=o.I/5,ocf=(o.S-o.C)-(o.S-o.C-dep)*o.t;return -o.I+ocf*af(o.r,5);}
function K_duyarlilik(root,api){
  const L=kl(root,'CNC hattının NBD\'si her girdi tek tek ±%x değiştirildiğinde ne kadar değişir? En uzun çubuk, tahmin hatasının en pahalı olduğu girdidir: yönetim tahmin çabasını oraya yoğunlaştırmalıdır.');
  const ck=checklist(L.task,[{id:'a',t:'NBD\'nin en duyarlı olduğu girdiyi bulun ve sapma oranını değiştirin.'},{id:'b',t:'Satışların hangi düşüş oranında NBD\'nin sıfıra indiğini bulun (başabaş satış, ±1 puan).'}],api);
  const x=sl(L.ctl,{label:'Girdi değişimi (±)',min:5,max:40,step:5,value:20,fmt:v=>'±%'+v});
  const sd=sl(L.ctl,{label:'Satışlardaki düşüş (başabaş arama)',min:0,max:40,step:1,value:0,fmt:v=>'−%'+v});
  legend(L.leg,[['box f2','Girdi azalınca NBD'],['box f3','Girdi artınca NBD']]);
  const ro=readouts(L.ro,[['b','Baz NBD'],['s','Satış düşüşünde NBD']]);
  const ad={S:'Satış',C:'Nakit gider',I:'Yatırım',r:'İskonto oranı',t:'Vergi'};
  function draw(u){
    const N0=npvBaz(BAZ),X=x.v/100,keys=Object.keys(ad);
    const lo=keys.map(k=>npvBaz({...BAZ,[k]:BAZ[k]*(1-X)})-N0),hi=keys.map(k=>npvBaz({...BAZ,[k]:BAZ[k]*(1+X)})-N0);
    groupChart(L.ch,keys.map(k=>ad[k]),[{n:'Girdi −',cls:'f2',v:lo},{n:'Girdi +',cls:'f3',v:hi}],{aria:'Duyarlılık analizi',ylab:'NBD değişimi (TL)'});
    const Ns=npvBaz({...BAZ,S:BAZ.S*(1-sd.v/100)});ro.set('b',tl(N0));ro.set('s',tl(Ns));
    const be=1-(()=>{const f=s=>npvBaz({...BAZ,S:s});return bisect(f,1,BAZ.S*2)/BAZ.S;})();
    L.x.innerHTML=`<p class="lmeta">NBD\'yi sıfırlayan satış düşüşü yaklaşık %${nf(be*100,1)}. Duyarlılık analizi girdileri tek tek değiştirir; girdilerin birlikte hareketi senaryo ve Monte Carlo analizinin konusudur.</p>`;
    if(u){if(x.v!==20)ck.mark('a');if(Math.abs(sd.v/100-be)<=0.01)ck.mark('b');}
  }
  [x,sd].forEach(q=>q.on(()=>draw(1)));draw(0);
}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function K_mc(root,api){
  const L=kl(root,'<b>Monte Carlo</b> analizinde belirsiz girdiler olasılık dağılımlarından çekilir ve proje binlerce kez yeniden hesaplanır. Burada yıllık satış normal dağılıyor (ortalama 900.000 TL); nakit giderlerin %60\'ı satışla değişken. 2.000 deneme yapılıyor.');
  const ck=checklist(L.task,[{id:'a',t:'Satış belirsizliğini artırın ve NBD\'nin negatif olma olasılığını izleyin.'},{id:'b',t:'Negatif NBD olasılığının <b>%30\'u aştığı</b> bir belirsizlik düzeyi bulun.'}],api);
  const s=sl(L.ctl,{label:'Satışın standart sapması',min:20000,max:400000,step:20000,value:40000,fmt:v=>tl(v)});
  let seed=7;const bx=el('div','','<button type="button" class="btn sm">Yeni denemeler (farklı tohum)</button>');L.ctl.appendChild(bx);$('button',bx).onclick=()=>{seed++;draw(0);};
  legend(L.leg,[['box f1','NBD < 0 olmayan denemeler'],['box f2','NBD < 0']]);
  const ro=readouts(L.ro,[['m','Ortalama NBD'],['p','P(NBD < 0)'],['q','%5 en kötü NBD']]);
  const s0=s.v;
  function draw(u){
    const R=rng(seed),out=[];for(let k=0;k<2000;k++){const u1=R()||1e-9,u2=R(),z=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2),S=Math.max(0,900000+s.v*z),C=200000+300000*S/900000;out.push(npvBaz({...BAZ,S,C}));}
    out.sort((a,b)=>a-b);const mean=out.reduce((a,b)=>a+b,0)/out.length,pn=out.filter(v=>v<0).length/out.length,q5=out[Math.floor(out.length*.05)];
    const lo=Math.floor(out[0]/1e5)*1e5,hi=Math.ceil(out[out.length-1]/1e5)*1e5,bw=Math.max(5e4,(hi-lo)/30),nb=Math.ceil((hi-lo)/bw),cnt=Array(nb).fill(0);
    out.forEach(v=>cnt[Math.min(nb-1,Math.floor((v-lo)/bw))]++);
    const f=frame(L.ch,{x:[lo,lo+nb*bw],y:[0,niceMax(Math.max(...cnt))],xlab:'NBD (TL)',ylab:'Deneme sayısı',xfmt:kTL,aria:'Monte Carlo NBD dağılımı'});
    cnt.forEach((c,i)=>{const x0=lo+i*bw;if(c)f.rect(x0+bw*.06,x0+bw*.94,0,c,x0+bw<=0?'f2':'f1');});f.vline(0,'ref','NBD = 0');
    f.hover(x=>{const i=clamp(Math.floor((x-lo)/bw),0,nb-1);return {html:`${kTL(lo+i*bw)} – ${kTL(lo+(i+1)*bw)}<br>${cnt[i]} deneme`};});
    ro.set('m',tl(mean));ro.set('p',pc(pn,1));ro.set('q',tl(q5));
    if(u){if(s.v!==s0)ck.mark('a');if(pn>.3)ck.mark('b');}
  }
  s.on(()=>draw(1));draw(0);
}

 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'D<sub>0</sub> = 5 TL, g = %8, r = %20. Hisse fiyatı kaç TL\'dir?',ans:5*1.08/.12,abs:0.01,unit:'TL',hint:'Önce D<sub>1</sub>\'i bulun.',sol:'5,40 / 0,12 = <b>45 TL</b>.'},
  {id:2,tag:'hesap',p:'Fiyatı 40 TL olan bir hissenin gelecek yıl temettüsü 3,20 TL, büyümesi %12 bekleniyor. Yatırımcının beklediği getiri yüzde kaçtır?',ans:20,abs:0.05,unit:'%',hint:'r = D<sub>1</sub>/P<sub>0</sub> + g.',sol:'3,20/40 + 0,12 = %8 + %12 = <b>%20</b>.'},
  {id:3,tag:'hesap',p:'EPS<sub>1</sub> = 6 TL, r = %20, b = %40, ROE = %30. Hisse fiyatı kaç TL\'dir?',ans:6*.6/(.2-.12),abs:0.01,unit:'TL',hint:'g = 0,4 × 0,3 = %12.',sol:'6 × 0,6 / (0,20 − 0,12) = <b>45 TL</b>; PVGO = 45 − 30 = 15 TL.'},
  {id:4,tag:'grafik',p:'ROE istenen getiriden düşükken kâr tutma oranı artırılırsa hisse fiyatı ne olur?',opts:['Artar','Azalır','Değişmez','Önce artar sonra azalır'],correct:1,hint:'Keşif 2\'de ROE < r iken eğrinin eğimi.',sol:'Yatırımlar fırsat maliyetini kazanamaz; fiyat <b>azalır</b>.'},
  {id:5,tag:'kavram',p:'Gordon modeli hangi koşulda kullanılamaz?',opts:['Temettü sıfırsa ya da g ≥ r ise','g negatifse','r %10\'un üstündeyse','Şirket halka açık değilse'],correct:0,hint:'Payda.',sol:'g ≥ r iken toplam yakınsamaz; temettü yoksa da model fiyat üretmez.'},
  {id:6,tag:'hesap',yl:1,p:'D<sub>1</sub> = 2 TL; temettüler 2. ve 3. yılda %30 büyüyecek, sonra sürekli %8 büyüyecek; r = %20. P<sub>0</sub> kaç TL\'dir? (2 ondalık)',ans:(()=>{const d1=2,d2=2.6,d3=3.38,p3=d3*1.08/.12;return d1/1.2+d2/1.44+(d3+p3)/1.728;})(),abs:0.05,unit:'TL',hint:'D<sub>2</sub> = 2,60; D<sub>3</sub> = 3,38; P<sub>3</sub> = D<sub>4</sub>/(r − g).',sol:'P<sub>3</sub> = 3,38 × 1,08/0,12 = 30,42; P<sub>0</sub> = 2/1,2 + 2,60/1,44 + (3,38 + 30,42)/1,728 ≈ <b>23,03 TL</b>.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary"><li>Hisse değeri gelecekteki temettülerin bugünkü değeridir.</li><li>Gordon: P<sub>0</sub> = D<sub>1</sub>/(r − g), yalnızca g &lt; r iken.</li><li>g = b × ROE; kâr tutmak ancak ROE &gt; r ise değer yaratır (PVGO &gt; 0).</li></ul>
  <p class="lmeta">İzlence: Hafta 3–4 · ÖÇ3.</p>`}
]},

nakit:{title:'Proje nakit akışlarının tahmini: vergi, amortisman ve işletme sermayesi',sure:'40 dk',steps:[
 {k:'a',type:'anlatim',title:'Hangi nakit akışları?',html:()=>`
  <p>Yatırım kararında yalnızca projenin yol açtığı <b>ek (artımsal)</b>, <b>vergi sonrası nakit</b> akışları kullanılır. Batık maliyetler dahil edilmez; fırsat maliyetleri (ör. projede kullanılacak, aksi hâlde kiraya verilebilecek depo) dahil edilir; finansman giderleri iskonto oranının içinde olduğu için ayrıca düşülmez.</p>
  <div class="eq">Faaliyet nakit akışı = (Satış − Nakit gider) × (1 − <i>t</i>) + Amortisman × <i>t</i></div>
  <p>İkinci terim <b>amortisman vergi kalkanıdır</b>. Ayrıca projenin başında bağlanan <b>işletme sermayesi</b> (stok ve alacak artışı) nakit çıkışı, proje sonunda geri dönüşü nakit girişidir; hurda satış değeri vergi etkisiyle birlikte son yıla eklenir.</p>`},
 {k:'o',type:'ornek',title:'CNC hattının nakit akışları',html:()=>{const R=projeNA({I:1e6,n:5,S:9e5,C:5e5,t:.25,dep:'normal',nwc:0,hurda:0});return `
  <p>Satış 900.000, nakit gider 500.000 → FAVÖK 400.000 TL. Amortisman 200.000 → vergi matrahı 200.000, vergi 50.000 TL.</p>
  <p>Faaliyet nakit akışı = 400.000 − 50.000 = <b>350.000 TL</b> = 400.000 × 0,75 + 200.000 × 0,25 = 300.000 + 50.000. NBD (%20) = ${tl(npv(.2,R.cf))}.</p>`;}},
 {k:'k1',type:'kesif',core:true,title:'Vergi kalkanı ve işletme sermayesi',mount:K_nakit},
 {k:'t',type:'turetim',title:'İki formül aynı sonucu verir',html:()=>`
  <p>Vergi = (<i>S</i> − <i>C</i> − <i>D</i>)<i>t</i>. Faaliyet nakit akışı = (<i>S</i> − <i>C</i>) − (<i>S</i> − <i>C</i> − <i>D</i>)<i>t</i> = (<i>S</i> − <i>C</i>)(1 − <i>t</i>) + <i>D t</i>. Aynı ifade net kâr + amortisman olarak da yazılabilir: (<i>S</i> − <i>C</i> − <i>D</i>)(1 − <i>t</i>) + <i>D</i>.</p>
  <p>Toplam amortisman yöntemden bağımsız olarak yatırım tutarına eşittir; ama hızlandırılmış amortisman vergi kalkanını öne çeker ve paranın zaman değeri nedeniyle NBD'yi artırır.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'Satış 600.000, nakit gider 350.000, amortisman 100.000 TL, vergi %25. Faaliyet nakit akışı kaç TL\'dir?',ans:212500,abs:1,unit:'TL',hint:'(S − C)(1 − t) + D·t.',sol:'250.000 × 0,75 + 100.000 × 0,25 = 187.500 + 25.000 = <b>212.500 TL</b>.'},
  {id:2,tag:'hesap',p:'Amortismanın yıllık vergi kalkanı (önceki soru) kaç TL\'dir?',ans:25000,abs:1,unit:'TL',hint:'D × t.',sol:'<b>25.000 TL</b>.'},
  {id:3,tag:'kavram',p:'Geçen yıl yapılan 80.000 TL\'lik pazar araştırması yeni projenin nakit akışlarına dahil edilir mi?',opts:['Evet, başlangıç yatırımına eklenir','Hayır, batık maliyettir','Yalnızca proje kabul edilirse','Amortismana tabi tutulur'],correct:1,hint:'Karar ne olursa olsun bu harcama değişmez.',sol:'<b>Batık maliyettir</b>; karardan etkilenmez.'},
  {id:4,tag:'kavram',p:'Proje başında 100.000 TL işletme sermayesi bağlanıyor ve proje sonunda geri dönüyor. NBD üzerindeki etkisi?',opts:['Sıfır','Negatif','Pozitif','Vergiye bağlı'],correct:1,hint:'Bugün çıkan para gelecekte dönerse bugünkü değeri?',sol:'Bugün 100.000 çıkar, sonra döner; iskontolama nedeniyle etki <b>negatiftir</b>.'},
  {id:5,tag:'grafik',p:'Normal amortisman yerine azalan bakiyeler kullanılırsa (vergi oranı > 0) NBD ne olur?',opts:['Azalır','Artar','Değişmez','Sıfırlanır'],correct:1,hint:'Vergi kalkanının zamanlaması.',sol:'Vergi kalkanı öne çekilir; NBD <b>artar</b>.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary"><li>Artımsal, vergi sonrası nakit akışları kullanılır; batık maliyetler hariç, fırsat maliyetleri dahil.</li><li>Faaliyet NA = (S − C)(1 − t) + D·t.</li><li>İşletme sermayesi başta çıkış, sonda giriş; hurda değeri vergi etkisiyle eklenir.</li></ul>
  <p class="lmeta">İzlence: Hafta 7–8 · ÖÇ2, ÖÇ4.</p>`}
]},

oran:{title:'Finansal analiz: oranlar ve DuPont çözümlemesi',sure:'40 dk',steps:[
 {k:'a',type:'anlatim',title:'Oran grupları',html:()=>`
  <table class="tbl sym"><thead><tr><th>Grup</th><th>Oranlar</th><th>Soru</th></tr></thead><tbody>
   <tr><td>Likidite</td><td>Cari oran, asit-test oranı, nakit oranı</td><td>Kısa vadeli borçlar ödenebilir mi?</td></tr>
   <tr><td>Finansal yapı</td><td>Borç / aktif, borç / özkaynak, faiz karşılama</td><td>Borç yükü ve finansal risk ne düzeyde?</td></tr>
   <tr><td>Faaliyet (etkinlik)</td><td>Aktif devir hızı, alacak tahsil süresi, stok devir süresi</td><td>Varlıklar ne kadar verimli kullanılıyor?</td></tr>
   <tr><td>Kârlılık</td><td>Brüt ve net kâr marjı, ROA, ROE</td><td>Ne kadar kazanılıyor?</td></tr></tbody></table>
  <h3>DuPont çözümlemesi</h3>
  <div class="eq">ROE = ${fr('Net kâr','Satışlar')} × ${fr('Satışlar','Aktif')} × ${fr('Aktif','Özkaynak')}</div>
  <p>Kâr marjı fiyatlama ve maliyet kontrolünü, devir hızı varlık kullanımını, kaldıraç finansal yapıyı gösterir. Aynı ROE'ye ulaşan iki şirket farklı risk taşıyabilir.</p>
  <div class="note">Bu ders izlencenin ders içeriğinde ("finansal analiz") yer alıp haftalık planda karşılığı olmayan konuyu kapsar.</div>`},
 {k:'o',type:'ornek',title:'Anka Makine\'nin oranları',html:()=>`
  <p>Satış 1.500.000; SMM 900.000; FVÖK 200.000; faiz 50.000; net kâr 112.500 TL. Dönen varlıklar 600.000 (kasa 100.000, alacak 250.000, stok 250.000), aktif 1.500.000; kısa vadeli borç 400.000, uzun vadeli borç 350.000, özkaynak 750.000 TL.</p>
  <p>Cari oran 1,50 · asit-test 0,875 · borç/aktif %50 · faiz karşılama 4,0 · alacak tahsil süresi 365 × 250/1.500 ≈ 61 gün · stok devir süresi 365 × 250/900 ≈ 101 gün · ROE = %7,5 × 1,0 × 2,0 = <b>%15</b>.</p>`},
 {k:'k1',type:'kesif',core:true,title:'DuPont: ROE\'ye giden üç yol',mount:K_dupont},
 {k:'k2',type:'kesif',core:true,title:'Likidite ve faaliyet oranları',mount:K_oranlar},
 {k:'t',type:'turetim',title:'Kaldıraç ROE\'yi neden büyütür?',html:()=>`
  <p>Faiz ve vergi etkisi birlikte düşünülürse ROE = ROA + (ROA − borç maliyeti) × B/Ö biçiminde de yazılabilir (vergi sonrası). Varlık getirisi borç maliyetinden yüksekse borç ROE'yi artırır; düşükse azaltır. Bu, Ders 11'deki finansal kaldıraç derecesinin (DFL) oranlar dilindeki karşılığıdır.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'Dönen varlıklar 900.000, stoklar 300.000, kısa vadeli borçlar 600.000 TL. Asit-test oranı kaçtır?',ans:1,abs:0.005,unit:'',hint:'(Dönen − stok) / KVYK.',sol:'600.000 / 600.000 = <b>1,00</b>.'},
  {id:2,tag:'hesap',p:'Net kâr marjı %5, aktif devir hızı 1,6, aktif/özkaynak 2,5. ROE yüzde kaçtır?',ans:20,abs:0.05,unit:'%',hint:'Üç oranı çarpın.',sol:'0,05 × 1,6 × 2,5 = <b>%20</b>.'},
  {id:3,tag:'hesap',p:'Yıllık kredili satış 3.650.000 TL, ortalama alacak 500.000 TL. Alacak tahsil süresi kaç gündür?',ans:50,abs:0.5,unit:'gün',hint:'365 × alacak / satış.',sol:'365 × 500.000 / 3.650.000 = <b>50 gün</b>.'},
  {id:4,tag:'kavram',p:'İki şirketin ROE\'si %20. A\'nın kaldıracı 1,2, B\'ninki 4,0. Hangisi daha risklidir?',opts:['A','B','Eşit','Bilgi yetersiz; ROE aynı'],correct:1,hint:'Kaldıraç finansal riski gösterir.',sol:'<b>B</b>: aynı ROE\'yi yüksek borçla elde ediyor; kârlar düşerse ROE hızla geriler.'},
  {id:5,tag:'hesap',p:'FVÖK 600.000 TL, faiz gideri 150.000 TL. Faiz karşılama oranı kaçtır?',ans:4,abs:0.01,unit:'kat',hint:'FVÖK / faiz.',sol:'<b>4 kat</b>.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary"><li>Oranlar dört grupta: likidite, finansal yapı, faaliyet, kârlılık.</li><li>ROE = marj × devir × kaldıraç.</li><li>Oranlar zaman serisi ve sektör karşılaştırmasıyla yorumlanır.</li></ul>
  <p class="lmeta">İzlence: Ders içeriğindeki "finansal analiz" (haftalık planda yok) · ÖÇ5.</p>`}
]},

plan:{title:'Finansal tahminleme ve planlama: yüzde satış, dış finansman ihtiyacı, sürdürülebilir büyüme',sure:'40 dk',steps:[
 {k:'a',type:'anlatim',title:'Satıştan bilançoya',html:()=>`
  <p>Finansal planlama satış tahminiyle başlar. <b>Yüzde satış yönteminde</b> satışlarla orantılı değiştiği varsayılan kalemler (aktifler, satıcılar, tahakkuklar) satışların yüzdesi olarak tahmin edilir. Banka kredisi ve sermaye gibi kalemler ise yönetimin kararıdır.</p>
  <div class="eq">DFİ = ${fr('<i>A</i>','<i>S</i><sub>0</sub>')} Δ<i>S</i> − ${fr('<i>L</i>','<i>S</i><sub>0</sub>')} Δ<i>S</i> − <i>m</i> · <i>S</i><sub>1</sub> · <i>b</i></div>
  <p>DFİ sıfır olduğunda şirket yalnızca dağıtmadığı kârla büyür: <b>içsel büyüme oranı</b> = ROA·<i>b</i> / (1 − ROA·<i>b</i>). Borç/özkaynak oranını sabit tutacak kadar borçlanmaya izin verilirse <b>sürdürülebilir büyüme oranı</b> = ROE·<i>b</i> / (1 − ROE·<i>b</i>).</p>`},
 {k:'o',type:'ornek',title:'Anka Makine %20 büyürse',html:()=>`
  <p>S<sub>0</sub> = 1.500.000; A/S = 1,0; L/S = 0,2; m = %7,5; dağıtım %40 (b = 0,6). Satış %20 artarsa:</p>
  <p>Aktif artışı 300.000 − kendiliğinden borç artışı 60.000 − dağıtılmayan kâr 0,075 × 1.800.000 × 0,6 = 81.000 → <b>DFİ = 159.000 TL</b>.</p>
  <p>İçsel büyüme = 0,075 × 0,6 / (1 − 0,045) = %4,71; sürdürülebilir büyüme (ROE %15) = 0,09 / 0,91 = %9,89.</p>`},
 {k:'k1',type:'kesif',core:true,title:'Dış finansman ihtiyacı ve büyüme',mount:K_dfi},
 {k:'t',type:'turetim',title:'İçsel büyüme formülü',html:()=>`
  <p>DFİ = 0 koşulunda (<i>A</i> − <i>L</i>)/<i>S</i><sub>0</sub> · <i>g S</i><sub>0</sub> = <i>m</i> · <i>S</i><sub>0</sub>(1 + <i>g</i>) · <i>b</i>. Basitlik için kendiliğinden doğan borçları sıfır alıp ROA = <i>m S</i><sub>0</sub>/<i>A</i> yazarsak <i>g</i> = ROA·<i>b</i>(1 + <i>g</i>) → <i>g</i> = ROA·<i>b</i>/(1 − ROA·<i>b</i>). Keşifteki eğri kendiliğinden doğan borçları da hesaba katar; bu yüzden içsel büyüme formüldekinden biraz yüksektir.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'S<sub>0</sub> = 2.000.000; A/S = 0,8; L/S = 0,1; marj %6; dağıtım %50. Satış %25 artarsa DFİ kaç TL\'dir?',ans:.8*5e5-.1*5e5-.06*2.5e6*.5,abs:1,unit:'TL',hint:'ΔS = 500.000; S<sub>1</sub> = 2.500.000.',sol:'400.000 − 50.000 − 75.000 = <b>275.000 TL</b>.'},
  {id:2,tag:'hesap',p:'ROE %18, kâr tutma oranı %50. Sürdürülebilir büyüme oranı yüzde kaçtır? (2 ondalık)',ans:100*.09/.91,abs:0.01,unit:'%',hint:'ROE·b / (1 − ROE·b).',sol:'0,09 / 0,91 = <b>%9,89</b>.'},
  {id:3,tag:'grafik',p:'Kâr dağıtım oranı artırılırsa içsel büyüme oranı ne olur?',opts:['Artar','Azalır','Değişmez','Sıfır olur'],correct:1,hint:'b azalır.',sol:'Dağıtılmayan kâr azalır; içsel büyüme <b>düşer</b>.'},
  {id:4,tag:'kavram',p:'Gerçekleşen büyüme sürdürülebilir büyümenin üstündeyse şirket ne yapmak zorundadır?',opts:['Hiçbir şey','Borç/özkaynak oranını artırmak, yeni sermaye bulmak, dağıtımı azaltmak ya da verimliliği artırmak','Satışları azaltmak zorundadır','Yalnızca kâr payı dağıtmak'],correct:1,hint:'Sürdürülebilir büyüme hangi varsayımlara dayanıyordu?',sol:'Varsayımlardan biri değişmelidir: kaldıraç, sermaye, dağıtım oranı ya da kârlılık ve devir hızı.'}
 ]},
 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary"><li>DFİ = aktif artışı − kendiliğinden borç artışı − dağıtılmayan kâr.</li><li>İçsel büyüme: ROA·b/(1 − ROA·b); sürdürülebilir büyüme: ROE·b/(1 − ROE·b).</li><li>Büyüme, kârlılık, dağıtım ve finansman kararları birbirine bağlıdır.</li></ul>
  <p class="lmeta">İzlence: Hafta 9–10 · ÖÇ5.</p>`}
]},

firsat:{title:'Sermayenin fırsat maliyeti ve risk ayarlı iskonto oranı',sure:'35 dk',steps:[
 {k:'a',type:'anlatim',title:'İskonto oranı nereden gelir?',html:()=>`
  <p>Bir yatırımın iskonto oranı, yatırımcının aynı riskteki bir başka yatırımdan bekleyeceği getiridir: <b>sermayenin fırsat maliyeti</b>. Risksiz faiz (devlet borçlanma aracı getirisi) ile bir risk priminin toplamıdır. Ders 9'da gördüğünüz gibi piyasa yalnızca çeşitlendirilemeyen (sistematik) riski ödüllendirir; bu risk beta (β) ile ölçülür.</p>
  <div class="eq"><i>r</i> = <i>r</i><sub>f</sub> + β (<i>r</i><sub>m</sub> − <i>r</i><sub>f</sub>)</div>
  <p>Şirketin bütün projelerine tek bir iskonto oranı (ör. şirketin ortalama sermaye maliyeti) uygulamak, şirketten daha riskli projeleri kabul etmeye, daha az riskli projeleri reddetmeye yol açar.</p>
  <div class="note tr">Türkiye'de risksiz faiz olarak genellikle TL cinsi devlet iç borçlanma senetlerinin getirisi kullanılır; enflasyonun yüksek olduğu dönemlerde nominal oranlar çok yüksek ve oynaktır. Simülatördeki oranlar örnektir.</div>`},
 {k:'o',type:'ornek',title:'İki proje, bir şirket',html:()=>`
  <p>r<sub>f</sub> = %20, piyasa risk primi %8, şirketin tek oranı %30. Proje D: β = 1,4, İVO %40 → risk ayarlı oran 20 + 1,4 × 8 = %31,2 → kabul. Proje F: β = 2,2, İVO %52 → 20 + 2,2 × 8 = %37,6 → kabul. Proje A: β = 0,6, İVO %27 → 20 + 0,6 × 8 = %24,8 → kabul; ama tek oranla (%30) <b>reddedilirdi</b>.</p>`},
 {k:'k1',type:'kesif',core:true,title:'Tek oran mı, risk ayarlı oran mı?',mount:K_firsat},
 {k:'t',type:'turetim',title:'Neden yalnızca sistematik risk?',html:()=>`
  <p>Yatırımcı firmaya özgü riski çeşitlendirerek bedavaya yok edebilir; piyasa, yok edilebilen bir risk için prim ödemez. Bir varlığın iyi çeşitlendirilmiş portföyün riskine katkısı, piyasa getirisiyle kovaryansına bağlıdır: β = Cov(<i>R</i><sub>i</sub>, <i>R</i><sub>m</sub>)/σ<sup>2</sup><sub>m</sub>. Piyasa portföyünün betası 1'dir; β = 0 olan bir varlık risksiz faizi kazanır. İkisi arasındaki doğru, Finans II'de ayrıntılı işlenecek güvenlik piyasası doğrusudur.</p>`},
 {k:'q',type:'alistirma',title:'Alıştırmalar',qs:[
  {id:1,tag:'hesap',p:'r<sub>f</sub> = %18, piyasa risk primi %7, β = 1,2. İstenen getiri yüzde kaçtır?',ans:26.4,abs:0.05,unit:'%',hint:'r = r<sub>f</sub> + β × MRP.',sol:'18 + 1,2 × 7 = <b>%26,4</b>.'},
  {id:2,tag:'kavram',p:'Şirketin tek oranı %30 iken β\'sı yüksek bir proje İVO %33 ile kabul edildi; risk ayarlı oran %36. Bu karar için ne söylenebilir?',opts:['Doğrudur','Yanlış kabuldür: proje riskinin gerektirdiği getiriyi sağlamıyor','Yanlış reddir','Bilgi yetersiz'],correct:1,hint:'Proje kendi riskine göre değerlendirilir.',sol:'İVO (%33) risk ayarlı oranın (%36) altında: <b>değer yok eden</b> bir projedir.'},
  {id:3,tag:'kavram',p:'Beta neyi ölçer?',opts:['Toplam riski','Firmaya özgü riski','Sistematik (piyasa) riskini','Likidite riskini'],correct:2,hint:'Ders 9\'daki ayrım.',sol:'<b>Sistematik riski</b>.'},
  {id:4,tag:'hesap',p:'β = 0 olan bir yatırımın istenen getirisi (r<sub>f</sub> = %20) yüzde kaçtır?',ans:20,abs:0.05,unit:'%',hint:'Risk primi sıfır.',sol:'<b>%20</b>.'}

 {k:'s',type:'ozet',core:true,title:'Özet',html:()=>`<ul class="summary"><li>İskonto oranı aynı riskteki yatırımın getirisidir (fırsat maliyeti).</li><li>r = r<sub>f</sub> + β(r<sub>m</sub> − r<sub>f</sub>); yalnızca sistematik risk ödüllendirilir.</li><li>Tek oran kullanmak riskli projeleri kayırır, güvenli projeleri cezalandırır.</li></ul>

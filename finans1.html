<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finans I Simülatörü</title>
<meta name="description" content="Finans I Simülatörü: tarayıcıda çalışan etkileşimli ders aracı. M. M. Tuncer Çalışkan.">
<style>
:root{color-scheme:light;
  --page:#f9f9f9;--surface:#ffffff;--ink:#191919;--ink2:#666666;--grid:#e7e7e7;--axis:#c2c2c2;--border:rgba(11,11,11,.10);
  --s1:#257de0;--s2:#f47230;--s3:#00b894;--s4:#f2a600;--s5:#ee7fac;
  --good:#0aac23;--crit:#dc3c3d;--goodtext:#006c10;
  --accent:#257de0;--accent-ink:#1757ac;--wash:#eef5fd;--ylwash:#f4f1fd;--ylink:#6a4ce2;}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --page:#0b0b0b;--surface:#191919;--ink:#efefef;--ink2:#9c9c9c;--grid:#303030;--axis:#474747;--border:rgba(255,255,255,.10);
  --s1:#338ced;--s2:#e76624;--s3:#00a888;--s4:#d28e05;--s5:#e24d8b;--goodtext:#53c556;
  --accent:#338ced;--accent-ink:#84b9f3;--wash:#14243a;--ylwash:#211c35;--ylink:#9887ef;}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15.5px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1080px;margin:0 auto;padding:18px 20px 60px}
a{color:var(--accent-ink)}
h1{font-size:1.55rem;line-height:1.25;margin:.15em 0}
h2{font-size:1.22rem;line-height:1.3;margin:.15em 0}
h3{font-size:1.02rem;margin:1.3em 0 .35em}
p{margin:.55em 0}
ul,ol{margin:.4em 0;padding-left:1.3em} li{margin:.2em 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px}
.hero{display:flex;gap:18px 28px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin:8px 0 16px}
.kicker{font-size:.78rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.lead{color:var(--ink2);max-width:62ch}
.toggles{display:flex;flex-direction:column;gap:8px}
.tg{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink2)} .tg .lbl{min-width:46px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-right:1px solid var(--border);background:transparent;color:var(--ink);padding:5px 11px;font:inherit;font-size:.85rem;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.seg button:focus-visible,.btn:focus-visible,.stp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;font-size:.88rem}
.howto b{display:block;font-size:.9rem;margin-bottom:2px}
.unit h2{font-size:1rem;margin:26px 0 10px;color:var(--ink2);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lc{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;transition:border-color .15s,transform .15s}

.lc.off{opacity:.6}
.lc .no{font-size:.76rem;color:var(--ink2)} .lc .tt{font-weight:600;margin:2px 0 8px;line-height:1.35} .lc .mt{font-size:.8rem;color:var(--ink2)}
.chip{display:inline-block;font-size:.72rem;line-height:1.5;padding:0 8px;border-radius:99px;border:1px solid var(--border);color:var(--ink2);margin-right:4px;vertical-align:middle;white-space:nowrap}
.chip.pilot{background:var(--wash);color:var(--accent-ink);border-color:transparent}
.chip.gap{border-style:dashed}
.chip.ok{color:var(--goodtext);border-color:transparent;background:rgba(10,172,35,.11)}
.chip.yl{background:var(--ylwash);color:var(--ylink);border-color:transparent}
.lh{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end;margin:4px 0 12px}
.back{font-size:.86rem;text-decoration:none}
.lmeta{font-size:.8rem;color:var(--ink2)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px}
.stp{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:99px;padding:3px 11px 3px 3px;font:inherit;font-size:.78rem;cursor:pointer;white-space:nowrap}
.stp .sn{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--page);font-weight:600;font-size:.76rem}
.stp.cur{border-color:var(--accent);color:var(--ink)} .stp.cur .sn{background:var(--accent);color:#fff}
.stp.done .sn{background:var(--good);color:#fff}
.stp:disabled{opacity:.4;cursor:not-allowed}
.step .sh{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:12px}
.chip.t-kesif{background:var(--wash);color:var(--accent-ink);border-color:transparent}
.chip.t-alistirma{background:rgba(242,166,0,.15);color:inherit;border-color:transparent}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
.lockmsg{font-size:.84rem;color:var(--ink2);text-align:center}

.eq i{font-style:italic}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px}
.fr>span{line-height:1.3;padding:0 3px} .fr>span:first-child{border-bottom:1px solid currentColor}
.tbl{border-collapse:collapse;font-size:.87rem;margin:10px 0;font-variant-numeric:tabular-nums}

.tbl th:first-child,.tbl td:first-child{text-align:left}

.tbl.sym td{text-align:left}
.tbl tr.tot td{font-weight:700;border-top:1.5px solid var(--axis)}

.tbl td.l{text-align:left}
.note{padding:10px 14px;border-radius:8px;margin:14px 0;background:var(--page);font-size:.92rem}
.note.yl{background:var(--ylwash);border-left:3px solid var(--ylink)}
.note.yl::before{content:var(--yl-label,"İleri düzey");display:block;font-size:.7rem;font-weight:700;color:var(--ylink);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.note.tr::before{content:"Mevzuat notu";display:block;font-size:.7rem;font-weight:700;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.note.warn{border-left:3px solid var(--s4)}
body:not(.yl) .yl-only{display:none!important}
.k-intro{margin-bottom:14px}
.kgrid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px}
.kgrid>*{min-width:0}
@media (max-width:840px){.kgrid{grid-template-columns:minmax(0,1fr)}}
.sl{display:block;margin:0 0 13px}
.sl-top{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;color:var(--ink2)}
.sl output{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0}
.segw{margin:0 0 13px} .segw .seg{margin-top:4px}
.task{border:1px dashed var(--accent);border-radius:10px;padding:10px 12px;margin-bottom:16px;background:var(--wash);font-size:.86rem}
.task.all{border-style:solid;border-color:var(--good)}
.task-h{font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.task-s{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink2)}
.ti{display:flex;gap:8px;margin:5px 0}
.cb{flex:0 0 16px;height:16px;border:1.5px solid var(--ink2);border-radius:4px;margin-top:3px;position:relative}
.ti.ok .cb{background:var(--good);border-color:var(--good)}
.ti.ok .cb::after{content:"";position:absolute;left:4px;top:0;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.ti.ok>span:last-child{color:var(--ink2)}
.ro{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.ro-i{border:1px solid var(--border);border-radius:8px;padding:6px 10px;background:var(--surface)}
.ro-i.wide{grid-column:1/-1}
.ro-l{font-size:.74rem;color:var(--ink2);line-height:1.35}
.ro-v{font-weight:600;font-variant-numeric:tabular-nums}
.flag{display:inline-flex;gap:5px;align-items:center;font-weight:600;font-size:.82rem;padding:1px 9px;border-radius:99px}
.flag.good{color:var(--goodtext);background:rgba(10,172,35,.12)}
.flag.bad{color:var(--crit);background:rgba(220,60,61,.11)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.8rem;color:var(--ink2);margin-bottom:2px}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:18px;height:0;border-top:2.5px solid var(--ink2)}
.sw.l1{border-color:var(--s1)} .sw.l2{border-color:var(--s2)} .sw.l3{border-color:var(--s3)}
.sw.ref{border-top:1.5px dashed var(--ink2)}
.sw.box{width:12px;height:12px;border:0;border-radius:3px}
.sw.box.f1{background:var(--s1)} .sw.box.f2{background:var(--s2)} .sw.box.f3{background:var(--s3)} .sw.box.f4{background:var(--s4)} .sw.box.f5{background:var(--s5)}
.sw.box.fg{background:var(--axis)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.tick{fill:var(--ink2);font-size:11.5px;font-variant-numeric:tabular-nums}
.atitle{fill:var(--ink2);font-size:12px}
.l1,.l2,.l3{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.l1{stroke:var(--s1)} .l2{stroke:var(--s2)} .l3{stroke:var(--s3)}
.ref{stroke:var(--ink2);stroke-width:1.25;stroke-dasharray:4 4;fill:none}
.cur{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.d1{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.d2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.d3{fill:var(--s3);stroke:var(--surface);stroke-width:2}
.f1{fill:var(--s1)} .f2{fill:var(--s2)} .f3{fill:var(--s3)} .f4{fill:var(--s4)} .f5{fill:var(--s5)} .fg{fill:var(--axis)}
.seg-r{stroke:var(--surface);stroke-width:2}
.area1{fill:var(--s1);opacity:.14} .area-g{fill:var(--good);opacity:.14} .area-c{fill:var(--crit);opacity:.12}
.bar1{fill:var(--s1)} .bar1.dim{opacity:.38}
.ref2{stroke:var(--axis);stroke-width:1.25;stroke-dasharray:2 3;fill:none}
.sw.box.bar1{background:var(--s1)} .sw.box.area1{background:var(--s1);opacity:.3}
.sw.box.area-g{background:var(--good);opacity:.35} .sw.box.area-c{background:var(--crit);opacity:.3}
.sw.dot{width:10px;height:10px;border:0;border-radius:50%;background:var(--ink)} .sw.dot.d2{background:var(--s2)} .sw.dot.d3{background:var(--s3)}
.dim{opacity:.38}
.lab,.lab2{font-size:12px;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.lab{fill:var(--ink)} .lab2{fill:var(--ink2)}
.labin{font-size:11.5px;fill:#fff;font-variant-numeric:tabular-nums}
.labin.dk{fill:#0b0b0b}
.hov line{stroke:var(--ink2);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,.14);border-radius:8px;padding:6px 10px;font-size:.78rem;line-height:1.45;white-space:nowrap;z-index:5;font-variant-numeric:tabular-nums}
details.dt summary{cursor:pointer;font-size:.82rem;color:var(--ink2);margin-top:10px}
.dtw{max-height:260px;overflow:auto}
.q{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:12px 0}
.qh{display:flex;gap:4px;align-items:center;margin-bottom:6px}
.qn{margin-left:auto;font-size:.76rem;color:var(--ink2)}
.qa{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
input.num,input.acc,select.sel{font:inherit;padding:6px 10px;border:1px solid var(--axis);border-radius:8px;background:var(--surface);color:var(--ink)}
input.num{width:190px}
.unit{color:var(--ink2);font-size:.9rem}
.opts label{display:flex;gap:8px;align-items:flex-start;padding:3px 0;cursor:pointer}
.opts input{margin-top:5px}
.fb{margin-top:10px;padding:8px 12px;border-radius:8px;font-size:.9rem}
.fb:empty{display:none}
.fb.ok{background:rgba(10,172,35,.11)}
.fb.try{background:rgba(242,166,0,.15)}
.fb.rev{background:var(--wash)}
.qsum{font-size:.86rem;color:var(--ink2);margin-bottom:4px}
.about{font-size:.8rem;color:var(--ink2);margin-top:30px;border-top:1px solid var(--grid);padding-top:14px}
.map summary{cursor:pointer;font-weight:600}
.map{margin-top:26px}
.done-box{text-align:center;padding:30px}
.summary li{margin:.35em 0}
/* ---- Muhasebeye özgü bileşenler ---- */
.jt{border-collapse:collapse;font-size:.88rem;margin:8px 0 12px;font-variant-numeric:tabular-nums;min-width:min(100%,520px)}
.jt td,.jt th{padding:4px 10px;border-bottom:1px solid var(--grid)}
.jt th{color:var(--ink2);font-weight:600;font-size:.78rem;text-align:right}
.jt th:first-child{text-align:left}
.jt td.n{text-align:right;width:110px}
.jt td.cr{padding-left:38px}
.jt tr.mh td{border-bottom:1.5px solid var(--axis);font-size:.78rem;color:var(--ink2);text-align:center}
.jt tr.ex td{font-size:.8rem;color:var(--ink2);font-style:italic;border-bottom:1.5px solid var(--axis)}
.jt tr.tot td{font-weight:700}
.ta-wrap{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}
.ta{min-width:200px;flex:1 1 200px;max-width:300px;font-size:.84rem;font-variant-numeric:tabular-nums}
.ta-h{text-align:center;font-weight:600;border-bottom:2px solid var(--ink);padding:2px 4px}
.ta-b{display:grid;grid-template-columns:1fr 1fr;min-height:50px}
.ta-b>div{padding:3px 6px}
.ta-b>div:first-child{border-right:2px solid var(--ink)}
.ta-b>div:last-child{text-align:right}
.ta-l{display:flex;justify-content:space-between;gap:6px} .ta-b>div:last-child .ta-l{flex-direction:row-reverse}
.ta-l span:first-child{color:var(--ink2);font-size:.74rem}
.ta-f{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--axis);font-size:.78rem}
.ta-f>div{padding:2px 6px} .ta-f>div:last-child{text-align:right}
.ta-bal{text-align:center;font-size:.78rem;color:var(--ink2)}
.ta.new .ta-h{color:var(--accent-ink)}
.je{border-collapse:collapse;margin-top:8px;font-size:.88rem}
.je td,.je th{padding:3px 4px}
.je th{color:var(--ink2);font-weight:600;font-size:.76rem;text-align:left}
.je input.acc{width:250px}
.je input.num{width:130px;text-align:right}
.je .tot td{font-size:.82rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.xbtn{border:0;background:transparent;color:var(--ink2);cursor:pointer;font-size:1rem}
.tx-list{display:flex;flex-direction:column;gap:6px}
.tx{display:flex;gap:8px;align-items:flex-start;text-align:left;font:inherit;font-size:.84rem;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.tx:hover:not(:disabled){border-color:var(--accent)}
.tx:disabled{opacity:.5;cursor:default}
.tx .txn{font-weight:700;color:var(--ink2);min-width:18px}
.tx select{max-width:100%;min-width:0}
.tx.on{border-color:var(--good);background:rgba(10,172,35,.07)}
.cls-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;padding:6px 0;border-bottom:1px solid var(--grid);font-size:.88rem}
/* Metin en az 180 px yer alır; sığmazsa açılır liste alt satıra iner (dar panelde kelime kelime kırılmayı önler) */
.cls-row>span{flex:1 1 180px;min-width:0}
.cls-row select{flex:0 1 auto;max-width:100%;min-width:0}
.cls-row.ok select{border-color:var(--good)} .cls-row.bad select{border-color:var(--crit)}
.fs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.fs{grid-template-columns:1fr}}
.fs .tbl{width:100%}
.mono{font-variant-numeric:tabular-nums}
/* Motorun tablolara eklediği kapsayıcı: dar ekranda tablo sayfayı değil kendini kaydırır */
.tw{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fs>.tw>.tbl{width:100%}
/* ---- Telefon (≤600 px): metin sütunları kelime kelime kırılmasın, geniş tablolar kendi içinde kaysın ---- */
@media (max-width:600px){
  #app{padding:12px 10px 50px}
  .card{padding:14px 12px}
  .q{padding:12px 10px}
  .tbl th,.tbl td{padding:4px 7px}
  .tbl:not(.sym) td:not(:first-child){white-space:nowrap}
  /* Tablo, sütun sayısına göre bir alt genişlik alır; ekrana sığmazsa .tw içinde yana kayar */
  .tbl.sym:has(tr>:nth-child(2)){min-width:21em}
  .tbl.sym:has(tr>:nth-child(3)){min-width:31em}
  .tbl.sym:has(tr>:nth-child(4)){min-width:40em}
  .tbl:not(.sym):has(tr>:nth-child(4)){min-width:30em}
  .tbl:not(.sym):has(tr>:nth-child(5)){min-width:36em}
  .jt{min-width:21em}
  .jt td,.jt th{padding:4px 6px}
  .jt td.n{width:auto;white-space:nowrap}
  .jt td.cr{padding-left:18px}
  .je{width:100%;font-size:.84rem}
  .je td,.je th{padding:3px 2px}
  .je input.acc{width:100%;min-width:7.5em;padding:6px}
  .je input.num{width:4.6em;padding:6px 4px}
}

<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================
   Muhasebe simülatörleri — ortak motor, sürüm 0.1 (pilot), 27.11.2026
   Özgün kod. Mimari 12_Finans_Simulatoru ile aynıdır; ders akışı
   fikri M. Songur'un Mikroekonomi Simülatörü'nden esinlenmiştir,
   o çalışmadan kod alınmamıştır.
   ============================================================ */

/* ---------- Yardımcılar ---------- */
const $=(s,r=document)=>r.querySelector(s);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function nf(x,d=0){return Number(x).toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d});}
function tl(x,d=0){return (x<-1e-9?'−':'')+nf(Math.abs(x),d)+' TL';}
function pc(x,d=1){return (x<-1e-12?'−%':'%')+nf(Math.abs(x)*100,d);}
function pp(x,d=1){return (x<-1e-12?'−':'')+nf(Math.abs(x)*100,d)+' puan';}
function kTL(v){const a=Math.abs(v),s=v<0?'−':'';if(a>=1e6)return s+nf(a/1e6,(a%1e6)?1:0)+' mn';if(a>=1e3)return s+nf(a/1e3,0)+' bin';return s+nf(a,0);}
function fr(n,d){return `<span class="fr"><span>${n}</span><span>${d}</span></span>`;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function r2(x){return Math.round(x*100)/100;}
const pctFmt=v=>'%'+nf(v,Number.isInteger(v)?0:1);

/* ---------- Tekdüzen Hesap Planı (ders kapsamındaki hesaplar) ----------

function niceStep(span,n){const s0=span/n,mag=Math.pow(10,Math.floor(Math.log10(s0))),e=s0/mag;return mag*(e>=7.5?10:e>=3.5?5:e>=1.5?2:1);}

function niceMax(v,n=5){if(!(v>0))return 1;const st=niceStep(v,n);return Math.ceil(v*1.0001/st)*st;}
function niceRange(lo,hi,n=5){if(hi-lo<1e-9){hi=lo+1;}const st=niceStep(hi-lo,n);return [Math.floor(lo/st)*st,Math.ceil(hi/st)*st];}

    rect(x0,x1,v0,v1,cls,round=true){const lo=Math.min(v0,v1),hi=Math.max(v0,v1);if(hi-lo<1e-9)return;
      const px0=X(x0),px1=X(x1),w=px1-px0,yt=Y(hi),yb=Y(lo),h=yb-yt,r=round?Math.min(4,w/2,h):0;
      if(!r){f.add(`<rect class="${cls}" x="${px0}" y="${yt}" width="${w}" height="${h}"/>`);return;}
      const up=v1>=v0; /* veri ucu: up ise üst, değilse alt */
      const p=up?`M${px0},${yb}V${yt+r}Q${px0},${yt} ${px0+r},${yt}H${px1-r}Q${px1},${yt} ${px1},${yt+r}V${yb}Z`
               :`M${px0},${yt}V${yb-r}Q${px0},${yb} ${px0+r},${yb}H${px1-r}Q${px1},${yb} ${px1},${yb-r}V${yt}Z`;

/* Yığılmış sütun (bilanço): cols=[{name, items:[[etiket,değer,sınıf]]}] */

/* Şelale: items=[{l, v, t:'total'|'delta'}] */
function waterfall(host,items,o={}){

  const lo=Math.min(0,...bars.map(x=>Math.min(x.a,x.b))),hi=Math.max(0,...bars.map(x=>Math.max(x.a,x.b)));

/* Gruplu sütun: cats=['..'], series=[{n, cls, v:[..]}] */
function groupChart(host,cats,series,o={}){

/* ---------- Alıştırmalar ---------- */
function parseNum(s){
  s=String(s).trim().replace(/\s/g,'').replace(/TL|tl|adet|yıl|gün|pay|%/g,'').replace(/[−–]/g,'-');
  if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  return Number(s);
}
function isRight(q,v){if(!isFinite(v))return false;const t=q.abs!=null?q.abs:Math.max(Math.abs(q.ans)*(q.rel||0.005),0.01);return Math.abs(v-q.ans)<=t;}
function netMap(lines){const m={};lines.forEach(([c,b,a])=>{m[c]=(m[c]||0)+b-a;});Object.keys(m).forEach(c=>{if(Math.abs(m[c])<0.5)delete m[c];});return m;}
/* Öğrenci satırlarını beklenen kayıtla (ya da alternatifleriyle) karşılaştırır */
function gradeEntry(q,lines){
  const tol=q.tol||1;const sm=netMap(lines);
  const res=[q.entry].concat(q.alt||[]).map(ex=>{const em=netMap(ex);const codes=new Set([...Object.keys(em),...Object.keys(sm)]);let good=0,bad=0;
    codes.forEach(c=>{if(em[c]!=null&&sm[c]!=null&&Math.abs(em[c]-sm[c])<=tol)good++;else bad++;});
    return {ok:bad===0,good,total:Object.keys(em).length,wrongAcc:Object.keys(sm).filter(c=>em[c]==null)};});
  return res.find(r=>r.ok)||res.reduce((a,b)=>(b.good-b.wrongAcc.length)>(a.good-a.wrongAcc.length)?b:a);
}

/* ---------- Finans matematiği ---------- */
function fv(pv,r,n){return pv*Math.pow(1+r,n);}
function af(r,n){return Math.abs(r)<1e-12?n:(1-Math.pow(1+r,-n))/r;}
function bondPrice(F,c,y,n){return c*F*af(y,n)+F*Math.pow(1+y,-n);}
function bondRisk(F,c,y,n){let P=0,s=0,cv=0;for(let t=1;t<=n;t++){const cf=c*F+(t===n?F:0),pv=cf/Math.pow(1+y,t);P+=pv;s+=t*pv;cv+=t*(t+1)*cf/Math.pow(1+y,t+2);}return {P,D:s/P,Dm:s/P/(1+y),C:cv/P};}
function npv(r,cfs){let s=0;for(let t=0;t<cfs.length;t++)s+=cfs[t]/Math.pow(1+r,t);return s;}
function irrAll(cfs,lo=-0.9,hi=5,step=0.001){const out=[];let a=lo,fa=npv(a,cfs);for(let b=lo+step;b<=hi+1e-12;b+=step){const fb=npv(b,cfs);if(fa===0){out.push(a);}else if(fa*fb<0){let x=a,y=b,fx=fa;for(let k=0;k<70;k++){const m=(x+y)/2,fm=npv(m,cfs);if(fx*fm<=0){y=m;}else{x=m;fx=fm;}}out.push((x+y)/2);}a=b;fa=fb;}return out;}
function payback(cfs,r=0){let cum=cfs[0];for(let t=1;t<cfs.length;t++){const d=cfs[t]/Math.pow(1+r,t),prev=cum;cum+=d;if(cum>=0&&d>0)return t-1+(-prev)/d;}return null;}
function mirr(cfs,r){const n=cfs.length-1;let pvN=0,fvP=0;cfs.forEach((c,t)=>{if(c<0)pvN+=-c/Math.pow(1+r,t);else fvP+=c*Math.pow(1+r,n-t);});return Math.pow(fvP/pvN,1/n)-1;}
function bisect(f,a,b){let fa=f(a);if(fa*f(b)>0)return null;for(let k=0;k<80;k++){const m=(a+b)/2,fm=f(m);if(fa*fm<=0)b=m;else{a=m;fa=fm;}}return (a+b)/2;}

function K_bilesik(root,api){
  const PV=1e5;
  const L=kl(root,'Başlangıç tutarı <b>100.000 TL</b>. Faiz oranını ve vadeyi değiştirerek basit ve bileşik faizle büyümeyi karşılaştırın. Mavi alan, bileşik faizin basit faize göre fazladan kazandırdığı <b>faizin faizidir</b>.');
  const ck=checklist(L.task,[{id:'a',t:'Faiz oranını en az üç farklı değerde deneyin.'},{id:'b',t:'Paranın <b>en geç 4 yılda</b> ikiye katlandığı <b>en düşük</b> tam sayı faiz oranını bulun.'}],api);
  const r=sl(L.ctl,{label:'Yıllık faiz oranı, r',min:1,max:60,step:1,value:25,fmt:v=>'%'+v});
  const n=sl(L.ctl,{label:'Vade, n',min:1,max:30,step:1,value:10,fmt:v=>v+' yıl'});
  legend(L.leg,[['l1','Bileşik faiz'],['l2','Basit faiz'],['box area1','Faizin faizi'],['ref','Başlangıcın iki katı']]);
  const ro=readouts(L.ro,[['c','Bileşik faizle FV'],['s','Basit faizle FV'],['f','Faizin faizi'],['t','İkiye katlanma süresi'],['k','Kural 72 tahmini (72 / r)']]);
  const tried=new Set();
  function draw(u){
    const R=r.v/100,N=n.v,C=[],B=[];
    for(let i=0;i<=120;i++){const t=N*i/120;C.push([t,fv(PV,R,t)]);B.push([t,PV*(1+R*t)]);}
    const f=frame(L.ch,{x:[0,N],y:[0,niceMax(fv(PV,R,N))],xlab:'Yıl',ylab:'Tutar (TL)',yfmt:kTL,aria:'Basit ve bileşik faizle büyüme'});
    f.area(C,B,'area1');f.hline(2*PV,'ref');f.line(B,'l2');f.line(C,'l1');
    const T2=Math.log(2)/Math.log(1+R);
    if(T2<=N){f.vline(T2,'ref');f.dot(T2,2*PV,'cur');f.text(T2,2*PV,'2 kat: '+nf(T2,2)+' yıl','lab','end',-8,-10);}
    f.text(N,fv(PV,R,N),'Bileşik','lab','end',-6,-9);f.text(N,PV*(1+R*N),'Basit','lab','end',-6,17);
    f.hover(x=>{const t=clamp(Math.round(x),0,N),c=fv(PV,R,t),b=PV*(1+R*t);return {x:t,pts:[[t,c,'d1'],[t,b,'d2']],html:`<b>${t}. yıl</b><br>Bileşik: ${tl(c)}<br>Basit: ${tl(b)}<br>Faizin faizi: ${tl(c-b)}`};});
    ro.set('c',tl(fv(PV,R,N)));ro.set('s',tl(PV*(1+R*N)));ro.set('f',tl(fv(PV,R,N)-PV*(1+R*N)));
    ro.set('t',nf(T2,2)+' yıl');ro.set('k',nf(72/r.v,2)+' yıl');
    const rows=[];for(let t=0;t<=N;t++)rows.push([t,tl(PV*(1+R*t)),tl(fv(PV,R,t)),tl(fv(PV,R,t)-PV*(1+R*t))]);
    dtable(L.main,['Yıl','Basit faiz','Bileşik faiz','Faizin faizi'],rows);
    if(u){tried.add(r.v);if(tried.size>=3)ck.mark('a');if(r.v===19)ck.mark('b');}
  }
  r.on(()=>draw(1));n.on(()=>draw(1));draw(0);
}
function K_siklik(root,api){
  const all=[[1,'Yıllık'],[2,'6 aylık'],[4,'3 aylık'],[12,'Aylık'],[365,'Günlük'],[Infinity,'Sürekli']];

  const ck=checklist(L.task,[{id:'a',t:`Bütün bileşik sıklıklarını tek tek seçin (${M.length} seçenek).`},{id:'b',t:'Nominal faizi değiştirin ve yıllık bileşik ile en sık bileşik arasındaki farkın nasıl değiştiğini gözleyin.'}],api);
  const r=sl(L.ctl,{label:'Yıllık nominal faiz',min:1,max:100,step:1,value:36,fmt:v=>'%'+v});

    f.hover(x=>{const t=clamp(Math.round(x),0,N);return {x:t,pts:[[t,fv(PV,I,t),'d1'],[t,fv(PV,rr,t),'d2']],html:`<b>${t}. yıl</b><br>Nominal: ${tl(fv(PV,I,t))}<br>Satın alma gücü: ${tl(fv(PV,rr,t))}`};});

    f.hover(x=>{const v=clamp(Math.round(x*4)/4,lo,hi),a=bondPrice(F,cc,v/100,2),b=bondPrice(F,cc,v/100,20);return {x:v,pts:[[v,a,'d1'],[v,b,'d2']],html:`<b>YTM %${nf(v,2)}</b><br>2 yıllık: ${tl(a,2)}<br>20 yıllık: ${tl(b,2)}`};});

  const L=kl(root,'Anka Makine\'nin CNC hattı projesi: bugün yatırım, ardından beş yıl boyunca nakit girişleri. Eğri, projenin <b>net bugünkü değerini</b> (NBD) iskonto oranının fonksiyonu olarak gösterir (<b>NBD profili</b>). Eğrinin yatay ekseni kestiği oran <b>iç verim oranıdır</b> (İVO).');

    f.line(pts,'l1');const I=irrAll(C,-0.5,3).filter(x=>x>=0&&x<=0.6);
    I.forEach((x,k)=>{f.vline(x*100,'ref','İVO = '+pc(x,1),k*14);});
    const N=npv(R,C);f.dot(r.v,N,'cur',6);f.text(r.v,N,tl(N),'lab',r.v>45?'end':'start',r.v>45?-9:9,-9);
    f.hover(x=>{const v=clamp(Math.round(x*4)/4,0,60),y=npv(v/100,C);return {x:v,pts:[[v,y,'d1']],html:`<b>r = %${nf(v,2)}</b><br>NBD: ${tl(y)}`};});
    const allI=irrAll(C,-0.9,5);

    ro.set('i',allI.length===0?'Yok':allI.length===1?pc(allI[0],2):allI.map(x=>pc(x,1)).join(' ve '));
    const pb=payback(C),dpb=payback(C,R),pvIn=C.slice(1).reduce((s,c,t)=>s+c/Math.pow(1+R,t+1),0);

    ro.set('pi',nf(pvIn/-C[0],3));ro.set('m',pc(mirr(C,R),2));

    ro.set('na',tl(na));ro.set('nb',tl(nb));ro.set('ia',pc(iA,2));ro.set('ib',pc(iB,2));ro.set('cn',cn);ro.set('ci',ci);
    const conflict=cn!==ci&&cn!=='İkisi de ret'&&ci!=='İkisi de ret';
    ro.set('f',conflict?'<span class="flag bad">⚠ Çatışma</span>':(cn===ci?'<span class="flag good">✓ Uyumlu</span>':'—'));
    if(u){if(conflict)ck.mark('c');if(cn===ci&&cn!=='İkisi de ret')ck.mark('g');}
  }

}

const PA={e:.30,s:.40},PB={e:.22,s:.10};
function K_korelasyon(root,api){
  const L=kl(root,`İki varlık: <b>A hisse senedi fonu</b> (beklenen getiri %30, standart sapma %40) ve <b>B tahvil fonu</b> (beklenen getiri %22, standart sapma %10). Eğri, ağırlıkları %0'dan %100'e kadar değiştirerek elde edilebilecek bütün portföyleri gösterir. Kesikli çizgi korelasyonun +1 olduğu durumdur; bu durumda çeşitlendirmeden kazanç yoktur.`);
  const ck=checklist(L.task,[{id:'a',t:'Korelasyonu en az üç farklı değerde deneyin.'},{id:'b',t:'Korelasyon <b>−1</b> iken riski <b>sıfıra</b> indiren ağırlığı bulun (σ < %0,5).'}],api);
  const rho=sl(L.ctl,{label:'Korelasyon katsayısı, ρ',min:-1,max:1,step:0.05,value:0.2,fmt:v=>nf(v,2)});
  const w=sl(L.ctl,{label:'A\'nın portföydeki ağırlığı, w',min:0,max:100,step:1,value:60,fmt:v=>'%'+v+' A · %'+(100-v)+' B'});
  legend(L.leg,[['l1','Olası portföyler (seçilen ρ)'],['ref','ρ = +1 (çeşitlendirme yok)'],['sw dot d2','Sizin portföyünüz']]);
  const ro=readouts(L.ro,[['e','Beklenen getiri, E(Rp)'],['s','Standart sapma, σp'],['a','Ağırlıklı ortalama σ'],['g','Çeşitlendirme kazancı'],['w','Minimum varyans ağırlığı (A)',1],['m','Minimum σ',1]]);
  const port=(W,R)=>({e:W*PA.e+(1-W)*PB.e,s:Math.sqrt(Math.max(0,W*W*PA.s*PA.s+(1-W)*(1-W)*PB.s*PB.s+2*W*(1-W)*R*PA.s*PB.s))});
  const tried=new Set();
  function draw(u){
    const R=rho.v,W=w.v/100,pts=[];for(let k=0;k<=100;k++){const p=port(k/100,R);pts.push([p.s*100,p.e*100]);}
    const f=frame(L.ch,{x:[0,45],y:[20,32],xlab:'Risk: standart sapma, σ (%)',ylab:'Beklenen getiri (%)',xfmt:v=>'%'+v,yfmt:v=>'%'+v,aria:'İki varlıklı portföy olanaklar eğrisi'});
    f.add(`<line class="ref" x1="${f.X(PB.s*100)}" y1="${f.Y(PB.e*100)}" x2="${f.X(PA.s*100)}" y2="${f.Y(PA.e*100)}"/>`);
    f.line(pts,'l1');
    f.dot(PA.s*100,PA.e*100,'cur',5,'A: σ %40, E %30');f.text(PA.s*100,PA.e*100,'A (hisse fonu)','lab','end',-9,-8);
    f.dot(PB.s*100,PB.e*100,'cur',5,'B: σ %10, E %22');f.text(PB.s*100,PB.e*100,'B (tahvil fonu)','lab','start',9,14);
    const P=port(W,R);
    const den=PA.s*PA.s+PB.s*PB.s-2*R*PA.s*PB.s,wm=den>1e-12?(PB.s*PB.s-R*PA.s*PB.s)/den:0.5,wc=clamp(wm,0,1),pm=port(wc,R);
    if(S.lvl==='yl'){f.dot(pm.s*100,pm.e*100,'d3',6,'Minimum varyans portföyü');f.text(pm.s*100,pm.e*100,'Min. varyans','lab2','end',-9,4);}
    f.dot(P.s*100,P.e*100,'d2',7,'Sizin portföyünüz');f.text(P.s*100,P.e*100,'Portföyünüz','lab','end',-10,-10);
    const avg=W*PA.s+(1-W)*PB.s;
    ro.set('e',pc(P.e,2));ro.set('s',pc(P.s,2));ro.set('a',pc(avg,2));ro.set('g',pp(avg-P.s,2));
    ro.set('w',pc(wm,1)+(wm<0?' (açığa satış gerekir; kısıtlı: %0)':''));ro.set('m',pc(pm.s,2));
    if(u){tried.add(R.toFixed(2));if(tried.size>=3)ck.mark('a');if(Math.abs(R+1)<1e-9&&P.s<0.005)ck.mark('b');}
  }
  rho.on(()=>draw(1));w.on(()=>draw(1));draw(0);
}
function K_cesit(root,api){
  const sg=0.40;
  const L=kl(root,'Portföye <b>eşit ağırlıklı</b> hisse senedi ekliyoruz. Her hissenin standart sapması %40, hisseler arası ortalama korelasyon ρ̄. Hisse sayısı arttıkça portföy riski hangi düzeye iniyor?');
  const ck=checklist(L.task,[{id:'a',t:'Hisse sayısını <b>30\'un üzerine</b> çıkarın.'},{id:'b',t:'Ortalama korelasyonu en az iki farklı değerde deneyin.'}],api);
  const N=sl(L.ctl,{label:'Hisse sayısı, N',min:1,max:50,step:1,value:1,fmt:v=>v+' hisse'});
  const rb=sl(L.ctl,{label:'Ortalama korelasyon, ρ̄',min:0,max:1,step:0.05,value:0.3,fmt:v=>nf(v,2)});
  legend(L.leg,[['l1','Portföy riski, σp'],['box area1','Çeşitlendirilebilir (firmaya özgü) risk'],['ref','Sistematik (piyasa) risk']]);
  const ro=readouts(L.ro,[['s','Portföy riski, σp'],['m','Sistematik risk, σ·√ρ̄'],['u','Varyansın çeşitlendirilebilir payı']]);
  const sp=(n,r)=>sg*Math.sqrt(1/n+(1-1/n)*r);
  const tried=new Set();
  function draw(u,which){
    const R=rb.v,pts=[],asy=[];for(let n=1;n<=50;n++){pts.push([n,sp(n,R)*100]);asy.push([n,sg*Math.sqrt(R)*100]);}
    const f=frame(L.ch,{x:[1,50],y:[0,45],xlab:'Portföydeki hisse sayısı',ylab:'Standart sapma (%)',xticks:[1,10,20,30,40,50],yfmt:v=>'%'+v,aria:'Hisse sayısı arttıkça portföy riski'});
    f.area(pts,asy,'area1');f.hline(sg*Math.sqrt(R)*100,'ref','Sistematik risk %'+nf(sg*Math.sqrt(R)*100,1),'end');f.line(pts,'l1');
    const s=sp(N.v,R);f.dot(N.v,s*100,'cur',6);f.text(N.v,s*100,pc(s,1),'lab','start',9,-9);
    f.hover(x=>{const n=clamp(Math.round(x),1,50),v=sp(n,R);return {x:n,pts:[[n,v*100,'d1']],html:`<b>${n} hisse</b><br>σp: ${pc(v,2)}`};});
    ro.set('s',pc(s,2));ro.set('m',pc(sg*Math.sqrt(R),2));ro.set('u',pc((s*s-R*sg*sg)/(s*s),1));
    if(u){if(N.v>30)ck.mark('a');if(which==='r'){tried.add(R.toFixed(2));if(tried.size>=2)ck.mark('b');}}
  }
  N.on(()=>draw(1,'n'));rb.on(()=>draw(1,'r'));draw(0);
}

function K_basabas(root,api){
  const QX=6000;
  const L=kl(root,'Anka Makine\'nin bir ürünü için fiyat (P), birim değişken maliyet (v) ve sabit maliyet (F). Gelir doğrusu toplam maliyet doğrusunu <b>başabaş noktasında</b> keser. Bu noktanın solunda firma zarar, sağında kâr eder.');
  const ck=checklist(L.task,[{id:'a',t:'Satış miktarını <b>başabaş noktasına</b> getirin.'},{id:'b',t:'Fiyatı değiştirin ve başabaş noktasının nasıl kaydığını gözleyin.'}],api);
  const P=sl(L.ctl,{label:'Birim fiyat, P',min:300,max:800,step:10,value:500,fmt:v=>nf(v)+' TL'});
  const v=sl(L.ctl,{label:'Birim değişken maliyet, v',min:100,max:500,step:10,value:300,fmt:x=>nf(x)+' TL'});
  const F=sl(L.ctl,{label:'Sabit maliyet, F',min:100000,max:800000,step:10000,value:400000,fmt:x=>kTL(x)+' TL'});
  const Q=sl(L.ctl,{label:'Satış miktarı, Q',min:0,max:QX,step:50,value:3000,fmt:x=>nf(x)+' adet'});
  legend(L.leg,[['l1','Gelir (P·Q)'],['l2','Toplam maliyet (F + v·Q)'],['ref','Sabit maliyet'],['box area-g','Kâr bölgesi'],['box area-c','Zarar bölgesi']]);
  const ro=readouts(L.ro,[['cm','Birim katkı payı (P − v)'],['q','Başabaş miktarı'],['s','Başabaş cirosu'],['e','FVÖK (seçilen Q)'],['m','Güvenlik marjı']]);
  function draw(u,which){
    const p=P.v,c=v.v,f0=F.v,q=Q.v,cm=p-c,qbe=cm>0?f0/cm:Infinity;
    const TR=x=>p*x,TC=x=>f0+c*x;
    const f=frame(L.ch,{x:[0,QX],y:[0,niceMax(Math.max(TR(QX),TC(QX)))],xlab:'Satış miktarı (adet)',ylab:'TL',yfmt:kTL,aria:'Başabaş grafiği'});
    const q1=Math.min(qbe,QX);
    f.area([[0,TC(0)],[q1,TC(q1)]],[[0,TR(0)],[q1,TR(q1)]],'area-c');
    if(qbe<QX)f.area([[qbe,TR(qbe)],[QX,TR(QX)]],[[qbe,TC(qbe)],[QX,TC(QX)]],'area-g');
    f.hline(f0,'ref','Sabit maliyet','end');
    f.line([[0,0],[QX,TR(QX)]],'l1');f.line([[0,f0],[QX,TC(QX)]],'l2');
    f.text(QX,TR(QX),'Gelir','lab','end',-6,TR(QX)>=TC(QX)?-9:17);f.text(QX,TC(QX),'Toplam maliyet','lab','end',-6,TC(QX)>TR(QX)?-9:22);
    if(qbe<=QX){f.dot(qbe,TR(qbe),'cur',6);f.text(qbe,TR(qbe),'Başabaş: '+nf(qbe,0)+' adet','lab','end',-10,-8);}
    if(q>0){f.vline(q,'ref2');f.dot(q,TR(q),'d1');f.dot(q,TC(q),'d2');}
    f.hover(x=>{const k=clamp(Math.round(x/50)*50,0,QX);return {x:k,pts:[[k,TR(k),'d1'],[k,TC(k),'d2']],html:`<b>${nf(k)} adet</b><br>Gelir: ${tl(TR(k))}<br>Toplam maliyet: ${tl(TC(k))}<br>FVÖK: ${tl(TR(k)-TC(k))}`};});
    const e=TR(q)-TC(q);
    ro.set('cm',tl(cm));ro.set('q',cm>0?nf(qbe,0)+' adet':'Yok (P ≤ v)');ro.set('s',cm>0?tl(qbe*p):'—');
    ro.set('e',`${tl(e)} <span class="flag ${e>=0?'good':'bad'}">${e>=0?'Kâr':'Zarar'}</span>`);
    ro.set('m',cm>0&&q>0?pc((q-qbe)/q,1):'—');
    const rows=[];for(let k=0;k<=QX;k+=500)rows.push([nf(k),tl(TR(k)),tl(TC(k)),tl(TR(k)-TC(k))]);
    dtable(L.main,['Miktar','Gelir','Toplam maliyet','FVÖK'],rows);
    if(u){if(cm>0&&Math.abs(q-qbe)<=25)ck.mark('a');if(which==='P')ck.mark('b');}
  }
  P.on(()=>draw(1,'P'));v.on(()=>draw(1,'v'));F.on(()=>draw(1,'F'));Q.on(()=>draw(1,'Q'));draw(0);
}
function K_dol(root,api){
  const p=500,c=300;
  const L=kl(root,'Fiyat 500 TL, birim değişken maliyet 300 TL. <b>Faaliyet kaldıracı derecesi</b> (DOL), satışlardaki %1\'lik değişimin FVÖK\'ü yüzde kaç değiştireceğini gösterir. Başabaş noktasına yaklaşırken DOL\'a ne oluyor?');
  const ck=checklist(L.task,[{id:'a',t:'DOL\'u <b>5\'in üzerine</b> çıkarın (kâr bölgesinde kalarak).'},{id:'b',t:'DOL\'u <b>1 ile 2 arasına</b> indirin.'}],api);
  const F=sl(L.ctl,{label:'Sabit maliyet, F',min:200000,max:800000,step:50000,value:400000,fmt:x=>kTL(x)+' TL'});
  const Q=sl(L.ctl,{label:'Satış miktarı, Q',min:500,max:8000,step:50,value:3000,fmt:x=>nf(x)+' adet'});
  legend(L.leg,[['l1','DOL'],['ref','Başabaş noktası ve DOL = 1']]);
  const ro=readouts(L.ro,[['e','FVÖK'],['d','DOL'],['x','Satışlar %10 artarsa FVÖK değişimi']]);
  const dol=(q,f0)=>q*(p-c)/(q*(p-c)-f0);
  function draw(u){
    const f0=F.v,qbe=f0/(p-c),L1=[],L2=[];
    for(let q=0;q<=8000;q+=10){const d=dol(q,f0);if(q<qbe-1)L1.push([q,d]);else if(q>qbe+1)L2.push([q,d]);}
    const f=frame(L.ch,{x:[0,8000],y:[-10,15],yticks:[-10,-5,0,1,5,10,15],xlab:'Satış miktarı (adet)',ylab:'DOL',yfmt:v=>nf(v),aria:'Faaliyet kaldıracı derecesi'});
    f.vline(qbe,'ref','Başabaş: '+nf(qbe)+' adet');f.hline(1,'ref','DOL = 1','end');
    f.line(L1,'l1');f.line(L2,'l1');
    const q=Q.v,d=dol(q,f0);f.dot(q,d,'cur',6);if(d>=-10&&d<=15)f.text(q,d,'DOL = '+nf(d,2),'lab','start',9,-9);
    f.text(qbe/2,-7,'Zarar bölgesi (DOL < 0)','lab2','middle');
    f.hover(x=>{const k=clamp(Math.round(x/50)*50,0,8000),dd=dol(k,f0);return {x:k,pts:[[k,dd,'d1']],html:`<b>${nf(k)} adet</b><br>FVÖK: ${tl(k*(p-c)-f0)}<br>DOL: ${isFinite(dd)?nf(dd,2):'tanımsız'}`};});
    const e=q*(p-c)-f0;
    ro.set('e',tl(e));ro.set('d',Math.abs(e)<1?'tanımsız (FVÖK = 0)':nf(d,2));ro.set('x',Math.abs(e)<1?'—':pc(d*0.10,1));
    if(u){if(e>0&&d>5)ck.mark('a');if(d>1&&d<2)ck.mark('b');}
  }
  F.on(()=>draw(1));Q.on(()=>draw(1));draw(0);
}
function K_fk(root,api){
  const p=500,c=300,f0=400000,Q0=3000,tax=0.25,sh=100000;
  const L=kl(root,'Anka Makine 3.000 adet satıyor (FVÖK 200.000 TL). Şirketin 100.000 hissesi var; örnek vergi oranı %25. Borçlanma <b>faiz gideri</b> yaratır. Satışlardaki bir değişim FVÖK\'e ve hisse başına kâra (HBK) nasıl yansıyor?');
  const ck=checklist(L.task,[{id:'a',t:'Faiz giderini <b>sıfır</b> yapın ve satışları değiştirin: HBK değişimi FVÖK değişimine eşit mi?'},{id:'b',t:'Birleşik kaldıracı (DCL) <b>en az 6</b> yapın ve satışları değiştirin.'}],api);
  const I=sl(L.ctl,{label:'Faiz gideri, I',min:0,max:180000,step:5000,value:50000,fmt:x=>kTL(x)+' TL'});
  const d=sl(L.ctl,{label:'Satış miktarındaki değişim',min:-30,max:30,step:5,value:10,fmt:x=>(x>0?'+':x<0?'−':'')+'%'+Math.abs(x)});
  legend(L.leg,[['box bar1','Yüzde değişim']]);
  const ro=readouts(L.ro,[['dol','DOL'],['dfl','DFL = FVÖK / (FVÖK − I)'],['dcl','DCL = DOL × DFL'],['e0','HBK (önce)'],['e1','HBK (sonra)']]);
  function draw(u){
    const i=I.v,g=d.v/100,Q1=Q0*(1+g),E0=Q0*(p-c)-f0,E1=Q1*(p-c)-f0,H0=(E0-i)*(1-tax)/sh,H1=(E1-i)*(1-tax)/sh;
    const vals=[g,E1/E0-1,H1/H0-1].map(x=>x*100),mx=niceMax(Math.max(10,...vals.map(Math.abs))*1.15);
    const f=frame(L.ch,{x:[0,3],y:[-mx,mx],xcats:['Satış miktarı','FVÖK','HBK'],ylab:'Yüzde değişim',yfmt:v=>(v<0?'−%':'%')+nf(Math.abs(v)),aria:'Kaldıraç etkisi: satış, FVÖK ve HBK değişimi'});
    vals.forEach((v,k)=>{f.bar(k,v,'bar1');f.text(k+.5,v,(v<0?'−%':'%')+nf(Math.abs(v),1),'lab','middle',0,v>=0?-8:16);});
    f.hover(x=>{const k=clamp(Math.floor(x),0,2);return {html:`<b>${['Satış miktarı','FVÖK','HBK'][k]}</b><br>Değişim: ${(vals[k]<0?'−%':'%')+nf(Math.abs(vals[k]),2)}`};});
    const DOL=Q0*(p-c)/E0,DFL=E0/(E0-i);
    ro.set('dol',nf(DOL,2));ro.set('dfl',nf(DFL,2));ro.set('dcl',nf(DOL*DFL,2));ro.set('e0',nf(H0,3)+' TL');ro.set('e1',nf(H1,3)+' TL');
    if(u&&g!==0){if(i===0)ck.mark('a');if(DOL*DFL>=6-1e-9)ck.mark('b');}
  }
  I.on(()=>draw(1));d.on(()=>draw(1));draw(0);
}

const AF20_5=af(.2,5);
const LESSONS={

 {k:'a',type:'anlatim',title:'Bugünün lirası neden daha değerli?',html:()=>`
